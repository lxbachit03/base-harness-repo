<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican Riding a Bicycle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #38bdf8, #fbbf24, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .canvas-container {
      width: 100%;
      max-width: 1000px;
      background: #0284c7;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1000 / 650;
    }

    /* CSS Keyframe Animations */
    @keyframes wheel-spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes road-scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-160px);
      }
    }

    @keyframes cloud-drift-1 {
      0% {
        transform: translateX(1050px);
      }
      100% {
        transform: translateX(-350px);
      }
    }

    @keyframes cloud-drift-2 {
      0% {
        transform: translateX(1100px);
      }
      100% {
        transform: translateX(-300px);
      }
    }

    @keyframes cloud-drift-3 {
      0% {
        transform: translateX(1150px);
      }
      100% {
        transform: translateX(-250px);
      }
    }

    @keyframes pelican-bob {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-4px) rotate(-0.5deg);
      }
      50% {
        transform: translateY(1px) rotate(0.4deg);
      }
      75% {
        transform: translateY(-3px) rotate(-0.2deg);
      }
    }

    @keyframes pouch-jiggle {
      0%, 100% {
        transform: scale(1, 1);
      }
      35% {
        transform: scale(1.025, 1.04) rotate(0.8deg);
      }
      70% {
        transform: scale(0.985, 0.97) rotate(-0.5deg);
      }
    }

    @keyframes crest-flutter {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(4deg);
      }
    }

    @keyframes fish-wag {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-10deg);
      }
    }

    @keyframes crank-spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes leg-pedal {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-6px) rotate(2deg);
      }
      50% {
        transform: translateY(3px) rotate(-1deg);
      }
      75% {
        transform: translateY(-2px) rotate(1deg);
      }
    }

    @keyframes bike-ride-sway {
      0%, 100% {
        transform: translateX(0px) translateY(0px);
      }
      25% {
        transform: translateX(6px) translateY(-1px);
      }
      50% {
        transform: translateX(10px) translateY(0.5px);
      }
      75% {
        transform: translateX(4px) translateY(-0.8px);
      }
    }

    /* Animation Classes */
    .css-spin-rear {
      transform-origin: 300px 405px;
      animation: wheel-spin 0.8s linear infinite;
    }

    .css-spin-front {
      transform-origin: 700px 405px;
      animation: wheel-spin 0.8s linear infinite;
    }

    .css-spin-crank {
      transform-origin: 475px 410px;
      animation: crank-spin 0.8s linear infinite;
    }

    .css-road-scroll {
      animation: road-scroll 0.8s linear infinite;
    }

    .css-pelican-bob {
      transform-origin: 440px 220px;
      animation: pelican-bob 0.8s ease-in-out infinite;
    }

    .css-pouch-jiggle {
      transform-origin: 620px 80px;
      animation: pouch-jiggle 0.8s ease-in-out infinite;
    }

    .css-crest-flutter {
      transform-origin: 530px 55px;
      animation: crest-flutter 0.8s ease-in-out infinite;
    }

    .css-fish-wag {
      transform-origin: 700px 195px;
      animation: fish-wag 0.4s ease-in-out infinite;
    }

    .css-leg-pedal {
      transform-origin: 440px 220px;
      animation: leg-pedal 0.8s ease-in-out infinite;
    }

    .css-bike-sway {
      animation: bike-ride-sway 1.6s ease-in-out infinite;
    }

    .css-cloud-1 {
      animation: cloud-drift-1 24s linear infinite;
    }

    .css-cloud-2 {
      animation: cloud-drift-2 32s linear infinite;
    }

    .css-cloud-3 {
      animation: cloud-drift-3 18s linear infinite;
    }

    footer {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pelican Riding a Bicycle</h1>
    <p class="subtitle">Self-contained 2D SVG &amp; CSS Animation</p>
  </header>

  <main class="canvas-container">
    <svg viewBox="0 0 1000 650" width="1000" height="650" xmlns="http://www.w3.org/2000/svg" aria-label="Animated illustration of a pelican riding a bicycle">
      <defs>
        <!-- Sky Gradient -->
        <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="45%" stop-color="#7dd3fc" />
          <stop offset="75%" stop-color="#bae6fd" />
          <stop offset="100%" stop-color="#e0f2fe" />
        </linearGradient>

        <!-- Asphalt Road Gradient -->
        <linearGradient id="road-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="35%" stop-color="#1e293b" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>

        <!-- Grass Verge Gradient -->
        <linearGradient id="grass-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22c55e" />
          <stop offset="100%" stop-color="#15803d" />
        </linearGradient>

        <!-- Bicycle Frame Gradient (Vintage Teal / Cyan) -->
        <linearGradient id="frame-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#14b8a6" />
          <stop offset="40%" stop-color="#0d9488" />
          <stop offset="100%" stop-color="#0f766e" />
        </linearGradient>

        <!-- Chrome Metal Gradient -->
        <linearGradient id="chrome-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="40%" stop-color="#cbd5e1" />
          <stop offset="70%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>

        <!-- Pelican Beak Gradient -->
        <linearGradient id="beak-grad" x1="0" y1="0" x2="1" y2="0.3">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="50%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <!-- Pelican Gular Pouch Gradient -->
        <linearGradient id="pouch-grad" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
          <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.9" />
          <stop offset="75%" stop-color="#fb923c" stop-opacity="0.92" />
          <stop offset="100%" stop-color="#ea580c" stop-opacity="0.95" />
        </linearGradient>

        <!-- Pelican Feathers Gradient -->
        <linearGradient id="pelican-body-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>

        <!-- Leather Saddle Gradient -->
        <linearGradient id="saddle-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#92400e" />
          <stop offset="50%" stop-color="#78350f" />
          <stop offset="100%" stop-color="#451a03" />
        </linearGradient>

        <!-- Fish Gradient -->
        <linearGradient id="fish-grad" x1="0" y1="0" x2="1" y2="0.5">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="50%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>

        <!-- Ground Contact Shadow Filter -->
        <filter id="tire-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" />
        </filter>
      </defs>

      <!-- ================= SCENERY & BACKGROUND ================= -->
      <!-- Sky Background -->
      <rect x="0" y="0" width="1000" height="490" fill="url(#sky-grad)" />

      <!-- Sun -->
      <circle cx="150" cy="90" r="42" fill="#fef08a" opacity="0.95" />
      <circle cx="150" cy="90" r="56" fill="#fef9c3" opacity="0.4" />
      <circle cx="150" cy="90" r="74" fill="#fef9c3" opacity="0.2" />

      <!-- Drifting Clouds (CSS + SMIL animations) -->
      <g class="css-cloud-1">
        <animateTransform attributeName="transform" type="translate" from="1050 0" to="-350 0" dur="24s" repeatCount="indefinite" />
        <!-- Cloud Shape 1 -->
        <path d="M 0,90 Q 25,60 60,70 Q 95,50 130,70 Q 165,60 180,90 Q 190,115 160,120 L 20,120 Q -10,115 0,90 Z" fill="#ffffff" opacity="0.82" />
      </g>

      <g class="css-cloud-2">
        <animateTransform attributeName="transform" type="translate" from="1100 0" to="-300 0" dur="32s" repeatCount="indefinite" />
        <!-- Cloud Shape 2 -->
        <path d="M 0,140 Q 30,115 70,125 Q 110,105 150,125 Q 185,120 200,145 Q 210,165 175,170 L 20,170 Q -10,165 0,140 Z" fill="#ffffff" opacity="0.7" />
      </g>

      <g class="css-cloud-3">
        <animateTransform attributeName="transform" type="translate" from="1150 0" to="-250 0" dur="18s" repeatCount="indefinite" />
        <!-- Cloud Shape 3 -->
        <path d="M 0,60 Q 20,40 50,48 Q 80,35 110,50 Q 135,45 145,65 Q 155,80 130,85 L 15,85 Q -8,80 0,60 Z" fill="#ffffff" opacity="0.88" />
      </g>

      <!-- Distant Seaside Hills -->
      <path d="M 0,440 Q 180,385 360,425 T 720,395 T 1000,430 L 1000,490 L 0,490 Z" fill="#93c5fd" opacity="0.45" />
      <path d="M 0,455 Q 150,420 320,450 T 680,425 T 1000,450 L 1000,490 L 0,490 Z" fill="#6ee7b7" opacity="0.55" />

      <!-- Distant Trees and Coastal Foliage -->
      <path d="M 40,465 Q 50,440 60,465 Q 70,435 80,465 Q 90,445 100,465 Z" fill="#15803d" opacity="0.75" />
      <path d="M 420,465 Q 430,442 440,465 Q 450,438 460,465 Q 470,446 480,465 Z" fill="#15803d" opacity="0.75" />
      <path d="M 820,465 Q 830,438 840,465 Q 850,432 860,465 Q 870,442 880,465 Z" fill="#15803d" opacity="0.75" />

      <!-- Road Verge (Grass and Curb) -->
      <rect x="0" y="472" width="1000" height="18" fill="url(#grass-grad)" />
      <rect x="0" y="487" width="1000" height="4" fill="#94a3b8" />
      <rect x="0" y="490" width="1000" height="2" fill="#cbd5e1" />

      <!-- Asphalt Road Surface -->
      <rect x="0" y="492" width="1000" height="158" fill="url(#road-grad)" />

      <!-- Road Edge Line (Solid Off-White) -->
      <line x1="0" y1="505" x2="1000" y2="505" stroke="#f8fafc" stroke-width="4" opacity="0.7" />

      <!-- Scrolling Road Dashes (White Lane Markers) -->
      <g class="css-road-scroll">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="0.8s" repeatCount="indefinite" />
        <!-- Repeating dashes spanning full screen width with wrap overflow -->
        <rect x="-140" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />
        <rect x="20" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />
        <rect x="180" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />
        <rect x="340" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />
        <rect x="500" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />
        <rect x="660" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />
        <rect x="820" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />
        <rect x="980" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />
        <rect x="1140" y="565" width="90" height="12" rx="4" fill="#f8fafc" opacity="0.95" />

        <!-- Road Asphalt Pebbles for Rich Motion Perception -->
        <circle cx="-60" cy="535" r="2" fill="#64748b" />
        <circle cx="100" cy="542" r="2.5" fill="#475569" />
        <circle cx="260" cy="530" r="1.8" fill="#64748b" />
        <circle cx="420" cy="540" r="2.2" fill="#475569" />
        <circle cx="580" cy="532" r="2.5" fill="#64748b" />
        <circle cx="740" cy="538" r="2" fill="#475569" />
        <circle cx="900" cy="534" r="2.2" fill="#64748b" />
        <circle cx="1060" cy="536" r="2.5" fill="#475569" />

        <circle cx="-20" cy="605" r="2.2" fill="#64748b" />
        <circle cx="140" cy="615" r="2.5" fill="#475569" />
        <circle cx="300" cy="608" r="1.8" fill="#64748b" />
        <circle cx="460" cy="618" r="2.5" fill="#475569" />
        <circle cx="620" cy="604" r="2.2" fill="#64748b" />
        <circle cx="780" cy="612" r="2.5" fill="#475569" />
        <circle cx="940" cy="606" r="2" fill="#64748b" />
        <circle cx="1100" cy="614" r="2.5" fill="#475569" />
      </g>

      <!-- ================= TIRE GROUND CONTACT SHADOWS ================= -->
      <g id="bicycle-shadows">
        <!-- Rear Tire Shadow -->
        <ellipse cx="300" cy="492" rx="48" ry="7" fill="#090d16" opacity="0.65" filter="url(#tire-blur)" />
        <!-- Front Tire Shadow -->
        <ellipse cx="700" cy="492" rx="48" ry="7" fill="#090d16" opacity="0.65" filter="url(#tire-blur)" />
        <!-- Crankset & Rider Ground Shadow -->
        <ellipse cx="490" cy="493" rx="140" ry="6" fill="#090d16" opacity="0.35" filter="url(#tire-blur)" />
      </g>


      <!-- ================= THE BICYCLE & PELICAN RIG ================= -->
      <!-- Wrapper group with gentle forward cruising sway -->
      <g id="pelican-bicycle-rig" class="css-bike-sway">
        <animateTransform attributeName="transform" type="translate" values="0,0; 8,-1; 12,0.5; 5,-0.8; 0,0" dur="1.6s" repeatCount="indefinite" />

        <!-- ================= REAR WHEEL (Center at 300, 405; R=85) ================= -->
        <g id="rear-wheel-assembly">
          <!-- Rotating Spokes & Hub Assembly (CSS + SMIL) -->
          <g id="rear-wheel-spin" class="css-spin-rear">
            <animateTransform attributeName="transform" type="rotate" from="0 300 405" to="360 300 405" dur="0.8s" repeatCount="indefinite" />

            <!-- Spokes (16 Radial Spoke Pairs) -->
            <g stroke="#cbd5e1" stroke-width="1.8" opacity="0.85">
              <line x1="300" y1="405" x2="300" y2="330" />
              <line x1="300" y1="405" x2="300" y2="480" />
              <line x1="300" y1="405" x2="225" y2="405" />
              <line x1="300" y1="405" x2="375" y2="405" />

              <line x1="300" y1="405" x2="353" y2="352" />
              <line x1="300" y1="405" x2="247" y2="458" />
              <line x1="300" y1="405" x2="247" y2="352" />
              <line x1="300" y1="405" x2="353" y2="458" />

              <line x1="300" y1="405" x2="329" y2="336" />
              <line x1="300" y1="405" x2="271" y2="474" />
              <line x1="300" y1="405" x2="271" y2="336" />
              <line x1="300" y1="405" x2="329" y2="474" />

              <line x1="300" y1="405" x2="369" y2="376" />
              <line x1="300" y1="405" x2="231" y2="434" />
              <line x1="300" y1="405" x2="231" y2="376" />
              <line x1="300" y1="405" x2="369" y2="434" />
            </g>

            <!-- Spoke Reflector (Amber) -->
            <rect x="328" y="360" width="22" height="9" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1" />

            <!-- Wheel Valve Stem -->
            <rect x="298" y="338" width="4" height="10" fill="#475569" />
          </g>

          <!-- Rear Wheel Rim -->
          <circle cx="300" cy="405" r="76" fill="none" stroke="#cbd5e1" stroke-width="6" />
          <circle cx="300" cy="405" r="73" fill="none" stroke="#64748b" stroke-width="1.5" />

          <!-- Rear Wheel Rubber Tire (Touches ground at y=490) -->
          <circle cx="300" cy="405" r="85" fill="none" stroke="#1e293b" stroke-width="16" />
          <circle cx="300" cy="405" r="91" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="3 4" opacity="0.6" />

          <!-- Rear Hub Center -->
          <circle cx="300" cy="405" r="12" fill="#334155" stroke="#f8fafc" stroke-width="2" />
          <circle cx="300" cy="405" r="5" fill="#94a3b8" />
        </g>

        <!-- ================= FRONT WHEEL (Center at 700, 405; R=85) ================= -->
        <g id="front-wheel-assembly">
          <!-- Rotating Spokes & Hub Assembly (CSS + SMIL) -->
          <g id="front-wheel-spin" class="css-spin-front">
            <animateTransform attributeName="transform" type="rotate" from="0 700 405" to="360 700 405" dur="0.8s" repeatCount="indefinite" />

            <!-- Spokes (16 Radial Spoke Pairs) -->
            <g stroke="#cbd5e1" stroke-width="1.8" opacity="0.85">
              <line x1="700" y1="405" x2="700" y2="330" />
              <line x1="700" y1="405" x2="700" y2="480" />
              <line x1="700" y1="405" x2="625" y2="405" />
              <line x1="700" y1="405" x2="775" y2="405" />

              <line x1="700" y1="405" x2="753" y2="352" />
              <line x1="700" y1="405" x2="647" y2="458" />
              <line x1="700" y1="405" x2="647" y2="352" />
              <line x1="700" y1="405" x2="753" y2="458" />

              <line x1="700" y1="405" x2="729" y2="336" />
              <line x1="700" y1="405" x2="671" y2="474" />
              <line x1="700" y1="405" x2="671" y2="336" />
              <line x1="700" y1="405" x2="729" y2="474" />

              <line x1="700" y1="405" x2="769" y2="376" />
              <line x1="700" y1="405" x2="631" y2="434" />
              <line x1="700" y1="405" x2="631" y2="376" />
              <line x1="700" y1="405" x2="769" y2="434" />
            </g>

            <!-- Spoke Reflector (Amber) -->
            <rect x="728" y="360" width="22" height="9" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1" />

            <!-- Wheel Valve Stem -->
            <rect x="698" y="338" width="4" height="10" fill="#475569" />
          </g>

          <!-- Front Wheel Rim -->
          <circle cx="700" cy="405" r="76" fill="none" stroke="#cbd5e1" stroke-width="6" />
          <circle cx="700" cy="405" r="73" fill="none" stroke="#64748b" stroke-width="1.5" />

          <!-- Front Wheel Rubber Tire (Touches ground at y=490) -->
          <circle cx="700" cy="405" r="85" fill="none" stroke="#1e293b" stroke-width="16" />
          <circle cx="700" cy="405" r="91" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="3 4" opacity="0.6" />

          <!-- Front Hub Center -->
          <circle cx="700" cy="405" r="12" fill="#334155" stroke="#f8fafc" stroke-width="2" />
          <circle cx="700" cy="405" r="5" fill="#94a3b8" />
        </g>

        <!-- ================= FENDERS / MUDGUARDS ================= -->
        <!-- Rear Fender (Curved Chrome Shield) -->
        <path d="M 220,380 A 96 96 0 0 1 350,314" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" />
        <path d="M 220,380 A 96 96 0 0 1 350,314" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" />
        <!-- Rear Fender Stays -->
        <line x1="300" y1="405" x2="225" y2="385" stroke="#cbd5e1" stroke-width="2.5" />
        <line x1="300" y1="405" x2="260" y2="330" stroke="#cbd5e1" stroke-width="2.5" />

        <!-- Front Fender (Curved Chrome Shield) -->
        <path d="M 645,340 A 96 96 0 0 1 765,360" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" />
        <path d="M 645,340 A 96 96 0 0 1 765,360" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" />
        <!-- Front Fender Stays -->
        <line x1="700" y1="405" x2="755" y2="368" stroke="#cbd5e1" stroke-width="2.5" />

        <!-- ================= REAR TOURING RACK ================= -->
        <g id="rear-luggage-rack">
          <line x1="250" y1="290" x2="380" y2="290" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
          <line x1="300" y1="405" x2="280" y2="290" stroke="#cbd5e1" stroke-width="3.5" />
          <line x1="300" y1="405" x2="350" y2="290" stroke="#cbd5e1" stroke-width="3.5" />
          <!-- Red Rear Reflector -->
