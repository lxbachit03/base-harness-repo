<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket Launch Loop</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 18%, #1b2a4a 0%, #0b1020 55%, #05060d 100%);
    overflow: hidden;
  }
  svg { width: min(88vw, 88vh); height: auto; display: block; }

  .star { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: .2; }
    50%      { opacity: 1; }
  }

  .rocket { animation: launch 6s linear infinite; }
  @keyframes launch {
    0%   { transform: translateY(0);      opacity: 1; animation-timing-function: cubic-bezier(.55,.06,.68,.19); }
    70%  { transform: translateY(-520px); opacity: 1; animation-timing-function: linear; }
    78%  { transform: translateY(-610px); opacity: 0; animation-timing-function: linear; }
    79%  { transform: translateY(0);      opacity: 0; animation-timing-function: ease-out; }
    88%  { transform: translateY(0);      opacity: 1; }
    100% { transform: translateY(0);      opacity: 1; }
  }

  .flame, .flame-inner {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: flicker .18s ease-in-out infinite alternate;
  }
  .flame-inner { animation-duration: .12s; animation-delay: .05s; }
  @keyframes flicker {
    from { transform: scaleY(.85) scaleX(1.05); opacity: .85; }
    to   { transform: scaleY(1.25) scaleX(.9);  opacity: 1; }
  }

  .puff {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: puff 1.1s linear infinite;
  }
  @keyframes puff {
    0%   { transform: translateY(0) scale(.4);    opacity: .55; }
    100% { transform: translateY(60px) scale(1.7); opacity: 0; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 400 600" role="img" aria-label="2D rocket launching upward in a repeating loop with animated exhaust flame">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe7f5"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fb0c9"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".45" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#fb5607"/>
    </linearGradient>
  </defs>

  <g fill="#cfe0ff">
    <circle class="star" cx="40"  cy="70"  r="1.8" style="animation-delay:0s"/>
    <circle class="star" cx="95"  cy="150" r="1.3" style="animation-delay:.4s"/>
    <circle class="star" cx="150" cy="55"  r="2"   style="animation-delay:.9s"/>
    <circle class="star" cx="215" cy="120" r="1.4" style="animation-delay:1.3s"/>
    <circle class="star" cx="270" cy="45"  r="1.8" style="animation-delay:.2s"/>
    <circle class="star" cx="330" cy="130" r="1.3" style="animation-delay:1.7s"/>
    <circle class="star" cx="360" cy="240" r="2"   style="animation-delay:.6s"/>
    <circle class="star" cx="60"  cy="260" r="1.4" style="animation-delay:2.1s"/>
    <circle class="star" cx="120" cy="330" r="1.6" style="animation-delay:1.1s"/>
    <circle class="star" cx="300" cy="330" r="1.4" style="animation-delay:2.4s"/>
    <circle class="star" cx="345" cy="420" r="1.7" style="animation-delay:.8s"/>
    <circle class="star" cx="55"  cy="430" r="1.3" style="animation-delay:1.9s"/>
    <circle class="star" cx="250" cy="220" r="1.2" style="animation-delay:2.7s"/>
    <circle class="star" cx="185" cy="250" r="1.2" style="animation-delay:.5s"/>
  </g>

  <line x1="118" y1="575" x2="282" y2="575" stroke="#2b3a5c" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(200,480)">
    <g class="rocket">
      <g class="flame">
        <path d="M-12 32 C-15 56, -7 76, 0 92 C7 76, 15 56, 12 32 Z" fill="url(#flameGrad)"/>
      </g>
      <g class="flame-inner">
        <path d="M-6 32 C-7 48, -3 62, 0 72 C3 62, 7 48, 6 32 Z" fill="#fff6cf"/>
      </g>

      <circle class="puff" cx="-14" cy="42" r="10" fill="#9aa7bd" style="animation-delay:0s"/>
      <circle class="puff" cx="6"   cy="46" r="12" fill="#8b99b0" style="animation-delay:.36s"/>
      <circle class="puff" cx="18"  cy="40" r="9"  fill="#a7b3c6" style="animation-delay:.72s"/>

      <path d="M-18 8 L-42 44 L-18 40 Z" fill="#c1442e"/>
      <path d="M18 8 L42 44 L18 40 Z" fill="#c1442e"/>

      <rect x="-18" y="-48" width="36" height="88" rx="10" fill="url(#bodyGrad)"/>
      <path d="M-18 -48 C-18 -64, -10 -80, 0 -94 C10 -80, 18 -64, 18 -48 Z" fill="#e63946"/>
      <rect x="-18" y="22" width="36" height="6" fill="#e63946"/>

      <circle cx="0" cy="-18" r="9" fill="#0b3d5c" stroke="#cfd8ea" stroke-width="3"/>
      <circle cx="-3" cy="-21" r="2.5" fill="#9fd6ff"/>
    </g>
  </g>
</svg>
</body>
</html>
