<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing Ball</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10131a;
  }
  svg { width: min(90vmin, 640px); height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 400 400" role="img" aria-labelledby="ballTitle ballDesc" xmlns="http://www.w3.org/2000/svg">
  <title id="ballTitle">Bouncing ball</title>
  <desc id="ballDesc">A solid ball bounces up and down in a continuous loop, squashing and stretching as it hits the ground.</desc>

  <defs>
    <radialGradient id="ballFill" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="45%" stop-color="#3b9dff"/>
      <stop offset="100%" stop-color="#1155cc"/>
    </radialGradient>
    <linearGradient id="skyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2030"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="url(#skyFill)"/>
  <line x1="20" y1="360" x2="380" y2="360" stroke="#3d465e" stroke-width="2"/>

  <!-- shadow: widens and darkens as the ball approaches the ground -->
  <ellipse cx="200" cy="360" rx="30" ry="9" fill="#000000" opacity="0.25">
    <animate attributeName="rx" values="30; 48; 30" keyTimes="0; 0.5; 1"
             calcMode="spline" keySplines="0.42 0 1 1; 0 0 0.58 1"
             dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22; 0.55; 0.22" keyTimes="0; 0.5; 1"
             calcMode="spline" keySplines="0.42 0 1 1; 0 0 0.58 1"
             dur="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ball position: accelerate down, decelerate up -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="200,80; 200,320; 200,80"
                      keyTimes="0; 0.5; 1" calcMode="spline"
                      keySplines="0.42 0 1 1; 0 0 0.58 1"
                      dur="1.2s" repeatCount="indefinite"/>
    <!-- shift origin to the ball's contact point so squash/stretch stays grounded -->
    <g transform="translate(0,40)">
      <!-- squash on impact, stretch while moving -->
      <g>
        <animateTransform attributeName="transform" type="scale"
                          values="1 1; 0.95 1.08; 0.92 1.12; 1.3 0.72; 0.95 1.06; 0.95 1.08; 1 1"
                          keyTimes="0; 0.25; 0.44; 0.5; 0.56; 0.75; 1"
                          calcMode="spline"
                          keySplines="0.4 0 0.8 1; 0.4 0 0.8 1; 0.3 0 0.6 1; 0.3 0 0.6 1; 0.4 0 0.7 1; 0.4 0 0.6 1"
                          dur="1.2s" repeatCount="indefinite"/>
        <circle cx="0" cy="-40" r="40" fill="url(#ballFill)"/>
        <ellipse cx="-13" cy="-54" rx="10" ry="7" fill="#ffffff" opacity="0.45"/>
      </g>
    </g>
  </g>
</svg>
</body>
</html>
