<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1a1a1a;
  --ink-2:#666666;
  --paper:#ffffff;
  --paper-2:#f5f5f5;
  --rule:#cccccc;
  --black:#000000;
  --accent:#e30613;
  --font:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fs-display:clamp(2.5rem,5vw,4.5rem);
  --fs-h2:clamp(1.25rem,2.5vw,1.75rem);
  --fs-body:1rem;
  --fs-label:.75rem;
  --lh-body:1.5;
  --lh-display:1;
  --track-display:-.03em;
  --track-label:.08em;
  --cols:12;
  --gutter:24px;
  --margin:48px;
  --max:1200px;
  --unit:8px;
  --radius:0;
  --rule-thin:1px;
  --rule-strong:3px;
  --t:150ms ease;
  color-scheme:light;
}
@media (max-width:1024px){
  :root{--margin:32px}
}
@media (max-width:600px){
  :root{--margin:20px;--gutter:16px}
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-size:var(--fs-body);
  line-height:var(--lh-body);
  text-align:left;
}
input,select,button{
  font:inherit;
  color:inherit;
  border-radius:var(--radius);
}
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}
[hidden]{display:none!important}

/* 12-column Swiss modular grid */
.page{
  display:grid;
  grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  gap:var(--gutter);
  max-width:var(--max);
  margin-inline:auto;
  padding:40px var(--margin) 56px;
}
.page>*{min-width:0}

/* Asymmetric masthead (cols 1-6) + progress module (cols 7-12) */
.masthead{grid-column:1/7}
.kicker{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 12px;
  font-size:var(--fs-label);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  color:var(--ink-2);
}
.kicker-mark{
  width:10px;
  height:10px;
  background:var(--accent);
  flex:0 0 auto;
}
h1{
  margin:0 0 14px;
  font-size:var(--fs-display);
  line-height:var(--lh-display);
  letter-spacing:var(--track-display);
  font-weight:800;
  color:var(--black);
}
.sub{
  margin:0;
  max-width:60ch;
  color:var(--ink-2);
}

.progress{
  grid-column:7/13;
  border-top:var(--rule-strong) solid var(--black);
  padding-top:16px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:12px;
}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px 16px;
  flex-wrap:wrap;
}
.pg-num{
  font-size:clamp(2.25rem,4.5vw,3.5rem);
  font-weight:800;
  line-height:1;
  letter-spacing:var(--track-display);
  color:var(--black);
  font-variant-numeric:tabular-nums;
}
.pg-num small{
  font-size:.34em;
  font-weight:600;
  letter-spacing:0;
  color:var(--ink-2);
  margin-left:8px;
  white-space:nowrap;
}
.pg-note{
  font-size:.875rem;
  color:var(--ink-2);
  max-width:60ch;
}
.bar{
  display:flex;
  height:18px;
  gap:2px;
  padding:2px;
  border:var(--rule-thin) solid var(--black);
  background:var(--paper);
}
.bar span{
  display:block;
  min-width:0;
  transition:flex-grow var(--t);
}
.bar .b-done{background:var(--black)}
.bar .b-doing{background:var(--ink-2)}
.bar .b-todo{background:var(--paper-2)}

.pg-dl{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin:0;
  padding-top:10px;
  border-top:var(--rule-thin) solid var(--rule);
}
.pg-dl div{min-width:0}
.pg-dl dt{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:var(--fs-label);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  color:var(--ink-2);
}
.pg-dl dd{
  margin:2px 0 0;
  font-size:1.125rem;
  font-weight:700;
  color:var(--black);
  font-variant-numeric:tabular-nums;
}
.sw{
  width:8px;
  height:8px;
  display:inline-block;
  flex:0 0 auto;
}
.sw-done{background:var(--black)}
.sw-doing{background:var(--ink-2)}
.sw-todo{background:var(--paper-2);border:var(--rule-thin) solid var(--black)}

/* Add task toolbar */
.add-section{
  grid-column:1/-1;
  border-top:var(--rule-thin) solid var(--black);
  border-bottom:var(--rule-thin) solid var(--rule);
  padding-block:20px;
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(150px,auto) minmax(150px,auto) auto;
  gap:16px;
  align-items:end;
}
.field{
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}
.field label{
  font-size:var(--fs-label);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  color:var(--ink-2);
}
.add input,.add select{
  width:100%;
  min-width:0;
  background:var(--paper);
  border:0;
  border-bottom:var(--rule-thin) solid var(--ink-2);
  padding:9px 2px;
  color:var(--ink);
  transition:border-color var(--t);
}
.add input:focus,.add select:focus{
  border-bottom:var(--rule-strong) solid var(--accent);
  padding-bottom:7px;
}
.btn{
  border:2px solid var(--black);
  background:transparent;
  color:var(--black);
  padding:.75rem 1.25rem;
  font:600 .875rem/1 var(--font);
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  cursor:pointer;
  transition:background var(--t),color var(--t);
  white-space:nowrap;
}
.btn:hover{
  background:var(--black);
  color:var(--paper);
}

/* View & filter controls */
.controls{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px 24px;
}
.views,.filters{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  max-width:100%;
}
.seg{
  display:inline-flex;
  flex-wrap:wrap;
  border:var(--rule-thin) solid var(--black);
  max-width:100%;
}
.seg button{
  background:var(--paper);
  color:var(--ink);
  border:0;
  padding:8px 14px;
  font-size:var(--fs-label);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  cursor:pointer;
  transition:background var(--t),color var(--t);
}
.seg button+button{
  border-left:var(--rule-thin) solid var(--black);
}
.seg button[aria-pressed="true"]{
  background:var(--black);
  color:var(--paper);
  font-weight:700;
}
.chip,.nav-btn{
  background:var(--paper);
  border:var(--rule-thin) solid var(--ink-2);
  color:var(--ink);
  padding:7px 12px;
  font-size:var(--fs-label);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  cursor:pointer;
  transition:background var(--t),color var(--t),border-color var(--t);
}
.chip:hover,.nav-btn:hover{
  border-color:var(--black);
  color:var(--black);
}
.chip[aria-pressed="true"]{
  background:var(--black);
  color:var(--paper);
  border-color:var(--black);
}

.weeknav{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  padding-bottom:8px;
  border-bottom:var(--rule-thin) solid var(--rule);
}
.weeknav .lbl{
  font-weight:700;
  font-size:.9375rem;
  color:var(--black);
  margin-left:6px;
  font-variant-numeric:tabular-nums;
}

/* Board & Week grids */
.board{
  grid-column:1/-1;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:var(--gutter);
  align-items:start;
}
.week{
  grid-column:1/-1;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:12px;
  align-items:start;
}
.extra{
  grid-column:1/-1;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--gutter);
  align-items:start;
}
.col{
  min-width:0;
  background:var(--paper-2);
  border-top:var(--rule-strong) solid var(--black);
  padding:16px;
  min-height:220px;
  transition:background var(--t),outline-color var(--t);
}
.week .col,.extra .col{
  padding:12px;
  min-height:180px;
}
.col.today{
  background:var(--paper);
  border:var(--rule-thin) solid var(--black);
  border-top:var(--rule-strong) solid var(--accent);
}
.col.over{
  background:var(--paper);
  outline:2px solid var(--black);
  outline-offset:-2px;
}
.col-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
  padding-bottom:10px;
  border-bottom:var(--rule-thin) solid var(--rule);
}
.week .col-head{
  flex-wrap:wrap;
  gap:4px 6px;
  margin-bottom:10px;
  padding-bottom:8px;
}
.col-head i{
  width:10px;
  height:10px;
  display:block;
  flex:0 0 auto;
}
.col[data-s="todo"] .col-head i{border:2px solid var(--black);background:var(--paper)}
.col[data-s="doing"] .col-head i{background:var(--ink-2)}
.col[data-s="done"] .col-head i{background:var(--black)}
.col-head h2{
  margin:0;
  font-size:var(--fs-label);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  color:var(--black);
}
.dsub{
  font-size:var(--fs-label);
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.col.today .dsub{
  color:var(--accent);
  font-weight:700;
}
.col-head .count{
  margin-left:auto;
  font-size:var(--fs-label);
  font-weight:700;
  color:var(--black);
  background:var(--paper);
  border:var(--rule-thin) solid var(--ink-2);
  padding:1px 7px;
  font-variant-numeric:tabular-nums;
}

/* Swiss card = text under a top rule, no card chrome */
.card{
  background:var(--paper);
  border-top:var(--rule-strong) solid var(--ink-2);
  border-bottom:var(--rule-thin) solid var(--rule);
  padding:12px 10px 10px;
  margin-bottom:12px;
  cursor:grab;
  min-width:0;
}
.week .card{
  padding:10px 8px 8px;
  font-size:.875rem;
}
.card.p-high{border-top-color:var(--accent)}
.card.p-mid{border-top-color:var(--black)}
.card.p-low{border-top-color:var(--ink-2)}
.card.dragging{opacity:.4}
.card .t{
  font-weight:500;
  color:var(--ink);
  overflow-wrap:anywhere;
  max-width:65ch;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--ink-2);
}
.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  font-size:var(--fs-label);
  font-weight:600;
  border:var(--rule-thin) solid var(--ink-2);
  padding:1px 6px;
  color:var(--ink-2);
  background:var(--paper);
  font-variant-numeric:tabular-nums;
}
.tag.p-high-tag{
  color:var(--black);
  border-color:var(--black);
}
.tag.late{
  color:var(--accent);
  border-color:var(--accent);
  font-weight:700;
}
.acts{
  margin-left:auto;
  display:flex;
  gap:4px;
}
.acts button{
  background:var(--paper);
  border:var(--rule-thin) solid var(--ink-2);
  width:28px;
  height:28px;
  padding:0;
  cursor:pointer;
  color:var(--ink);
  font-size:.875rem;
  line-height:1;
  display:inline-grid;
  place-items:center;
  transition:background var(--t),color var(--t),border-color var(--t);
}
.acts button:hover:not(:disabled){
  background:var(--black);
  color:var(--paper);
  border-color:var(--black);
}
.acts button:disabled{
  opacity:.3;
  cursor:default;
}
.empty{
  color:var(--ink-2);
  font-size:.875rem;
  text-align:left;
  padding:12px 0;
  max-width:60ch;
}
.addday{
  width:100%;
  background:var(--paper);
  border:var(--rule-thin) solid var(--ink-2);
  padding:7px 8px;
  color:var(--ink);
  cursor:pointer;
  font-size:var(--fs-label);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  text-align:left;
  transition:background var(--t),color var(--t),border-color var(--t);
}
.addday:hover{
  background:var(--black);
  color:var(--paper);
  border-color:var(--black);
}

@media (max-width:1050px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .masthead,.progress{grid-column:1/-1}
  .board,.extra{grid-template-columns:minmax(0,1fr)}
  .add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .add .field-title,.add .btn{grid-column:1/-1}
}
@media (max-width:600px){
  .week{grid-template-columns:minmax(0,1fr)}
  .add{grid-template-columns:minmax(0,1fr)}
  .pg-dl{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
@media (prefers-reduced-transparency:reduce){
  .card.dragging{opacity:1;outline:2px dashed var(--black)}
}
@media (forced-colors:active){
  :focus-visible{outline:3px solid Highlight}
  .seg button[aria-pressed="true"],.chip[aria-pressed="true"],.btn:hover,.acts button:hover:not(:disabled),.addday:hover{
    background:Highlight;
    color:HighlightText;
    border-color:Highlight;
  }
  .bar span{border:1px solid CanvasText}
  .bar .b-done{background:Highlight}
  .bar .b-doing{background:CanvasText}
  .bar .b-todo{background:Canvas}
  .col,.card,.tag,.acts button,.addday,.chip,.nav-btn,.seg,.btn{border-color:CanvasText}
}
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <p class="kicker"><span class="kicker-mark" aria-hidden="true"></span><span>01 / Quản lý công việc</span></p>
    <h1>Bảng công việc</h1>
    <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
  </header>

  <section class="progress" aria-label="Tiến độ">
    <div class="pg-top">
      <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
      <div class="pg-note" id="note"></div>
    </div>
    <div class="bar" aria-hidden="true">
      <span class="b-done" id="bDone"></span>
      <span class="b-doing" id="bDoing"></span>
      <span class="b-todo" id="bTodo"></span>
    </div>
    <dl class="pg-dl">
      <div><dt><span class="sw sw-done" aria-hidden="true"></span>Hoàn thành</dt><dd id="cntDone">0</dd></div>
      <div><dt><span class="sw sw-doing" aria-hidden="true"></span>Đang làm</dt><dd id="cntDoing">0</dd></div>
      <div><dt><span class="sw sw-todo" aria-hidden="true"></span>Cần làm</dt><dd id="cntTodo">0</dd></div>
    </dl>
  </section>

  <section class="add-section" aria-label="Thêm công việc mới">
    <div class="add">
      <div class="field field-title">
        <label for="title">Tên công việc</label>
        <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      </div>
      <div class="field">
        <label for="prio">Mức ưu tiên</label>
        <select id="prio" aria-label="Mức ưu tiên">
          <option value="high">Ưu tiên cao</option>
          <option value="mid" selected>Ưu tiên vừa</option>
          <option value="low">Ưu tiên thấp</option>
        </select>
      </div>
      <div class="field">
        <label for="due">Hạn hoàn thành</label>
        <input type="date" id="due" aria-label="Hạn hoàn thành">
      </div>
      <button class="btn" id="addBtn" type="button">Thêm việc</button>
    </div>
  </section>

  <div class="controls">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="nav-btn" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="nav-btn" id="thisW">Tuần này</button>
    <button type="button" class="nav-btn" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</main>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag"+(t.p==="high"?" p-high-tag":""),PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("cntDone").textContent=String(d);
    document.getElementById("cntDoing").textContent=String(g);
    document.getElementById("cntTodo").textContent=String(o);
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  load();render();
})();
</script>
</body>
</html>
