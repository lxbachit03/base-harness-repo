<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --neu-bg:#e0e5ec;
  --neu-surface-hi:#e6ebf2;
  --neu-surface-lo:#d7dde6;
  --neu-shadow-dark:#a3b1c6;
  --neu-shadow-light:#ffffff;
  --neu-text:#2d3436;
  --neu-text-2:#4b565a;          /* substitutes #636e72 (4.14:1 fails AA) */
  --neu-accent:#3a62d8;          /* substitutes #4d7cff (3.72:1 white-on-accent fails AA) */
  --neu-accent-text:#2e53c4;     /* 5.27:1 AA for small accent text on --neu-bg */
  --neu-on-accent:#ffffff;
  --neu-accent-soft:rgba(58,98,216,.15);
  --neu-accent-soft-solid:#cbd6ec;
  --neu-edge:#73818d;            /* >= 3:1 UI edge where shadow alone is 1.72:1 */
  --neu-edge-soft:rgba(75,86,90,.28);

  --neu-done:#1d734c;
  --neu-doing:#945700;
  --neu-todo:#3a62d8;
  --neu-high:#b82d24;
  --neu-mid:#945700;
  --neu-low:#4b565a;

  --neu-dist:8px;
  --neu-blur:15px;
  --neu-dist-sm:4px;
  --neu-blur-sm:8px;
  --neu-dist-lg:12px;
  --neu-blur-lg:24px;

  --radius-card:20px;
  --radius-ctl:12px;
  --radius-pill:999px;
  --font:"Nunito Sans","Nunito",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --neu-bg:#2d2d2d;
    --neu-surface-hi:#333333;
    --neu-surface-lo:#282828;
    --neu-shadow-dark:#252525;
    --neu-shadow-light:#353535;
    --neu-text:#e0e0e0;
    --neu-text-2:#b2bec3;
    --neu-accent:#7ea3ff;
    --neu-accent-text:#7ea3ff;
    --neu-on-accent:#182030;
    --neu-accent-soft:rgba(126,163,255,.18);
    --neu-accent-soft-solid:#3c4253;
    --neu-edge:#7c7c7c;
    --neu-edge-soft:rgba(224,224,224,.22);

    --neu-done:#56d39a;
    --neu-doing:#f5b841;
    --neu-todo:#7ea3ff;
    --neu-high:#ff7a70;
    --neu-mid:#f5b841;
    --neu-low:#b2bec3;
    color-scheme:dark;
  }
}

:root[data-theme="dark"]{
  --neu-bg:#2d2d2d;
  --neu-surface-hi:#333333;
  --neu-surface-lo:#282828;
  --neu-shadow-dark:#252525;
  --neu-shadow-light:#353535;
  --neu-text:#e0e0e0;
  --neu-text-2:#b2bec3;
  --neu-accent:#7ea3ff;
  --neu-accent-text:#7ea3ff;
  --neu-on-accent:#182030;
  --neu-accent-soft:rgba(126,163,255,.18);
  --neu-accent-soft-solid:#3c4253;
  --neu-edge:#7c7c7c;
  --neu-edge-soft:rgba(224,224,224,.22);

  --neu-done:#56d39a;
  --neu-doing:#f5b841;
  --neu-todo:#7ea3ff;
  --neu-high:#ff7a70;
  --neu-mid:#f5b841;
  --neu-low:#b2bec3;
  color-scheme:dark;
}

html{
  box-sizing:border-box;
  scroll-padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}

body{
  margin:0;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background:var(--neu-bg);
  color:var(--neu-text);
  font-family:var(--font);
  font-size:16px;
  font-weight:500;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:32px 24px 48px;
  display:grid;
  gap:28px;
}

/* Three depth states only: raised, flat, pressed; single top-left light source */
.neu-raised{
  background:var(--neu-bg);
  border-radius:var(--radius-card);
  border:1px solid var(--neu-edge-soft);
  box-shadow:var(--neu-dist) var(--neu-dist) var(--neu-blur) var(--neu-shadow-dark),
             calc(-1 * var(--neu-dist)) calc(-1 * var(--neu-dist)) var(--neu-blur) var(--neu-shadow-light);
}
.neu-pressed{
  background:var(--neu-bg);
  border-radius:var(--radius-ctl);
  border:1px solid var(--neu-edge);
  box-shadow:inset 4px 4px 8px var(--neu-shadow-dark),
             inset -4px -4px 8px var(--neu-shadow-light);
}

/* Header */
.head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.head-title{min-width:0;flex:1 1 260px}
h1{
  margin:0 0 6px;
  font-size:clamp(28px,4.5vw,40px);
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.15;
}
.sub{
  margin:0;
  color:var(--neu-text-2);
  font-size:16px;
}
.theme-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--neu-bg);
  color:var(--neu-text);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-pill);
  padding:9px 16px;
  font:600 14px/1.2 var(--font);
  cursor:pointer;
  box-shadow:var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
             calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  transition:box-shadow .2s ease,border-color .2s ease;
}
.theme-btn:hover{
  box-shadow:2px 2px 5px var(--neu-shadow-dark),-2px -2px 5px var(--neu-shadow-light);
}
.theme-btn:active{
  box-shadow:inset 3px 3px 6px var(--neu-shadow-dark),inset -3px -3px 6px var(--neu-shadow-light);
}

:focus-visible{
  outline:3px solid var(--neu-accent);
  outline-offset:3px;
}

/* Progress hero card: molded device-dashboard feel */
.progress{
  padding:32px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  gap:28px;
  background:linear-gradient(145deg,var(--neu-surface-hi),var(--neu-surface-lo));
}
.dial{
  position:relative;
  width:104px;
  height:104px;
  border-radius:50%;
  background:var(--neu-bg);
  border:1px solid var(--neu-edge-soft);
  box-shadow:var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
             calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.dial svg{
  width:88px;
  height:88px;
  transform:rotate(-90deg);
}
.dial-track{
  fill:none;
  stroke:var(--neu-shadow-dark);
  stroke-opacity:.45;
  stroke-width:8;
}
.dial-fill{
  fill:none;
  stroke:var(--neu-done);
  stroke-width:8;
  stroke-linecap:round;
  transition:stroke-dashoffset .35s ease;
}
.dial-center{
  position:absolute;
  inset:16px;
  border-radius:50%;
  background:var(--neu-bg);
  box-shadow:inset 3px 3px 6px var(--neu-shadow-dark),inset -3px -3px 6px var(--neu-shadow-light);
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:18px;
  color:var(--neu-text);
}

.pg-body{min-width:0;display:grid;gap:14px}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.pg-num{
  font-size:clamp(30px,5vw,44px);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
}
.pg-num small{
  font-size:16px;
  font-weight:600;
  color:var(--neu-text-2);
  letter-spacing:0;
  margin-left:10px;
}
.pg-note{
  color:var(--neu-text-2);
  font-size:15px;
  font-weight:600;
}
/* Pressed well track with 1px edge so it reads as a meter, not a scrollbar */
.bar-well{
  padding:4px;
  border-radius:var(--radius-pill);
  background:var(--neu-bg);
  border:1px solid var(--neu-edge);
  box-shadow:inset 3px 3px 6px var(--neu-shadow-dark),
             inset -3px -3px 6px var(--neu-shadow-light);
}
.bar{
  display:flex;
  height:14px;
  border-radius:var(--radius-pill);
  overflow:hidden;
  gap:3px;
}
.bar span{
  display:block;
  min-width:0;
  border-radius:var(--radius-pill);
  transition:flex-grow .35s ease;
}
.bar .b-done{background:var(--neu-done)}
.bar .b-doing{background:var(--neu-doing)}
.bar .b-todo{background:var(--neu-todo)}
.pg-legend{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:13px;
  color:var(--neu-text-2);
  font-weight:600;
}
.pg-legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.pg-legend i{
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
}
.lg-done i{background:var(--neu-done)}
.lg-doing i{background:var(--neu-doing)}
.lg-todo i{background:var(--neu-todo)}

/* Controls toolbar */
.controls{
  display:grid;
  gap:20px;
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:12px;
  padding:16px;
  border-radius:var(--radius-card);
  background:var(--neu-bg);
  border:1px solid var(--neu-edge-soft);
  box-shadow:var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
             calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
}
input,select,button{font:inherit;color:inherit}
.add input,.add select{
  background:var(--neu-bg);
  color:var(--neu-text);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-ctl);
  padding:11px 14px;
  min-width:0;
  max-width:100%;
  font-size:16px;
  box-shadow:inset 3px 3px 6px var(--neu-shadow-dark),
             inset -3px -3px 6px var(--neu-shadow-light);
}
.add input::placeholder{color:var(--neu-text-2);opacity:1}

/* Primary CTA uses solid accent fill per guardrail (never a bare bump) */
.btn{
  background:var(--neu-accent);
  color:var(--neu-on-accent);
  border:1px solid var(--neu-accent);
  border-radius:var(--radius-ctl);
  padding:11px 22px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  box-shadow:var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
             calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  transition:filter .18s ease,box-shadow .18s ease,transform .12s ease;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{
  transform:translateY(1px);
  box-shadow:2px 2px 4px var(--neu-shadow-dark),-2px -2px 4px var(--neu-shadow-light);
}

.toolbar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.views{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{
  display:inline-flex;
  flex-wrap:wrap;
  padding:4px;
  gap:4px;
  background:var(--neu-bg);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-ctl);
  box-shadow:inset 3px 3px 6px var(--neu-shadow-dark),
             inset -3px -3px 6px var(--neu-shadow-light);
}
.seg button{
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  padding:8px 16px;
  cursor:pointer;
  color:var(--neu-text-2);
  font-weight:600;
  font-size:15px;
  transition:box-shadow .2s ease,background .2s ease,color .2s ease;
}
.seg button[aria-pressed="true"]{
  background:var(--neu-bg);
  color:var(--neu-text);
  border-color:var(--neu-edge);
  font-weight:700;
  box-shadow:3px 3px 6px var(--neu-shadow-dark),-3px -3px 6px var(--neu-shadow-light);
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.chip{
  background:var(--neu-bg);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-pill);
  padding:7px 15px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  color:var(--neu-text-2);
  box-shadow:3px 3px 6px var(--neu-shadow-dark),-3px -3px 6px var(--neu-shadow-light);
  transition:box-shadow .2s ease,background .2s ease,color .2s ease;
}
.chip:hover{color:var(--neu-text)}
.chip[aria-pressed="true"]{
  background:var(--neu-accent-soft);
  color:var(--neu-text);
  border-color:var(--neu-accent);
  font-weight:700;
  box-shadow:inset 3px 3px 6px var(--neu-shadow-dark),
             inset -3px -3px 6px var(--neu-shadow-light);
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.weeknav .lbl{
  font-weight:700;
  margin-left:6px;
  color:var(--neu-text);
}

/* Board & Week columns: flat static wells so cards & controls read clearly */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
  align-items:start;
}
.col{
  background:var(--neu-bg);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-card);
  padding:20px;
  min-height:200px;
  min-width:0;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.col.over{
  border-color:var(--neu-accent);
  box-shadow:inset 4px 4px 10px var(--neu-shadow-dark),
             inset -4px -4px 10px var(--neu-shadow-light);
}
.col-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 16px;
}
.col-head i{
  width:12px;
  height:12px;
  border-radius:50%;
  flex-shrink:0;
  display:block;
}
.col[data-s="todo"] .col-head i{background:var(--neu-todo)}
.col[data-s="doing"] .col-head i{background:var(--neu-doing)}
.col[data-s="done"] .col-head i{background:var(--neu-done)}
.col-head h2{
  font-size:17px;
  margin:0;
  font-weight:700;
  overflow-wrap:anywhere;
}
.col-head .count{
  margin-left:auto;
  font-size:13px;
  font-weight:700;
  color:var(--neu-text);
  background:var(--neu-bg);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-pill);
  padding:2px 10px;
  box-shadow:inset 2px 2px 4px var(--neu-shadow-dark),
             inset -2px -2px 4px var(--neu-shadow-light);
}

/* Task cards: gently extruded molded surfaces with crisp priority indicator */
.card{
  background:var(--neu-bg);
  border:1px solid var(--neu-edge-soft);
  border-left:5px solid var(--neu-low);
  border-radius:var(--radius-ctl);
  padding:14px 16px;
  margin-bottom:14px;
  cursor:grab;
  box-shadow:var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
             calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  transition:box-shadow .2s ease;
}
.card:last-child{margin-bottom:0}
.card:hover{
  box-shadow:var(--neu-dist) var(--neu-dist) var(--neu-blur) var(--neu-shadow-dark),
             calc(-1 * var(--neu-dist)) calc(-1 * var(--neu-dist)) var(--neu-blur) var(--neu-shadow-light);
}
.card.p-high{border-left-color:var(--neu-high)}
.card.p-mid{border-left-color:var(--neu-mid)}
.card.p-low{border-left-color:var(--neu-low)}
.card.dragging{opacity:.45}
.card .t{
  font-weight:600;
  font-size:16px;
  overflow-wrap:anywhere;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--neu-text-2);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  font-size:12px;
  font-weight:700;
  border:1px solid var(--neu-edge);
  border-radius:8px;
  padding:2px 8px;
  color:var(--neu-text-2);
  background:var(--neu-bg);
}
.tag.prio-high{color:var(--neu-high);border-color:var(--neu-high)}
.tag.prio-mid{color:var(--neu-mid);border-color:var(--neu-mid)}
.tag.late{color:var(--neu-high);border-color:var(--neu-high);background:var(--neu-bg)}

.acts{
  margin-left:auto;
  display:flex;
  gap:4px;
}
.acts button{
  background:var(--neu-bg);
  border:1px solid var(--neu-edge);
  border-radius:8px;
  width:32px;
  height:32px;
  cursor:pointer;
  color:var(--neu-text);
  font-size:15px;
  font-weight:700;
  line-height:1;
  display:grid;
  place-items:center;
  transition:box-shadow .18s ease;
}
.acts button:hover:not(:disabled){
  box-shadow:2px 2px 5px var(--neu-shadow-dark),-2px -2px 5px var(--neu-shadow-light);
}
.acts button:active:not(:disabled){
  box-shadow:inset 2px 2px 4px var(--neu-shadow-dark),inset -2px -2px 4px var(--neu-shadow-light);
}
.acts button:disabled{
  opacity:.35;
  cursor:default;
}

.empty{
  color:var(--neu-text-2);
  font-size:14px;
  text-align:center;
  padding:20px 8px;
  border-radius:var(--radius-ctl);
  border:1px dashed var(--neu-edge);
}

/* Week view */
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:12px;
  align-items:start;
}
.week .col,.extra .col{
  padding:14px 12px;
  min-height:170px;
}
.week .card{
  padding:10px 11px;
  margin-bottom:10px;
}
.week .card .t{font-size:14px}
.week .col-head{flex-wrap:wrap;gap:4px 6px;margin-bottom:12px}
.week .col-head h2{font-size:15px}
.dsub{
  font-size:13px;
  color:var(--neu-text-2);
  font-weight:600;
}
.col.today{
  border:2px solid var(--neu-accent);
  box-shadow:var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
             calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
}
.col.today .dsub{
  color:var(--neu-accent-text);
  font-weight:800;
}
.addday{
  width:100%;
  margin-top:8px;
  background:var(--neu-bg);
  border:1px dashed var(--neu-edge);
  border-radius:var(--radius-ctl);
  padding:8px 10px;
  color:var(--neu-text-2);
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:color .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.addday:hover{
  color:var(--neu-text);
  border-color:var(--neu-accent);
  box-shadow:2px 2px 5px var(--neu-shadow-dark),-2px -2px 5px var(--neu-shadow-light);
}
.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
  align-items:start;
}

[hidden]{display:none!important}

/* Responsive: shrink offsets under 768px and prevent horizontal overflow at 400px */
@media (max-width:1050px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .board,.week,.extra{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input[type=text]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
}
@media (max-width:768px){
  :root{
    --neu-dist:5px;
    --neu-blur:10px;
    --neu-dist-sm:3px;
    --neu-blur-sm:6px;
    --neu-dist-lg:8px;
    --neu-blur-lg:16px;
  }
  .wrap{
    padding:20px 14px 36px;
    gap:20px;
  }
  .progress{
    padding:20px;
    grid-template-columns:1fr;
    gap:16px;
  }
  .dial{margin:0 auto}
}
@media (max-width:440px){
  .add{grid-template-columns:1fr}
  .seg{width:100%}
  .seg button{flex:1 1 auto;text-align:center}
}

@media (prefers-reduced-motion:reduce){
  *{
    transition:none!important;
    animation:none!important;
  }
}

@media (prefers-reduced-transparency:reduce){
  :root{
    --neu-accent-soft:var(--neu-accent-soft-solid);
  }
}

@media (forced-colors:active){
  .neu-raised,.neu-pressed,.col,.card,.chip,.seg,.seg button,.btn,.theme-btn,.acts button,.add,.add input,.add select,.bar-well,.dial,.dial-center,.addday,.col-head .count{
    box-shadow:none!important;
    background:Canvas!important;
    color:CanvasText!important;
    border:1px solid CanvasText!important;
  }
  .btn,.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{
    background:Highlight!important;
    color:HighlightText!important;
    border-color:Highlight!important;
  }
  .col.today,.col.over{
    border:2px solid Highlight!important;
  }
  .bar .b-done,.bar .b-doing,.bar .b-todo{
    background:Highlight!important;
    border:1px solid CanvasText!important;
  }
  .dial-track{stroke:CanvasText!important}
  .dial-fill{stroke:Highlight!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="head-title">
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Chuyển giao diện sáng hoặc tối">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <span id="themeLbl">Giao diện: Tự động</span>
    </button>
  </header>

  <section class="progress neu-raised" aria-label="Tiến độ">
    <div class="dial" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle class="dial-track" cx="50" cy="50" r="40"/>
        <circle class="dial-fill" id="dialFill" cx="50" cy="50" r="40" stroke-dasharray="251.33" stroke-dashoffset="251.33"/>
      </svg>
      <div class="dial-center" id="dialPct">0%</div>
    </div>
    <div class="pg-body">
      <div class="pg-top">
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="bar-well" aria-hidden="true">
        <div class="bar"><span class="b-done" id="bDone"></span><span class="b-doing" id="bDoing"></span><span class="b-todo" id="bTodo"></span></div>
      </div>
      <div class="pg-legend">
        <span class="lg-done"><i></i>Hoàn thành</span>
        <span class="lg-doing"><i></i>Đang làm</span>
        <span class="lg-todo"><i></i>Cần làm</span>
      </div>
    </div>
  </section>

  <div class="controls">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button type="button" class="btn" id="addBtn">Thêm việc</button>
    </div>

    <div class="toolbar-row">
      <div class="views">
        <div class="seg" role="group" aria-label="Chế độ xem">
          <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
          <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
        </div>
      </div>
      <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
        <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
        <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
        <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
        <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
      </div>
    </div>

    <div class="weeknav" id="weeknav" hidden>
      <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
      <button type="button" class="chip" id="thisW">Tuần này</button>
      <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
      <span class="lbl" id="wlabel"></span>
    </div>
  </div>

  <main>
    <div class="board" id="board"></div>
    <div class="week" id="week" hidden></div>
    <div class="extra" id="extra" hidden></div>
  </main>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;
  var CIRC=2*Math.PI*40;

  function loadTheme(){
    var t="";
    try{t=localStorage.getItem(THEME_KEY)||""}catch(e){}
    applyTheme(t);
  }
  function applyTheme(t){
    var root=document.documentElement;
    if(t==="light"||t==="dark"){
      root.setAttribute("data-theme",t);
      document.getElementById("themeLbl").textContent="Giao diện: "+(t==="dark"?"Tối":"Sáng");
    }else{
      root.removeAttribute("data-theme");
      document.getElementById("themeLbl").textContent="Giao diện: Tự động";
    }
  }
  document.getElementById("themeBtn").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme")||"";
    var next=cur===""?"light":cur==="light"?"dark":"";
    try{
      if(next)localStorage.setItem(THEME_KEY,next);
      else localStorage.removeItem(THEME_KEY);
    }catch(e){}
    applyTheme(next);
  };

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("dialPct").textContent=pct+"%";
    document.getElementById("dialFill").style.strokeDashoffset=String(CIRC*(1-pct/100));
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  loadTheme();load();render();
})();
</script>
</body>
</html>
