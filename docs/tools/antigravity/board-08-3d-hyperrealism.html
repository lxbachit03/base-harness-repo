<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  /* Source tokens: 3D Hyperrealism — Material realism (light) */
  --sk-bg:#f5f0eb;
  --sk-surface:#ede5dc;
  --sk-raised:#e8e0d8;
  --sk-raised-top:#f1ebe4;
  --sk-pressed:#d8d0c8;
  --sk-text:#4a4240;
  --sk-text-2:#6a605a;        /* #7a706a fails AA (4.26:1); substituted #6a605a */
  --sk-text-well:#5c534e;     /* 4.92:1 on #d8d0c8 recessed well */
  --sk-emboss-light:#fffefa;
  --sk-emboss-dark:#9a8a80;
  --sk-coral:#d4836a;
  --sk-sky:#7ca8c8;
  --sk-sage:#8aaa8a;
  --sk-gold:#c8a86a;
  --sk-late-text:#94341e;     /* #d4836a fails on light (2.56:1); substituted #94341e */
  --sk-edge:#7a6f66;          /* >=3:1 UI edge on all light surfaces */
  --sk-on-accent:#2b2523;
  --sk-shadow:rgba(138,126,114,.35);
  --sk-radius:14px;
  --light-angle:135deg;

  /* Source tokens: 3D Hyperrealism — Spatial 3D (dark canvas) */
  --imm-void:#0b0b0f;
  --imm-space:#101018;
  --imm-indigo:#161630;
  --imm-slate:#1e1e2e;
  --imm-cyan:#00e5ff;
  --imm-violet:#7c3aed;
  --imm-magenta:#e040fb;
  --imm-amber:#f59e0b;
  --imm-green:#10b981;
  --imm-red:#f87171;          /* #ef4444 is 4.40:1 on glass scrim; substituted #f87171 */
  --imm-fog:#94a3b8;
  --imm-text:#f1f5f9;
  --font-display:"Exo 2","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;

  /* Active semantic theme (light default) */
  --bg:var(--sk-bg);
  --panel-bg:linear-gradient(180deg,var(--sk-raised-top),var(--sk-surface));
  --panel-solid:var(--sk-surface);
  --card-bg:linear-gradient(180deg,var(--sk-raised-top),var(--sk-raised));
  --card-solid:var(--sk-raised);
  --well-bg:var(--sk-pressed);
  --ink:var(--sk-text);
  --muted:var(--sk-text-2);
  --muted-well:var(--sk-text-well);
  --edge:var(--sk-edge);
  --key-bg:linear-gradient(180deg,var(--sk-raised-top),var(--sk-raised));
  --key-ink:var(--sk-text);
  --key-active-bg:linear-gradient(180deg,#59504d,#4a4240);
  --key-active-ink:#fffefa;
  --focus-ring:#4a4240;

  --todo:var(--sk-sky);
  --doing:var(--sk-gold);
  --done:var(--sk-sage);
  --high:var(--sk-coral);
  --mid:var(--sk-gold);
  --low:var(--sk-sky);
  --late:var(--sk-late-text);
  --on-bar-ink:var(--sk-on-accent);

  --bevel-hi:rgba(255,255,254,.84);
  --bevel-lo:rgba(138,126,114,.22);
  --drop-shadow:6px 8px 16px var(--sk-shadow),-2px -2px 6px rgba(255,255,255,.72);
  --card-shadow:4px 5px 12px var(--sk-shadow),-1px -1px 4px rgba(255,255,255,.68);
  --btn-shadow:3px 4px 8px var(--sk-shadow),-1px -1px 3px rgba(255,255,255,.72);
  --well-shadow:inset 3px 3px 6px rgba(138,126,114,.42),inset -2px -2px 5px rgba(255,255,255,.74);
  --btn-press-shadow:inset 2px 2px 5px rgba(138,126,114,.48),inset -1px -1px 3px rgba(255,255,255,.45);
  --emboss-shadow:1px 1px 0 var(--sk-emboss-light),-1px -1px 0 rgba(154,138,128,.45);
  --gauge-ring:#d8d0c8;
  --gauge-track:#c8bfb6;
  --gauge-fill:#3b698a;
  --backdrop-blur:none;

  color-scheme:light;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:var(--imm-void);
    --panel-bg:rgba(30,30,46,.88);
    --panel-solid:var(--imm-slate);
    --card-bg:linear-gradient(155deg,rgba(36,38,58,.92),rgba(24,25,40,.92));
    --card-solid:var(--imm-slate);
    --well-bg:#141422;
    --ink:var(--imm-text);
    --muted:var(--imm-fog);
    --muted-well:var(--imm-fog);
    --edge:#64748b;
    --key-bg:linear-gradient(180deg,#282840,#1c1c2c);
    --key-ink:var(--imm-text);
    --key-active-bg:linear-gradient(180deg,#33f0ff,#00e5ff);
    --key-active-ink:var(--imm-void);
    --focus-ring:var(--imm-cyan);

    --todo:var(--imm-cyan);
    --doing:var(--imm-amber);
    --done:var(--imm-green);
    --high:var(--imm-red);
    --mid:var(--imm-amber);
    --low:var(--imm-cyan);
    --late:var(--imm-red);
    --on-bar-ink:var(--imm-void);

    --bevel-hi:rgba(241,245,249,.16);
    --bevel-lo:rgba(0,0,0,.55);
    --drop-shadow:0 16px 36px rgba(0,0,0,.62),0 0 24px rgba(0,229,255,.06);
    --card-shadow:0 10px 22px rgba(0,0,0,.52),0 0 12px rgba(124,58,237,.08);
    --btn-shadow:0 6px 14px rgba(0,0,0,.5),0 0 0 1px rgba(100,116,139,.35);
    --well-shadow:inset 3px 3px 8px rgba(0,0,0,.78),inset -1px -1px 2px rgba(241,245,249,.09);
    --btn-press-shadow:inset 2px 3px 6px rgba(0,0,0,.85);
    --emboss-shadow:0 1px 0 rgba(0,0,0,.75),0 0 18px rgba(0,229,255,.18);
    --gauge-ring:#141422;
    --gauge-track:#27273d;
    --gauge-fill:var(--imm-cyan);
    --backdrop-blur:blur(14px);
    color-scheme:dark;
  }
}

:root[data-theme="dark"]{
  --bg:var(--imm-void);
  --panel-bg:rgba(30,30,46,.88);
  --panel-solid:var(--imm-slate);
  --card-bg:linear-gradient(155deg,rgba(36,38,58,.92),rgba(24,25,40,.92));
  --card-solid:var(--imm-slate);
  --well-bg:#141422;
  --ink:var(--imm-text);
  --muted:var(--imm-fog);
  --muted-well:var(--imm-fog);
  --edge:#64748b;
  --key-bg:linear-gradient(180deg,#282840,#1c1c2c);
  --key-ink:var(--imm-text);
  --key-active-bg:linear-gradient(180deg,#33f0ff,#00e5ff);
  --key-active-ink:var(--imm-void);
  --focus-ring:var(--imm-cyan);

  --todo:var(--imm-cyan);
  --doing:var(--imm-amber);
  --done:var(--imm-green);
  --high:var(--imm-red);
  --mid:var(--imm-amber);
  --low:var(--imm-cyan);
  --late:var(--imm-red);
  --on-bar-ink:var(--imm-void);

  --bevel-hi:rgba(241,245,249,.16);
  --bevel-lo:rgba(0,0,0,.55);
  --drop-shadow:0 16px 36px rgba(0,0,0,.62),0 0 24px rgba(0,229,255,.06);
  --card-shadow:0 10px 22px rgba(0,0,0,.52),0 0 12px rgba(124,58,237,.08);
  --btn-shadow:0 6px 14px rgba(0,0,0,.5),0 0 0 1px rgba(100,116,139,.35);
  --well-shadow:inset 3px 3px 8px rgba(0,0,0,.78),inset -1px -1px 2px rgba(241,245,249,.09);
  --btn-press-shadow:inset 2px 3px 6px rgba(0,0,0,.85);
  --emboss-shadow:0 1px 0 rgba(0,0,0,.75),0 0 18px rgba(0,229,255,.18);
  --gauge-ring:#141422;
  --gauge-track:#27273d;
  --gauge-fill:var(--imm-cyan);
  --backdrop-blur:blur(14px);
  color-scheme:dark;
}

html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  min-height:100vh;
  background-color:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  position:relative;
  overflow-x:clip;
}

/* Poster fallback + progressive WebGL2 ambient canvas */
.stage-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,254,250,.72),transparent 48%),
    linear-gradient(var(--light-angle),#f8f4ef 0%,var(--sk-bg) 56%,#e6ddd3 100%);
}
:root[data-theme="dark"] .stage-bg{
  background:
    radial-gradient(ellipse 80% 55% at 15% 10%,rgba(0,229,255,.11),transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 20%,rgba(124,58,237,.16),transparent 62%),
    linear-gradient(180deg,var(--imm-space) 0%,var(--imm-void) 70%,#08080c 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .stage-bg{
    background:
      radial-gradient(ellipse 80% 55% at 15% 10%,rgba(0,229,255,.11),transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 20%,rgba(124,58,237,.16),transparent 62%),
      linear-gradient(180deg,var(--imm-space) 0%,var(--imm-void) 70%,#08080c 100%);
  }
}
.poster-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.55;
}
#spatialCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  opacity:0;
  transition:opacity .45s ease;
}
#spatialCanvas.is-live{opacity:1}

.wrap{
  position:relative;
  z-index:1;
  max-width:1260px;
  margin:0 auto;
  padding:24px 18px 48px;
}

/* Tactile raised shell helper */
.sk-panel{
  background:var(--panel-bg);
  border:1px solid var(--edge);
  border-radius:var(--sk-radius);
  box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo),var(--drop-shadow);
  -webkit-backdrop-filter:var(--backdrop-blur);
  backdrop-filter:var(--backdrop-blur);
}
@supports not (backdrop-filter:blur(1px)){
  .sk-panel{background:var(--panel-solid)}
}

/* Header module (never raw text on canvas) */
.hero-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  padding:16px 20px;
  margin-bottom:18px;
}
.hero-title{min-width:0;flex:1 1 260px}
h1{
  font-family:var(--font-display);
  font-size:clamp(24px,4.2vw,38px);
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin:0 0 4px;
  line-height:1.12;
  text-shadow:var(--emboss-shadow);
}
.sub{color:var(--muted);margin:0;font-size:14px}

.theme-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--key-bg);
  color:var(--key-ink);
  border:1px solid var(--edge);
  border-radius:10px;
  padding:9px 14px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo),var(--btn-shadow);
  transition:transform .16s ease,opacity .16s ease;
  flex-shrink:0;
}
.theme-btn:hover{opacity:.92}
.theme-btn:active{transform:translateY(1px);box-shadow:var(--btn-press-shadow)}
.theme-led{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--doing);
  border:1px solid var(--edge);
  box-shadow:inset 1px 1px 1px rgba(255,255,255,.7);
}
:root[data-theme="dark"] .theme-led{background:var(--imm-cyan);box-shadow:0 0 8px var(--imm-cyan)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-led{background:var(--imm-cyan);box-shadow:0 0 8px var(--imm-cyan)}
}

/* Progress Instrument */
.progress{
  padding:18px 20px;
  margin-bottom:16px;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:18px;
  align-items:center;
}
.gauge-wrap{
  width:88px;
  height:88px;
  border-radius:50%;
  background:var(--well-bg);
  padding:6px;
  box-shadow:var(--well-shadow);
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.gauge-svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.gauge-track{fill:none;stroke:var(--gauge-track);stroke-width:9}
.gauge-fill{fill:none;stroke:var(--gauge-fill);stroke-width:9;stroke-linecap:round}
.pg-body{min-width:0}
.pg-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pg-num{
  font-family:var(--font-display);
  font-size:clamp(28px,5vw,44px);
  font-weight:800;
  letter-spacing:.02em;
  line-height:1;
  text-shadow:var(--emboss-shadow);
}
.pg-num small{
  font-family:var(--font-body);
  font-size:.38em;
  font-weight:600;
  color:var(--muted);
  letter-spacing:0;
  margin-left:8px;
  text-shadow:none;
}
.pg-note{color:var(--muted);font-size:14px;font-weight:500}
.bar{
  display:flex;
  height:18px;
  border-radius:9px;
  overflow:hidden;
  background:var(--well-bg);
  border:1px solid var(--edge);
  padding:2px;
  gap:3px;
  box-shadow:var(--well-shadow);
}
.bar span{
  display:block;
  min-width:0;
  border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}
.bar .b-done{background:var(--done)}
.bar .b-doing{background:var(--doing)}
.bar .b-todo{background:var(--todo)}

/* Command Deck (Add + Views + WeekNav + Filters) */
.deck{padding:16px 18px;margin-bottom:18px}
.add{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;margin-bottom:14px}
input,select,button{font:inherit;color:inherit}
.add input,.add select{
  background:var(--well-bg);
  color:var(--ink);
  border:1px solid var(--edge);
  border-radius:10px;
  padding:10px 12px;
  min-width:0;
  box-shadow:var(--well-shadow);
}
.add input::placeholder{color:var(--muted-well);opacity:1}
.btn{
  background:var(--key-active-bg);
  color:var(--key-active-ink);
  border:1px solid var(--edge);
  border-radius:10px;
  padding:10px 18px;
  font-weight:700;
  cursor:pointer;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.28),var(--btn-shadow);
  transition:transform .16s ease,opacity .16s ease;
}
.btn:hover{opacity:.92}
.btn:active{transform:translateY(1px);box-shadow:var(--btn-press-shadow)}

:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}

.controls-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.views{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{
  display:inline-flex;
  background:var(--well-bg);
  border:1px solid var(--edge);
  border-radius:11px;
  padding:3px;
  gap:3px;
  box-shadow:var(--well-shadow);
  max-width:100%;
}
.seg button{
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  padding:7px 14px;
  cursor:pointer;
  color:var(--muted-well);
  font-weight:600;
  font-size:14px;
  transition:transform .16s ease,opacity .16s ease;
}
.seg button[aria-pressed="true"]{
  background:var(--key-active-bg);
  color:var(--key-active-ink);
  border-color:var(--edge);
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.25),var(--btn-shadow);
}
.seg button:active{transform:translateY(1px)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  background:var(--key-bg);
  border:1px solid var(--edge);
  border-radius:999px;
  padding:6px 14px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  color:var(--ink);
  box-shadow:inset 1px 1px 0 var(--bevel-hi),var(--btn-shadow);
  transition:transform .16s ease,opacity .16s ease;
}
.chip:hover{opacity:.9}
.chip:active{transform:translateY(1px);box-shadow:var(--btn-press-shadow)}
.chip[aria-pressed="true"]{
  background:var(--key-active-bg);
  color:var(--key-active-ink);
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.22),var(--btn-press-shadow);
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--edge);
  flex-wrap:wrap;
}
.weeknav .lbl{font-weight:700;margin-left:4px;font-size:15px}

[hidden]{display:none!important}

/* Board & Columns (Recessed machined bays) */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{
  background:var(--panel-bg);
  border:1px solid var(--edge);
  border-radius:var(--sk-radius);
  padding:14px;
  min-height:200px;
  min-width:0;
  box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo),var(--drop-shadow);
  -webkit-backdrop-filter:var(--backdrop-blur);
  backdrop-filter:var(--backdrop-blur);
  transition:transform .16s ease,opacity .16s ease;
}
@supports not (backdrop-filter:blur(1px)){
  .col{background:var(--panel-solid)}
}
.col.over{
  outline:2px solid var(--focus-ring);
  outline-offset:-2px;
  transform:translateY(-2px);
}
.col-head{display:flex;align-items:center;gap:9px;margin:0 2px 12px;padding-bottom:10px;border-bottom:1px solid var(--edge)}
.col-head i{
  width:13px;
  height:13px;
  border-radius:50%;
  display:block;
  border:1px solid var(--edge);
  box-shadow:inset 2px 2px 2px rgba(255,255,255,.72),0 1px 3px rgba(0,0,0,.25);
  flex-shrink:0;
}
.col[data-s="todo"] i{background:var(--todo)}
.col[data-s="doing"] i{background:var(--doing)}
.col[data-s="done"] i{background:var(--done)}
.col-head h2{
  font-family:var(--font-display);
  font-size:15px;
  letter-spacing:.03em;
  text-transform:uppercase;
  margin:0;
  font-weight:700;
}
.col-head .count{
  margin-left:auto;
  font-size:13px;
  font-weight:700;
  color:var(--muted-well);
  background:var(--well-bg);
  border:1px solid var(--edge);
  border-radius:999px;
  padding:1px 10px;
  box-shadow:var(--well-shadow);
}

/* Tactile Raised Task Cards */
.card{
  background:var(--card-bg);
  border:1px solid var(--edge);
  border-left:7px solid var(--low);
  border-radius:11px;
  padding:12px 13px;
  margin-bottom:11px;
  box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo),var(--card-shadow);
  cursor:grab;
  min-width:0;
  transition:transform .16s ease,opacity .16s ease;
}
@supports not (backdrop-filter:blur(1px)){
  .card{background:var(--card-solid)}
}
.card:hover{transform:translateY(-1px)}
.card.p-high{border-left-color:var(--high)}
.card.p-mid{border-left-color:var(--mid)}
.card.p-low{border-left-color:var(--low)}
.card.dragging{opacity:.42;transform:scale(.98)}
.card .t{font-weight:600;overflow-wrap:anywhere;color:var(--ink)}
.card.is-done .t{text-decoration:line-through;color:var(--muted)}

.meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.tag{
  font-size:12px;
  font-weight:600;
  background:var(--well-bg);
  border:1px solid var(--edge);
  border-radius:6px;
  padding:2px 8px;
  color:var(--muted-well);
  box-shadow:inset 1px 1px 2px rgba(0,0,0,.14);
}
.tag.late{
  color:var(--late);
  border-color:var(--late);
  font-weight:700;
}
.acts{margin-left:auto;display:flex;gap:4px}
.acts button{
  background:var(--key-bg);
  border:1px solid var(--edge);
  border-radius:7px;
  width:30px;
  height:30px;
  cursor:pointer;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  line-height:1;
  display:grid;
  place-items:center;
  box-shadow:inset 1px 1px 0 var(--bevel-hi),0 2px 4px rgba(0,0,0,.18);
  transition:transform .14s ease,opacity .14s ease;
}
.acts button:hover:not(:disabled){opacity:.88}
.acts button:active:not(:disabled){transform:translateY(1px);box-shadow:var(--btn-press-shadow)}
.acts button:disabled{opacity:.32;cursor:default;box-shadow:none}

.empty{
  color:var(--muted-well);
  background:var(--well-bg);
  border:1px dashed var(--edge);
  border-radius:10px;
  font-size:14px;
  text-align:center;
  padding:20px 10px;
  box-shadow:var(--well-shadow);
}

/* Week View */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.week .col,.extra .col{padding:10px}
.week .card{padding:9px 10px;font-size:14px}
.week .col-head{flex-wrap:wrap;gap:3px 6px}
.week .col-head h2{font-size:13px}
.dsub{font-size:12px;color:var(--muted);font-weight:600}
.col.today{
  border-color:var(--focus-ring);
  box-shadow:inset 1px 1px 0 var(--bevel-hi),0 0 0 1px var(--focus-ring),var(--drop-shadow);
}
.col.today .dsub{color:var(--focus-ring);font-weight:700}
.addday{
  width:100%;
  background:var(--well-bg);
  border:1px dashed var(--edge);
  border-radius:8px;
  padding:7px 8px;
  color:var(--muted-well);
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  box-shadow:var(--well-shadow);
  transition:transform .14s ease,opacity .14s ease;
}
.addday:hover{color:var(--ink);border-style:solid}
.addday:active{transform:translateY(1px)}
.extra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px;align-items:start}

@media (max-width:1080px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .wrap{padding:16px 12px 36px}
  .progress{grid-template-columns:1fr;justify-items:start}
  .week,.extra,.board{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input[type=text]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
}
@media (max-width:440px){
  .add{grid-template-columns:1fr}
  .hero-bar,.progress,.deck{padding:14px}
  .seg{width:100%}
  .seg button{flex:1 1 0;padding:7px 8px;font-size:13px}
}

/* Mandatory Accessibility & Environment Fallbacks */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
  }
  #spatialCanvas{display:none!important}
}

@media (prefers-reduced-transparency:reduce){
  :root[data-theme="dark"],:root:not([data-theme="light"]){
    --backdrop-blur:none;
  }
  .sk-panel,.col{
    -webkit-backdrop-filter:none!important;
    backdrop-filter:none!important;
    background:var(--panel-solid)!important;
  }
  .card{background:var(--card-solid)!important}
}

@media (forced-colors:active){
  .stage-bg,.poster-svg,#spatialCanvas{display:none!important}
  .sk-panel,.col,.card,.btn,.chip,.theme-btn,.seg,.seg button,.bar,.tag,.acts button,.addday,.add input,.add select,.gauge-wrap,.col-head .count{
    background:Canvas!important;
    color:CanvasText!important;
    border:1px solid CanvasText!important;
    box-shadow:none!important;
    text-shadow:none!important;
  }
  .btn,.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{
    background:Highlight!important;
    color:HighlightText!important;
    border-color:Highlight!important;
  }
  .card{border-left-width:6px!important}
  .bar span{forced-color-adjust:none;border:1px solid CanvasText}
  .gauge-track{stroke:GrayText!important}
  .gauge-fill{stroke:Highlight!important}
  :focus-visible{outline:3px solid Highlight!important}
}
</style>
</head>
<body>
<div class="stage-bg" aria-hidden="true">
  <svg class="poster-svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" focusable="false">
    <defs>
      <linearGradient id="gridLine" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="currentColor" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="currentColor" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    <g stroke="url(#gridLine)" stroke-width="1" fill="none">
      <path d="M0 540 L1200 540 M0 600 L1200 600 M0 660 L1200 660"/>
      <path d="M600 320 L120 720 M600 320 L360 720 M600 320 L600 720 M600 320 L840 720 M600 320 L1080 720"/>
    </g>
  </svg>
  <canvas id="spatialCanvas"></canvas>
</div>

<div class="wrap">
  <header class="sk-panel hero-bar">
    <div class="hero-title">
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-pressed="false">
      <span class="theme-led" aria-hidden="true"></span>
      <span id="themeLbl">Giao diện: Sáng</span>
    </button>
  </header>

  <section class="sk-panel progress" aria-label="Tiến độ">
    <div class="gauge-wrap" aria-hidden="true">
      <svg class="gauge-svg" viewBox="0 0 100 100" focusable="false">
        <circle class="gauge-track" cx="50" cy="50" r="40"></circle>
        <circle class="gauge-fill" id="gaugeArc" cx="50" cy="50" r="40" stroke-dasharray="251.33" stroke-dashoffset="251.33"></circle>
      </svg>
    </div>
    <div class="pg-body">
      <div class="pg-top">
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="bar" aria-hidden="true">
        <span class="b-done" id="bDone"></span>
        <span class="b-doing" id="bDoing"></span>
        <span class="b-todo" id="bTodo"></span>
      </div>
    </div>
  </section>

  <section class="sk-panel deck" aria-label="Điều khiển công việc">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button class="btn" id="addBtn" type="button">Thêm việc</button>
    </div>

    <div class="controls-row">
      <div class="views">
        <div class="seg" role="group" aria-label="Chế độ xem">
          <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
          <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
        </div>
      </div>

      <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
        <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
        <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
        <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
        <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
      </div>
    </div>

    <div class="weeknav" id="weeknav" hidden>
      <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
      <button type="button" class="chip" id="thisW">Tuần này</button>
      <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
      <span class="lbl" id="wlabel"></span>
    </div>
  </section>

  <main>
    <div class="board" id="board"></div>
    <div class="week" id="week" hidden></div>
    <div class="extra" id="extra" hidden></div>
  </main>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var CIRC=251.33;
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag",PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("gaugeArc").setAttribute("stroke-dashoffset",(CIRC*(1-pct/100)).toFixed(2));
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};

  /* Theme handling (prefers-color-scheme + data-theme) */
  var mqDark=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
  var mqMotion=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):null;
  function currentTheme(){
    var attr=document.documentElement.getAttribute("data-theme");
    if(attr==="dark"||attr==="light")return attr;
    return mqDark&&mqDark.matches?"dark":"light";
  }
  function syncThemeUI(){
    var t=currentTheme();
    var btn=document.getElementById("themeBtn");
    btn.setAttribute("aria-pressed",String(t==="dark"));
    document.getElementById("themeLbl").textContent=t==="dark"?"Giao diện: Tối":"Giao diện: Sáng";
  }
  try{
    var savedTheme=localStorage.getItem(THEME_KEY);
    if(savedTheme==="dark"||savedTheme==="light")document.documentElement.setAttribute("data-theme",savedTheme);
  }catch(e){}
  syncThemeUI();
  document.getElementById("themeBtn").onclick=function(){
    var next=currentTheme()==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem(THEME_KEY,next)}catch(e){}
    syncThemeUI();
  };
  if(mqDark&&mqDark.addEventListener)mqDark.addEventListener("change",syncThemeUI);

  /* Progressive-enhancement WebGL2 spatial background (desktop + non-reduced-motion only) */
  function initSpatialCanvas(){
    var canvas=document.getElementById("spatialCanvas");
    if(!canvas)return;
    var rafId=0,gl=null;
    function stop(){
      if(rafId){cancelAnimationFrame(rafId);rafId=0}
      canvas.classList.remove("is-live");
    }
    function shouldRun(){
      if(mqMotion&&mqMotion.matches)return false;
      if(window.innerWidth<768)return false;
      return true;
    }
    function start(){
      stop();
      if(!shouldRun())return;
      if(!gl){
        try{gl=canvas.getContext("webgl2",{alpha:true,antialias:false,powerPreference:"low-power"})}catch(e){gl=null}
      }
      if(!gl)return;
      var vsSrc="#version 300 es\nlayout(location=0) in vec2 pos;out vec2 vUv;void main(){vUv=pos*0.5+0.5;gl_Position=vec4(pos,0.0,1.0);}";
      var fsSrc="#version 300 es\nprecision mediump float;in vec2 vUv;uniform float uTime;uniform float uDark;out vec4 frag;\nvoid main(){\n  vec2 p=vUv*2.0-1.0;\n  float wave=sin(p.x*3.2+uTime*0.35)*cos(p.y*2.6-uTime*0.25);\n  float horizon=smoothstep(0.65,-0.55,p.y);\n  if(uDark>0.5){\n    vec3 c1=vec3(0.0,0.9,1.0)*0.07*horizon;\n    vec3 c2=vec3(0.49,0.23,0.93)*0.09*(0.5+0.5*wave);\n    frag=vec4(c1+c2,0.55);\n  }else{\n    vec3 warm=vec3(0.98,0.96,0.92)*(0.06+0.04*wave);\n    frag=vec4(warm,0.35);\n  }\n}";
      function compile(type,src){
        var sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);
        if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){gl.deleteShader(sh);return null}
        return sh;
      }
      var vs=compile(gl.VERTEX_SHADER,vsSrc),fs=compile(gl.FRAGMENT_SHADER,fsSrc);
      if(!vs||!fs)return;
      var prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog,gl.LINK_STATUS))return;
      var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
      var uTime=gl.getUniformLocation(prog,"uTime");
      var uDark=gl.getUniformLocation(prog,"uDark");
      gl.useProgram(prog);
      canvas.classList.add("is-live");
      var t0=performance.now();
      function frame(now){
        if(!shouldRun()){stop();return}
        var dpr=Math.min(window.devicePixelRatio||1,1.5);
        var w=Math.floor(canvas.clientWidth*dpr),h=Math.floor(canvas.clientHeight*dpr);
        if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}
        gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform1f(uTime,(now-t0)*0.001);
        gl.uniform1f(uDark,currentTheme()==="dark"?1.0:0.0);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
        rafId=requestAnimationFrame(frame);
      }
      rafId=requestAnimationFrame(frame);
    }
    start();
    window.addEventListener("resize",function(){if(shouldRun()&&!rafId)start();else if(!shouldRun())stop()});
    if(mqMotion&&mqMotion.addEventListener)mqMotion.addEventListener("change",function(){if(shouldRun())start();else stop()});
  }

  load();
  render();
  initSpatialCanvas();
})();
</script>
</body>
</html>
