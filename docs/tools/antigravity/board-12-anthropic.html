<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  /* Anthropic brand look tokens */
  --bg:#faf9f5;
  --surface:#ffffff;
  --surface-2:#f5f4ed;
  --surface-3:#f0eee6;
  --line:#e8e6dc;
  --line-2:#dedcd1;
  --line-ctl:#87867f;
  --ink:#141413;
  --ink-2:#3d3d3a;
  --muted:#5e5d59; /* substituted for #87867f which fails 4.5:1 on #faf9f5 (3.47:1) */
  --accent:#d97757;
  --accent-interactive:#c6613f; /* UI borders and focus ring (>=3.85:1) */
  --clay-ink:#9c4325; /* deep clay for small text (>=6.15:1) */

  /* Secondary / semantic status & priority tokens (separate from clay accent) */
  --todo:#366899; /* deepened from --sky #6a9bcc (2.78:1) for >=5.5:1 UI contrast */
  --todo-bg:#cde2fb;
  --todo-ink:#184f95;
  --doing:#4a3aa7;
  --doing-bg:#dfdbfd;
  --doing-ink:#4a3aa7;
  --done:#788c5d;
  --done-bg:#bcd1ca;
  --done-ink:#334721;

  --prio-high:#c46686;
  --prio-high-bg:#ebcece;
  --prio-high-ink:#7d2438;
  --prio-mid:#8b6830;
  --prio-mid-bg:#e3dacc;
  --prio-mid-ink:#594825;
  --prio-low:#87867f;
  --prio-low-bg:#f5f4ed;
  --prio-low-ink:#5e5d59;

  --radius-xs:4px;
  --radius-ctl:8px;
  --radius-card:12px;
  --radius-pill:999px;
  --shadow:0 1px 2px rgba(20,20,19,.04),0 4px 12px rgba(20,20,19,.03);
  --font-serif:"Newsreader","Source Serif 4",Georgia,serif;
  --font-sans:"Inter","DM Sans",system-ui,-apple-system,sans-serif;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141413;
    --surface:#1f1e1d;
    --surface-2:#262624;
    --surface-3:#30302e;
    --line:#30302e;
    --line-2:#3d3d3a;
    --line-ctl:#73726c;
    --ink:#faf9f5;
    --ink-2:#e8e6dc;
    --muted:#b0aea5;
    --accent:#d97757;
    --accent-interactive:#d97757;
    --clay-ink:#d97757;

    --todo:#8cb4e0;
    --todo-bg:#1d2838;
    --todo-ink:#8cb4e0;
    --doing:#b8b0f5;
    --doing-bg:#28243d;
    --doing-ink:#b8b0f5;
    --done:#a3be8c;
    --done-bg:#232d22;
    --done-ink:#a3be8c;

    --prio-high:#f2a7b8;
    --prio-high-bg:#3a2228;
    --prio-high-ink:#f2a7b8;
    --prio-mid:#d9a959;
    --prio-mid-bg:#302a20;
    --prio-mid-ink:#e3dacc;
    --prio-low:#9c9a92;
    --prio-low-bg:#262624;
    --prio-low-ink:#b0aea5;
    --shadow:none;
  }
}

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141413;
  --surface:#1f1e1d;
  --surface-2:#262624;
  --surface-3:#30302e;
  --line:#30302e;
  --line-2:#3d3d3a;
  --line-ctl:#73726c;
  --ink:#faf9f5;
  --ink-2:#e8e6dc;
  --muted:#b0aea5;
  --accent:#d97757;
  --accent-interactive:#d97757;
  --clay-ink:#d97757;

  --todo:#8cb4e0;
  --todo-bg:#1d2838;
  --todo-ink:#8cb4e0;
  --doing:#b8b0f5;
  --doing-bg:#28243d;
  --doing-ink:#b8b0f5;
  --done:#a3be8c;
  --done-bg:#232d22;
  --done-ink:#a3be8c;

  --prio-high:#f2a7b8;
  --prio-high-bg:#3a2228;
  --prio-high-ink:#f2a7b8;
  --prio-mid:#d9a959;
  --prio-mid-bg:#302a20;
  --prio-mid-ink:#e3dacc;
  --prio-low:#9c9a92;
  --prio-low-bg:#262624;
  --prio-low-ink:#b0aea5;
  --shadow:none;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 1rem/1.5 var(--font-sans);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding-top:clamp(24px,4vw,44px);
  padding-bottom:clamp(36px,5vw,64px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.title-block{min-width:0;flex:1 1 280px}
h1.display{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:clamp(2.125rem,4.5vw,3.125rem);
  line-height:1.12;
  letter-spacing:-.015em;
  margin:0 0 8px;
  text-wrap:balance;
  font-variation-settings:"opsz" 48;
}
.sub{
  margin:0;
  color:var(--muted);
  font-size:1rem;
  line-height:1.5;
  max-width:58ch;
}

.theme-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--surface-2);
  color:var(--ink-2);
  border:1px solid var(--line-2);
  border-radius:var(--radius-pill);
  padding:8px 14px;
  font:500 .8125rem/1.4 var(--font-sans);
  letter-spacing:.01em;
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.theme-btn:hover{background:var(--surface-3);border-color:var(--line-ctl);color:var(--ink)}
.theme-btn svg{width:15px;height:15px;flex:none}

input,select,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-interactive);outline-offset:2px}
[hidden]{display:none!important}

/* Tiến độ */
.progress{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  padding:20px 24px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px 24px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.pg-num{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:clamp(2.25rem,5vw,3.25rem);
  line-height:1;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  font-variation-settings:"opsz" 48;
}
.pg-num small{
  font-family:var(--font-sans);
  font-size:.9375rem;
  font-weight:400;
  color:var(--muted);
  letter-spacing:0;
  margin-left:10px;
}
.pg-note{
  color:var(--muted);
  font-size:.9375rem;
}
.bar{
  display:flex;
  height:10px;
  border-radius:var(--radius-pill);
  overflow:hidden;
  background:var(--surface-3);
  gap:2px;
}
.bar span{
  display:block;
  min-width:0;
  transition:flex-grow .35s ease;
}
.bar .b-done{background:var(--done)}
.bar .b-doing{background:var(--doing)}
.bar .b-todo{background:var(--todo)}
.pg-legend{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  margin-top:12px;
  font-size:.8125rem;
  color:var(--muted);
}
.leg-item{display:inline-flex;align-items:center;gap:6px}
.leg-dot{width:8px;height:8px;border-radius:var(--radius-pill);display:inline-block}
.leg-dot.d-done{background:var(--done)}
.leg-dot.d-doing{background:var(--doing)}
.leg-dot.d-todo{background:var(--todo)}

/* Thêm việc */
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:10px;
  padding:12px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  margin-bottom:18px;
}
.add input,.add select{
  background:var(--surface);
  border:1px solid var(--line-ctl);
  border-radius:var(--radius-ctl);
  padding:9px 12px;
  min-width:0;
  font-size:.9375rem;
  color:var(--ink);
  transition:border-color .15s ease;
}
.add input::placeholder{color:var(--muted)}
.add input:hover,.add select:hover{border-color:var(--ink-2)}
.btn{
  border:0;
  border-radius:var(--radius-pill);
  padding:9px 20px;
  font:500 .875rem/1.5 var(--font-sans);
  letter-spacing:.01em;
  background:var(--ink);
  color:var(--bg);
  cursor:pointer;
  white-space:nowrap;
  transition:opacity .15s ease,transform .15s ease;
}
.btn:hover{opacity:.88}
.btn:active{transform:translateY(1px)}

/* Chế độ xem & Bộ lọc */
.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px 16px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.seg{
  display:inline-flex;
  flex-wrap:wrap;
  background:var(--surface-2);
  border:1px solid var(--line-2);
  border-radius:var(--radius-pill);
  padding:3px;
  gap:2px;
  max-width:100%;
}
.seg button{
  background:transparent;
  border:0;
  border-radius:var(--radius-pill);
  padding:6px 15px;
  font:500 .875rem/1.4 var(--font-sans);
  color:var(--muted);
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{
  background:var(--ink);
  color:var(--bg);
}

.filters{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.chip{
  background:var(--surface);
  border:1px solid var(--line-ctl);
  border-radius:var(--radius-pill);
  padding:5px 14px;
  font:500 .8125rem/1.45 var(--font-sans);
  letter-spacing:.01em;
  color:var(--ink-2);
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.chip:hover{background:var(--surface-2);border-color:var(--ink)}
.chip[aria-pressed="true"]{
  background:var(--ink);
  color:var(--bg);
  border-color:var(--ink);
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.weeknav .lbl{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:1.125rem;
  color:var(--ink);
  margin-left:4px;
}

/* Bảng cột */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  align-items:start;
}
.col{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  padding:14px;
  min-width:0;
  min-height:200px;
  transition:background .15s ease,border-color .15s ease;
}
.col.over{
  background:var(--surface-3);
  border-color:var(--accent-interactive);
}
.col-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 2px 12px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
}
.col-head i{
  width:9px;
  height:9px;
  border-radius:var(--radius-pill);
  display:block;
  flex:none;
}
.col-head h2{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:1.1875rem;
  line-height:1.25;
  margin:0;
  letter-spacing:-.01em;
}
.col-head .count{
  margin-left:auto;
  font-size:.75rem;
  font-weight:500;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-pill);
  padding:1px 9px;
  font-variant-numeric:tabular-nums;
}
.col[data-s="todo"] i{background:var(--todo)}
.col[data-s="doing"] i{background:var(--doing)}
.col[data-s="done"] i{background:var(--done)}

/* Thẻ công việc */
.card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-left:4px solid var(--prio-low);
  border-radius:var(--radius-ctl);
  padding:12px 13px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
  cursor:grab;
  transition:border-color .15s ease,opacity .15s ease;
}
.card:last-child{margin-bottom:0}
.card:hover{border-color:var(--line-ctl)}
.card.p-high{border-left-color:var(--prio-high)}
.card.p-mid{border-left-color:var(--prio-mid)}
.card.p-low{border-left-color:var(--prio-low)}
.card.dragging{opacity:.45;cursor:grabbing}
.card .t{
  font-weight:500;
  font-size:.9375rem;
  line-height:1.45;
  color:var(--ink);
  overflow-wrap:anywhere;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--muted);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  font-size:.75rem;
  font-weight:500;
  line-height:1.35;
  border-radius:var(--radius-xs);
  padding:2px 8px;
  background:var(--surface-2);
  color:var(--muted);
  border:1px solid var(--line);
}
.tag.prio-high{background:var(--prio-high-bg);color:var(--prio-high-ink);border-color:transparent}
.tag.prio-mid{background:var(--prio-mid-bg);color:var(--prio-mid-ink);border-color:transparent}
.tag.prio-low{background:var(--prio-low-bg);color:var(--prio-low-ink);border-color:var(--line-2)}
.tag.status-doing{background:var(--doing-bg);color:var(--doing-ink);border-color:transparent}
.tag.late{background:var(--prio-high-bg);color:var(--prio-high-ink);border-color:var(--prio-high);font-weight:600}

.acts{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:2px;
}
.acts button{
  background:transparent;
  border:1px solid transparent;
  border-radius:var(--radius-xs);
  width:28px;
  height:28px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--muted);
  font-size:.9375rem;
  line-height:1;
  transition:background .15s ease,color .15s ease;
}
.acts button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.acts button:disabled{opacity:.28;cursor:default}

.empty{
  color:var(--muted);
  font-size:.875rem;
  text-align:center;
  padding:24px 10px;
}

/* Theo tuần */
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
  align-items:start;
}
.week .col,.extra .col{padding:11px;min-height:160px}
.week .card{padding:10px;font-size:.875rem}
.week .col-head{flex-wrap:wrap;gap:2px 6px;margin-bottom:10px;padding-bottom:8px}
.week .col-head h2{font-size:1rem}
.dsub{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.col.today{
  background:var(--surface);
  border-color:var(--accent-interactive);
  box-shadow:var(--shadow);
}
.col.today .dsub{
  color:var(--clay-ink);
  font-weight:600;
}
.addday{
  width:100%;
  margin-top:8px;
  background:transparent;
  border:1px dashed var(--line-ctl);
  border-radius:var(--radius-pill);
  padding:6px 10px;
  color:var(--muted);
  cursor:pointer;
  font-size:.8125rem;
  font-weight:500;
  transition:color .15s ease,border-color .15s ease,background .15s ease;
}
.addday:hover{color:var(--ink);border-color:var(--ink);background:var(--surface)}

.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:16px;
  align-items:start;
}

@media (max-width:1080px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .board,.extra{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input[type="text"],.add .btn{grid-column:1/-1}
}
@media (max-width:680px){
  .week{grid-template-columns:1fr}
}
@media (max-width:520px){
  .add{grid-template-columns:1fr}
  .controls{align-items:stretch}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
@media (prefers-reduced-transparency:reduce){
  .progress,.col,.card,.theme-btn,.chip,.seg,.add{
    backdrop-filter:none!important;
  }
}
@media (forced-colors:active){
  .progress,.col,.card,.theme-btn,.chip,.seg,.add,.tag,.bar,.addday,.btn{
    border:1px solid ButtonText;
    forced-color-adjust:auto;
  }
  .col.today,.col.over{border:2px solid Highlight}
  .chip[aria-pressed="true"],.seg button[aria-pressed="true"],.btn{
    background:Highlight;
    color:HighlightText;
  }
  :focus-visible{outline:2px solid Highlight;outline-offset:2px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="topbar">
    <div class="title-block">
      <h1 class="display">Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Chuyển giao diện sáng tối">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span id="themeLabel">Chế độ tối</span>
    </button>
  </header>

  <section class="progress" aria-label="Tiến độ">
    <div class="pg-top">
      <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
      <div class="pg-note" id="note"></div>
    </div>
    <div class="bar" aria-hidden="true">
      <span class="b-done" id="bDone"></span>
      <span class="b-doing" id="bDoing"></span>
      <span class="b-todo" id="bTodo"></span>
    </div>
    <div class="pg-legend" aria-hidden="true">
      <span class="leg-item"><i class="leg-dot d-done"></i>Hoàn thành (<span id="cDone">0</span>)</span>
      <span class="leg-item"><i class="leg-dot d-doing"></i>Đang làm (<span id="cDoing">0</span>)</span>
      <span class="leg-item"><i class="leg-dot d-todo"></i>Cần làm (<span id="cTodo">0</span>)</span>
    </div>
  </section>

  <section class="add" aria-label="Thêm công việc mới">
    <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
    <select id="prio" aria-label="Mức ưu tiên">
      <option value="high">Ưu tiên cao</option>
      <option value="mid" selected>Ưu tiên vừa</option>
      <option value="low">Ưu tiên thấp</option>
    </select>
    <input type="date" id="due" aria-label="Hạn hoàn thành">
    <button type="button" class="btn" id="addBtn">Thêm việc</button>
  </section>

  <div class="controls">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="chip" id="thisW">Tuần này</button>
    <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</main>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;

  function sysDark(){
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function currentTheme(){
    var attr=document.documentElement.getAttribute("data-theme");
    if(attr==="dark"||attr==="light")return attr;
    return sysDark()?"dark":"light";
  }
  function updateThemeUI(){
    var dark=currentTheme()==="dark";
    var lbl=document.getElementById("themeLabel");
    var icon=document.getElementById("themeIcon");
    var btn=document.getElementById("themeBtn");
    lbl.textContent=dark?"Chế độ sáng":"Chế độ tối";
    btn.setAttribute("aria-pressed",String(dark));
    icon.innerHTML=dark
      ?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'
      :'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  function initTheme(){
    try{
      var saved=localStorage.getItem(THEME_KEY);
      if(saved==="dark"||saved==="light")document.documentElement.setAttribute("data-theme",saved);
    }catch(e){}
    updateThemeUI();
    document.getElementById("themeBtn").onclick=function(){
      var next=currentTheme()==="dark"?"light":"dark";
      document.documentElement.setAttribute("data-theme",next);
      try{localStorage.setItem(THEME_KEY,next)}catch(e){}
      updateThemeUI();
    };
    if(window.matchMedia){
      var mq=window.matchMedia("(prefers-color-scheme: dark)");
      if(mq.addEventListener)mq.addEventListener("change",updateThemeUI);
    }
  }

  function load(){
    try{
      var r=localStorage.getItem(KEY);
      if(r){
        var parsed=JSON.parse(r);
        if(Array.isArray(parsed)){tasks=parsed;return}
      }
    }catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}
  function nextId(){
    var m=Date.now();
    tasks.forEach(function(t){if(t.id>=m)m=t.id+1});
    return m;
  }

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;
    c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag status-doing","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function resolveDragId(e){
    if(dragId!=null)return dragId;
    try{var raw=e.dataTransfer.getData("text/plain");if(raw){var n=Number(raw);if(!isNaN(n))return n}}catch(x){}
    return null;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");var id=resolveDragId(e);if(id!=null)move(id,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    document.getElementById("cDone").textContent=String(d);
    document.getElementById("cDoing").textContent=String(g);
    document.getElementById("cTodo").textContent=String(o);
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");var id=resolveDragId(e);if(id!=null)setDate(id,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:nextId(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll("#filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll("#filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){
      view=b.dataset.v;
      document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
      render();
    };
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};

  initTheme();
  load();
  render();
})();
</script>
</body>
</html>
