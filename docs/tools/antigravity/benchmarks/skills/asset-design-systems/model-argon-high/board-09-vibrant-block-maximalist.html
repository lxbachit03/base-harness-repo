<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap">
<style>
:root{
  --cb-red:#e63946; --cb-navy:#1d3557; --cb-yellow:#ffd60a; --cb-cobalt:#2a6fdb;
  --cb-green:#2dc653; --cb-coral:#ff6b6b; --cb-violet:#7b2d8e; --cb-tangerine:#ff8c42; --cb-teal:#0b8a8a; --cb-blush:#f4acb7;
  --cb-black:#111111; --cb-ivory:#f8f7f2; --cb-white:#ffffff;
  --cb-divider:4px solid var(--cb-black);
  --cb-pad:clamp(40px,6vw,80px); --cb-t:.3s ease;
  --font-display:"Montserrat","Archivo Black","Bebas Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:Inter,"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;

  /* Contrast-verified foreground tokens per block (Guardrails: #111111 substituted on #e63946, #ff8c42, #0b8a8a where white fails) */
  --on-red:var(--cb-black);
  --on-navy:var(--cb-white);
  --on-yellow:var(--cb-black);
  --on-cobalt:var(--cb-white);
  --on-green:var(--cb-black);
  --on-tangerine:var(--cb-black);
  --on-teal:var(--cb-black);
  --on-ivory:var(--cb-black);
  --on-white:var(--cb-black);
  --on-black:var(--cb-white);
  color-scheme:light;
  box-sizing:border-box;
}

*,*::before,*::after{box-sizing:inherit}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  max-width:100%;
  overflow-x:hidden;
  background:var(--cb-black);
}
body{
  margin:0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--cb-ivory);
  color:var(--on-ivory);
  font-family:var(--font-body);
  font-weight:400;
  line-height:1.5;
  max-width:100%;
  overflow-x:hidden;
}

[hidden]{display:none!important}

/* Core Vibrant Block / De Stijl Layout Primitives from reference */
.cb-section{
  width:100%;
  padding:var(--cb-pad);
  border-bottom:var(--cb-divider);
}
.cb-inner{
  max-width:1320px;
  margin:0 auto;
  width:100%;
  min-width:0;
}
.cb-mondrian{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  gap:4px;
  background:var(--cb-black);
  border:var(--cb-divider);
}

/* Band 1: Warm Block Hero & Mondrian Progress Composition */
.band-hero{
  background:var(--cb-yellow);
  color:var(--on-yellow);
}
.hero-mondrian{
  grid-template-rows:auto auto auto;
}
.m-cell{
  padding:clamp(18px,3vw,32px);
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.m-title{
  grid-column:1 / 2;
  grid-row:1 / 3;
  background:var(--cb-yellow);
  color:var(--on-yellow);
}
.kicker{
  display:inline-block;
  align-self:flex-start;
  font-family:var(--font-display);
  font-weight:900;
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  background:var(--cb-black);
  color:var(--cb-yellow);
  padding:4px 10px;
  margin-bottom:14px;
}
h1{
  font-family:var(--font-display);
  font-weight:900;
  font-size:clamp(28px,5.2vw,60px);
  line-height:1.02;
  letter-spacing:-.02em;
  text-transform:uppercase;
  margin:0 0 12px;
  overflow-wrap:anywhere;
}
.sub{
  margin:0;
  font-size:clamp(15px,1.8vw,18px);
  font-weight:600;
  color:var(--cb-black);
  max-width:48ch;
}

.m-pct{
  grid-column:2 / 3;
  grid-row:1 / 3;
  background:var(--cb-navy);
  color:var(--on-navy);
}
.cell-label{
  font-family:var(--font-display);
  font-weight:800;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:8px;
  display:block;
}
.pg-num{
  font-family:var(--font-display);
  font-weight:900;
  font-size:clamp(36px,5.5vw,64px);
  line-height:1;
  letter-spacing:-.03em;
  color:var(--cb-white);
}
.pg-num small{
  display:block;
  font-family:var(--font-display);
  font-size:15px;
  font-weight:800;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:var(--cb-yellow);
  margin-top:10px;
}

.m-note{
  grid-column:3 / 4;
  grid-row:1 / 3;
  background:var(--cb-red);
  color:var(--on-red);
}
.pg-note{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(17px,2vw,22px);
  line-height:1.25;
  color:var(--cb-black);
  overflow-wrap:anywhere;
}
.m-bar{
  grid-column:1 / -1;
  grid-row:3 / 4;
  background:var(--cb-white);
  color:var(--on-white);
  padding:18px clamp(16px,2.5vw,28px);
  gap:12px;
}
.bar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
.bar-title{
  font-family:var(--font-display);
  font-weight:900;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.bar-legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  font-size:13px;
  font-weight:700;
}
.leg-item{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:2px 8px;
  border:2px solid var(--cb-black);
  background:var(--cb-ivory);
  color:var(--cb-black);
}
.leg-swatch{
  display:inline-block;
  width:12px;
  height:12px;
  border:2px solid var(--cb-black);
}
.leg-done{background:var(--cb-green)}
.leg-doing{background:var(--cb-yellow)}
.leg-todo{background:var(--cb-cobalt)}

.bar{
  display:flex;
  height:28px;
  background:var(--cb-black);
  border:var(--cb-divider);
  gap:4px;
  overflow:hidden;
}
.bar span{
  display:block;
  min-width:0;
  transition:flex-grow var(--cb-t);
}
.bar .b-done{background:var(--cb-green)}
.bar .b-doing{background:var(--cb-yellow)}
.bar .b-todo{background:var(--cb-cobalt)}

/* Band 2: Guardrail Calm Zone (Plain background, normal spacing for form) */
.band-calm{
  background:var(--cb-ivory);
  color:var(--on-ivory);
}
.calm-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:16px;
}
.section-tag{
  font-family:var(--font-display);
  font-weight:900;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:6px 12px;
  background:var(--cb-navy);
  color:var(--cb-white);
  border:2px solid var(--cb-black);
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:12px;
  background:var(--cb-white);
  border:var(--cb-divider);
  padding:16px;
}
input,select,button{
  font:inherit;
  color:inherit;
  border-radius:0;
}
.add input,.add select{
  background:var(--cb-ivory);
  color:var(--cb-black);
  border:var(--cb-divider);
  padding:12px 14px;
  font-weight:600;
  min-width:0;
  max-width:100%;
}
.add input::placeholder{
  color:var(--cb-navy);
  opacity:1;
}
.btn{
  background:var(--cb-yellow);
  color:var(--cb-black);
  border:var(--cb-divider);
  padding:12px 22px;
  font-family:var(--font-display);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.05em;
  cursor:pointer;
  transition:background-color var(--cb-t),color var(--cb-t);
}
.btn:hover{
  background:var(--cb-black);
  color:var(--cb-yellow);
}

/* Focus-visible fallback */
:focus-visible{
  outline:4px solid var(--cb-black);
  outline-offset:3px;
}
.band-controls :focus-visible{
  outline:4px solid var(--cb-yellow);
  outline-offset:3px;
}

/* Band 3: Cool Block Controls (View switcher, Week nav, Filter chips) */
.band-controls{
  background:var(--cb-navy);
  color:var(--on-navy);
}
.controls-grid{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}
.views{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}
.seg{
  display:inline-flex;
  flex-wrap:wrap;
  background:var(--cb-black);
  border:var(--cb-divider);
  gap:4px;
}
.seg button{
  background:var(--cb-white);
  color:var(--cb-black);
  border:0;
  padding:10px 18px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.04em;
  cursor:pointer;
  transition:background-color var(--cb-t),color var(--cb-t);
}
.seg button:hover{
  background:var(--cb-ivory);
}
.seg button[aria-pressed="true"]{
  background:var(--cb-yellow);
  color:var(--cb-black);
  text-decoration:underline;
  text-decoration-thickness:3px;
  text-underline-offset:4px;
}
.seg button[aria-pressed="true"]::before{
  content:"■ ";
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.chip{
  background:var(--cb-white);
  color:var(--cb-black);
  border:var(--cb-divider);
  padding:8px 16px;
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:800;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.04em;
  transition:background-color var(--cb-t),color var(--cb-t);
}
.chip:hover{
  background:var(--cb-ivory);
}
.chip[aria-pressed="true"]{
  background:var(--cb-yellow);
  color:var(--cb-black);
  text-decoration:underline;
  text-decoration-thickness:3px;
  text-underline-offset:4px;
}
.chip[aria-pressed="true"]::before{
  content:"◆ ";
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:16px;
  padding-top:16px;
  border-top:4px solid var(--cb-white);
  flex-wrap:wrap;
}
.weeknav .lbl{
  font-family:var(--font-display);
  font-weight:900;
  font-size:15px;
  background:var(--cb-yellow);
  color:var(--cb-black);
  border:var(--cb-divider);
  padding:8px 14px;
}

/* Band 4: Warm Outer Slab + Mondrian Columns Workspace */
.band-workspace{
  background:var(--cb-red);
  color:var(--on-red);
}
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:4px;
  background:var(--cb-black);
  border:var(--cb-divider);
  align-items:stretch;
}
.col{
  background:var(--cb-ivory);
  color:var(--cb-black);
  padding:16px;
  min-height:260px;
  min-width:0;
  display:flex;
  flex-direction:column;
  transition:background-color var(--cb-t);
}
/* Alternate warm and cool slabs across the 3 board columns */
.board > .col[data-s="todo"]{
  background:var(--cb-yellow);
  color:var(--on-yellow);
}
.board > .col[data-s="doing"]{
  background:var(--cb-cobalt);
  color:var(--on-cobalt);
}
.board > .col[data-s="done"]{
  background:var(--cb-green);
  color:var(--on-green);
}
.col.over{
  outline:4px dashed var(--cb-black);
  outline-offset:-8px;
}
.board > .col[data-s="doing"].over{
  outline:4px dashed var(--cb-white);
}

.col-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  margin-bottom:14px;
  background:var(--cb-white);
  color:var(--cb-black);
  border:var(--cb-divider);
  flex-wrap:wrap;
}
.col-head i{
  width:16px;
  height:16px;
  display:inline-block;
  border:3px solid var(--cb-black);
  flex-shrink:0;
}
.col[data-s="todo"] .col-head i{background:var(--cb-cobalt)}
.col[data-s="doing"] .col-head i{background:var(--cb-yellow)}
.col[data-s="done"] .col-head i{background:var(--cb-green)}

.col-head h2{
  font-family:var(--font-display);
  font-size:16px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin:0;
  color:var(--cb-black);
}
.col-head .count{
  margin-left:auto;
  font-family:var(--font-display);
  font-size:13px;
  font-weight:900;
  color:var(--cb-white);
  background:var(--cb-navy);
  border:2px solid var(--cb-black);
  padding:2px 10px;
}

/* Task Cards: High-contrast solid white slab with thick black De Stijl borders */
.card{
  background:var(--cb-white);
  color:var(--cb-black);
  border:var(--cb-divider);
  border-left:14px solid var(--cb-navy);
  padding:12px;
  margin-bottom:12px;
  cursor:grab;
  min-width:0;
  transition:transform var(--cb-t),background-color var(--cb-t);
}
.card:hover{
  background:var(--cb-ivory);
}
.card.p-high{border-left-color:var(--cb-red)}
.card.p-mid{border-left-color:var(--cb-yellow)}
.card.p-low{border-left-color:var(--cb-navy)}
.card.dragging{
  opacity:.55;
  outline:4px dashed var(--cb-black);
}
.card .t{
  font-weight:700;
  font-size:15px;
  color:var(--cb-black);
  overflow-wrap:anywhere;
  word-break:break-word;
}
.card.is-done .t{
  text-decoration:line-through;
  text-decoration-thickness:3px;
  color:var(--cb-navy);
}
.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  font-family:var(--font-display);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  border:2px solid var(--cb-black);
  padding:2px 8px;
  background:var(--cb-ivory);
  color:var(--cb-black);
}
.tag.prio-high{
  background:var(--cb-red);
  color:var(--on-red);
}
.tag.prio-mid{
  background:var(--cb-yellow);
  color:var(--on-yellow);
}
.tag.prio-low{
  background:var(--cb-navy);
  color:var(--on-navy);
}
.tag.late{
  background:var(--cb-red);
  color:var(--on-red);
  font-weight:900;
  text-decoration:underline;
  text-decoration-thickness:2px;
}
.acts{
  margin-left:auto;
  display:flex;
  gap:4px;
}
.acts button{
  background:var(--cb-ivory);
  border:2px solid var(--cb-black);
  width:32px;
  height:32px;
  cursor:pointer;
  color:var(--cb-black);
  font-family:var(--font-display);
  font-weight:900;
  font-size:16px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:background-color var(--cb-t),color var(--cb-t);
}
.acts button:hover:not(:disabled){
  background:var(--cb-yellow);
  color:var(--cb-black);
}
.acts button:disabled{
  background:var(--cb-ivory);
  color:var(--cb-navy);
  border-style:dashed;
  opacity:.45;
  cursor:default;
}

.empty{
  background:var(--cb-ivory);
  color:var(--cb-black);
  border:3px dashed var(--cb-black);
  font-weight:700;
  font-size:14px;
  text-align:center;
  padding:20px 10px;
  margin-bottom:10px;
}

/* Week View Grid & Extra Backlogs */
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
  background:var(--cb-black);
  border:var(--cb-divider);
  align-items:stretch;
}
.week .col,.extra .col{
  padding:10px;
  min-height:220px;
}
.week .col:nth-child(odd){
  background:var(--cb-ivory);
  color:var(--on-ivory);
}
.week .col:nth-child(even){
  background:var(--cb-white);
  color:var(--on-white);
}
.week .col.today{
  background:var(--cb-yellow);
  color:var(--on-yellow);
}
.week .col.today .col-head{
  background:var(--cb-red);
  color:var(--on-red);
}
.week .col.today .col-head h2{
  color:var(--on-red);
}
.week .card{
  padding:10px;
  font-size:14px;
}
.week .col-head{
  padding:8px;
  gap:6px;
}
.week .col-head h2{
  font-size:13px;
}
.dsub{
  font-family:var(--font-display);
  font-size:12px;
  font-weight:800;
  background:var(--cb-ivory);
  color:var(--cb-black);
  border:2px solid var(--cb-black);
  padding:1px 6px;
}
.col.today .dsub{
  background:var(--cb-yellow);
  color:var(--cb-black);
}
.addday{
  width:100%;
  margin-top:auto;
  background:var(--cb-white);
  border:3px solid var(--cb-black);
  padding:8px 6px;
  color:var(--cb-black);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:800;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
  transition:background-color var(--cb-t),color var(--cb-t);
}
.addday:hover{
  background:var(--cb-navy);
  color:var(--cb-white);
}

.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:4px;
  margin-top:16px;
  background:var(--cb-black);
  border:var(--cb-divider);
  align-items:stretch;
}
.extra > .col:first-child{
  background:var(--cb-cobalt);
  color:var(--on-cobalt);
}
.extra > .col:last-child{
  background:var(--cb-yellow);
  color:var(--on-yellow);
}

/* Responsive Breakpoints & 400px Zero-Horizontal-Scroll Guarantee */
@media (max-width:1120px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .cb-mondrian{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto;
  }
  .m-title,.m-pct,.m-note,.m-bar{
    grid-column:1 / -1;
    grid-row:auto;
  }
  .board,.week,.extra{
    grid-template-columns:minmax(0,1fr);
  }
  .add{
    grid-template-columns:minmax(0,1fr);
  }
}
@media (max-width:560px){
  .cb-section{
    padding:24px 14px;
  }
  .seg,.filters{
    width:100%;
  }
  .seg button{
    flex:1 1 auto;
    text-align:center;
  }
}

/* Mandatory Accessibility & Defensive Fallbacks */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
@media (prefers-reduced-transparency:reduce){
  .card.dragging,.acts button:disabled{
    opacity:1!important;
  }
}
@media (forced-colors:active){
  .cb-section,.cb-mondrian,.col,.card,.btn,.chip,.seg button,.tag,.bar{
    forced-color-adjust:auto;
    border:2px solid CanvasText;
  }
}
@supports (backdrop-filter:blur(0px)){
  .cb-section,.card,.col{
    backdrop-filter:none;
  }
}
</style>
</head>
<body>
<header class="cb-section band-hero">
  <div class="cb-inner">
    <section class="cb-mondrian hero-mondrian progress" aria-label="Tiến độ">
      <div class="m-cell m-title">
        <span class="kicker">DE STIJL // BLOCK 09</span>
        <h1>Bảng công việc</h1>
        <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
      </div>
      <div class="m-cell m-pct">
        <span class="cell-label">TỶ LỆ HOÀN THÀNH</span>
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
      </div>
      <div class="m-cell m-note">
        <span class="cell-label">TÌNH TRẠNG HIỆN TẠI</span>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="m-cell m-bar">
        <div class="bar-head">
          <span class="bar-title">PHÂN BỔ TRẠNG THÁI</span>
          <div class="bar-legend" aria-hidden="true">
            <span class="leg-item"><i class="leg-swatch leg-done"></i>✓ Hoàn thành</span>
            <span class="leg-item"><i class="leg-swatch leg-doing"></i>◆ Đang làm</span>
            <span class="leg-item"><i class="leg-swatch leg-todo"></i>■ Cần làm</span>
          </div>
        </div>
        <div class="bar" aria-hidden="true">
          <span class="b-done" id="bDone"></span>
          <span class="b-doing" id="bDoing"></span>
          <span class="b-todo" id="bTodo"></span>
        </div>
      </div>
    </section>
  </div>
</header>

<section class="cb-section band-calm" aria-label="Thêm công việc mới">
  <div class="cb-inner">
    <div class="calm-header">
      <span class="section-tag">KHU VỰC NHẬP LIỆU // THÊM VIỆC MỚI</span>
    </div>
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button class="btn" id="addBtn" type="button">Thêm việc</button>
    </div>
  </div>
</section>

<section class="cb-section band-controls" aria-label="Bộ lọc và chế độ xem">
  <div class="cb-inner">
    <div class="controls-grid">
      <div class="views">
        <div class="seg" role="group" aria-label="Chế độ xem">
          <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
          <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
        </div>
      </div>
      <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
        <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
        <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
        <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
        <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
      </div>
    </div>
    <div class="weeknav" id="weeknav" hidden>
      <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
      <button type="button" class="chip" id="thisW">Tuần này</button>
      <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
      <span class="lbl" id="wlabel"></span>
    </div>
  </div>
</section>

<main class="cb-section band-workspace">
  <div class="cb-inner">
    <div class="board" id="board"></div>
    <div class="week" id="week" hidden></div>
    <div class="extra" id="extra" hidden></div>
  </div>
</main>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"▲ Cao",mid:"■ Vừa",low:"● Thấp"};
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","◆ Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"! Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    if(!list.length&&dateVal===null)col.appendChild(el("div","empty","Không có việc tồn đọng."));
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      var subLbl=pad(d.getDate())+"/"+pad(d.getMonth()+1)+(s===tod?" • HÔM NAY":"");
      W.appendChild(dayCol(names[k],subLbl,list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  load();render();
})();
</script>
</body>
</html>
