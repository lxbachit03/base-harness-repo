<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&family=IBM+Plex+Mono:wght@400;600;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;

  /* Reference tokens: Atomic / Space-Age (defined per reference :root, inactive mood) */
  --ra-navy: #0e1a2b;
  --ra-charcoal: #1c2a3a;
  --ra-space: #0a0f1a;
  --ra-chrome: #c0c0c0;
  --ra-chrome-hi: #e2e2e2;
  --ra-chrome-lo: #8a8a8a;
  --ra-cream: #fff5e1;
  --ra-turquoise: #00c9b7;
  --ra-coral: #ff6b57;
  --ra-gold: #f0a500;
  --ra-red: #d0342c;
  --ra-font-display: "Orbitron", "Audiowide", sans-serif;
  --ra-font-deco: "Monoton", "Bungee", sans-serif;
  --ra-font-body: "Jost", "Space Grotesk", sans-serif;
  --ra-radius: 24px 24px 8px 8px;

  /* Reference tokens: Cyberpunk / neon (active mood) */
  --cy-void: #0a0a0f;
  --cy-steel: #12121a;
  --cy-gunmetal: #1a1a2e;
  --cy-slate: #2a2a3e;
  --cy-cyan: #00f0ff;
  --cy-blue: #0080ff;
  --cy-magenta: #ff0080;
  --cy-green: #00ff41;
  --cy-amber: #ffb800;
  --cy-red: #ff1744;
  --cy-purple: #b000ff;
  --cy-purple-sub: #c084fc; /* Substitute for #b000ff (4.03:1 fails AA body text; #c084fc is 7.47:1 on #0a0a0f) */
  --cy-text: #e0e0ec;
  --cy-text-2: #8a8aa6;     /* Substitute for source #6a6a8a (3.80:1 fails AA; #8a8aa6 is 5.89:1 on #0a0a0f) */
  --cy-glow-cyan: 0 0 10px rgba(0, 240, 255, .5), 0 0 40px rgba(0, 240, 255, .15);
  --cy-font-ui: "Share Tech Mono", "IBM Plex Mono", monospace;
  --cy-font-display: "Orbitron", "Rajdhani", "Exo 2", sans-serif;

  /* Derived spacing & cut-corner geometry tokens */
  --cy-space-xs: 6px;
  --cy-space-sm: 10px;
  --cy-space-md: 16px;
  --cy-space-lg: 24px;
  --cy-space-xl: 36px;
  --cy-clip-panel: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  --cy-clip-btn: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  --cy-clip-card: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background-color: var(--cy-void);
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--cy-void);
  background-image:
    linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--cy-text);
  font-family: var(--cy-font-ui);
  line-height: 1.5;
  overflow-x: hidden;
}

[hidden] {
  display: none !important;
}

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: var(--cy-space-lg) var(--cy-space-md) var(--cy-space-xl);
  width: 100%;
}

/* Header & HUD Telemetry Bar */
.hud-header {
  position: relative;
  border-bottom: 1px solid var(--cy-slate);
  padding-bottom: var(--cy-space-md);
  margin-bottom: var(--cy-space-lg);
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--cy-space-sm);
}

.hud-kicker {
  display: flex;
  align-items: center;
  gap: var(--cy-space-sm);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--cy-cyan);
  margin-bottom: 4px;
}

.hud-kicker .kata {
  color: var(--cy-text-2);
}

.cy-title {
  font-family: var(--cy-font-display);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--cy-cyan);
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
}

h1.glitch-title {
  position: relative;
  display: inline-block;
  font-family: var(--cy-font-display);
  font-size: clamp(24px, 4.5vw, 40px);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--cy-cyan);
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
  margin: 0 0 4px;
  line-height: 1.15;
}

h1.glitch-title::before,
h1.glitch-title::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  opacity: 0.75;
}

h1.glitch-title::before {
  left: 2px;
  color: var(--cy-cyan);
  clip-path: inset(0 0 100% 0);
  animation: cy-glitch-a 3s infinite linear alternate-reverse;
}

h1.glitch-title::after {
  left: -2px;
  color: var(--cy-red);
  clip-path: inset(0 0 100% 0);
  animation: cy-glitch-b 3s infinite linear alternate;
}

@keyframes cy-glitch-a {
  0%, 84%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
  88% { clip-path: inset(12% 0 65% 0); transform: translate(-2px, 0); }
  92% { clip-path: inset(58% 0 18% 0); transform: translate(2px, 0); }
}

@keyframes cy-glitch-b {
  0%, 86%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
  90% { clip-path: inset(40% 0 38% 0); transform: translate(2px, 0); }
  94% { clip-path: inset(74% 0 6% 0); transform: translate(-1px, 0); }
}

.sub {
  color: var(--cy-text-2);
  margin: 0;
  font-size: 14px;
}

.hud-badge {
  font-size: 12px;
  color: var(--cy-text-2);
  border: 1px solid var(--cy-slate);
  background: var(--cy-void);
  padding: 4px 10px;
  letter-spacing: 0.08em;
}

/* Cyberpunk wrapper glow + cut-corner panel recipe */
.cy-glow {
  filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.45));
  margin-bottom: var(--cy-space-lg);
}

.cy-panel {
  position: relative;
  padding: var(--cy-space-md) var(--cy-space-lg);
  background: var(--cy-gunmetal);
  border: 1px solid var(--cy-cyan);
  color: var(--cy-text);
  clip-path: var(--cy-clip-panel);
}

@supports (backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px)) {
  .cy-panel.cy-backdrop {
    background: rgba(26, 26, 46, 0.88);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
}

.cy-scan::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent 0 2px,
    rgba(0, 0, 0, 0.12) 2px 4px
  );
}

/* Progress HUD Panel */
.pg-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--cy-space-sm);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--cy-text-2);
  margin-bottom: var(--cy-space-xs);
}

.pg-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--cy-space-md);
  flex-wrap: wrap;
  margin-bottom: var(--cy-space-sm);
}

.pg-num {
  font-family: var(--cy-font-display);
  font-size: clamp(30px, 5.5vw, 48px);
  font-weight: 900;
  letter-spacing: 0.06em;
  line-height: 1;
  color: var(--cy-cyan);
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
}

.pg-num small {
  font-family: var(--cy-font-ui);
  font-size: 0.38em;
  font-weight: 400;
  color: var(--cy-text);
  letter-spacing: 0.04em;
  margin-left: var(--cy-space-sm);
  text-shadow: none;
}

.pg-note {
  color: var(--cy-text);
  font-size: 14px;
  background: var(--cy-void);
  border: 1px solid var(--cy-slate);
  padding: 3px 10px;
}

.bar {
  display: flex;
  height: 14px;
  background: var(--cy-void);
  border: 1px solid var(--cy-cyan);
  padding: 2px;
  gap: 3px;
}

.bar span {
  display: block;
  min-width: 0;
  transition: flex-grow 0.3s ease;
}

.bar .b-done {
  background: var(--cy-cyan);
}

.bar .b-doing {
  background: var(--cy-amber);
}

.bar .b-todo {
  background: var(--cy-text-2);
}

.pg-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--cy-space-md);
  margin-top: var(--cy-space-xs);
  font-size: 12px;
  color: var(--cy-text-2);
}

.pg-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pg-legend i {
  display: inline-block;
  width: 8px;
  height: 8px;
}

/* Add Task Form */
.add {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: var(--cy-space-sm);
  margin-bottom: var(--cy-space-md);
  background: var(--cy-steel);
  border: 1px solid var(--cy-slate);
  padding: var(--cy-space-sm);
  position: relative;
}

input, select, button {
  font: inherit;
  color: inherit;
  border-radius: 0;
}

.add input,
.add select {
  background: var(--cy-void);
  border: 1px solid var(--cy-cyan);
  color: var(--cy-text);
  padding: 9px 12px;
  min-width: 0;
  width: 100%;
}

.add input::placeholder {
  color: var(--cy-text-2);
  opacity: 1;
}

.btn-wrap {
  filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.4));
  display: flex;
}

.btn {
  background: var(--cy-cyan);
  color: var(--cy-void);
  border: 1px solid var(--cy-cyan);
  padding: 9px 18px;
  font-family: var(--cy-font-display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  clip-path: var(--cy-clip-btn);
  width: 100%;
  white-space: nowrap;
}

.btn:hover {
  background: var(--cy-text);
  border-color: var(--cy-text);
}

:focus-visible {
  outline: 2px solid var(--cy-cyan);
  outline-offset: 2px;
}

/* Controls Toolbar: Views, Week Nav & Priority Filters */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--cy-space-sm);
  margin-bottom: var(--cy-space-md);
}

.views {
  display: flex;
  align-items: center;
}

.seg {
  display: inline-flex;
  flex-wrap: wrap;
  border: 1px solid var(--cy-cyan);
  background: var(--cy-void);
}

.seg button {
  background: transparent;
  border: 0;
  border-right: 1px solid var(--cy-slate);
  padding: 7px 14px;
  cursor: pointer;
  color: var(--cy-text);
  font-size: 13px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.seg button:last-child {
  border-right: 0;
}

.seg button[aria-pressed="true"] {
  background: var(--cy-cyan);
  color: var(--cy-void);
  font-weight: 700;
}

.filters {
  display: flex;
  gap: var(--cy-space-xs);
  flex-wrap: wrap;
}

.chip {
  background: var(--cy-void);
  border: 1px solid var(--cy-slate);
  padding: 5px 12px;
  cursor: pointer;
  font-size: 13px;
  color: var(--cy-text);
  clip-path: var(--cy-clip-btn);
}

.chip:hover {
  border-color: var(--cy-cyan);
  color: var(--cy-cyan);
}

.chip[aria-pressed="true"] {
  background: var(--cy-cyan);
  color: var(--cy-void);
  border-color: var(--cy-cyan);
  font-weight: 700;
}

.weeknav {
  display: flex;
  align-items: center;
  gap: var(--cy-space-xs);
  margin-bottom: var(--cy-space-md);
  flex-wrap: wrap;
  background: var(--cy-steel);
  border: 1px solid var(--cy-slate);
  padding: 8px 12px;
}

.weeknav .lbl {
  font-weight: 700;
  margin-left: var(--cy-space-xs);
  color: var(--cy-cyan);
  letter-spacing: 0.06em;
}

/* Status Board & Columns */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--cy-space-md);
  align-items: start;
}

.col {
  position: relative;
  background: var(--cy-steel);
  border: 1px solid var(--cy-slate);
  padding: var(--cy-space-sm);
  min-height: 200px;
  min-width: 0;
  transition: border-color 0.15s, background-color 0.15s;
}

/* HUD corner bracket accents on columns */
.col::before {
  content: "";
  position: absolute;
  top: -1px;
  left: -1px;
  width: 10px;
  height: 10px;
  border-top: 2px solid var(--cy-cyan);
  border-left: 2px solid var(--cy-cyan);
  pointer-events: none;
}

.col[data-s="doing"]::before {
  border-color: var(--cy-amber);
}

.col[data-s="todo"]::before {
  border-color: var(--cy-text-2);
}

.col.over {
  background: var(--cy-gunmetal);
  border-color: var(--cy-cyan);
}

.col-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 var(--cy-space-sm);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--cy-slate);
}

.col-head i {
  width: 10px;
  height: 10px;
  display: block;
  flex-shrink: 0;
  background: var(--cy-cyan);
}

.col[data-s="todo"] .col-head i {
  background: var(--cy-text-2);
}

.col[data-s="doing"] .col-head i {
  background: var(--cy-amber);
}

.col[data-s="done"] .col-head i {
  background: var(--cy-cyan);
}

.col-head h2 {
  font-family: var(--cy-font-display);
  font-size: 14px;
  margin: 0;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cy-text);
}

.col-head .count {
  margin-left: auto;
  font-size: 12px;
  color: var(--cy-cyan);
  background: var(--cy-void);
  border: 1px solid var(--cy-cyan);
  padding: 0 8px;
}

/* Task Cards (Body copy un-glowed per Guardrails) */
.card {
  position: relative;
  background: var(--cy-void);
  border: 1px solid var(--cy-slate);
  border-left: 4px solid var(--cy-text-2);
  padding: 10px 12px;
  margin-bottom: var(--cy-space-sm);
  cursor: grab;
  clip-path: var(--cy-clip-card);
  min-width: 0;
}

.card:hover {
  border-color: var(--cy-cyan);
}

.card.p-high {
  border-left-color: var(--cy-red);
}

.card.p-mid {
  border-left-color: var(--cy-amber);
}

.card.p-low {
  border-left-color: var(--cy-text-2);
}

.card.dragging {
  opacity: 0.45;
}

.card .t {
  font-weight: 400;
  color: var(--cy-text);
  overflow-wrap: anywhere;
  text-shadow: none;
}

.card.is-done .t {
  text-decoration: line-through;
  color: var(--cy-text-2);
}

.meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.tag {
  font-size: 11px;
  background: var(--cy-void);
  border: 1px solid var(--cy-text-2);
  padding: 1px 7px;
  color: var(--cy-text);
  letter-spacing: 0.04em;
}

.tag.p-tag-high {
  color: var(--cy-red);
  border-color: var(--cy-red);
}

.tag.p-tag-mid {
  color: var(--cy-amber);
  border-color: var(--cy-amber);
}

.tag.p-tag-low {
  color: var(--cy-text-2);
  border-color: var(--cy-text-2);
}

.tag.late {
  color: var(--cy-red);
  border-color: var(--cy-red);
  font-weight: 700;
}

.acts {
  margin-left: auto;
  display: flex;
  gap: 4px;
}

.acts button {
  background: var(--cy-steel);
  border: 1px solid var(--cy-slate);
  width: 28px;
  height: 28px;
  cursor: pointer;
  color: var(--cy-text);
  font-size: 15px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.acts button:hover:not(:disabled) {
  background: var(--cy-cyan);
  color: var(--cy-void);
  border-color: var(--cy-cyan);
}

.acts button:disabled {
  opacity: 0.35;
  cursor: default;
}

.empty {
  color: var(--cy-text-2);
  font-size: 13px;
  text-align: center;
  padding: 20px 8px;
  border: 1px dashed var(--cy-slate);
  background: var(--cy-void);
}

/* Week View */
.week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
  align-items: start;
}

.week .col,
.extra .col {
  padding: 8px;
}

.week .card {
  padding: 8px 9px;
  font-size: 13px;
}

.week .col-head {
  flex-wrap: wrap;
  gap: 4px 6px;
}

.week .col-head h2 {
  font-size: 12px;
}

.dsub {
  font-size: 12px;
  color: var(--cy-text-2);
}

.col.today {
  border-color: var(--cy-cyan);
  background: var(--cy-gunmetal);
}

.col.today .dsub {
  color: var(--cy-cyan);
  font-weight: 700;
}

.addday {
  width: 100%;
  background: var(--cy-void);
  border: 1px dashed var(--cy-text-2);
  padding: 6px;
  color: var(--cy-text-2);
  cursor: pointer;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.addday:hover {
  color: var(--cy-cyan);
  border-color: var(--cy-cyan);
  border-style: solid;
}

.extra {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--cy-space-md);
  margin-top: var(--cy-space-md);
  align-items: start;
}

/* Responsive Breakpoints (zero horizontal scroll down to 400px and below) */
@media (max-width: 1080px) {
  .week {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  .week,
  .extra,
  .board {
    grid-template-columns: minmax(0, 1fr);
  }
  .add {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .add input[type="text"],
  .add .btn-wrap {
    grid-column: 1 / -1;
  }
}

@media (max-width: 480px) {
  .wrap {
    padding: 16px 10px 28px;
  }
  .cy-panel {
    padding: 14px;
  }
  .add {
    grid-template-columns: minmax(0, 1fr);
  }
  .seg {
    width: 100%;
  }
  .seg button {
    flex: 1 1 auto;
    text-align: center;
    padding: 7px 8px;
  }
}

/* Accessibility & Preference Fallbacks */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .cy-panel,
  .cy-panel.cy-backdrop {
    background: var(--cy-gunmetal) !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
  .cy-scan::after {
    display: none !important;
  }
}

@media (forced-colors: active) {
  .cy-panel,
  .btn,
  .chip,
  .card {
    clip-path: none !important;
    border: 1px solid CanvasText !important;
  }
  .cy-glow,
  .btn-wrap,
  .cy-title,
  h1.glitch-title,
  .pg-num {
    filter: none !important;
    text-shadow: none !important;
  }
  h1.glitch-title::before,
  h1.glitch-title::after,
  .cy-scan::after {
    display: none !important;
  }
  .chip[aria-pressed="true"],
  .seg button[aria-pressed="true"],
  .col.today {
    outline: 2px solid Highlight !important;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hud-header">
    <div>
      <div class="hud-kicker">
        <span>[SYS.HUD // NODE-07]</span>
        <span class="kata" aria-hidden="true">タスク管理</span>
      </div>
      <h1 class="glitch-title" data-text="Bảng công việc">Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <div class="hud-badge" aria-hidden="true">STATUS: ONLINE // NET-SYNC</div>
  </header>

  <div class="cy-glow">
    <section class="cy-panel cy-backdrop cy-scan progress" aria-label="Tiến độ">
      <div class="pg-meta-row" aria-hidden="true">
        <span>TELEMETRY // TIẾN ĐỘ HỆ THỐNG</span>
        <span>VECTOR: 0x07F</span>
      </div>
      <div class="pg-top">
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="bar" aria-hidden="true">
        <span class="b-done" id="bDone"></span>
        <span class="b-doing" id="bDoing"></span>
        <span class="b-todo" id="bTodo"></span>
      </div>
      <div class="pg-legend" aria-hidden="true">
        <span><i style="background:var(--cy-cyan)"></i>Hoàn thành</span>
        <span><i style="background:var(--cy-amber)"></i>Đang làm</span>
        <span><i style="background:var(--cy-text-2)"></i>Cần làm</span>
      </div>
    </section>
  </div>

  <div class="add">
    <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
    <select id="prio" aria-label="Mức ưu tiên">
      <option value="high">Ưu tiên cao</option>
      <option value="mid" selected>Ưu tiên vừa</option>
      <option value="low">Ưu tiên thấp</option>
    </select>
    <input type="date" id="due" aria-label="Hạn hoàn thành">
    <div class="btn-wrap">
      <button class="btn" id="addBtn" type="button">Thêm việc</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="chip" id="thisW">Tuần này</button>
    <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag p-tag-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  load();render();
})();
</script>
</body>
</html>
