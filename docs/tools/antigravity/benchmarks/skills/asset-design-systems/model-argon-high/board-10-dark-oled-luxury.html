<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* Canonical Dark OLED Luxury tokens from reference */
  --lx-obsidian: #0a0a0a;
  --lx-onyx: #111111;
  --lx-charcoal: #1a1a1a;
  --lx-graphite: #252525;
  --lx-smoke: #333333;
  --lx-black: #000000; /* OLED canvas under media only; text areas use obsidian+ */

  --lx-gold: #d4af37;
  --lx-gold-antique: #c5a258;
  --lx-gold-pale: #e8d48b;
  --lx-rose: #b76e79;

  --lx-ivory: #f5f0e1;
  --lx-warm-white: #e8e0d0;
  --lx-muted: #8a8070;

  --lx-burgundy: #6b1024;
  --lx-emerald: #1b5e3b;
  --lx-sapphire: #1a3a5c;

  --lx-border: rgba(255, 255, 255, .12);
  --lx-gold-line: rgba(212, 175, 55, .35);

  --font-display: "Playfair Display", "Bodoni Moda", "Cormorant Garamond", Georgia, serif;
  --font-body: "Montserrat", "Raleway", Inter, system-ui, -apple-system, sans-serif;

  --section-gap: clamp(80px, 10vw, 120px);
  --pad-block: clamp(40px, 5vw, 60px);
  --max: 1160px;

  /* Guardrail & contrast-substituted tokens */
  --lx-pewter: #5c5c5c; /* 2.96:1 on #0a0a0a — disabled controls only */
  --lx-muted-hi: #a39887; /* Substituted for --lx-muted on #1a1a1a (6.13:1) and #252525 (5.40:1) */
  --lx-control-edge: rgba(212, 175, 55, .62); /* Substituted for --lx-gold-line on interactive edges (>=3.50:1) */
  --lx-warm-shadow: 0 16px 38px rgba(0, 0, 0, .72), 0 2px 14px rgba(212, 175, 55, .05);

  /* Semantic theme mappings */
  --bg: var(--lx-obsidian);
  --surface: var(--lx-onyx);
  --surface-card: var(--lx-charcoal);
  --surface-elevated: var(--lx-graphite);
  --media-canvas: var(--lx-black);
  --ink: var(--lx-ivory);
  --ink-soft: var(--lx-warm-white);
  --ink-muted: var(--lx-muted);
  --ink-muted-card: var(--lx-muted-hi);
  --accent-gold: var(--lx-gold);
  --accent-gold-soft: var(--lx-gold-antique);
  --accent-gold-bright: var(--lx-gold-pale);
  --accent-rose: var(--lx-rose);
  --cta-bg: var(--lx-gold);
  --cta-ink: var(--lx-obsidian);
  --edge-subtle: var(--lx-border);
  --edge-control: var(--lx-control-edge);
  --status-done: var(--lx-gold);
  --status-doing: var(--lx-gold-pale);
  --status-todo: var(--lx-muted);
  --prio-high: var(--lx-rose);
  --prio-mid: var(--lx-gold);
  --prio-low: var(--lx-muted);
}

/* Warm-ivory editorial light theme for reading-first / bright environments */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f5f0e1;
    --surface: #e8e0d0;
    --surface-card: #faf7ef;
    --surface-elevated: #e8e0d0;
    --media-canvas: #111111;
    --ink: #111111;
    --ink-soft: #1a1a1a;
    --ink-muted: #5c5346;
    --ink-muted-card: #5c5346;
    --accent-gold: #7a580b;
    --accent-gold-soft: #7a580b;
    --accent-gold-bright: #5c4106;
    --accent-rose: #6b1024;
    --cta-bg: #111111;
    --cta-ink: #f5f0e1;
    --edge-subtle: rgba(17, 17, 17, .16);
    --edge-control: #7a6f5d;
    --status-done: #1b5e3b;
    --status-doing: #7a580b;
    --status-todo: #5c5346;
    --prio-high: #6b1024;
    --prio-mid: #7a580b;
    --prio-low: #5c5346;
    --lx-warm-shadow: 0 10px 28px rgba(17, 17, 17, .08), 0 2px 10px rgba(212, 175, 55, .05);
  }
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f0e1;
  --surface: #e8e0d0;
  --surface-card: #faf7ef;
  --surface-elevated: #e8e0d0;
  --media-canvas: #111111;
  --ink: #111111;
  --ink-soft: #1a1a1a;
  --ink-muted: #5c5346;
  --ink-muted-card: #5c5346;
  --accent-gold: #7a580b;
  --accent-gold-soft: #7a580b;
  --accent-gold-bright: #5c4106;
  --accent-rose: #6b1024;
  --cta-bg: #111111;
  --cta-ink: #f5f0e1;
  --edge-subtle: rgba(17, 17, 17, .16);
  --edge-control: #7a6f5d;
  --status-done: #1b5e3b;
  --status-doing: #7a580b;
  --status-todo: #5c5346;
  --prio-high: #6b1024;
  --prio-mid: #7a580b;
  --prio-low: #5c5346;
  --lx-warm-shadow: 0 10px 28px rgba(17, 17, 17, .08), 0 2px 10px rgba(212, 175, 55, .05);
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  overflow-x: hidden;
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  letter-spacing: .025em;
  line-height: 1.55;
  overflow-x: hidden;
}

/* Reference recipes */
.lx-gold-text {
  background: linear-gradient(135deg, #bf953f, #fcf6ba 30%, #b38728 50%, #fbf5b7 70%, #aa771c);
  -webkit-background-clip: text;
  background-clip: text;
  color: var(--accent-gold);
  -webkit-text-fill-color: transparent;
}

:root[data-theme="light"] .lx-gold-text {
  background: none;
  color: var(--ink);
  -webkit-text-fill-color: var(--ink);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .lx-gold-text {
    background: none;
    color: var(--ink);
    -webkit-text-fill-color: var(--ink);
  }
}

.lx-velvet {
  position: relative;
  background-color: var(--surface);
}

.lx-velvet::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: .04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.lx-spot {
  background: radial-gradient(ellipse at 50% 0%, rgba(212, 175, 55, .12), transparent 60%), var(--bg);
}

.lx-img img {
  filter: brightness(.7) contrast(1.1) saturate(.85);
}

.lx-frame {
  padding: 3px;
  border: 1px solid var(--accent-gold);
  outline: 1px solid var(--accent-gold);
  outline-offset: 6px;
}

/* Layout & containers */
.wrap {
  max-width: var(--max);
  margin: 0 auto;
  padding: var(--pad-block) clamp(14px, 4vw, 32px) clamp(56px, 8vw, 96px);
}

/* Header & editorial identity */
.masthead {
  text-align: center;
  margin-bottom: clamp(28px, 4.5vw, 48px);
  padding-bottom: clamp(20px, 3vw, 32px);
  border-bottom: 1px solid var(--lx-gold-line);
  position: relative;
}

.masthead-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .22em;
  color: var(--accent-gold);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.theme-btn {
  background: var(--surface-card);
  color: var(--ink);
  border: 1px solid var(--edge-control);
  border-radius: 2px;
  padding: 6px 12px;
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color .2s ease, background-color .2s ease;
}

.theme-btn:hover {
  border-color: var(--accent-gold);
  background: var(--surface-elevated);
}

h1 {
  font-family: var(--font-display);
  font-size: clamp(30px, 5.5vw, 52px);
  font-weight: 600;
  letter-spacing: .01em;
  margin: 0 0 10px;
  line-height: 1.12;
}

.sub {
  color: var(--ink-soft);
  font-size: clamp(13px, 2vw, 15px);
  font-weight: 300;
  max-width: 580px;
  margin: 0 auto;
}

/* Progress showcase (.lx-frame + .lx-velvet + OLED #000 media dial canvas) */
.progress {
  margin-bottom: clamp(24px, 4vw, 36px);
  box-shadow: var(--lx-warm-shadow);
  border-radius: 2px;
}

.progress-inner {
  padding: clamp(18px, 3vw, 28px);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(16px, 3vw, 28px);
  align-items: center;
}

.dial-canvas {
  background: var(--media-canvas);
  border: 1px solid var(--edge-control);
  width: 92px;
  height: 92px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
  box-shadow: inset 0 0 18px rgba(212, 175, 55, .14);
}

.dial-svg {
  width: 78px;
  height: 78px;
  transform: rotate(-90deg);
}

.dial-track {
  fill: none;
  stroke: var(--lx-graphite);
  stroke-width: 4;
}

.dial-ring {
  fill: none;
  stroke: var(--lx-gold);
  stroke-width: 4;
  stroke-linecap: butt;
  transition: stroke-dashoffset .4s ease;
}

.dial-ornament {
  position: absolute;
  color: var(--lx-gold);
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.pg-body {
  min-width: 0;
}

.pg-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.pg-num {
  font-family: var(--font-display);
  font-size: clamp(32px, 5.5vw, 48px);
  font-weight: 600;
  letter-spacing: -.01em;
  line-height: 1;
  color: var(--accent-gold);
}

.pg-num small {
  font-family: var(--font-body);
  font-size: .36em;
  font-weight: 400;
  color: var(--ink-soft);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-left: 10px;
}

.pg-note {
  color: var(--ink-muted-card);
  font-size: 13px;
  letter-spacing: .04em;
}

.bar {
  display: flex;
  height: 12px;
  border-radius: 2px;
  overflow: hidden;
  background: var(--surface-elevated);
  border: 1px solid var(--edge-control);
  gap: 2px;
  padding: 1px;
}

.bar span {
  display: block;
  min-width: 0;
  transition: flex-grow .35s ease;
}

.bar .b-done {
  background: var(--status-done);
}

.bar .b-doing {
  background: var(--status-doing);
}

.bar .b-todo {
  background: var(--status-todo);
}

.pg-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 12px;
  color: var(--ink-muted-card);
}

.pg-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pg-legend i {
  width: 8px;
  height: 8px;
  display: inline-block;
  border: 1px solid var(--ink);
}

/* Add task form */
.add {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 10px;
  margin-bottom: 20px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--edge-subtle);
  box-shadow: var(--lx-warm-shadow);
}

input, select, button {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}

.add input,
.add select {
  background: var(--surface-card);
  color: var(--ink);
  border: 1px solid var(--edge-control);
  border-radius: 2px;
  padding: 11px 14px;
  min-width: 0;
  font-size: 14px;
  transition: border-color .2s ease, background-color .2s ease;
}

.add input::placeholder {
  color: var(--ink-muted-card);
  opacity: 1;
}

.add input:hover,
.add select:hover {
  border-color: var(--accent-gold);
}

.btn {
  background: var(--cta-bg);
  color: var(--cta-ink);
  border: 1px solid var(--accent-gold);
  border-radius: 2px;
  padding: 11px 22px;
  font-weight: 600;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .12em;
  cursor: pointer;
  transition: background-color .2s ease, transform .15s ease;
}

.btn:hover {
  background: var(--accent-gold-bright);
  color: var(--lx-obsidian);
}

/* Accessible focus ring */
:focus-visible {
  outline: 2px solid var(--accent-gold);
  outline-offset: 3px;
}

/* Toolbar: view switcher + priority filters */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--edge-subtle);
}

@supports (backdrop-filter: blur(8px)) {
  .toolbar {
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(8px);
  }
}

.views {
  margin: 0;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--edge-control);
  border-radius: 2px;
  overflow: hidden;
  background: var(--surface-card);
  flex-wrap: wrap;
}

.seg button {
  background: transparent;
  border: 0;
  padding: 8px 16px;
  cursor: pointer;
  color: var(--ink-muted-card);
  font-size: 13px;
  letter-spacing: .06em;
  transition: background-color .2s ease, color .2s ease;
}

.seg button:hover {
  color: var(--ink);
}

.seg button[aria-pressed="true"] {
  background: var(--cta-bg);
  color: var(--cta-ink);
  font-weight: 600;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 0;
}

.chip {
  background: var(--surface-card);
  border: 1px solid var(--edge-control);
  border-radius: 2px;
  padding: 6px 14px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
  letter-spacing: .05em;
  transition: border-color .2s ease, background-color .2s ease, color .2s ease;
}

.chip:hover {
  border-color: var(--accent-gold);
  color: var(--ink);
}

.chip[aria-pressed="true"] {
  background: var(--cta-bg);
  color: var(--cta-ink);
  border-color: var(--accent-gold);
  font-weight: 600;
}

/* Week navigation */
.weeknav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--edge-subtle);
}

.weeknav .lbl {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 16px;
  color: var(--accent-gold);
  margin-left: 8px;
  letter-spacing: .04em;
}

/* Status columns board */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  align-items: start;
}

.col {
  background: var(--surface);
  border: 1px solid var(--edge-subtle);
  border-top: 2px solid var(--edge-control);
  border-radius: 2px;
  padding: 14px;
  min-height: 210px;
  min-width: 0;
  box-shadow: var(--lx-warm-shadow);
  transition: border-color .2s ease, background-color .2s ease;
}

.col[data-s="todo"] {
  border-top-color: var(--status-todo);
}

.col[data-s="doing"] {
  border-top-color: var(--status-doing);
}

.col[data-s="done"] {
  border-top-color: var(--status-done);
}

.col.over {
  background: var(--surface-card);
  border-color: var(--accent-gold);
  outline: 1px solid var(--accent-gold);
}

.col-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--edge-subtle);
}

.col-head i {
  width: 10px;
  height: 10px;
  transform: rotate(45deg);
  display: block;
  flex-shrink: 0;
  border: 1px solid var(--ink);
}

.col[data-s="todo"] .col-head i {
  background: var(--status-todo);
}

.col[data-s="doing"] .col-head i {
  background: var(--status-doing);
}

.col[data-s="done"] .col-head i {
  background: var(--status-done);
}

.col-head h2 {
  font-family: var(--font-display);
  font-size: 18px;
  margin: 0;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: .02em;
}

.col-head .count {
  margin-left: auto;
  font-size: 12px;
  font-weight: 500;
  color: var(--accent-gold);
  background: var(--surface-card);
  border: 1px solid var(--edge-control);
  border-radius: 2px;
  padding: 1px 9px;
}

/* Task cards */
.card {
  background: var(--surface-card);
  border: 1px solid var(--edge-subtle);
  border-left: 4px solid var(--prio-low);
  border-radius: 2px;
  padding: 12px 14px;
  margin-bottom: 12px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .38);
  cursor: grab;
  transition: border-color .2s ease, background-color .2s ease;
}

.card:hover {
  background: var(--surface-elevated);
  border-color: var(--edge-control);
}

.card.p-high {
  border-left-color: var(--prio-high);
}

.card.p-mid {
  border-left-color: var(--prio-mid);
}

.card.p-low {
  border-left-color: var(--prio-low);
}

.card.dragging {
  opacity: .45;
}

.card .t {
  font-weight: 500;
  color: var(--ink);
  font-size: 14px;
  overflow-wrap: anywhere;
  line-height: 1.45;
}

.card.is-done .t {
  text-decoration: line-through;
  color: var(--ink-muted-card);
}

.meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.tag {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .06em;
  border: 1px solid var(--edge-control);
  border-radius: 2px;
  padding: 2px 8px;
  color: var(--ink-soft);
  background: var(--surface);
}

.tag.p-tag-high {
  color: var(--lx-ivory);
  background: var(--lx-burgundy);
  border-color: var(--lx-rose);
}

.tag.p-tag-mid {
  color: var(--accent-gold);
  border-color: var(--edge-control);
}

.tag.doing-tag {
  color: var(--lx-ivory);
  background: var(--lx-sapphire);
  border-color: var(--edge-control);
}

.tag.late {
  color: var(--lx-ivory);
  background: var(--lx-burgundy);
  border-color: var(--lx-rose);
  font-weight: 600;
}

.acts {
  margin-left: auto;
  display: flex;
  gap: 4px;
}

.acts button {
  background: var(--surface);
  border: 1px solid var(--edge-control);
  border-radius: 2px;
  width: 28px;
  height: 28px;
  cursor: pointer;
  color: var(--ink);
  font-size: 15px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}

.acts button:hover:not(:disabled) {
  background: var(--cta-bg);
  color: var(--cta-ink);
  border-color: var(--accent-gold);
}

/* Pewter #5c5c5c reserved strictly for disabled state per Guardrail 1 */
.acts button:disabled {
  color: var(--lx-pewter);
  border-color: var(--edge-subtle);
  background: transparent;
  cursor: default;
}

.empty {
  color: var(--ink-muted-card);
  font-size: 13px;
  font-style: italic;
  text-align: center;
  padding: 24px 8px;
  border: 1px dashed var(--edge-subtle);
}

[hidden] {
  display: none !important;
}

/* Week view */
.week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 10px;
  align-items: start;
}

.week .col,
.extra .col {
  padding: 10px;
}

.week .card {
  padding: 9px 10px;
  font-size: 13px;
}

.week .col-head {
  flex-wrap: wrap;
  gap: 4px 6px;
}

.week .col-head h2 {
  font-size: 15px;
}

.dsub {
  font-size: 12px;
  color: var(--ink-muted-card);
  letter-spacing: .04em;
}

.col.today {
  border-color: var(--accent-gold);
  border-top: 2px solid var(--accent-gold);
  box-shadow: 0 0 0 1px var(--accent-gold), var(--lx-warm-shadow);
}

.col.today .dsub {
  color: var(--accent-gold);
  font-weight: 600;
}

.addday {
  width: 100%;
  background: var(--surface-card);
  border: 1px dashed var(--edge-control);
  border-radius: 2px;
  padding: 7px 6px;
  color: var(--ink-soft);
  cursor: pointer;
  font-size: 12px;
  letter-spacing: .05em;
  transition: border-color .2s ease, color .2s ease, background-color .2s ease;
}

.addday:hover {
  color: var(--accent-gold);
  border-color: var(--accent-gold);
  border-style: solid;
}

.extra {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-top: 16px;
  align-items: start;
}

/* Responsive breakpoints — zero horizontal scroll at 400px */
@media (max-width: 1080px) {
  .week {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  .board,
  .week,
  .extra {
    grid-template-columns: minmax(0, 1fr);
  }
  .add {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .add input[type="text"],
  .add .btn {
    grid-column: 1 / -1;
  }
  .progress-inner {
    grid-template-columns: minmax(0, 1fr);
    text-align: left;
  }
  .dial-canvas {
    margin: 0 auto;
  }
}

@media (max-width: 480px) {
  .add {
    grid-template-columns: minmax(0, 1fr);
  }
  .masthead-top {
    justify-content: center;
  }
  .toolbar {
    flex-direction: column;
    align-items: stretch;
  }
  .seg {
    width: 100%;
  }
  .seg button {
    flex: 1 1 auto;
    text-align: center;
  }
}

/* Required accessibility & media fallbacks */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .lx-velvet::after {
    display: none;
  }
  .toolbar {
    backdrop-filter: none !important;
    background: var(--surface) !important;
  }
  .lx-gold-text {
    background: none;
    color: var(--accent-gold);
    -webkit-text-fill-color: var(--accent-gold);
  }
}

@media (forced-colors: active) {
  .lx-gold-text {
    background: none;
    color: CanvasText;
    -webkit-text-fill-color: CanvasText;
  }
  .lx-velvet::after {
    display: none;
  }
  .card,
  .col,
  .progress,
  .add,
  .toolbar,
  .chip,
  .btn,
  .acts button {
    border: 1px solid ButtonText;
  }
  .chip[aria-pressed="true"],
  .seg button[aria-pressed="true"],
  .btn {
    background: Highlight;
    color: HighlightText;
    forced-color-adjust: none;
  }
}
</style>
</head>
<body class="lx-spot">
<div class="wrap">
  <header class="masthead">
    <div class="masthead-top">
      <span class="eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
          <polygon points="12 2 22 12 12 22 2 12 12 2"></polygon>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Atelier Horloger · OLED Edition
      </span>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Đổi giao diện sáng hoặc tối">
        <span id="themeLbl">Chế độ: Tối OLED</span>
      </button>
    </div>
    <h1 class="lx-gold-text">Bảng công việc</h1>
    <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
  </header>

  <section class="progress lx-frame lx-velvet" aria-label="Tiến độ">
    <div class="progress-inner">
      <div class="dial-canvas" aria-hidden="true">
        <svg class="dial-svg" viewBox="0 0 80 80">
          <circle class="dial-track" cx="40" cy="40" r="33"></circle>
          <circle class="dial-ring" id="dialRing" cx="40" cy="40" r="33" stroke-dasharray="207.35" stroke-dashoffset="207.35"></circle>
        </svg>
        <span class="dial-ornament">XXIV</span>
      </div>
      <div class="pg-body">
        <div class="pg-top">
          <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
          <div class="pg-note" id="note"></div>
        </div>
        <div class="bar" aria-hidden="true">
          <span class="b-done" id="bDone"></span>
          <span class="b-doing" id="bDoing"></span>
          <span class="b-todo" id="bTodo"></span>
        </div>
        <div class="pg-legend" aria-hidden="true">
          <span><i style="background:var(--status-done)"></i> Hoàn thành</span>
          <span><i style="background:var(--status-doing)"></i> Đang làm</span>
          <span><i style="background:var(--status-todo)"></i> Cần làm</span>
        </div>
      </div>
    </div>
  </section>

  <div class="add" role="form" aria-label="Thêm công việc mới">
    <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
    <select id="prio" aria-label="Mức ưu tiên">
      <option value="high">Ưu tiên cao</option>
      <option value="mid" selected>Ưu tiên vừa</option>
      <option value="low">Ưu tiên thấp</option>
    </select>
    <input type="date" id="due" aria-label="Hạn hoàn thành">
    <button type="button" class="btn" id="addBtn">Thêm việc</button>
  </div>

  <div class="toolbar">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="chip" id="thisW">Tuần này</button>
    <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;

  function initTheme(){
    var root=document.documentElement;
    var saved=null;
    try{saved=localStorage.getItem(THEME_KEY)}catch(e){}
    if(saved==="light"||saved==="dark"){
      root.setAttribute("data-theme",saved);
    }
    syncThemeLabel();
  }

  function syncThemeLabel(){
    var cur=document.documentElement.getAttribute("data-theme")||"dark";
    var lbl=document.getElementById("themeLbl");
    if(lbl)lbl.textContent=cur==="light"?"Chế độ: Sáng Ivory":"Chế độ: Tối OLED";
  }

  document.getElementById("themeBtn").onclick=function(){
    var root=document.documentElement;
    var next=root.getAttribute("data-theme")==="light"?"dark":"light";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem(THEME_KEY,next)}catch(e){}
    syncThemeLabel();
  };

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag p-tag-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag doing-tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col lx-velvet");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var ring=document.getElementById("dialRing");
    if(ring){
      var circ=207.35;
      ring.style.strokeDashoffset=String(circ-(circ*pct/100));
    }
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col lx-velvet"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  initTheme();
  load();
  render();
})();
</script>
</body>
</html>
