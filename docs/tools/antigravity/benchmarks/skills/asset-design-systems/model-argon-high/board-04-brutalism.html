<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap">
<style>
:root {
  --nb-black: #000000;
  --nb-paper: #fffdf5;
  --nb-yellow: #ffd23f;
  --nb-coral: #ff6b6b;
  --nb-sky: #74b9ff;
  --nb-green: #88d498;
  --nb-orange: #ffa552;
  --nb-lav: #b8a9fa;
  --nb-border: 3px solid var(--nb-black);
  --nb-shadow-s: 3px 3px 0 0 #000000;
  --nb-shadow-m: 5px 5px 0 0 #000000;
  --nb-shadow-l: 8px 8px 0 0 #000000;
  --nb-radius: 0;
  --font-display: "Syne", "Archivo Black", "Bebas Neue", "Arial Black", system-ui, sans-serif;
  --font-head: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: Inter, "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Space Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  background: var(--nb-paper);
  color: var(--nb-black);
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--nb-paper);
  color: var(--nb-black);
  font-family: var(--font-body);
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 1.7;
  overflow-x: hidden;
}

[hidden] {
  display: none !important;
}

/* Bold top navigation bar with thick bottom border, zero transparency or blur */
.nb-topbar {
  background: var(--nb-paper);
  border-bottom: var(--nb-border);
  padding: 20px 24px;
}

.nb-topbar-inner {
  max-width: 1160px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.nb-brand {
  min-width: 0;
  flex: 1 1 320px;
}

.nb-kicker {
  display: inline-block;
  background: var(--nb-black);
  color: var(--nb-yellow);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 4px 10px;
  border: var(--nb-border);
  margin-bottom: 10px;
}

h1 {
  font-family: var(--font-display);
  font-size: clamp(3rem, 7vw, 5.5rem);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: 1;
  margin: 0 0 10px;
  overflow-wrap: break-word;
}

.sub {
  margin: 0;
  font-family: var(--font-body);
  font-size: 1.05rem;
  line-height: 1.7;
  max-width: 64ch;
}

/* Main container: 1000-1200px, padding 24-32px */
.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 28px 24px 56px;
}

/* Core Neo-Brutalist recipes from reference */
.nb-card {
  background: var(--nb-yellow);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-m);
  border-radius: var(--nb-radius);
  padding: 1.5rem;
}

.nb-btn {
  background: var(--nb-coral);
  color: var(--nb-black);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-m);
  border-radius: var(--nb-radius);
  font: 700 0.95rem var(--font-head);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0.9rem 1.5rem;
  min-height: 48px;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
}

.nb-btn:hover {
  transform: translate(2px, 2px);
  box-shadow: var(--nb-shadow-s);
}

.nb-btn:active {
  transform: translate(5px, 5px);
  box-shadow: 0 0 0 0 var(--nb-black);
}

:focus-visible {
  outline: 3px solid var(--nb-black);
  outline-offset: 3px;
}

/* Macro asymmetry hero: progress card + add task console */
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr);
  gap: 24px;
  align-items: stretch;
  margin-bottom: 28px;
  padding-bottom: 28px;
  border-bottom: var(--nb-border);
}

.progress.nb-card {
  box-shadow: var(--nb-shadow-l);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
}

.section-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-head);
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.pg-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.pg-num {
  font-family: var(--font-display);
  font-size: clamp(2.75rem, 6vw, 4.5rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
}

.pg-num small {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 700;
  background: var(--nb-paper);
  color: var(--nb-black);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-s);
  padding: 4px 10px;
  margin-left: 10px;
  vertical-align: middle;
}

.pg-note {
  font-family: var(--font-head);
  font-size: 0.95rem;
  font-weight: 700;
  background: var(--nb-paper);
  border: var(--nb-border);
  padding: 6px 12px;
}

.bar {
  display: flex;
  height: 28px;
  background: var(--nb-paper);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-s);
  overflow: hidden;
}

.bar span {
  display: block;
  min-width: 0;
  height: 100%;
  transition: flex-grow 0.15s ease;
}

.bar .b-done {
  background: var(--nb-green);
  border-right: var(--nb-border);
}

.bar .b-doing {
  background: var(--nb-sky);
  border-right: var(--nb-border);
}

.bar .b-todo {
  background: var(--nb-coral);
}

.pg-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 700;
}

.pg-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--nb-paper);
  border: var(--nb-border);
  padding: 2px 8px;
}

.swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--nb-black);
}

.swatch.s-done { background: var(--nb-green); }
.swatch.s-doing { background: var(--nb-sky); }
.swatch.s-todo { background: var(--nb-coral); }

/* Add task form panel: mechanical micro-alignment */
.add-panel {
  background: var(--nb-paper);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-m);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
}

.add {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.field-full {
  grid-column: 1 / -1;
}

.field-label {
  font-family: var(--font-head);
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

input, select, button {
  font: inherit;
  color: var(--nb-black);
  border-radius: var(--nb-radius);
}

.add input,
.add select {
  width: 100%;
  min-width: 0;
  min-height: 48px;
  background: var(--nb-paper);
  color: var(--nb-black);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-s);
  padding: 10px 12px;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
}

.add input::placeholder {
  color: var(--nb-black);
  opacity: 0.75;
}

.add .nb-btn {
  grid-column: 1 / -1;
  width: 100%;
}

/* Controls bar: views, week navigation, priority filter chips */
.controls-band {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: var(--nb-border);
}

.views {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 8px;
}

.seg button,
.chip {
  min-height: 48px;
  background: var(--nb-paper);
  color: var(--nb-black);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-s);
  padding: 10px 16px;
  font-family: var(--font-head);
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
}

.seg button:hover,
.chip:hover {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 0 var(--nb-black);
}

.seg button:active,
.chip:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 0 var(--nb-black);
}

.seg button[aria-pressed="true"] {
  background: var(--nb-yellow);
  color: var(--nb-black);
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 4px;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.chip[aria-pressed="true"] {
  background: var(--nb-black);
  color: var(--nb-paper);
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 4px;
}

.weeknav {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--nb-sky);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-m);
}

.weeknav .lbl {
  font-family: var(--font-mono);
  font-size: 1rem;
  font-weight: 700;
  background: var(--nb-paper);
  border: var(--nb-border);
  padding: 8px 14px;
  min-height: 48px;
  display: inline-flex;
  align-items: center;
}

/* Board view: 3 status columns */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
  align-items: start;
}

.col {
  background: var(--nb-paper);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-m);
  padding: 16px;
  min-height: 220px;
  min-width: 0;
}

.col.over {
  background: var(--nb-yellow);
  outline: 3px dashed var(--nb-black);
  outline-offset: -6px;
}

.col-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  margin: -16px -16px 16px -16px;
  border-bottom: var(--nb-border);
  background: var(--nb-paper);
  flex-wrap: wrap;
}

.col[data-s="todo"] .col-head {
  background: var(--nb-coral);
}

.col[data-s="doing"] .col-head {
  background: var(--nb-sky);
}

.col[data-s="done"] .col-head {
  background: var(--nb-green);
}

.col-head i {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: var(--nb-border);
  background: var(--nb-paper);
  font-family: var(--font-mono);
  font-style: normal;
  font-weight: 700;
  font-size: 0.9rem;
  flex-shrink: 0;
}

.col[data-s="todo"] .col-head i::before { content: "[ ]"; }
.col[data-s="doing"] .col-head i::before { content: "→"; }
.col[data-s="done"] .col-head i::before { content: "✓"; }

.col-head h2 {
  font-family: var(--font-head);
  font-size: 1.05rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0;
}

.col-head .count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  font-weight: 700;
  background: var(--nb-black);
  color: var(--nb-paper);
  border: 2px solid var(--nb-black);
  padding: 2px 10px;
}

/* Task cards: calm body copy on paper with bold geometric framing */
.card {
  background: var(--nb-paper);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-m);
  padding: 16px;
  margin-bottom: 16px;
  cursor: grab;
  position: relative;
}

.card.p-high {
  border-left: 12px solid var(--nb-black);
}

.card.p-mid {
  border-left: 8px solid var(--nb-black);
}

.card.p-low {
  border-left: 4px solid var(--nb-black);
}

.card.dragging {
  opacity: 0.55;
  transform: translate(3px, 3px);
  box-shadow: var(--nb-shadow-s);
}

.card .t {
  font-family: var(--font-body);
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.6;
  color: var(--nb-black);
  overflow-wrap: anywhere;
}

.card.is-done {
  background: var(--nb-paper);
}

.card.is-done .t {
  text-decoration: line-through;
  text-decoration-thickness: 3px;
}

.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.tag {
  font-family: var(--font-head);
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--nb-paper);
  color: var(--nb-black);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-s);
  padding: 3px 10px;
}

.tag.prio-high {
  background: var(--nb-coral);
}

.tag.prio-mid {
  background: var(--nb-yellow);
}

.tag.prio-low {
  background: var(--nb-paper);
}

.tag.doing-tag {
  background: var(--nb-sky);
}

.tag.late {
  background: var(--nb-coral);
  color: var(--nb-black);
  text-decoration: underline;
  text-decoration-thickness: 2px;
}

.acts {
  margin-left: auto;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.acts button {
  background: var(--nb-paper);
  color: var(--nb-black);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-s);
  min-width: 48px;
  min-height: 48px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.08s, box-shadow 0.08s;
}

.acts button:hover:not(:disabled) {
  background: var(--nb-yellow);
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 0 var(--nb-black);
}

.acts button.del-btn:hover:not(:disabled) {
  background: var(--nb-coral);
}

.acts button:active:not(:disabled) {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 0 var(--nb-black);
}

.acts button:disabled {
  opacity: 0.4;
  box-shadow: none;
  cursor: not-allowed;
}

.empty {
  font-family: var(--font-mono);
  font-size: 0.92rem;
  color: var(--nb-black);
  text-align: center;
  padding: 24px 12px;
  border: 3px dashed var(--nb-black);
  background: var(--nb-paper);
}

/* Week view */
.week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 14px;
  align-items: start;
}

.week .col,
.extra .col {
  padding: 14px;
}

.week .col-head,
.extra .col-head {
  margin: -14px -14px 14px -14px;
  padding: 10px;
}

.dsub {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 700;
  background: var(--nb-paper);
  border: 2px solid var(--nb-black);
  padding: 1px 6px;
}

.col.today {
  background: var(--nb-paper);
  box-shadow: var(--nb-shadow-l);
}

.col.today .col-head {
  background: var(--nb-yellow);
}

.addday {
  width: 100%;
  min-height: 48px;
  background: var(--nb-yellow);
  color: var(--nb-black);
  border: var(--nb-border);
  box-shadow: var(--nb-shadow-s);
  padding: 10px;
  cursor: pointer;
  font-family: var(--font-head);
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  transition: transform 0.08s, box-shadow 0.08s;
}

.addday:hover {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 0 var(--nb-black);
}

.addday:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 0 var(--nb-black);
}

.extra {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin-top: 24px;
  align-items: start;
}

.extra .col-head {
  background: var(--nb-sky);
}

.extra .col.overdue-col .col-head {
  background: var(--nb-coral);
}

/* Responsive breakpoints — full border and shadow strength preserved */
@media (max-width: 1120px) {
  .week {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 920px) {
  .hero-grid {
    grid-template-columns: 1fr;
  }
  .board {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .nb-topbar {
    padding: 18px 16px;
  }
  .wrap {
    padding: 24px 16px 48px;
  }
  .week,
  .extra,
  .add {
    grid-template-columns: 1fr;
  }
  .seg,
  .filters {
    width: 100%;
  }
  .seg button,
  .filters .chip {
    flex: 1 1 auto;
    text-align: center;
  }
}

/* Accessibility and environment fallbacks */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
  .nb-btn:hover,
  .nb-btn:active,
  .seg button:hover,
  .seg button:active,
  .chip:hover,
  .chip:active,
  .acts button:hover:not(:disabled),
  .acts button:active:not(:disabled),
  .addday:hover,
  .addday:active {
    transform: none !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .card.dragging {
    opacity: 1;
  }
}

@media (forced-colors: active) {
  .nb-card,
  .nb-btn,
  .add-panel,
  .col,
  .card,
  .tag,
  .chip,
  .seg button,
  .acts button,
  .addday,
  .bar {
    border: 3px solid CanvasText;
    forced-color-adjust: none;
  }
  :focus-visible {
    outline: 3px solid Highlight;
  }
}
</style>
</head>
<body>
<header class="nb-topbar">
  <div class="nb-topbar-inner">
    <div class="nb-brand">
      <span class="nb-kicker">NB-04 // NEO-BRUTALISM WORKSPACE</span>
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero-grid">
    <section class="progress nb-card" aria-label="Tiến độ">
      <div class="section-tag">[01] TỔNG QUAN TIẾN ĐỘ</div>
      <div class="pg-top">
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="bar" aria-hidden="true">
        <span class="b-done" id="bDone"></span>
        <span class="b-doing" id="bDoing"></span>
        <span class="b-todo" id="bTodo"></span>
      </div>
      <div class="pg-legend" aria-hidden="true">
        <span class="pg-legend-item"><i class="swatch s-done"></i> [✓] Hoàn thành</span>
        <span class="pg-legend-item"><i class="swatch s-doing"></i> [→] Đang làm</span>
        <span class="pg-legend-item"><i class="swatch s-todo"></i> [ ] Cần làm</span>
      </div>
    </section>

    <section class="add-panel" aria-label="Thêm công việc mới">
      <div class="section-tag">[02] THÊM VIỆC MỚI</div>
      <div class="add">
        <div class="field field-full">
          <label class="field-label" for="title">Tên công việc</label>
          <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
        </div>
        <div class="field">
          <label class="field-label" for="prio">Mức ưu tiên</label>
          <select id="prio" aria-label="Mức ưu tiên">
            <option value="high">Ưu tiên cao</option>
            <option value="mid" selected>Ưu tiên vừa</option>
            <option value="low">Ưu tiên thấp</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="due">Hạn hoàn thành</label>
          <input type="date" id="due" aria-label="Hạn hoàn thành">
        </div>
        <button type="button" class="nb-btn" id="addBtn">Thêm việc</button>
      </div>
    </section>
  </div>

  <div class="controls-band">
    <div class="section-tag">[03] BỘ LỌC ƯU TIÊN</div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">▲ Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">■ Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">● Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="chip" id="thisW">Tuần này</button>
    <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</main>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"▲ Cao",mid:"■ Vừa",low:"● Thấp"};
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag doing-tag","→ Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"! Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button","del-btn","×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    if(!list.length&&dateVal===null)col.appendChild(el("div","empty","Không có việc tồn đọng."));
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      var subLbl=pad(d.getDate())+"/"+pad(d.getMonth()+1)+(s===tod?" • HÔM NAY":"");
      W.appendChild(dayCol(names[k],subLbl,list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null," overdue-col"));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  load();render();
})();
</script>
</body>
</html>
