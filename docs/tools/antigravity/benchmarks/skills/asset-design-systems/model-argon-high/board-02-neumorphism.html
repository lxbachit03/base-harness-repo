<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* Canonical Neumorphism (Soft UI) tokens from references/neumorphism.md */
  --neu-bg: #e0e5ec;
  --neu-shadow-dark: #a3b1c6;
  --neu-shadow-light: #ffffff;
  --neu-text: #2d3436;
  --neu-text-2: #4b565a;          /* Substituted for #636e72 (4.14:1 fails AA); #4b565a is 5.97:1 */
  --neu-accent: #3a62d8;          /* Substituted for #4d7cff (3.72:1 fails AA); #ffffff on #3a62d8 is 5.36:1 */
  --neu-accent-soft: rgba(58, 98, 216, 0.15);
  --neu-dist: 8px;
  --neu-blur: 15px;
  --neu-dist-sm: 4px;
  --neu-blur-sm: 8px;
  --neu-dist-lg: 12px;
  --neu-blur-lg: 24px;
  --radius-card: 20px;
  --radius-ctl: 12px;
  --radius-pill: 999px;
  --font: "Nunito Sans", "Nunito", Inter, system-ui, sans-serif;

  /* Derived surface gradients & AA-verified semantic tokens on #e0e5ec and #ccd1d8 */
  --neu-grad-convex: linear-gradient(145deg, #e6ebf2, #ccd1d8);
  --neu-grad-concave: linear-gradient(145deg, #ccd1d8, #e6ebf2);
  --neu-ctl-edge: #6c7a89;        /* 3.47:1 on #e0e5ec (meets 3:1 non-text bar where shadow #a3b1c6 is 1.72:1) */
  --neu-accent-ink: #2243ae;      /* 6.68:1 on #e0e5ec, 5.53:1 on accent-soft */
  --neu-on-accent: #ffffff;       /* 5.36:1 on #3a62d8 */

  --neu-todo: #2243ae;            /* 6.68:1 on #e0e5ec */
  --neu-doing: #7a4100;           /* 6.38:1 on #e0e5ec, 5.29:1 on #ccd1d8 */
  --neu-done: #145c3d;            /* 6.30:1 on #e0e5ec, 5.21:1 on #ccd1d8 */
  --neu-high: #961e1e;            /* 6.61:1 on #e0e5ec, 5.47:1 on #ccd1d8 */
  --neu-mid: #7a4100;             /* 6.38:1 on #e0e5ec */
  --neu-low: #4b565a;             /* 5.97:1 on #e0e5ec */

  --neu-high-soft: rgba(150, 30, 30, 0.12);
  --neu-doing-soft: rgba(122, 65, 0, 0.12);
  --neu-done-soft: rgba(20, 92, 61, 0.12);

  color-scheme: light;
}

/* Dark theme tokens from references/neumorphism.md: base #2d2d2d, dark #252525, light #353535, text #e0e0e0 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --neu-bg: #2d2d2d;
    --neu-shadow-dark: #252525;
    --neu-shadow-light: #353535;
    --neu-text: #e0e0e0;          /* 10.43:1 on #2d2d2d */
    --neu-text-2: #b0b8c0;        /* 6.86:1 on #2d2d2d */
    --neu-accent: #3a62d8;        /* 5.36:1 with #ffffff */
    --neu-accent-soft: rgba(124, 160, 255, 0.12);
    --neu-grad-convex: linear-gradient(145deg, #323232, #282828);
    --neu-grad-concave: linear-gradient(145deg, #282828, #323232);
    --neu-ctl-edge: #7f8c9a;      /* 4.01:1 on #2d2d2d */
    --neu-accent-ink: #94b3ff;    /* 6.62:1 on #2d2d2d, >5.1:1 on accent-soft */
    --neu-on-accent: #ffffff;
    --neu-todo: #7ca0ff;          /* 5.46:1 on #2d2d2d */
    --neu-doing: #f5b74c;         /* 7.71:1 on #2d2d2d */
    --neu-done: #5cd69d;          /* 7.58:1 on #2d2d2d */
    --neu-high: #ff8585;          /* 5.87:1 on #2d2d2d */
    --neu-mid: #f5b74c;           /* 7.71:1 on #2d2d2d */
    --neu-low: #b0b8c0;           /* 6.86:1 on #2d2d2d */
    --neu-high-soft: rgba(255, 133, 133, 0.14);
    --neu-doing-soft: rgba(245, 183, 76, 0.14);
    --neu-done-soft: rgba(92, 214, 157, 0.14);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --neu-bg: #2d2d2d;
  --neu-shadow-dark: #252525;
  --neu-shadow-light: #353535;
  --neu-text: #e0e0e0;
  --neu-text-2: #b0b8c0;
  --neu-accent: #3a62d8;
  --neu-accent-soft: rgba(124, 160, 255, 0.12);
  --neu-grad-convex: linear-gradient(145deg, #323232, #282828);
  --neu-grad-concave: linear-gradient(145deg, #282828, #323232);
  --neu-ctl-edge: #7f8c9a;
  --neu-accent-ink: #94b3ff;
  --neu-on-accent: #ffffff;
  --neu-todo: #7ca0ff;
  --neu-doing: #f5b74c;
  --neu-done: #5cd69d;
  --neu-high: #ff8585;
  --neu-mid: #f5b74c;
  --neu-low: #b0b8c0;
  --neu-high-soft: rgba(255, 133, 133, 0.14);
  --neu-doing-soft: rgba(245, 183, 76, 0.14);
  --neu-done-soft: rgba(92, 214, 157, 0.14);
  color-scheme: dark;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  margin: 0;
  background: var(--neu-bg);
  color: var(--neu-text);
  font-family: var(--font);
  font-size: 1rem; /* Guardrail: body >= 16px, weights 500-700 */
  font-weight: 500;
  line-height: 1.55;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Three depth states only: raised, flat, pressed. Single top-left light source. */
.neu-raised {
  background: var(--neu-bg);
  border-radius: var(--radius-card);
  box-shadow:
    var(--neu-dist) var(--neu-dist) var(--neu-blur) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist)) calc(-1 * var(--neu-dist)) var(--neu-blur) var(--neu-shadow-light);
}

.neu-pressed {
  background: var(--neu-bg);
  border-radius: var(--radius-card);
  box-shadow:
    inset 5px 5px 10px var(--neu-shadow-dark),
    inset -5px -5px 10px var(--neu-shadow-light);
}

.neu-btn {
  background: var(--neu-bg);
  color: var(--neu-text);
  border: 1px solid var(--neu-ctl-edge);
  border-radius: var(--radius-ctl);
  padding: 0.75rem 1.25rem;
  font: 600 1rem var(--font);
  box-shadow:
    5px 5px 10px var(--neu-shadow-dark),
    -5px -5px 10px var(--neu-shadow-light);
  cursor: pointer;
  transition: box-shadow 0.2s ease, transform 0.15s ease, background-color 0.2s ease;
}

.neu-btn:hover:not(:disabled) {
  box-shadow:
    3px 3px 6px var(--neu-shadow-dark),
    -3px -3px 6px var(--neu-shadow-light);
}

.neu-btn:active:not(:disabled),
.neu-btn[aria-pressed="true"] {
  box-shadow:
    inset 3px 3px 6px var(--neu-shadow-dark),
    inset -3px -3px 6px var(--neu-shadow-light);
}

:focus-visible {
  outline: 3px solid var(--neu-accent);
  outline-offset: 3px;
}

/* Generous padding (32-48px inside, 24-40px gaps) per Guardrails */
.wrap {
  max-width: 1260px;
  margin: 0 auto;
  padding: 36px 28px 56px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* Header bar */
.top-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.brand-block {
  min-width: 0;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8125rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--neu-text-2);
  margin-bottom: 6px;
}

.led-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--neu-accent);
  box-shadow: 0 0 0 2px var(--neu-bg), 0 0 0 3px var(--neu-ctl-edge);
}

h1 {
  font-size: clamp(1.75rem, 4vw, 2.5rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  line-height: 1.15;
}

.sub {
  color: var(--neu-text-2);
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
}

.theme-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0.625rem 1rem;
  font-size: 0.9375rem;
  border-radius: var(--radius-pill);
  white-space: nowrap;
}

.theme-btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Progress console: extruded card (32px padding) with tactile dial gauge + recessed LED meter */
.progress {
  padding: 32px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 28px;
  align-items: center;
}

.gauge-bezel {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  background: var(--neu-grad-convex);
  box-shadow:
    var(--neu-dist) var(--neu-dist) var(--neu-blur) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist)) calc(-1 * var(--neu-dist)) var(--neu-blur) var(--neu-shadow-light);
  display: grid;
  place-items: center;
  padding: 10px;
  flex-shrink: 0;
}

.gauge-well {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--neu-bg);
  box-shadow:
    inset 4px 4px 8px var(--neu-shadow-dark),
    inset -4px -4px 8px var(--neu-shadow-light);
  display: grid;
  place-items: center;
  position: relative;
}

.gauge-svg {
  width: 84px;
  height: 84px;
  transform: rotate(-90deg);
}

.gauge-track {
  fill: none;
  stroke: var(--neu-ctl-edge);
  stroke-opacity: 0.35;
  stroke-width: 7;
}

.gauge-arc {
  fill: none;
  stroke: var(--neu-accent);
  stroke-width: 7;
  stroke-linecap: round;
  stroke-dasharray: 213.6;
  stroke-dashoffset: 213.6;
  transition: stroke-dashoffset 0.35s ease;
}

.gauge-center-icon {
  position: absolute;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: var(--neu-text-2);
  text-transform: uppercase;
}

.pg-body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.pg-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.pg-num {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--neu-text);
}

.pg-num small {
  font-size: 0.44em;
  font-weight: 700;
  color: var(--neu-text-2);
  letter-spacing: 0;
  margin-left: 10px;
}

.pg-note {
  color: var(--neu-text-2);
  font-size: 0.9375rem;
  font-weight: 700;
}

/* Segmented instrument meter inside a recessed pressed well (avoids looking like a scrollbar) */
.bar-well {
  padding: 6px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--neu-ctl-edge);
  background: var(--neu-bg);
  box-shadow:
    inset 4px 4px 8px var(--neu-shadow-dark),
    inset -4px -4px 8px var(--neu-shadow-light);
}

.bar {
  display: flex;
  height: 16px;
  border-radius: var(--radius-pill);
  overflow: hidden;
  gap: 4px;
}

.bar span {
  display: block;
  min-width: 0;
  border-radius: var(--radius-pill);
  transition: flex-grow 0.35s ease;
}

.bar .b-done {
  background: var(--neu-done);
}

.bar .b-doing {
  background: var(--neu-doing);
}

.bar .b-todo {
  background: var(--neu-todo);
}

.pg-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--neu-text-2);
}

.pg-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pg-legend i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  display: inline-block;
}

/* Control Console: Add form + view & priority controls */
.control-deck {
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.add {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 14px;
  align-items: center;
}

input, select, button {
  font: inherit;
  color: inherit;
}

/* Recessed input wells with 1px control edge border (Guardrail: >=3:1 edge contrast) */
.neu-input,
.neu-select {
  background: var(--neu-bg);
  color: var(--neu-text);
  border: 1px solid var(--neu-ctl-edge);
  border-radius: var(--radius-ctl);
  padding: 0.75rem 1rem;
  min-width: 0;
  font-weight: 600;
  box-shadow:
    inset 4px 4px 8px var(--neu-shadow-dark),
    inset -4px -4px 8px var(--neu-shadow-light);
}

.neu-input::placeholder {
  color: var(--neu-text-2);
  opacity: 1;
}

/* Guardrail: primary CTA needs a solid accent fill, not a bare neumorphic bump */
.btn-cta {
  background: var(--neu-accent);
  color: var(--neu-on-accent);
  border: 1px solid var(--neu-accent);
  border-radius: var(--radius-ctl);
  padding: 0.75rem 1.5rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow:
    5px 5px 10px var(--neu-shadow-dark),
    -5px -5px 10px var(--neu-shadow-light);
  transition: box-shadow 0.2s ease, transform 0.15s ease;
}

.btn-cta:hover {
  box-shadow:
    3px 3px 6px var(--neu-shadow-dark),
    -3px -3px 6px var(--neu-shadow-light);
}

.btn-cta:active {
  box-shadow:
    inset 3px 3px 6px rgba(0, 0, 0, 0.35);
}

/* Toolbar row: Views & Filters */
.toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.views {
  display: flex;
  align-items: center;
}

/* Recessed groove holding segmented view buttons */
.seg {
  display: inline-flex;
  padding: 6px;
  gap: 6px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--neu-ctl-edge);
  background: var(--neu-bg);
  box-shadow:
    inset 4px 4px 8px var(--neu-shadow-dark),
    inset -4px -4px 8px var(--neu-shadow-light);
  flex-wrap: wrap;
}

.seg button {
  background: transparent;
  border: 1px solid transparent;
  border-radius: calc(var(--radius-ctl) - 4px);
  padding: 0.5rem 1.125rem;
  cursor: pointer;
  color: var(--neu-text-2);
  font-weight: 700;
  font-size: 0.9375rem;
  transition: all 0.2s ease;
}

.seg button[aria-pressed="true"] {
  background: var(--neu-accent);
  color: var(--neu-on-accent);
  border-color: var(--neu-accent);
  box-shadow:
    3px 3px 6px var(--neu-shadow-dark),
    -3px -3px 6px var(--neu-shadow-light);
}

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.chip {
  background: var(--neu-bg);
  border: 1px solid var(--neu-ctl-edge);
  border-radius: var(--radius-pill);
  padding: 0.45rem 1.1rem;
  cursor: pointer;
  font-size: 0.9375rem;
  font-weight: 700;
  color: var(--neu-text-2);
  box-shadow:
    var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  transition: all 0.2s ease;
}

.chip:hover {
  color: var(--neu-text);
}

.chip[aria-pressed="true"] {
  background: var(--neu-accent);
  color: var(--neu-on-accent);
  border-color: var(--neu-accent);
  box-shadow:
    inset 2px 2px 5px rgba(0, 0, 0, 0.28);
}

.weeknav {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.weeknav .lbl {
  font-weight: 800;
  margin-left: 6px;
  color: var(--neu-text);
}

/* Board columns: Recessed trays (.neu-pressed) holding extruded cards (.neu-raised) */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
  align-items: start;
}

.col {
  background: var(--neu-bg);
  border-radius: var(--radius-card);
  border: 1px solid var(--neu-ctl-edge);
  padding: 24px;
  min-height: 240px;
  min-width: 0;
  box-shadow:
    inset 6px 6px 12px var(--neu-shadow-dark),
    inset -6px -6px 12px var(--neu-shadow-light);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.col.over {
  border: 2px solid var(--neu-accent);
  background: var(--neu-accent-soft);
}

.col-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 18px;
}

.col-head i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  display: block;
  flex-shrink: 0;
  border: 2px solid var(--neu-bg);
}

.col-head h2 {
  font-size: 1.0625rem;
  margin: 0;
  font-weight: 800;
  color: var(--neu-text);
}

.col-head .count {
  margin-left: auto;
  font-size: 0.875rem;
  font-weight: 800;
  color: var(--neu-text-2);
  background: var(--neu-bg);
  border: 1px solid var(--neu-ctl-edge);
  border-radius: var(--radius-pill);
  padding: 2px 11px;
  box-shadow:
    2px 2px 5px var(--neu-shadow-dark),
    -2px -2px 5px var(--neu-shadow-light);
}

.col[data-s="todo"] .col-head i {
  background: var(--neu-todo);
}

.col[data-s="doing"] .col-head i {
  background: var(--neu-doing);
}

.col[data-s="done"] .col-head i {
  background: var(--neu-done);
}

/* Task card: Raised tactile tile */
.card {
  background: var(--neu-bg);
  border: 1px solid var(--neu-ctl-edge);
  border-left: 6px solid var(--neu-low);
  border-radius: var(--radius-ctl);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow:
    5px 5px 10px var(--neu-shadow-dark),
    -5px -5px 10px var(--neu-shadow-light);
  cursor: grab;
  transition: box-shadow 0.2s ease, transform 0.15s ease;
}

.card:last-child {
  margin-bottom: 0;
}

.card.p-high {
  border-left-color: var(--neu-high);
}

.card.p-mid {
  border-left-color: var(--neu-mid);
}

.card.p-low {
  border-left-color: var(--neu-low);
}

.card.dragging {
  opacity: 0.65;
}

@supports (backdrop-filter: blur(4px)) {
  .card.dragging {
    backdrop-filter: blur(4px);
  }
}

.card .t {
  font-weight: 700;
  font-size: 1rem;
  color: var(--neu-text);
  overflow-wrap: anywhere;
}

.card.is-done .t {
  text-decoration: line-through;
  color: var(--neu-text-2);
}

.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

/* Static metadata tags remain flat so they never masquerade as clickable buttons */
.tag {
  font-size: 0.8125rem;
  font-weight: 700;
  border: 1px solid var(--neu-ctl-edge);
  border-radius: 8px;
  padding: 2px 9px;
  color: var(--neu-text-2);
  background: transparent;
}

.card.p-high .tag:first-child {
  color: var(--neu-high);
  border-color: var(--neu-high);
  background: var(--neu-high-soft);
}

.card.p-mid .tag:first-child {
  color: var(--neu-doing);
  border-color: var(--neu-doing);
  background: var(--neu-doing-soft);
}

.tag.late {
  color: var(--neu-high);
  border-color: var(--neu-high);
  background: var(--neu-high-soft);
  font-weight: 800;
}

/* Card action controls: tactile molded micro-buttons with 1px edge border */
.acts {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.acts button {
  background: var(--neu-bg);
  border: 1px solid var(--neu-ctl-edge);
  border-radius: 8px;
  width: 32px;
  height: 32px;
  cursor: pointer;
  color: var(--neu-text);
  font-size: 1rem;
  font-weight: 800;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    3px 3px 6px var(--neu-shadow-dark),
    -3px -3px 6px var(--neu-shadow-light);
}

.acts button:hover:not(:disabled) {
  color: var(--neu-accent-ink);
  border-color: var(--neu-accent);
}

.acts button:active:not(:disabled) {
  box-shadow:
    inset 2px 2px 4px var(--neu-shadow-dark),
    inset -2px -2px 4px var(--neu-shadow-light);
}

.acts button:disabled {
  opacity: 0.35;
  cursor: default;
  box-shadow: none;
}

.empty {
  color: var(--neu-text-2);
  font-size: 0.9375rem;
  font-weight: 600;
  text-align: center;
  padding: 24px 8px;
}

[hidden] {
  display: none !important;
}

/* Week view */
.week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 14px;
  align-items: start;
}

.week .col,
.extra .col {
  padding: 14px;
  min-height: 190px;
}

.week .card {
  padding: 12px;
  font-size: 0.9375rem;
  margin-bottom: 12px;
}

.week .col-head {
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-bottom: 12px;
}

.week .col-head h2 {
  font-size: 0.9375rem;
}

.dsub {
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--neu-text-2);
}

.col.today {
  border: 2px solid var(--neu-accent);
  background: var(--neu-accent-soft);
}

.col.today .dsub {
  color: var(--neu-accent-ink);
  font-weight: 800;
}

.addday {
  width: 100%;
  margin-top: 8px;
  background: var(--neu-bg);
  border: 1px dashed var(--neu-ctl-edge);
  border-radius: var(--radius-ctl);
  padding: 8px;
  color: var(--neu-text-2);
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 700;
  box-shadow:
    3px 3px 6px var(--neu-shadow-dark),
    -3px -3px 6px var(--neu-shadow-light);
}

.addday:hover {
  color: var(--neu-text);
  border-style: solid;
  border-color: var(--neu-accent);
}

.extra {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
  align-items: start;
}

@media (max-width: 1120px) {
  .week {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Guardrail: shrink shadow offsets under 768px and prevent horizontal overflow at 400px */
@media (max-width: 768px) {
  :root {
    --neu-dist: 4px;
    --neu-blur: 8px;
    --neu-dist-sm: 2px;
    --neu-blur-sm: 5px;
    --neu-dist-lg: 6px;
    --neu-blur-lg: 12px;
  }

  .wrap {
    padding: 20px 14px 40px;
    gap: 20px;
  }

  .progress,
  .control-deck {
    padding: 20px 16px;
  }

  .progress {
    grid-template-columns: 1fr;
    justify-items: start;
    gap: 18px;
  }

  .board,
  .week,
  .extra {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .add {
    grid-template-columns: 1fr 1fr;
  }

  .add input[type="text"],
  .add .btn-cta {
    grid-column: 1 / -1;
  }

  .col {
    padding: 16px;
  }
}

@media (max-width: 440px) {
  .add {
    grid-template-columns: 1fr;
  }

  .seg {
    width: 100%;
  }

  .seg button {
    flex: 1 1 auto;
    text-align: center;
  }
}

/* Accessibility fallbacks required by skill step 4 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  :root {
    --neu-accent-soft: #c7d1e9;
    --neu-high-soft: #d9c8d0;
    --neu-doing-soft: #d6ceca;
    --neu-done-soft: #cad4db;
  }
  :root[data-theme="dark"] {
    --neu-accent-soft: #394050;
    --neu-high-soft: #4a3939;
    --neu-doing-soft: #494131;
    --neu-done-soft: #34443c;
  }
}

/* Guardrail: Add @media (forced-colors:active) with real borders; shadows vanish there */
@media (forced-colors: active) {
  .neu-raised,
  .neu-pressed,
  .col,
  .card,
  .bar-well,
  .gauge-bezel,
  .gauge-well,
  .seg,
  .neu-input,
  .neu-select,
  .neu-btn,
  .btn-cta,
  .chip,
  .acts button,
  .tag,
  .addday {
    box-shadow: none !important;
    border: 1px solid CanvasText !important;
  }

  .btn-cta,
  .chip[aria-pressed="true"],
  .seg button[aria-pressed="true"] {
    background: Highlight !important;
    color: HighlightText !important;
    border-color: Highlight !important;
    forced-color-adjust: none;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top-header">
    <div class="brand-block">
      <div class="eyebrow"><span class="led-dot" aria-hidden="true"></span> Bảng điều khiển tác vụ · Soft UI</div>
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <button type="button" class="neu-btn theme-btn" id="themeBtn" aria-label="Đổi giao diện sáng tối">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <span id="themeLbl">Giao diện</span>
    </button>
  </header>

  <section class="progress neu-raised" aria-label="Tiến độ">
    <div class="gauge-bezel" aria-hidden="true">
      <div class="gauge-well">
        <svg class="gauge-svg" viewBox="0 0 84 84">
          <circle class="gauge-track" cx="42" cy="42" r="34"></circle>
          <circle class="gauge-arc" id="gaugeArc" cx="42" cy="42" r="34"></circle>
        </svg>
        <span class="gauge-center-icon">XONG</span>
      </div>
    </div>
    <div class="pg-body">
      <div class="pg-top">
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="bar-well" aria-hidden="true">
        <div class="bar">
          <span class="b-done" id="bDone"></span>
          <span class="b-doing" id="bDoing"></span>
          <span class="b-todo" id="bTodo"></span>
        </div>
      </div>
      <div class="pg-legend" aria-hidden="true">
        <span><i style="background:var(--neu-done)"></i> Hoàn thành</span>
        <span><i style="background:var(--neu-doing)"></i> Đang làm</span>
        <span><i style="background:var(--neu-todo)"></i> Cần làm</span>
      </div>
    </div>
  </section>

  <section class="control-deck neu-raised" aria-label="Thêm và lọc công việc">
    <div class="add">
      <input type="text" class="neu-input" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select class="neu-select" id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" class="neu-input" id="due" aria-label="Hạn hoàn thành">
      <button type="button" class="btn-cta" id="addBtn">Thêm việc</button>
    </div>

    <div class="toolbar-row">
      <div class="views">
        <div class="seg" role="group" aria-label="Chế độ xem">
          <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
          <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
        </div>
      </div>

      <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
        <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
        <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
        <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
        <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
      </div>
    </div>

    <div class="weeknav" id="weeknav" hidden>
      <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
      <button type="button" class="chip" id="thisW">Tuần này</button>
      <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
      <span class="lbl" id="wlabel"></span>
    </div>
  </section>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;
  var CIRC=2*Math.PI*34;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag",PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var arc=document.getElementById("gaugeArc");
    if(arc){arc.style.strokeDashoffset=String(CIRC*(1-pct/100))}
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};

  var root=document.documentElement;
  var themeBtn=document.getElementById("themeBtn");
  if(themeBtn){
    themeBtn.onclick=function(){
      var cur=root.getAttribute("data-theme");
      var isDark=cur==="dark"||(!cur&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next=isDark?"light":"dark";
      root.setAttribute("data-theme",next);
      document.getElementById("themeLbl").textContent=next==="dark"?"Chế độ tối":"Chế độ sáng";
    };
  }

  load();render();
})();
</script>
</body>
</html>
