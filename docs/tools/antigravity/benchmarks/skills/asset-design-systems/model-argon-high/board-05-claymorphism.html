<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@500;700&family=Quicksand:wght@500;700&display=swap">
<style>
:root {
  /* Reference tokens (.agents/skills/asset-design-systems/references/claymorphism.md) */
  --clay-bg: #f5f5fa;
  --clay-bg-2: #f0eeff;
  --clay-bg-3: #eefbf5;
  --clay-white: #ffffff;
  --clay-lav: #f3e8ff;
  --clay-coral: #f76d6d;
  --clay-sky: #62cdff;
  --clay-purple: #d6a2ff;
  --clay-green: #7ae582;
  --clay-peach: #ffb347;
  --clay-text: #2d3557;
  --clay-text-2: #555b7a;
  --clay-shadow-tint: 112, 100, 176;
  --radius-card: 32px;
  --radius-ctl: 24px;
  --radius-pill: 999px;
  --pad-card: 2rem;
  --font: "Nunito", "Quicksand", "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Reference recipe & guardrail tokens */
  --clay-btn-bg: #c4b5fd;
  --clay-ink-purple: #3b2d5e;
  --clay-focus: #6d28d9;
  /* Contrast substitute for normal text on coral (#2d3557 on #f76d6d is 4.19:1 large-only; #2d3557 on #ff8a8a is 5.26:1 AA) */
  --clay-coral-soft: #ff8a8a;

  /* Container outer-only shadows (Guardrail: containers get outer shadow only) */
  --shadow-container: 0 35px 68px rgba(var(--clay-shadow-tint), 0.30);
  --shadow-container-sm: 0 22px 44px rgba(var(--clay-shadow-tint), 0.22);

  /* Interactive 3-shadow clay stacks (outer + inner dark negative-y + inner light positive-y) */
  --shadow-clay-lav:
    0 12px 24px rgba(var(--clay-shadow-tint), 0.35),
    inset 0 -4px 8px rgba(95, 70, 140, 0.25),
    inset 0 4px 8px rgba(255, 255, 255, 0.75);
  --shadow-clay-white:
    0 14px 28px rgba(var(--clay-shadow-tint), 0.24),
    inset 0 -5px 10px rgba(95, 70, 140, 0.16),
    inset 0 5px 10px rgba(255, 255, 255, 0.90);
  --shadow-clay-purple:
    0 12px 24px rgba(112, 72, 176, 0.36),
    inset 0 -4px 8px rgba(95, 50, 145, 0.28),
    inset 0 4px 8px rgba(255, 255, 255, 0.72);
  --shadow-clay-coral:
    0 10px 20px rgba(185, 75, 75, 0.32),
    inset 0 -4px 8px rgba(145, 45, 45, 0.25),
    inset 0 4px 8px rgba(255, 255, 255, 0.68);
  --shadow-clay-peach:
    0 10px 20px rgba(180, 110, 30, 0.32),
    inset 0 -4px 8px rgba(140, 80, 15, 0.25),
    inset 0 4px 8px rgba(255, 255, 255, 0.72);
  --shadow-clay-sky:
    0 10px 20px rgba(45, 130, 185, 0.32),
    inset 0 -4px 8px rgba(25, 95, 145, 0.25),
    inset 0 4px 8px rgba(255, 255, 255, 0.75);
  --shadow-clay-green:
    0 10px 20px rgba(55, 150, 70, 0.32),
    inset 0 -4px 8px rgba(35, 115, 48, 0.25),
    inset 0 4px 8px rgba(255, 255, 255, 0.75);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  max-width: 100%;
  overflow-x: hidden;
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  margin: 0;
  min-height: 100vh;
  max-width: 100%;
  overflow-x: hidden;
  background-color: var(--clay-bg);
  background-image:
    radial-gradient(circle at 12% 8%, var(--clay-bg-2) 0%, transparent 45%),
    radial-gradient(circle at 88% 18%, var(--clay-bg-3) 0%, transparent 45%),
    radial-gradient(circle at 50% 92%, var(--clay-lav) 0%, transparent 55%);
  color: var(--clay-text);
  font-family: var(--font);
  font-weight: 600;
  line-height: 1.5;
}

/* Guardrail: centered card layouts, max-width 900-1100px */
.wrap {
  max-width: 1060px;
  margin: 0 auto;
  padding: 32px 24px 56px;
}

/* Header with playful clay mascot icon */
.hero-head {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.clay-mascot {
  width: 64px;
  height: 64px;
  border-radius: 22px;
  background: var(--clay-lav);
  box-shadow: var(--shadow-container-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.hero-copy {
  min-width: 0;
  flex: 1;
}

h1 {
  font-size: clamp(28px, 4.5vw, 42px);
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  line-height: 1.15;
  color: var(--clay-text);
}

.sub {
  color: var(--clay-text-2);
  font-weight: 600;
  margin: 0;
  font-size: 16px;
}

/* Progress Container: container gets outer shadow only */
.progress {
  background: var(--clay-lav);
  border-radius: var(--radius-card);
  padding: var(--pad-card);
  margin-bottom: 26px;
  box-shadow: var(--shadow-container);
}

.pg-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.pg-num {
  font-size: clamp(34px, 6vw, 52px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--clay-ink-purple);
}

.pg-num small {
  font-size: 0.42em;
  font-weight: 700;
  color: var(--clay-text-2);
  letter-spacing: 0;
  margin-left: 10px;
}

.pg-note {
  color: var(--clay-text);
  background: var(--clay-white);
  padding: 6px 16px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 700;
}

.bar {
  display: flex;
  height: 24px;
  border-radius: var(--radius-pill);
  overflow: hidden;
  background: var(--clay-white);
  padding: 4px;
  gap: 4px;
}

.bar span {
  display: block;
  min-width: 0;
  border-radius: var(--radius-pill);
}

.bar .b-done {
  background: var(--clay-green);
}

.bar .b-doing {
  background: var(--clay-peach);
}

.bar .b-todo {
  background: var(--clay-sky);
}

.pg-legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.leg-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--clay-text);
  background: var(--clay-white);
  padding: 4px 12px;
  border-radius: var(--radius-pill);
}

.leg-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Add Task Container: container gets outer shadow only; controls inside get 3-shadow clay stack */
.add-wrap {
  background: var(--clay-bg-2);
  border-radius: var(--radius-card);
  padding: 24px;
  margin-bottom: 26px;
  box-shadow: var(--shadow-container-sm);
}

.add {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 12px;
  align-items: center;
}

input, select, button {
  font: inherit;
  color: inherit;
}

.add input,
.add select {
  background: var(--clay-white);
  border: 0;
  border-radius: var(--radius-ctl);
  padding: 14px 18px;
  min-width: 0;
  width: 100%;
  color: var(--clay-text);
  font-weight: 700;
  box-shadow: var(--shadow-clay-white);
  transition: transform 120ms ease, opacity 120ms ease;
}

.add input::placeholder {
  color: var(--clay-text-2);
  opacity: 1;
}

.add input:active,
.add select:active {
  transform: translateY(2px) scale(0.99);
}

/* Interactive Clay Button (Recipe from claymorphism.md) */
.clay-btn {
  background: var(--clay-btn-bg);
  border: 0;
  border-radius: var(--radius-ctl);
  padding: 14px 28px;
  color: var(--clay-ink-purple);
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow-clay-lav);
  transition: transform 120ms ease, opacity 120ms ease;
  white-space: nowrap;
}

.clay-btn:hover {
  transform: translateY(-1px);
}

.clay-btn:active {
  transform: translateY(2px) scale(0.98);
}

/* Explicit focus-visible outline per Guardrail */
:focus-visible {
  outline: 3px solid var(--clay-focus);
  outline-offset: 3px;
}

/* Toolbar: Views & Priority Filter Chips */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.views {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 10px;
}

.seg button,
.chip {
  background: var(--clay-white);
  border: 0;
  border-radius: var(--radius-pill);
  padding: 10px 20px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 800;
  color: var(--clay-text);
  box-shadow: var(--shadow-clay-white);
  transition: transform 120ms ease, opacity 120ms ease;
}

.seg button:hover,
.chip:hover {
  transform: translateY(-1px);
}

.seg button:active,
.chip:active {
  transform: translateY(2px) scale(0.98);
}

.seg button[aria-pressed="true"] {
  background: var(--clay-btn-bg);
  color: var(--clay-ink-purple);
  box-shadow: var(--shadow-clay-lav);
}

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.chip[aria-pressed="true"] {
  background: var(--clay-purple);
  color: var(--clay-text);
  box-shadow: var(--shadow-clay-purple);
}

.chip[data-f="high"][aria-pressed="true"] {
  background: var(--clay-coral-soft);
  box-shadow: var(--shadow-clay-coral);
}

.chip[data-f="mid"][aria-pressed="true"] {
  background: var(--clay-peach);
  box-shadow: var(--shadow-clay-peach);
}

.chip[data-f="low"][aria-pressed="true"] {
  background: var(--clay-sky);
  box-shadow: var(--shadow-clay-sky);
}

/* Week navigation bar */
.weeknav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.weeknav .lbl {
  font-weight: 800;
  font-size: 16px;
  color: var(--clay-ink-purple);
  background: var(--clay-lav);
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  margin-left: 4px;
}

/* Status Board (3 columns) */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
  align-items: start;
}

/* Columns are containers: outer shadow only */
.col {
  background: var(--clay-bg-2);
  border-radius: var(--radius-card);
  padding: 22px 18px;
  min-height: 220px;
  min-width: 0;
  box-shadow: var(--shadow-container-sm);
}

.col[data-s="doing"] {
  background: var(--clay-lav);
}

.col[data-s="done"] {
  background: var(--clay-bg-3);
}

.col.over {
  outline: 3px dashed var(--clay-focus);
  outline-offset: -4px;
}

.col-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 4px 16px;
}

.col-head i {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: block;
  flex-shrink: 0;
}

.col[data-s="todo"] .col-head i {
  background: var(--clay-sky);
}

.col[data-s="doing"] .col-head i {
  background: var(--clay-peach);
}

.col[data-s="done"] .col-head i {
  background: var(--clay-green);
}

.col-head h2 {
  font-size: 18px;
  margin: 0;
  font-weight: 800;
  color: var(--clay-text);
}

.col-head .count {
  margin-left: auto;
  font-size: 13px;
  font-weight: 800;
  color: var(--clay-text);
  background: var(--clay-white);
  border-radius: var(--radius-pill);
  padding: 2px 12px;
}

/* Task Card: interactive draggable clay object gets full 3-shadow stack */
.card {
  background: var(--clay-white);
  border-radius: var(--radius-ctl);
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-clay-white);
  cursor: grab;
  transition: transform 120ms ease, opacity 120ms ease;
}

.card:hover {
  transform: translateY(-2px);
}

.card:active {
  transform: translateY(2px) scale(0.98);
}

.card.dragging {
  opacity: 0.45;
  transform: scale(0.96);
}

.card .t {
  font-weight: 700;
  font-size: 16px;
  color: var(--clay-text);
  overflow-wrap: anywhere;
  word-break: break-word;
}

.card.is-done {
  background: var(--clay-bg);
}

.card.is-done .t {
  text-decoration: line-through;
  color: var(--clay-text-2);
}

.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.tag {
  font-size: 12px;
  font-weight: 800;
  border-radius: var(--radius-pill);
  padding: 4px 12px;
  color: var(--clay-text);
  background: var(--clay-lav);
}

.card.p-high .tag-prio {
  background: var(--clay-coral-soft);
}

.card.p-mid .tag-prio {
  background: var(--clay-peach);
}

.card.p-low .tag-prio {
  background: var(--clay-sky);
}

.tag-doing {
  background: var(--clay-peach);
}

.tag.late {
  background: var(--clay-coral-soft);
  color: var(--clay-text);
}

.acts {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.acts button {
  background: var(--clay-lav);
  border: 0;
  border-radius: 14px;
  width: 34px;
  height: 34px;
  cursor: pointer;
  color: var(--clay-text);
  font-size: 16px;
  font-weight: 800;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-clay-white);
  transition: transform 120ms ease, opacity 120ms ease;
}

.acts button:hover:not(:disabled) {
  transform: translateY(-1px);
}

.acts button:active:not(:disabled) {
  transform: translateY(2px) scale(0.96);
}

.acts button:disabled {
  opacity: 0.35;
  cursor: default;
}

.empty {
  color: var(--clay-text-2);
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  padding: 24px 10px;
  background: var(--clay-white);
  border-radius: var(--radius-ctl);
}

[hidden] {
  display: none !important;
}

/* Week View */
.week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 12px;
  align-items: start;
}

.week .col,
.extra .col {
  padding: 14px 12px;
  border-radius: 26px;
}

.week .card {
  padding: 12px;
  font-size: 14px;
}

.week .card .t {
  font-size: 14px;
}

.week .col-head {
  flex-wrap: wrap;
  gap: 4px 6px;
  margin-bottom: 12px;
}

.week .col-head h2 {
  font-size: 15px;
}

.dsub {
  font-size: 13px;
  font-weight: 700;
  color: var(--clay-text-2);
}

.col.today {
  background: var(--clay-lav);
  outline: 3px solid var(--clay-focus);
  outline-offset: -3px;
}

.col.today .dsub {
  color: var(--clay-ink-purple);
  font-weight: 800;
}

.addday {
  width: 100%;
  background: var(--clay-white);
  border: 0;
  border-radius: 18px;
  padding: 10px 8px;
  color: var(--clay-ink-purple);
  cursor: pointer;
  font-size: 13px;
  font-weight: 800;
  box-shadow: var(--shadow-clay-white);
  transition: transform 120ms ease, opacity 120ms ease;
}

.addday:hover {
  transform: translateY(-1px);
}

.addday:active {
  transform: translateY(2px) scale(0.98);
}

.extra {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin-top: 20px;
  align-items: start;
}

/* Progressive enhancement branch for backdrop-filter */
@supports (backdrop-filter: blur(8px)) {
  .weeknav .lbl {
    backdrop-filter: blur(8px);
  }
}

/* Responsive layout down to 400px without horizontal scroll */
@media (max-width: 1050px) {
  .week {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 860px) {
  .board,
  .extra {
    grid-template-columns: 1fr;
  }
  .add {
    grid-template-columns: 1fr 1fr;
  }
  .add input[type="text"],
  .add .clay-btn {
    grid-column: 1 / -1;
  }
}

@media (max-width: 560px) {
  .wrap {
    padding: 20px 14px 40px;
  }
  .progress,
  .add-wrap,
  .col {
    padding: 18px 14px;
    border-radius: 26px;
  }
  .add,
  .week {
    grid-template-columns: 1fr;
  }
  .seg,
  .filters {
    width: 100%;
  }
  .seg button {
    flex: 1 1 auto;
    text-align: center;
  }
}

/* Accessibility & environment media queries */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  body {
    background-image: none;
    background-color: var(--clay-bg);
  }
  .weeknav .lbl {
    backdrop-filter: none;
  }
}

@media (forced-colors: active) {
  .progress,
  .add-wrap,
  .col,
  .card,
  .add input,
  .add select,
  .clay-btn,
  .seg button,
  .chip,
  .acts button,
  .addday,
  .tag,
  .bar {
    border: 2px solid CanvasText;
    box-shadow: none;
  }
  .seg button[aria-pressed="true"],
  .chip[aria-pressed="true"] {
    outline: 3px solid Highlight;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero-head">
    <div class="clay-mascot" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="8" width="36" height="34" rx="12" fill="#c4b5fd"/>
        <rect x="15" y="4" width="18" height="10" rx="5" fill="#ffb347"/>
        <path d="M17 26L22 31L32 20" stroke="#2d3557" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="hero-copy">
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
  </header>

  <section class="progress" aria-label="Tiến độ">
    <div class="pg-top">
      <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
      <div class="pg-note" id="note"></div>
    </div>
    <div class="bar" aria-hidden="true">
      <span class="b-done" id="bDone"></span>
      <span class="b-doing" id="bDoing"></span>
      <span class="b-todo" id="bTodo"></span>
    </div>
    <div class="pg-legend" aria-hidden="true">
      <span class="leg-pill"><i class="leg-dot" style="background:var(--clay-green)"></i>Hoàn thành</span>
      <span class="leg-pill"><i class="leg-dot" style="background:var(--clay-peach)"></i>Đang làm</span>
      <span class="leg-pill"><i class="leg-dot" style="background:var(--clay-sky)"></i>Cần làm</span>
    </div>
  </section>

  <section class="add-wrap" aria-label="Thêm công việc mới">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button class="clay-btn" id="addBtn" type="button">Thêm việc</button>
    </div>
  </section>

  <div class="toolbar">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="chip" id="thisW">Tuần này</button>
    <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag tag-prio",PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag tag-doing","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  load();render();
})();
</script>
</body>
</html>
