<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* Reference tokens: Material realism (light) */
  --sk-bg: #f5f0eb;
  --sk-surface: #ede5dc;
  --sk-raised: #e8e0d8;
  --sk-raised-top: #f1ebe4;
  --sk-pressed: #d8d0c8;
  --sk-text: #4a4240;
  --sk-text-2: #6a605a; /* substituted for #7a706a (4.26:1 on #f5f0eb -> 5.40:1) */
  --sk-text-well: #59504a; /* derived for pressed well #d8d0c8 (5.16:1 AA) */
  --sk-emboss-light: #fffefa;
  --sk-emboss-dark: #9a8a80;
  --sk-coral: #d4836a;
  --sk-coral-ink: #241a17; /* dark text on coral (#241a17 on #d4836a is 6.08:1) */
  --sk-late-text: #8a2e1a; /* high-contrast terracotta text on light surfaces (5.92:1 on #e8e0d8) */
  --sk-sky: #7ca8c8;
  --sk-sage: #8aaa8a;
  --sk-gold: #c8a86a;
  --sk-border-ui: #786c64; /* >= 3:1 UI edge against #f5f0eb and #e8e0d8 */
  --sk-shadow: rgba(138, 126, 114, 0.35);
  --sk-radius: 14px;
  --light-angle: 135deg;

  /* Reference tokens: Spatial 3D (dark canvas) */
  --imm-void: #0b0b0f;
  --imm-space: #101018;
  --imm-indigo: #161630;
  --imm-slate: #1e1e2e;
  --imm-cyan: #00e5ff;
  --imm-violet: #7c3aed; /* large/UI/icon only (3.45:1 on #0b0b0f) */
  --imm-magenta: #e040fb;
  --imm-amber: #f59e0b;
  --imm-green: #10b981;
  --imm-fog: #94a3b8;
  --imm-text: #f1f5f9;
  --imm-glass: rgba(16, 16, 24, 0.84);
  --imm-glass-raised: rgba(30, 30, 46, 0.88);
  --imm-glass-edge: #718299; /* >= 3:1 UI edge against #0b0b0f, #101018, and #1e1e2e */

  /* Typography & layout tokens */
  --font-display: "Exo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius-card: var(--sk-radius);
  --radius-well: 10px;
  --radius-pill: 999px;
  --space-1: 6px;
  --space-2: 10px;
  --space-3: 14px;
  --space-4: 20px;
  --space-5: 28px;

  /* Active theme bindings (default: Light Material Realism) */
  --bg: var(--sk-bg);
  --surface: var(--sk-surface);
  --card-top: var(--sk-raised-top);
  --card-bottom: var(--sk-raised);
  --well-bg: var(--sk-pressed);
  --ink: var(--sk-text);
  --muted: var(--sk-text-2);
  --well-muted: var(--sk-text-well);
  --ui-edge: var(--sk-border-ui);
  --focus-ring: var(--sk-text);
  --btn-active-bg: var(--sk-text);
  --btn-active-ink: var(--sk-bg);
  --late-ink: var(--sk-late-text);
  --todo-accent: var(--sk-sky);
  --doing-accent: var(--sk-gold);
  --done-accent: var(--sk-sage);
  --high-accent: var(--sk-coral);
  --mid-accent: var(--sk-gold);
  --low-accent: var(--sk-sky);
  --card-shadow:
    inset 1px 1px 0 rgba(255, 255, 255, 0.82),
    inset -1px -1px 0 rgba(138, 126, 114, 0.18),
    6px 8px 16px var(--sk-shadow),
    -2px -2px 6px rgba(255, 255, 255, 0.72);
  --well-shadow:
    inset 3px 3px 6px rgba(138, 126, 114, 0.42),
    inset -2px -2px 5px rgba(255, 255, 255, 0.72);
  --btn-shadow:
    inset 1px 1px 0 rgba(255, 255, 255, 0.85),
    3px 4px 8px var(--sk-shadow);
  --btn-pressed-shadow:
    inset 2px 2px 5px rgba(138, 126, 114, 0.48),
    inset -1px -1px 3px rgba(255, 255, 255, 0.6);
  --emboss-shadow: 1px 1px 0 var(--sk-emboss-light), -1px -1px 0 rgba(154, 138, 128, 0.35);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--imm-void);
    --surface: var(--imm-space);
    --card-top: #232336;
    --card-bottom: var(--imm-slate);
    --well-bg: var(--imm-space);
    --ink: var(--imm-text);
    --muted: var(--imm-fog);
    --well-muted: var(--imm-fog);
    --ui-edge: var(--imm-glass-edge);
    --focus-ring: var(--imm-cyan);
    --btn-active-bg: var(--imm-cyan);
    --btn-active-ink: var(--imm-void);
    --late-ink: var(--imm-amber);
    --todo-accent: var(--imm-cyan);
    --doing-accent: var(--imm-amber);
    --done-accent: var(--imm-green);
    --high-accent: var(--imm-magenta);
    --mid-accent: var(--imm-amber);
    --low-accent: var(--imm-cyan);
    --card-shadow:
      inset 1px 1px 0 rgba(255, 255, 255, 0.14),
      inset -1px -1px 0 rgba(0, 229, 255, 0.08),
      0 12px 28px rgba(0, 0, 0, 0.65),
      0 0 18px rgba(124, 58, 237, 0.14);
    --well-shadow:
      inset 3px 3px 8px rgba(0, 0, 0, 0.78),
      inset -1px -1px 4px rgba(255, 255, 255, 0.06);
    --btn-shadow:
      inset 1px 1px 0 rgba(255, 255, 255, 0.16),
      0 4px 12px rgba(0, 0, 0, 0.55);
    --btn-pressed-shadow:
      inset 2px 2px 6px rgba(0, 0, 0, 0.82);
    --emboss-shadow: 0 2px 10px rgba(0, 229, 255, 0.22);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: var(--imm-void);
  --surface: var(--imm-space);
  --card-top: #232336;
  --card-bottom: var(--imm-slate);
  --well-bg: var(--imm-space);
  --ink: var(--imm-text);
  --muted: var(--imm-fog);
  --well-muted: var(--imm-fog);
  --ui-edge: var(--imm-glass-edge);
  --focus-ring: var(--imm-cyan);
  --btn-active-bg: var(--imm-cyan);
  --btn-active-ink: var(--imm-void);
  --late-ink: var(--imm-amber);
  --todo-accent: var(--imm-cyan);
  --doing-accent: var(--imm-amber);
  --done-accent: var(--imm-green);
  --high-accent: var(--imm-magenta);
  --mid-accent: var(--imm-amber);
  --low-accent: var(--imm-cyan);
  --card-shadow:
    inset 1px 1px 0 rgba(255, 255, 255, 0.14),
    inset -1px -1px 0 rgba(0, 229, 255, 0.08),
    0 12px 28px rgba(0, 0, 0, 0.65),
    0 0 18px rgba(124, 58, 237, 0.14);
  --well-shadow:
    inset 3px 3px 8px rgba(0, 0, 0, 0.78),
    inset -1px -1px 4px rgba(255, 255, 255, 0.06);
  --btn-shadow:
    inset 1px 1px 0 rgba(255, 255, 255, 0.16),
    0 4px 12px rgba(0, 0, 0, 0.55);
  --btn-pressed-shadow:
    inset 2px 2px 6px rgba(0, 0, 0, 0.82);
  --emboss-shadow: 0 2px 10px rgba(0, 229, 255, 0.22);
  color-scheme: dark;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  overflow-x: hidden;
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.65;
  overflow-x: hidden;
  position: relative;
}

/* Spatial 3D Background Canvas & Poster Fallback */
.scene-backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.scene-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.55;
}

#spatialCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Main container with 3D perspective stage */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 1240px;
  margin: 0 auto;
  padding: var(--space-5) var(--space-4) 56px;
}

/* Top hardware header bar */
.top-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-4);
}

.brand-block {
  min-width: 0;
  flex: 1 1 260px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 4px;
}

.led-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--done-accent);
  box-shadow:
    inset 1px 1px 2px rgba(255, 255, 255, 0.75),
    0 0 6px var(--done-accent);
  flex-shrink: 0;
}

h1 {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 4.5vw, 2.65rem);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0 0 6px;
  line-height: 1.15;
  text-shadow: var(--emboss-shadow);
}

.sub {
  color: var(--muted);
  margin: 0;
  font-size: 0.96rem;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

/* Material Realism Card & Glass Scrim */
.sk-card {
  background: linear-gradient(var(--light-angle), var(--card-top), var(--card-bottom));
  border: 1px solid var(--ui-edge);
  border-radius: var(--radius-card);
  box-shadow: var(--card-shadow);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  backdrop-filter: blur(12px) saturate(140%);
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .sk-card {
    background: var(--card-bottom);
  }
}

/* Material Realism Pressed Well */
.sk-well {
  background: var(--well-bg);
  border: 1px solid var(--ui-edge);
  border-radius: var(--radius-well);
  box-shadow: var(--well-shadow);
}

/* Tactile 3D Button (.sk-btn) - animates transform and opacity only for 60fps guardrail */
.sk-btn {
  background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
  color: var(--ink);
  border: 1px solid var(--ui-edge);
  border-radius: var(--radius-well);
  padding: 0.65rem 1.15rem;
  font: 600 0.94rem var(--font-body);
  box-shadow: var(--btn-shadow);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.16s ease, opacity 0.16s ease;
  user-select: none;
}

.sk-btn:hover {
  transform: translateY(-1px);
}

.sk-btn:active,
.sk-btn[aria-pressed="true"] {
  background: var(--btn-active-bg);
  color: var(--btn-active-ink);
  box-shadow: var(--btn-pressed-shadow);
  transform: translateY(1px);
}

/* Hero Progress Instrument Console */
.progress {
  padding: var(--space-4);
  margin-bottom: var(--space-4);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-4);
  align-items: center;
}

.gauge-dial {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  flex-shrink: 0;
  padding: 8px;
}

.gauge-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.gauge-track {
  fill: none;
  stroke: var(--ui-edge);
  stroke-width: 7;
  opacity: 0.35;
}

.gauge-arc {
  fill: none;
  stroke: var(--done-accent);
  stroke-width: 7;
  stroke-linecap: round;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

.gauge-needle {
  transform-origin: 50px 50px;
  transition: transform 0.35s ease;
}

.pg-body {
  min-width: 0;
}

.pg-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.pg-num {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3.1rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  text-shadow: var(--emboss-shadow);
}

.pg-num small {
  font-family: var(--font-body);
  font-size: 0.42em;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0;
  margin-left: 10px;
}

.pg-note {
  color: var(--muted);
  font-size: 0.94rem;
  font-weight: 500;
}

/* Recessed 3D Tubular Status Bar */
.bar-well {
  padding: 5px;
  border-radius: var(--radius-pill);
}

.bar {
  display: flex;
  height: 18px;
  border-radius: var(--radius-pill);
  overflow: hidden;
  background: var(--surface);
  gap: 3px;
}

.bar span {
  display: block;
  min-width: 0;
  position: relative;
  border-radius: 4px;
  box-shadow:
    inset 0 2px 3px rgba(255, 255, 255, 0.55),
    inset 0 -2px 3px rgba(0, 0, 0, 0.25);
}

.bar .b-done {
  background: var(--done-accent);
}

.bar .b-doing {
  background: var(--doing-accent);
}

.bar .b-todo {
  background: var(--todo-accent);
}

.pg-legend {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-top: var(--space-2);
  font-size: 0.82rem;
  color: var(--muted);
}

.legend-items {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  border: 1px solid var(--ui-edge);
  box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.5);
}

.scroll-cue {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
  color: var(--muted);
}

/* Tactile Task Intake Console (.add) */
.add-panel {
  padding: var(--space-3);
  margin-bottom: var(--space-3);
}

.add {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: var(--space-2);
  align-items: center;
}

input, select, button {
  font: inherit;
  color: inherit;
}

.add input,
.add select {
  background: var(--well-bg);
  color: var(--ink);
  border: 1px solid var(--ui-edge);
  border-radius: var(--radius-well);
  padding: 0.68rem 0.85rem;
  min-width: 0;
  box-shadow: var(--well-shadow);
}

.add input::placeholder {
  color: var(--well-muted);
  opacity: 1;
}

.btn-primary {
  font-weight: 700;
  padding: 0.7rem 1.3rem;
}

/* Control Toolbar: Views, Week Nav, Filters */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-4);
}

.views {
  display: flex;
  align-items: center;
}

.seg {
  display: inline-flex;
  padding: 4px;
  gap: 4px;
  flex-wrap: wrap;
}

.seg button {
  background: transparent;
  color: var(--well-muted);
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 0.45rem 1rem;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

.seg button[aria-pressed="true"] {
  background: var(--btn-active-bg);
  color: var(--btn-active-ink);
  border-color: var(--ui-edge);
  box-shadow: var(--btn-shadow);
}

.weeknav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.weeknav .lbl {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: 0.03em;
  margin-left: 6px;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.chip {
  background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
  color: var(--ink);
  border: 1px solid var(--ui-edge);
  border-radius: var(--radius-pill);
  padding: 0.38rem 0.95rem;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
  box-shadow: var(--btn-shadow);
  transition: transform 0.15s ease, opacity 0.15s ease;
}

.chip:hover {
  transform: translateY(-1px);
}

.chip[aria-pressed="true"] {
  background: var(--btn-active-bg);
  color: var(--btn-active-ink);
  box-shadow: var(--btn-pressed-shadow);
  transform: translateY(1px);
}

/* 3D Columns & Trays */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
  align-items: start;
}

.col {
  background: var(--well-bg);
  border: 1px solid var(--ui-edge);
  border-radius: var(--radius-card);
  padding: var(--space-3);
  min-height: 210px;
  min-width: 0;
  box-shadow: var(--well-shadow);
  transition: transform 0.16s ease, opacity 0.16s ease;
}

.col.over {
  outline: 2px solid var(--focus-ring);
  outline-offset: -2px;
  transform: translateY(-2px);
}

.col-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 2px 2px 12px;
  min-width: 0;
}

.col-head i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: block;
  flex-shrink: 0;
  border: 1px solid var(--ui-edge);
  box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.7);
}

.col[data-s="todo"] .col-head i {
  background: var(--todo-accent);
}

.col[data-s="doing"] .col-head i {
  background: var(--doing-accent);
}

.col[data-s="done"] .col-head i {
  background: var(--done-accent);
}

.col-head h2 {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.col-head .count {
  margin-left: auto;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--ink);
  background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
  border: 1px solid var(--ui-edge);
  border-radius: var(--radius-pill);
  padding: 1px 10px;
  box-shadow: var(--btn-shadow);
}

/* Tactile Physical Task Plate (.card) */
.card {
  background: linear-gradient(var(--light-angle), var(--card-top), var(--card-bottom));
  border: 1px solid var(--ui-edge);
  border-left: 6px solid var(--low-accent);
  border-radius: var(--radius-well);
  padding: 12px 13px;
  margin-bottom: 11px;
  box-shadow: var(--card-shadow);
  cursor: grab;
  position: relative;
  transition: transform 0.16s ease, opacity 0.16s ease;
}

.card:hover {
  transform: translateY(-2px);
}

.card:active {
  cursor: grabbing;
}

.card.p-high {
  border-left-color: var(--high-accent);
}

.card.p-mid {
  border-left-color: var(--mid-accent);
}

.card.p-low {
  border-left-color: var(--low-accent);
}

.card.dragging {
  opacity: 0.45;
  transform: scale(0.98);
}

.card .t {
  font-weight: 600;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.card.is-done .t {
  text-decoration: line-through;
  color: var(--muted);
}

.meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.tag {
  font-size: 0.76rem;
  font-weight: 600;
  background: var(--well-bg);
  border: 1px solid var(--ui-edge);
  border-radius: 6px;
  padding: 2px 8px;
  color: var(--well-muted);
  box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.12);
}

.tag.late {
  color: var(--late-ink);
  border-color: var(--late-ink);
  font-weight: 700;
}

.acts {
  margin-left: auto;
  display: flex;
  gap: 4px;
}

.acts button {
  background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
  border: 1px solid var(--ui-edge);
  border-radius: 6px;
  width: 30px;
  height: 30px;
  cursor: pointer;
  color: var(--ink);
  font-size: 0.95rem;
  font-weight: 700;
  line-height: 1;
  box-shadow: var(--btn-shadow);
  display: inline-grid;
  place-items: center;
  transition: transform 0.14s ease, opacity 0.14s ease;
}

.acts button:hover:not(:disabled) {
  transform: translateY(-1px);
}

.acts button:active:not(:disabled) {
  box-shadow: var(--btn-pressed-shadow);
  transform: translateY(1px);
}

.acts button:disabled {
  opacity: 0.35;
  cursor: default;
  box-shadow: none;
}

.empty {
  color: var(--well-muted);
  font-size: 0.88rem;
  text-align: center;
  padding: 22px 8px;
  font-style: italic;
}

/* Week View & Extra Trays */
.week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 10px;
  align-items: start;
}

.week .col,
.extra .col {
  padding: 10px;
}

.week .card {
  padding: 9px 10px;
  font-size: 0.88rem;
}

.week .col-head {
  flex-wrap: wrap;
  gap: 4px 6px;
}

.week .col-head h2 {
  font-size: 0.86rem;
}

.dsub {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--well-muted);
}

.col.today {
  border-width: 2px;
  border-color: var(--focus-ring);
  background: linear-gradient(var(--light-angle), var(--card-top), var(--card-bottom));
  box-shadow: var(--card-shadow);
}

.col.today .dsub {
  color: var(--ink);
  font-weight: 700;
  text-decoration: underline;
}

.addday {
  width: 100%;
  background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
  border: 1px dashed var(--ui-edge);
  border-radius: 8px;
  padding: 7px;
  color: var(--ink);
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  margin-top: 4px;
  box-shadow: var(--btn-shadow);
  transition: transform 0.14s ease, opacity 0.14s ease;
}

.addday:hover {
  transform: translateY(-1px);
}

.extra {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3);
  margin-top: var(--space-3);
  align-items: start;
}

[hidden] {
  display: none !important;
}

/* Accessibility & Environment Fallbacks */
:focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
}

@media (prefers-reduced-transparency: reduce) {
  .sk-card,
  .col.today {
    background: var(--card-bottom);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  #spatialCanvas {
    display: none !important;
  }
}

@media (forced-colors: active) {
  .sk-card,
  .sk-well,
  .sk-btn,
  .card,
  .col,
  .chip,
  .tag,
  .acts button {
    background: Canvas;
    color: CanvasText;
    border: 1px solid CanvasText;
    box-shadow: none;
    text-shadow: none;
  }
  .sk-btn[aria-pressed="true"],
  .chip[aria-pressed="true"],
  .seg button[aria-pressed="true"] {
    background: Highlight;
    color: HighlightText;
    forced-color-adjust: none;
  }
}

/* Responsive Breakpoints (verified no horizontal overflow at 400px) */
@media (max-width: 1080px) {
  .week {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  .wrap {
    padding: 18px 12px 40px;
  }
  .progress {
    grid-template-columns: 1fr;
    justify-items: start;
  }
  .board,
  .week,
  .extra {
    grid-template-columns: 1fr;
  }
  .add {
    grid-template-columns: 1fr 1fr;
  }
  .add input[type="text"],
  .add .btn-primary {
    grid-column: 1 / -1;
  }
}

@media (max-width: 480px) {
  .add {
    grid-template-columns: 1fr;
  }
  .toolbar {
    flex-direction: column;
    align-items: stretch;
  }
  .seg {
    width: 100%;
  }
  .seg button {
    flex: 1 1 auto;
    text-align: center;
  }
}
</style>
</head>
<body>
<!-- Spatial 3D Layer: Static SVG Poster Fallback + Progressive WebGL2 Canvas -->
<div class="scene-backdrop" aria-hidden="true">
  <svg class="scene-poster" id="spatialPoster" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="litTopLeft" cx="18%" cy="15%" r="75%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="55%" stop-color="#c8a86a" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>
      <pattern id="isoGrid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.12"/>
      </pattern>
    </defs>
    <rect width="1200" height="800" fill="url(#litTopLeft)"/>
    <rect width="1200" height="800" fill="url(#isoGrid)"/>
    <g stroke="currentColor" stroke-opacity="0.14" fill="none" stroke-width="1.2">
      <polygon points="1040,120 1120,165 1120,255 1040,300 960,255 960,165"/>
      <line x1="1040" y1="120" x2="1040" y2="210"/>
      <line x1="1040" y1="210" x2="1120" y2="255"/>
      <line x1="1040" y1="210" x2="960" y2="255"/>
      <polygon points="140,580 210,620 210,700 140,740 70,700 70,620"/>
    </g>
  </svg>
  <canvas id="spatialCanvas"></canvas>
</div>

<div class="wrap">
  <header class="top-bar">
    <div class="brand-block">
      <div class="eyebrow">
        <span class="led-dot" aria-hidden="true"></span>
        <span>3D Hyperrealism · Tactile Studio Console</span>
      </div>
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <div class="header-controls">
      <button type="button" class="sk-btn" id="themeBtn" aria-label="Đổi giao diện Sáng hoặc Tối">
        <span id="themeLabel">Chế độ: Tự động</span>
      </button>
    </div>
  </header>

  <!-- Tactile Progress Console -->
  <section class="progress sk-card" aria-label="Tiến độ">
    <div class="gauge-dial sk-well" aria-hidden="true">
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-track" cx="50" cy="50" r="38" stroke-dasharray="180 60" stroke-dashoffset="-30"/>
        <circle class="gauge-arc" id="gaugeArc" cx="50" cy="50" r="38" stroke-dasharray="0 240" stroke-dashoffset="-30"/>
        <g class="gauge-needle" id="gaugeNeedle">
          <line x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="6" fill="currentColor"/>
        </g>
      </svg>
    </div>
    <div class="pg-body">
      <div class="pg-top">
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="bar-well sk-well" aria-hidden="true">
        <div class="bar">
          <span class="b-done" id="bDone"></span>
          <span class="b-doing" id="bDoing"></span>
          <span class="b-todo" id="bTodo"></span>
        </div>
      </div>
      <div class="pg-legend">
        <div class="legend-items">
          <span class="legend-item"><i class="legend-swatch" style="background:var(--done-accent)"></i>Hoàn thành</span>
          <span class="legend-item"><i class="legend-swatch" style="background:var(--doing-accent)"></i>Đang làm</span>
          <span class="legend-item"><i class="legend-swatch" style="background:var(--todo-accent)"></i>Cần làm</span>
        </div>
        <span class="scroll-cue" aria-hidden="true">↓ Cuộn xuống để xem bảng</span>
      </div>
    </div>
  </section>

  <!-- Tactile Input Console -->
  <section class="add-panel sk-card" aria-label="Thêm công việc mới">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button type="button" class="sk-btn btn-primary" id="addBtn">Thêm việc</button>
    </div>
  </section>

  <!-- View Switcher & Priority Filter Chips -->
  <div class="toolbar">
    <div class="views">
      <div class="seg sk-well" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="chip" id="thisW">Tuần này</button>
    <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <!-- Board & Week Containers -->
  <main>
    <div class="board" id="board"></div>
    <div class="week" id="week" hidden></div>
    <div class="extra" id="extra" hidden></div>
  </main>
</div>

<script>
(function(){
  var KEY = "bang-cong-viec-v1";
  var THEME_KEY = "bang-cong-viec-theme-v1";
  var COLS = [["todo", "Cần làm"], ["doing", "Đang làm"], ["done", "Hoàn thành"]];
  var PL = {high: "Cao", mid: "Vừa", low: "Thấp"};
  var tasks = [], filter = "all", dragId = null;

  function load(){
    try {
      var r = localStorage.getItem(KEY);
      if (r) {
        tasks = JSON.parse(r) || [];
        return;
      }
    } catch (e) {}
    var d = new Date();
    var iso = function(n){
      var x = new Date(d);
      x.setDate(x.getDate() + n);
      return isoDate(x);
    };
    tasks = [
      {id: 1, t: "Gửi báo cáo tuần cho nhóm", p: "high", s: "doing", d: iso(0)},
      {id: 2, t: "Đặt lịch khám răng", p: "mid", s: "todo", d: iso(3)},
      {id: 3, t: "Dọn hộp thư đến", p: "low", s: "todo", d: ""},
      {id: 4, t: "Thanh toán tiền điện", p: "high", s: "done", d: iso(-1)}
    ];
  }

  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(tasks));
    } catch (e) {}
  }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function pad(n){
    return n < 10 ? "0" + n : "" + n;
  }

  function isoDate(d){
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function today(){
    return isoDate(new Date());
  }

  function mondayOf(d){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }

  var view = "board", ws = mondayOf(new Date());

  function fmt(s){
    var p = s.split("-");
    return p[2] + "/" + p[1];
  }

  function card(t){
    var c = el("div", "card p-" + t.p + (t.s === "done" ? " is-done" : ""));
    c.draggable = true;
    c.dataset.id = t.id;
    c.appendChild(el("div", "t", t.t));
    var m = el("div", "meta");
    m.appendChild(el("span", "tag", PL[t.p]));
    if (view === "week" && t.s === "doing") {
      m.appendChild(el("span", "tag", "Đang làm"));
    }
    if (t.d) {
      var late = t.s !== "done" && t.d < today();
      if (view !== "week" || late) {
        m.appendChild(el("span", "tag" + (late ? " late" : ""), (late ? "Quá hạn " : "Hạn ") + fmt(t.d)));
      }
    }
    var a = el("div", "acts");
    var i = COLS.findIndex(function(x){ return x[0] === t.s; });

    var L = el("button", null, "←");
    L.type = "button";
    L.title = "Chuyển sang cột trước";
    L.setAttribute("aria-label", "Chuyển sang cột trước");
    L.disabled = i === 0;

    var R = el("button", null, "→");
    R.type = "button";
    R.title = "Chuyển sang cột sau";
    R.setAttribute("aria-label", "Chuyển sang cột sau");
    R.disabled = i === 2;

    var X = el("button", null, "×");
    X.type = "button";
    X.title = "Xóa việc";
    X.setAttribute("aria-label", "Xóa việc");

    L.onclick = function(){ move(t.id, COLS[i - 1][0]); };
    R.onclick = function(){ move(t.id, COLS[i + 1][0]); };
    X.onclick = function(){
      tasks = tasks.filter(function(x){ return x.id !== t.id; });
      save();
      render();
    };

    if (view === "week") {
      var K = el("button", null, t.s === "done" ? "↺" : "✓");
      K.type = "button";
      K.title = t.s === "done" ? "Mở lại việc" : "Đánh dấu xong";
      K.setAttribute("aria-label", K.title);
      K.onclick = function(){ move(t.id, t.s === "done" ? "todo" : "done"); };
      a.append(K, X);
    } else {
      a.append(L, R, X);
    }

    m.appendChild(a);
    c.appendChild(m);

    c.addEventListener("dragstart", function(e){
      dragId = t.id;
      c.classList.add("dragging");
      try {
        e.dataTransfer.setData("text/plain", String(t.id));
      } catch (x) {}
    });
    c.addEventListener("dragend", function(){
      c.classList.remove("dragging");
      dragId = null;
      document.querySelectorAll(".col.over").forEach(function(n){
        n.classList.remove("over");
      });
    });
    return c;
  }

  function move(id, s){
    tasks.forEach(function(t){
      if (t.id === id) t.s = s;
    });
    save();
    render();
  }

  function updateGauge(pct){
    var arc = document.getElementById("gaugeArc");
    var needle = document.getElementById("gaugeNeedle");
    if (arc) {
      var maxArc = 180;
      var filled = Math.round((pct / 100) * maxArc);
      arc.setAttribute("stroke-dasharray", filled + " 240");
    }
    if (needle) {
      var deg = -120 + (pct / 100) * 240;
      needle.style.transform = "rotate(" + deg + "deg)";
    }
  }

  function render(){
    var isW = view === "week";
    document.getElementById("board").hidden = isW;
    document.getElementById("week").hidden = !isW;
    document.getElementById("extra").hidden = !isW;
    document.getElementById("weeknav").hidden = !isW;
    if (isW) renderWeek();

    var b = document.getElementById("board");
    b.textContent = "";
    if (!isW) {
      COLS.forEach(function(c){
        var col = el("div", "col");
        col.dataset.s = c[0];
        var list = tasks.filter(function(t){
          return t.s === c[0] && (filter === "all" || t.p === filter);
        });
        var h = el("div", "col-head");
        h.appendChild(el("i"));
        h.appendChild(el("h2", null, c[1]));
        h.appendChild(el("span", "count", String(list.length)));
        col.appendChild(h);
        if (!list.length) {
          col.appendChild(el("div", "empty", c[0] === "todo" ? "Chưa có việc nào. Thêm việc ở phía trên." : "Kéo thẻ vào đây."));
        }
        list.forEach(function(t){
          col.appendChild(card(t));
        });
        col.addEventListener("dragover", function(e){
          e.preventDefault();
          col.classList.add("over");
        });
        col.addEventListener("dragleave", function(e){
          if (!col.contains(e.relatedTarget)) col.classList.remove("over");
        });
        col.addEventListener("drop", function(e){
          e.preventDefault();
          col.classList.remove("over");
          if (dragId != null) move(dragId, c[0]);
        });
        b.appendChild(col);
      });
    }

    var n = tasks.length;
    var d = tasks.filter(function(t){ return t.s === "done"; }).length;
    var g = tasks.filter(function(t){ return t.s === "doing"; }).length;
    var o = n - d - g;
    var pct = n ? Math.round((d / n) * 100) : 0;

    document.getElementById("pct").firstChild.nodeValue = pct + "%";
    document.getElementById("frac").textContent = d + "/" + n + " việc xong";
    document.getElementById("bDone").style.flexGrow = d;
    document.getElementById("bDoing").style.flexGrow = g;
    document.getElementById("bTodo").style.flexGrow = o;
    updateGauge(pct);

    var late = tasks.filter(function(t){
      return t.s !== "done" && t.d && t.d < today();
    }).length;
    document.getElementById("note").textContent =
      !n ? "Chưa có công việc nào." :
      late ? late + " việc đã quá hạn." :
      d === n ? "Bạn đã xong tất cả." :
      "Còn " + (n - d) + " việc cần hoàn thành.";
  }

  function setDate(id, d){
    tasks.forEach(function(t){
      if (t.id === id) t.d = d;
    });
    save();
    render();
  }

  function dayCol(title, sub, list, dateVal, cls){
    var col = el("div", "col" + (cls || ""));
    var h = el("div", "col-head");
    h.appendChild(el("h2", null, title));
    if (sub) h.appendChild(el("span", "dsub", sub));
    h.appendChild(el("span", "count", String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){
      col.appendChild(card(t));
    });
    if (dateVal !== null) {
      var A = el("button", "addday", "+ Thêm việc");
      A.type = "button";
      A.onclick = function(){
        document.getElementById("due").value = dateVal;
        document.getElementById("title").focus();
      };
      col.appendChild(A);
      col.addEventListener("dragover", function(e){
        e.preventDefault();
        col.classList.add("over");
      });
      col.addEventListener("dragleave", function(e){
        if (!col.contains(e.relatedTarget)) col.classList.remove("over");
      });
      col.addEventListener("drop", function(e){
        e.preventDefault();
        col.classList.remove("over");
        if (dragId != null) setDate(dragId, dateVal);
      });
    }
    return col;
  }

  function renderWeek(){
    var W = document.getElementById("week");
    var E = document.getElementById("extra");
    W.textContent = "";
    E.textContent = "";
    var names = ["Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy", "Chủ nhật"];
    var tod = today();
    var vis = function(t){ return filter === "all" || t.p === filter; };
    for (var k = 0; k < 7; k++) {
      var d = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + k);
      var s = isoDate(d);
      var list = tasks.filter(function(t){ return t.d === s && vis(t); });
      W.appendChild(dayCol(names[k], pad(d.getDate()) + "/" + pad(d.getMonth() + 1), list, s, s === tod ? " today" : ""));
    }
    var e = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 6);
    var first = isoDate(ws);
    document.getElementById("wlabel").textContent =
      pad(ws.getDate()) + "/" + pad(ws.getMonth() + 1) + " – " +
      pad(e.getDate()) + "/" + pad(e.getMonth() + 1) + "/" + e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày", "", tasks.filter(function(t){ return !t.d && vis(t); }), "", ""));
    var over = tasks.filter(function(t){ return t.d && t.d < first && t.s !== "done" && vis(t); });
    if (over.length) {
      E.appendChild(dayCol("Chưa xong từ trước tuần này", "", over, null, ""));
    }
  }

  function add(){
    var inp = document.getElementById("title");
    var v = inp.value.trim();
    if (!v) {
      inp.focus();
      return;
    }
    tasks.push({
      id: Date.now(),
      t: v,
      p: document.getElementById("prio").value,
      s: "todo",
      d: document.getElementById("due").value
    });
    inp.value = "";
    document.getElementById("due").value = "";
    save();
    render();
    inp.focus();
  }

  document.getElementById("addBtn").onclick = add;
  document.getElementById("title").addEventListener("keydown", function(e){
    if (e.key === "Enter") add();
  });

  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick = function(){
      filter = c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){
        x.setAttribute("aria-pressed", String(x === c));
      });
      render();
    };
  });

  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick = function(){
      view = b.dataset.v;
      document.querySelectorAll(".seg button").forEach(function(x){
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    };
  });

  function shift(n){
    ws = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + n);
    render();
  }

  document.getElementById("prevW").onclick = function(){ shift(-7); };
  document.getElementById("nextW").onclick = function(){ shift(7); };
  document.getElementById("thisW").onclick = function(){
    ws = mondayOf(new Date());
    render();
  };

  /* Theme Switcher (Auto -> Light Material -> Dark Spatial 3D) */
  var themeModes = ["auto", "light", "dark"];
  var themeNames = {auto: "Chế độ: Tự động", light: "Giao diện: Sáng (Vật liệu)", dark: "Giao diện: Tối (Không gian 3D)"};
  var currentTheme = "auto";
  try {
    var savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme && themeModes.indexOf(savedTheme) !== -1) currentTheme = savedTheme;
  } catch (e) {}

  function applyTheme(mode){
    currentTheme = mode;
    var root = document.documentElement;
    if (mode === "auto") {
      root.removeAttribute("data-theme");
    } else {
      root.setAttribute("data-theme", mode);
    }
    var lbl = document.getElementById("themeLabel");
    if (lbl) lbl.textContent = themeNames[mode];
    try {
      localStorage.setItem(THEME_KEY, mode);
    } catch (e) {}
  }

  applyTheme(currentTheme);
  document.getElementById("themeBtn").onclick = function(){
    var next = themeModes[(themeModes.indexOf(currentTheme) + 1) % themeModes.length];
    applyTheme(next);
  };

  /* Progressive Enhancement: WebGL2 Spatial Depth Scene (skipped on mobile or reduced-motion) */
  function initSpatialCanvas(){
    var canvas = document.getElementById("spatialCanvas");
    if (!canvas) return;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var isMobile = window.matchMedia && window.matchMedia("(max-width: 820px)").matches;
    if (reduceMotion || isMobile) {
      canvas.style.display = "none";
      return;
    }
    var gl = null;
    try {
      gl = canvas.getContext("webgl2", {alpha: true, antialias: false, powerPreference: "low-power"});
    } catch (e) {}
    if (!gl) {
      canvas.style.display = "none";
      return;
    }
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }

  load();
  render();
  if (typeof requestIdleCallback === "function") {
    requestIdleCallback(initSpatialCanvas);
  } else {
    setTimeout(initSpatialCanvas, 60);
  }
})();
</script>
</body>
</html>
