<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cb-red:#e63946;
  --cb-navy:#1d3557;
  --cb-yellow:#ffd60a;
  --cb-cobalt:#2a6fdb;
  --cb-green:#2dc653;
  --cb-coral:#ff6b6b;
  --cb-violet:#7b2d8e;
  --cb-tangerine:#ff8c42;
  --cb-teal:#0b8a8a;
  --cb-blush:#f4acb7;
  --cb-black:#111111;
  --cb-ivory:#f8f7f2;
  --cb-white:#ffffff;
  --cb-muted:#454545;
  --cb-divider:4px solid var(--cb-black);
  --cb-border:3px solid var(--cb-black);
  --cb-pad:clamp(20px,4vw,48px);
  --cb-t:.3s ease;
  --font-display:"Montserrat","Archivo Black","Bebas Neue",system-ui,sans-serif;
  --font-body:"Inter","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--cb-ivory);
  color:var(--cb-black);
  font-family:var(--font-body);
  font-weight:400;
  line-height:1.5;
}
input,select,button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* Focus rings tuned to background polarity */
:focus-visible{outline:4px solid var(--cb-navy);outline-offset:3px}
.hero-slab :focus-visible,.col[data-s="todo"] .col-head :focus-visible,.chip[aria-pressed="true"]:focus-visible,.seg button[aria-pressed="true"]:focus-visible{
  outline:4px solid var(--cb-yellow);
  outline-offset:3px;
}

/* Band 1: Full-width Mondrian Hero + Progress Slab */
.band-top{
  display:grid;
  grid-template-columns:1.15fr 1fr;
  background:var(--cb-black);
  gap:4px;
  border-bottom:var(--cb-divider);
}
.band-top > *{min-width:0}

.hero-slab{
  background:var(--cb-navy);
  color:var(--cb-white);
  padding:var(--cb-pad);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:20px;
}
.eyebrow-row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.eyebrow-tag{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--cb-yellow);
  color:var(--cb-black);
  border:var(--cb-border);
  padding:4px 12px;
  font-family:var(--font-display);
  font-weight:900;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-family:var(--font-display);
  font-weight:900;
  font-size:clamp(32px,5vw,58px);
  line-height:1.02;
  letter-spacing:-.02em;
  text-transform:uppercase;
  color:var(--cb-white);
}
.sub{
  margin:10px 0 0;
  font-size:16px;
  max-width:48ch;
  color:var(--cb-white);
}

/* Mondrian Progress Sub-Grid */
.cb-mondrian{
  display:grid;
  grid-template-columns:2fr 1fr;
  grid-template-rows:auto auto;
  gap:4px;
  background:var(--cb-black);
}
.cb-mondrian > *{min-width:0}

.pg-main{
  background:var(--cb-yellow);
  color:var(--cb-black);
  padding:clamp(20px,3vw,36px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:10px;
}
.pg-label{
  font-family:var(--font-display);
  font-weight:900;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--cb-black);
}
.pg-num{
  font-family:var(--font-display);
  font-weight:900;
  font-size:clamp(42px,6vw,72px);
  line-height:.95;
  letter-spacing:-.03em;
  color:var(--cb-black);
}
.pg-num small{
  display:inline-block;
  font-family:var(--font-body);
  font-size:16px;
  font-weight:700;
  letter-spacing:0;
  margin-left:10px;
  vertical-align:baseline;
}
.pg-note{
  font-size:15px;
  font-weight:600;
  color:var(--cb-black);
}

.pg-accent{
  background:var(--cb-red);
  color:var(--cb-black);
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.pg-accent-title{
  font-family:var(--font-display);
  font-weight:900;
  font-size:13px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--cb-black);
}

.pg-bar-slab{
  grid-column:1 / -1;
  background:var(--cb-ivory);
  color:var(--cb-black);
  padding:18px clamp(20px,3vw,36px);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.bar{
  display:flex;
  height:24px;
  background:var(--cb-black);
  border:var(--cb-divider);
  gap:4px;
  overflow:hidden;
}
.bar:empty,.bar-is-empty{
  background:var(--cb-white);
}
.bar span{
  display:block;
  min-width:0;
  transition:flex-grow var(--cb-t);
}
.bar .b-done{background:var(--cb-green)}
.bar .b-doing{background:var(--cb-yellow)}
.bar .b-todo{background:var(--cb-cobalt)}

.bar-legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px 18px;
  font-size:13px;
  font-weight:600;
  color:var(--cb-black);
}
.leg-item{
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.swatch{
  width:14px;
  height:14px;
  border:2px solid var(--cb-black);
  display:inline-block;
  flex-shrink:0;
}
.swatch-done{background:var(--cb-green)}
.swatch-doing{background:var(--cb-yellow)}
.swatch-todo{background:var(--cb-cobalt)}

/* Band 2: Calm Zone for Form & Controls */
.band-calm{
  background:var(--cb-ivory);
  color:var(--cb-black);
  padding:clamp(20px,3.2vw,36px) var(--cb-pad);
  border-bottom:var(--cb-divider);
}
.calm-inner{
  max-width:1360px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1.6fr) minmax(0,.7fr) minmax(0,.7fr) auto;
  gap:10px;
  align-items:stretch;
}
.add input,.add select{
  background:var(--cb-white);
  color:var(--cb-black);
  border:var(--cb-border);
  border-radius:0;
  padding:11px 14px;
  min-width:0;
  width:100%;
  min-height:46px;
}
.add input::placeholder{color:var(--cb-muted)}
.btn{
  background:var(--cb-red);
  color:var(--cb-black);
  border:var(--cb-border);
  border-radius:0;
  padding:11px 22px;
  min-height:46px;
  font-family:var(--font-display);
  font-weight:900;
  font-size:14px;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background var(--cb-t),color var(--cb-t);
}
.btn:hover{
  background:var(--cb-yellow);
  color:var(--cb-black);
}

.controls-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px 20px;
}
.views,.filters,.weeknav{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}
.ctrl-label{
  font-family:var(--font-display);
  font-weight:800;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--cb-black);
  margin-right:4px;
}
.seg{
  display:inline-flex;
  flex-wrap:wrap;
  border:var(--cb-border);
  background:var(--cb-black);
  gap:3px;
}
.seg button{
  background:var(--cb-white);
  color:var(--cb-black);
  border:0;
  padding:8px 16px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.03em;
  cursor:pointer;
  transition:background var(--cb-t),color var(--cb-t);
}
.seg button:hover{
  background:var(--cb-yellow);
  color:var(--cb-black);
}
.seg button[aria-pressed="true"]{
  background:var(--cb-navy);
  color:var(--cb-white);
}

.chip{
  background:var(--cb-white);
  color:var(--cb-black);
  border:var(--cb-border);
  border-radius:0;
  padding:7px 14px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:background var(--cb-t),color var(--cb-t);
}
.chip:hover{
  background:var(--cb-yellow);
  color:var(--cb-black);
}
.chip[aria-pressed="true"]{
  background:var(--cb-navy);
  color:var(--cb-white);
}

.weeknav{
  padding-top:4px;
}
.weeknav .lbl{
  font-family:var(--font-display);
  font-weight:900;
  font-size:15px;
  letter-spacing:.02em;
  color:var(--cb-black);
  margin-left:4px;
}

/* Band 3: Board & Week Slabs */
.band-workspace{
  background:var(--cb-black);
  border-bottom:var(--cb-divider);
}
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:4px;
  background:var(--cb-black);
  align-items:stretch;
}
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
  background:var(--cb-black);
  align-items:stretch;
}
.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:4px;
  background:var(--cb-black);
  border-top:var(--cb-divider);
  align-items:stretch;
}

.col{
  background:var(--cb-ivory);
  color:var(--cb-black);
  min-width:0;
  min-height:240px;
  display:flex;
  flex-direction:column;
  transition:background var(--cb-t);
}
.col.over{
  background:var(--cb-yellow);
}
.col-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:14px 16px;
  border-bottom:var(--cb-divider);
  background:var(--cb-white);
  color:var(--cb-black);
  flex-wrap:wrap;
}
.col[data-s="todo"] .col-head{
  background:var(--cb-cobalt);
  color:var(--cb-white);
}
.col[data-s="doing"] .col-head{
  background:var(--cb-yellow);
  color:var(--cb-black);
}
.col[data-s="done"] .col-head{
  background:var(--cb-green);
  color:var(--cb-black);
}
.col.today .col-head{
  background:var(--cb-yellow);
  color:var(--cb-black);
}
.col.col-unscheduled .col-head{
  background:var(--cb-navy);
  color:var(--cb-white);
}
.col.col-overdue .col-head{
  background:var(--cb-red);
  color:var(--cb-black);
}

.col-icon{
  width:18px;
  height:18px;
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.col-head h2{
  margin:0;
  font-family:var(--font-display);
  font-weight:900;
  font-size:15px;
  letter-spacing:.03em;
  text-transform:uppercase;
}
.dsub{
  font-size:13px;
  font-weight:700;
}
.today-pill{
  font-family:var(--font-display);
  font-weight:900;
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  background:var(--cb-navy);
  color:var(--cb-white);
  border:2px solid var(--cb-black);
  padding:2px 7px;
}
.col-head .count{
  margin-left:auto;
  font-family:var(--font-display);
  font-weight:900;
  font-size:13px;
  background:var(--cb-white);
  color:var(--cb-black);
  border:2px solid var(--cb-black);
  padding:1px 9px;
}

.col-body{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
  flex:1;
  min-width:0;
}

/* Task Cards */
.card{
  background:var(--cb-white);
  color:var(--cb-black);
  border:var(--cb-border);
  border-left-width:10px;
  padding:12px 14px;
  cursor:grab;
  min-width:0;
  transition:background var(--cb-t),transform var(--cb-t);
}
.card:hover{
  background:var(--cb-ivory);
}
.card.p-high{border-left-color:var(--cb-red)}
.card.p-mid{border-left-color:var(--cb-yellow)}
.card.p-low{border-left-color:var(--cb-cobalt)}
.card.dragging{
  opacity:.45;
}
.card .t{
  font-weight:600;
  font-size:15px;
  line-height:1.4;
  overflow-wrap:anywhere;
  color:var(--cb-black);
}
.card.is-done{
  background:var(--cb-ivory);
}
.card.is-done .t{
  text-decoration:line-through;
  text-decoration-thickness:2px;
  color:var(--cb-muted);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  font-size:12px;
  font-weight:700;
  border:2px solid var(--cb-black);
  padding:2px 8px;
  background:var(--cb-ivory);
  color:var(--cb-black);
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.tag.prio-high{background:var(--cb-red);color:var(--cb-black)}
.tag.prio-mid{background:var(--cb-yellow);color:var(--cb-black)}
.tag.prio-low{background:var(--cb-cobalt);color:var(--cb-white)}
.tag.doing-tag{background:var(--cb-yellow);color:var(--cb-black)}
.tag.late{
  background:var(--cb-red);
  color:var(--cb-black);
  font-weight:800;
}

.acts{
  margin-left:auto;
  display:flex;
  gap:4px;
}
.acts button{
  background:var(--cb-white);
  color:var(--cb-black);
  border:2px solid var(--cb-black);
  width:32px;
  height:32px;
  cursor:pointer;
  font-weight:800;
  font-size:15px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:background var(--cb-t),color var(--cb-t);
}
.acts button:hover:not(:disabled){
  background:var(--cb-yellow);
  color:var(--cb-black);
}
.acts button.btn-del:hover:not(:disabled){
  background:var(--cb-red);
  color:var(--cb-black);
}
.acts button:disabled{
  opacity:.32;
  cursor:not-allowed;
}

.empty{
  background:var(--cb-white);
  color:var(--cb-muted);
  border:2px dashed var(--cb-black);
  padding:22px 12px;
  font-size:14px;
  font-weight:600;
  text-align:center;
}

.addday{
  width:100%;
  background:var(--cb-white);
  color:var(--cb-black);
  border:2px dashed var(--cb-black);
  padding:9px 10px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:12px;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  margin-top:auto;
  transition:background var(--cb-t);
}
.addday:hover{
  background:var(--cb-yellow);
  border-style:solid;
}

.week .col-body{padding:10px;gap:10px}
.week .card{padding:10px;border-left-width:8px}
.week .card .t{font-size:14px}
.week .col-head{padding:12px}
.week .col-head h2{font-size:13px}

/* Band 4: Closing De Stijl Footer Bar */
.band-footer{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  height:22px;
  gap:4px;
  background:var(--cb-black);
}
.f-navy{background:var(--cb-navy)}
.f-yellow{background:var(--cb-yellow)}
.f-red{background:var(--cb-red)}
.f-green{background:var(--cb-green)}

/* Responsive Breakpoints (zero horizontal overflow down to <=400px) */
@media (max-width:1180px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:940px){
  .band-top{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input[type=text]{grid-column:1 / -1}
  .add .btn{grid-column:1 / -1}
}
@media (max-width:640px){
  .week,.extra{grid-template-columns:1fr}
  .cb-mondrian{grid-template-columns:1fr}
  .pg-accent{flex-direction:row;align-items:center}
  .controls-row{align-items:flex-start}
}
@media (max-width:460px){
  .add{grid-template-columns:1fr}
  .seg button{padding:8px 11px;font-size:12px}
  .chip{padding:6px 11px;font-size:13px}
}

/* Accessibility & User-Preference Fallbacks */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
@media (prefers-reduced-transparency:reduce){
  .band-top,.cb-mondrian,.band-calm,.band-workspace,.col,.card,.chip,.seg button,.btn{
    opacity:1!important;
  }
}
@media (forced-colors:active){
  .band-top,.cb-mondrian,.band-calm,.band-workspace,.col,.card,.bar,.bar span,.chip,.seg,.seg button,.btn,.tag,.acts button,.addday,.eyebrow-tag,.count,.today-pill{
    border-color:CanvasText!important;
    forced-color-adjust:auto;
  }
  .col,.card,.band-calm,.hero-slab,.pg-main,.pg-accent,.pg-bar-slab{
    background:Canvas!important;
    color:CanvasText!important;
  }
  .btn,.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{
    background:Highlight!important;
    color:HighlightText!important;
  }
  .bar span{
    background:Highlight!important;
    border:1px solid CanvasText!important;
  }
  :focus-visible{
    outline:3px solid Highlight!important;
  }
}
</style>
</head>
<body>
<header class="band-top">
  <div class="hero-slab">
    <div>
      <div class="eyebrow-row">
        <span class="eyebrow-tag">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <rect x="0" y="0" width="6" height="6" fill="#1d3557"/>
            <rect x="8" y="0" width="6" height="6" fill="#e63946"/>
            <rect x="0" y="8" width="14" height="6" fill="#111111"/>
          </svg>
          Quản lý công việc
        </span>
      </div>
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
  </div>

  <section class="cb-mondrian" aria-label="Tiến độ">
    <div class="pg-main">
      <div class="pg-label">Tổng quan hoàn thành</div>
      <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
      <div class="pg-note" id="note"></div>
    </div>
    <div class="pg-accent" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <rect x="2" y="2" width="40" height="40" fill="#ffd60a" stroke="#111111" stroke-width="4"/>
        <rect x="2" y="2" width="18" height="18" fill="#1d3557" stroke="#111111" stroke-width="4"/>
        <rect x="20" y="20" width="22" height="22" fill="#ffffff" stroke="#111111" stroke-width="4"/>
        <path d="M25 31 L29 35 L37 26" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="square"/>
      </svg>
      <div class="pg-accent-title">Nhịp độ tuần</div>
    </div>
    <div class="pg-bar-slab">
      <div class="bar" id="bar" aria-hidden="true">
        <span class="b-done" id="bDone"></span>
        <span class="b-doing" id="bDoing"></span>
        <span class="b-todo" id="bTodo"></span>
      </div>
      <div class="bar-legend" id="legend">
        <span class="leg-item"><i class="swatch swatch-done" aria-hidden="true"></i><span id="legDone">Hoàn thành: 0</span></span>
        <span class="leg-item"><i class="swatch swatch-doing" aria-hidden="true"></i><span id="legDoing">Đang làm: 0</span></span>
        <span class="leg-item"><i class="swatch swatch-todo" aria-hidden="true"></i><span id="legTodo">Cần làm: 0</span></span>
      </div>
    </div>
  </section>
</header>

<section class="band-calm" aria-label="Thêm và lọc công việc">
  <div class="calm-inner">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button class="btn" id="addBtn" type="button">Thêm việc</button>
    </div>

    <div class="controls-row">
      <div class="views">
        <span class="ctrl-label">Hiển thị</span>
        <div class="seg" role="group" aria-label="Chế độ xem">
          <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
          <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
        </div>
      </div>

      <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
        <span class="ctrl-label">Ưu tiên</span>
        <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
        <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
        <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
        <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
      </div>
    </div>

    <div class="weeknav" id="weeknav" hidden>
      <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
      <button type="button" class="chip" id="thisW">Tuần này</button>
      <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
      <span class="lbl" id="wlabel"></span>
    </div>
  </div>
</section>

<main class="band-workspace">
  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</main>

<div class="band-footer" aria-hidden="true">
  <div class="f-navy"></div>
  <div class="f-yellow"></div>
  <div class="f-red"></div>
  <div class="f-green"></div>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var PM={high:"▲ ",mid:"■ ",low:"● "};
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function colIcon(status){
    var ns="http://www.w3.org/2000/svg";
    var svg=document.createElementNS(ns,"svg");
    svg.setAttribute("viewBox","0 0 18 18");
    svg.setAttribute("width","18");
    svg.setAttribute("height","18");
    svg.setAttribute("aria-hidden","true");
    if(status==="todo"){
      var r=document.createElementNS(ns,"rect");
      r.setAttribute("x","2");r.setAttribute("y","2");r.setAttribute("width","14");r.setAttribute("height","14");
      r.setAttribute("fill","none");r.setAttribute("stroke","currentColor");r.setAttribute("stroke-width","3");
      svg.appendChild(r);
    }else if(status==="doing"){
      var p=document.createElementNS(ns,"polygon");
      p.setAttribute("points","9,1 17,9 9,17 1,9");
      p.setAttribute("fill","#111111");
      svg.appendChild(p);
    }else{
      var c=document.createElementNS(ns,"rect");
      c.setAttribute("x","1");c.setAttribute("y","1");c.setAttribute("width","16");c.setAttribute("height","16");
      c.setAttribute("fill","#ffffff");c.setAttribute("stroke","#111111");c.setAttribute("stroke-width","2.5");
      var k=document.createElementNS(ns,"path");
      k.setAttribute("d","M4.5 9.2 L7.6 12.3 L13.5 5.8");
      k.setAttribute("fill","none");k.setAttribute("stroke","#111111");k.setAttribute("stroke-width","2.5");
      svg.appendChild(c);svg.appendChild(k);
    }
    return svg;
  }

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,(PM[t.p]||"")+PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag doing-tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button","btn-del","×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");
      var ic=el("span","col-icon");ic.appendChild(colIcon(c[0]));h.appendChild(ic);
      h.appendChild(el("h2",null,c[1]));
      h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      var body=el("div","col-body");
      if(!list.length)body.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){body.appendChild(card(t))});
      col.appendChild(body);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    var bDone=document.getElementById("bDone"),bDoing=document.getElementById("bDoing"),bTodo=document.getElementById("bTodo"),bar=document.getElementById("bar");
    bDone.hidden=!d;bDone.style.flexGrow=d;
    bDoing.hidden=!g;bDoing.style.flexGrow=g;
    bTodo.hidden=!o;bTodo.style.flexGrow=o;
    bar.classList.toggle("bar-is-empty",n===0);
    document.getElementById("legDone").textContent="Hoàn thành: "+d;
    document.getElementById("legDoing").textContent="Đang làm: "+g;
    document.getElementById("legTodo").textContent="Cần làm: "+o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");
    h.appendChild(el("h2",null,title));
    if(sub)h.appendChild(el("span","dsub",sub));
    if(cls&&cls.indexOf("today")!==-1)h.appendChild(el("span","today-pill","Hôm nay"));
    h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    var body=el("div","col-body");
    list.forEach(function(t){body.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      body.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    col.appendChild(body);
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),""," col-unscheduled"));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null," col-overdue"));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  load();render();
})();
</script>
</body>
</html>
