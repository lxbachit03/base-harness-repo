<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Orbitron:wght@700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;

  /* Cyberpunk / Neon core tokens from reference */
  --cy-void:#0a0a0f;
  --cy-steel:#12121a;
  --cy-gunmetal:#1a1a2e;
  --cy-slate:#2a2a3e;
  --cy-cyan:#00f0ff;
  --cy-blue:#0080ff;
  --cy-magenta:#ff0080;
  --cy-green:#00ff41;
  --cy-amber:#ffb800;
  --cy-red:#ff1744;
  --cy-purple:#c084fc; /* #b000ff fails AA body text (4.03:1); substituted per Guardrails */
  --cy-text:#e0e0ec;
  --cy-text-2:#8a8aa6;  /* #6a6a8a from sources fails AA (3.80:1); substituted per reference */
  --cy-glow-cyan:0 0 10px rgba(0,240,255,.5),0 0 40px rgba(0,240,255,.15);
  --cy-font-ui:"IBM Plex Mono","Share Tech Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --cy-font-display:"Exo 2","Orbitron","Rajdhani",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cy-font-hud:"Orbitron","Exo 2",sans-serif;

  /* Derived contrast-verified semantic tokens */
  --cy-red-text:#ff5c7c;  /* #ff1744 is 4.43:1 on #1a1a2e (LOW); #ff5c7c is 5.75:1 AA */
  --cy-blue-text:#4da6ff; /* #0080ff is 4.49:1 on #1a1a2e (LOW); #4da6ff is 6.67:1 AA */
  --cy-border:#68688c;    /* 3.21:1+ UI edge contrast against #1a1a2e and #0a0a0f */
  --cy-panel-glass:rgba(18,18,26,.90);
  --cy-card-glass:rgba(26,26,46,.92);
  --cy-cut:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  --cy-cut-sm:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
}

html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--cy-void)}
*,*::before,*::after{box-sizing:inherit}

body{
  margin:0;
  min-height:100vh;
  background-color:var(--cy-void);
  background-image:
    radial-gradient(circle at 12% 8%,rgba(0,240,255,.10),transparent 38%),
    radial-gradient(circle at 88% 16%,rgba(0,128,255,.09),transparent 42%),
    linear-gradient(rgba(0,240,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.045) 1px,transparent 1px);
  background-size:auto,auto,36px 36px,36px 36px;
  color:var(--cy-text);
  font-family:var(--cy-font-ui);
  line-height:1.5;
  overflow-x:clip;
}

/* Subtle scanline atmosphere (low alpha so text stays crisp, pointer-events:none) */
.scanlines{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.09) 2px 4px);
}

.wrap{
  position:relative;
  z-index:1;
  max-width:1280px;
  margin:0 auto;
  padding:24px 18px 56px;
}

/* Header HUD */
.hud-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding-bottom:10px;
  margin-bottom:14px;
  border-bottom:1px solid var(--cy-border);
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--cy-text-2);
}
.hud-tag{
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.hud-dot{
  width:8px;
  height:8px;
  background:var(--cy-cyan);
  box-shadow:0 0 8px var(--cy-cyan);
  animation:hudPulse 4s ease-in-out infinite;
}
.hud-jp{
  color:var(--cy-cyan);
  letter-spacing:.18em;
}

.title-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
h1{
  position:relative;
  margin:0 0 6px;
  font-family:var(--cy-font-display);
  font-size:clamp(28px,4.8vw,46px);
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  line-height:1.1;
  color:var(--cy-cyan);
  text-shadow:var(--cy-glow-cyan);
}
.sub{
  margin:0 0 20px;
  color:var(--cy-text-2);
  font-size:14px;
  max-width:68ch;
}

/* Focus visible */
:focus-visible{
  outline:2px solid var(--cy-cyan);
  outline-offset:2px;
}

/* Progress HUD */
.cy-glow{
  filter:drop-shadow(0 0 8px rgba(0,240,255,.28));
  margin-bottom:20px;
}
.progress{
  position:relative;
  background:var(--cy-steel);
  border:1px solid var(--cy-cyan);
  clip-path:var(--cy-cut);
  padding:18px 20px;
}
@supports (backdrop-filter:blur(8px)){
  .progress{
    background:var(--cy-panel-glass);
    backdrop-filter:blur(8px);
  }
}
.progress::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(0,240,255,.08),transparent 42%,rgba(0,128,255,.06));
}
.pg-grid{
  position:relative;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:18px;
  align-items:center;
}
.pg-gauge{
  width:72px;
  height:72px;
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.pg-gauge svg{
  width:72px;
  height:72px;
  transform:rotate(-90deg);
}
.pg-gauge .g-track{
  fill:none;
  stroke:var(--cy-slate);
  stroke-width:5;
}
.pg-gauge .g-fill{
  fill:none;
  stroke:var(--cy-cyan);
  stroke-width:5;
  stroke-linecap:butt;
  stroke-dasharray:175.93;
  stroke-dashoffset:175.93;
  transition:stroke-dashoffset .35s ease;
}
.pg-main{min-width:0}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.pg-num{
  font-family:var(--cy-font-hud);
  font-size:clamp(30px,5.2vw,48px);
  font-weight:900;
  letter-spacing:.03em;
  line-height:1;
  color:var(--cy-cyan);
  text-shadow:0 0 12px rgba(0,240,255,.45);
}
.pg-num small{
  font-family:var(--cy-font-ui);
  font-size:.36em;
  font-weight:600;
  color:var(--cy-text-2);
  letter-spacing:.04em;
  text-shadow:none;
  margin-left:10px;
  vertical-align:middle;
}
.pg-note{
  color:var(--cy-text-2);
  font-size:14px;
}
.bar{
  display:flex;
  height:14px;
  background:var(--cy-void);
  border:1px solid var(--cy-border);
  padding:2px;
  gap:3px;
}
.bar span{
  display:block;
  min-width:0;
  transition:flex-grow .35s ease;
}
.bar .b-done{background:var(--cy-green)}
.bar .b-doing{background:var(--cy-amber)}
.bar .b-todo{background:var(--cy-cyan)}
.pg-legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:8px;
  font-size:12px;
  color:var(--cy-text-2);
}
.pg-legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.pg-legend i{
  width:10px;
  height:4px;
  display:inline-block;
}
.lg-done{background:var(--cy-green)}
.lg-doing{background:var(--cy-amber)}
.lg-todo{background:var(--cy-cyan)}

/* Add Form */
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:10px;
  margin-bottom:16px;
  padding:12px;
  background:var(--cy-steel);
  border:1px solid var(--cy-border);
}
input,select,button{
  font:inherit;
  color:inherit;
}
.add input,.add select{
  background:var(--cy-void);
  border:1px solid var(--cy-border);
  padding:10px 12px;
  min-width:0;
  color:var(--cy-text);
  border-radius:0;
  min-height:42px;
}
.add input::placeholder{
  color:var(--cy-text-2);
}
.add input:hover,.add select:hover{
  border-color:var(--cy-cyan);
}
.btn{
  position:relative;
  background:transparent;
  color:var(--cy-void);
  border:0;
  padding:10px 20px;
  min-height:42px;
  font-family:var(--cy-font-display);
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  z-index:1;
}
.btn::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:var(--cy-cyan);
  clip-path:var(--cy-cut-sm);
  transition:filter .15s ease,transform .15s ease;
}
.btn:hover::before{
  filter:brightness(1.1);
}
.btn:active::before{
  transform:translateY(1px);
}

/* Controls Row */
.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.views{display:flex;align-items:center}
.seg{
  display:inline-flex;
  border:1px solid var(--cy-border);
  background:var(--cy-steel);
}
.seg button{
  background:transparent;
  border:0;
  padding:8px 16px;
  min-height:38px;
  cursor:pointer;
  color:var(--cy-text-2);
  font-family:var(--cy-font-display);
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.seg button+button{
  border-left:1px solid var(--cy-border);
}
.seg button:hover{
  color:var(--cy-cyan);
}
.seg button[aria-pressed="true"]{
  background:var(--cy-cyan);
  color:var(--cy-void);
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.chip{
  background:var(--cy-steel);
  border:1px solid var(--cy-border);
  padding:6px 14px;
  min-height:36px;
  cursor:pointer;
  font-size:13px;
  color:var(--cy-text-2);
  letter-spacing:.04em;
  text-transform:uppercase;
}
.chip:hover{
  border-color:var(--cy-cyan);
  color:var(--cy-text);
}
.chip[aria-pressed="true"]{
  background:var(--cy-cyan);
  color:var(--cy-void);
  border-color:var(--cy-cyan);
  font-weight:700;
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
  flex-wrap:wrap;
  padding:10px 12px;
  background:var(--cy-steel);
  border:1px solid var(--cy-border);
}
.weeknav .lbl{
  font-family:var(--cy-font-display);
  font-weight:700;
  color:var(--cy-cyan);
  letter-spacing:.05em;
  margin-left:4px;
}

/* Board & Columns */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  align-items:start;
}
.col{
  position:relative;
  background:var(--cy-steel);
  border:1px solid var(--cy-border);
  padding:14px 12px;
  min-height:200px;
  min-width:0;
  transition:border-color .15s ease,background-color .15s ease;
}
@supports (backdrop-filter:blur(6px)){
  .col{
    background:var(--cy-panel-glass);
    backdrop-filter:blur(6px);
  }
}
.col::before{
  content:"";
  position:absolute;
  top:-1px;
  left:-1px;
  width:14px;
  height:14px;
  border-top:2px solid var(--cy-cyan);
  border-left:2px solid var(--cy-cyan);
  pointer-events:none;
}
.col::after{
  content:"";
  position:absolute;
  right:-1px;
  bottom:-1px;
  width:14px;
  height:14px;
  border-right:2px solid var(--cy-cyan);
  border-bottom:2px solid var(--cy-cyan);
  pointer-events:none;
}
.col[data-s="doing"]::before,.col[data-s="doing"]::after{border-color:var(--cy-amber)}
.col[data-s="done"]::before,.col[data-s="done"]::after{border-color:var(--cy-green)}

.col.over{
  border-color:var(--cy-cyan);
  background:rgba(0,240,255,.08);
}

.col-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--cy-slate);
}
.col-head i{
  width:10px;
  height:10px;
  display:block;
  flex-shrink:0;
}
.col[data-s="todo"] .col-head i{background:var(--cy-cyan);box-shadow:0 0 8px var(--cy-cyan)}
.col[data-s="doing"] .col-head i{background:var(--cy-amber);box-shadow:0 0 8px var(--cy-amber)}
.col[data-s="done"] .col-head i{background:var(--cy-green);box-shadow:0 0 8px var(--cy-green)}
.col-head h2{
  font-family:var(--cy-font-display);
  font-size:15px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  margin:0;
  color:var(--cy-text);
}
.col-head .count{
  margin-left:auto;
  font-family:var(--cy-font-hud);
  font-size:12px;
  color:var(--cy-cyan);
  background:var(--cy-void);
  border:1px solid var(--cy-border);
  padding:2px 8px;
}

/* Task Cards */
.card{
  position:relative;
  background:var(--cy-gunmetal);
  border:1px solid var(--cy-border);
  border-left:4px solid var(--cy-border);
  padding:11px 12px;
  margin-bottom:10px;
  cursor:grab;
  min-width:0;
}
.card:last-child{margin-bottom:0}
.card.p-high{border-left-color:var(--cy-red)}
.card.p-mid{border-left-color:var(--cy-amber)}
.card.p-low{border-left-color:var(--cy-cyan)}
.card:hover{
  border-color:var(--cy-cyan);
}
.card.p-high:hover{border-left-color:var(--cy-red)}
.card.p-mid:hover{border-left-color:var(--cy-amber)}
.card.dragging{
  opacity:.45;
  border-style:dashed;
}
.card .t{
  font-family:var(--cy-font-display);
  font-size:15px;
  font-weight:600;
  color:var(--cy-text);
  overflow-wrap:anywhere;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--cy-text-2);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:9px;
  flex-wrap:wrap;
}
.tag{
  font-size:12px;
  border:1px solid var(--cy-border);
  background:var(--cy-steel);
  padding:1px 7px;
  color:var(--cy-text-2);
  white-space:nowrap;
}
.card.p-high .tag-prio{color:var(--cy-red-text);border-color:var(--cy-red)}
.card.p-mid .tag-prio{color:var(--cy-amber);border-color:var(--cy-amber)}
.card.p-low .tag-prio{color:var(--cy-cyan);border-color:var(--cy-cyan)}
.tag.tag-doing{color:var(--cy-amber);border-color:var(--cy-amber)}
.tag.late{
  color:var(--cy-red-text);
  border-color:var(--cy-red);
  font-weight:700;
}

.acts{
  margin-left:auto;
  display:flex;
  gap:4px;
}
.acts button{
  background:var(--cy-steel);
  border:1px solid var(--cy-border);
  width:30px;
  height:30px;
  cursor:pointer;
  color:var(--cy-text);
  font-size:15px;
  line-height:1;
  display:grid;
  place-items:center;
}
.acts button:hover:not(:disabled){
  border-color:var(--cy-cyan);
  color:var(--cy-cyan);
  background:var(--cy-void);
}
.acts button:disabled{
  opacity:.28;
  cursor:default;
}

.empty{
  color:var(--cy-text-2);
  font-size:13px;
  text-align:center;
  padding:20px 8px;
  border:1px dashed var(--cy-slate);
}

/* Week View */
[hidden]{display:none!important}
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
  align-items:start;
}
.week .col,.extra .col{padding:10px 8px}
.week .card{padding:9px;font-size:13px}
.week .card .t{font-size:14px}
.week .col-head{flex-wrap:wrap;gap:4px 6px}
.week .col-head h2{font-size:13px}
.dsub{
  font-size:12px;
  color:var(--cy-text-2);
}
.col.today{
  border-color:var(--cy-cyan);
  box-shadow:inset 0 0 0 1px rgba(0,240,255,.35);
}
.col.today .dsub{
  color:var(--cy-cyan);
  font-weight:700;
}
.addday{
  width:100%;
  margin-top:8px;
  background:transparent;
  border:1px dashed var(--cy-border);
  padding:7px 8px;
  color:var(--cy-text-2);
  cursor:pointer;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.addday:hover{
  color:var(--cy-cyan);
  border-color:var(--cy-cyan);
}
.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  margin-top:14px;
  align-items:start;
}

/* Responsive */
@media (max-width:1050px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .week,.extra,.board{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input[type=text]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
}
@media (max-width:480px){
  .wrap{padding:16px 12px 40px}
  .pg-grid{grid-template-columns:1fr;gap:12px}
  .pg-gauge{display:none}
  .add{grid-template-columns:1fr}
  .seg{width:100%}
  .seg button{flex:1 1 0;padding:8px 8px;font-size:12px}
}

/* Keyframes (slow ambient pulse < 1Hz, well below WCAG 2.3.1 3 flashes/s) */
@keyframes hudPulse{
  0%,100%{opacity:1}
  50%{opacity:.45}
}

/* Required Accessibility & Media Fallbacks */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}

@media (prefers-reduced-transparency:reduce){
  .scanlines{display:none}
  .progress,.col,.card{
    background:var(--cy-steel)!important;
    backdrop-filter:none!important;
  }
  .card{background:var(--cy-gunmetal)!important}
}

@media (forced-colors:active){
  .scanlines{display:none}
  .cy-glow{filter:none}
  .progress,.col,.card,.chip,.seg,.weeknav,.add,.add input,.add select,.acts button,.tag,.addday,.bar{
    background:Canvas!important;
    color:CanvasText!important;
    border:1px solid CanvasText!important;
    clip-path:none!important;
    box-shadow:none!important;
    backdrop-filter:none!important;
  }
  .btn::before{
    background:ButtonFace!important;
    border:1px solid ButtonText!important;
    clip-path:none!important;
  }
  .btn{color:ButtonText!important}
  .chip[aria-pressed="true"],.seg button[aria-pressed="true"]{
    background:Highlight!important;
    color:HighlightText!important;
    border-color:Highlight!important;
  }
  .bar span{background:Highlight!important}
  .pg-gauge .g-track{stroke:CanvasText!important}
  .pg-gauge .g-fill{stroke:Highlight!important}
  :focus-visible{outline:2px solid Highlight!important}
}
</style>
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<main class="wrap">
  <div class="hud-top" aria-hidden="true">
    <span class="hud-tag"><span class="hud-dot"></span>SYS.07 // TASK-OS ACTIVE</span>
    <span class="hud-jp">タスクボード // 任務管理</span>
  </div>

  <div class="title-row">
    <h1>Bảng công việc</h1>
  </div>
  <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>

  <div class="cy-glow">
    <section class="progress" aria-label="Tiến độ">
      <div class="pg-grid">
        <div class="pg-gauge" aria-hidden="true">
          <svg viewBox="0 0 72 72">
            <circle class="g-track" cx="36" cy="36" r="28"></circle>
            <circle class="g-fill" id="gFill" cx="36" cy="36" r="28"></circle>
          </svg>
        </div>
        <div class="pg-main">
          <div class="pg-top">
            <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
            <div class="pg-note" id="note"></div>
          </div>
          <div class="bar" aria-hidden="true"><span class="b-done" id="bDone"></span><span class="b-doing" id="bDoing"></span><span class="b-todo" id="bTodo"></span></div>
          <div class="pg-legend" aria-hidden="true">
            <span><i class="lg-done"></i>Hoàn thành</span>
            <span><i class="lg-doing"></i>Đang làm</span>
            <span><i class="lg-todo"></i>Cần làm</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="add">
    <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
    <select id="prio" aria-label="Mức ưu tiên">
      <option value="high">Ưu tiên cao</option>
      <option value="mid" selected>Ưu tiên vừa</option>
      <option value="low">Ưu tiên thấp</option>
    </select>
    <input type="date" id="due" aria-label="Hạn hoàn thành">
    <button class="btn" id="addBtn" type="button">Thêm việc</button>
  </div>

  <div class="controls">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>

    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="chip" id="thisW">Tuần này</button>
    <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</main>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var CIRC=2*Math.PI*28;
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag tag-prio",PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag tag-doing","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var gFill=document.getElementById("gFill");
    if(gFill){gFill.style.strokeDashoffset=String(CIRC*(1-pct/100))}
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  load();render();
})();
</script>
</body>
</html>
