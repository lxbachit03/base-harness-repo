<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  /* Glassmorphism reference tokens */
  --glass-fill:rgba(255,255,255,.15);
  --glass-fill-2:rgba(255,255,255,.25);
  --glass-fill-3:rgba(255,255,255,.40);
  --glass-fill-dark:rgba(17,25,40,.75);
  --glass-edge:rgba(255,255,255,.20);
  --glass-edge-2:rgba(255,255,255,.30);
  --glass-blur:12px;
  --glass-blur-heavy:20px;
  --glass-sat:150%;
  --glass-radius:16px;
  --glass-shadow:0 8px 32px rgba(0,0,0,.10);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,.50), inset 0 -1px 0 rgba(255,255,255,.10);
  --bg-cool:linear-gradient(135deg,#4a00e0,#2575fc);
  --bg-aurora:linear-gradient(135deg,#8e2de2,#00d2ff);
  --bg-dark:linear-gradient(135deg,#0f0c29,#302b63 50%,#24243e);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fw-body:500;

  /* Light theme surface & contrast-verified semantic tokens */
  --stage-bg:var(--bg-aurora);
  --blob-a:rgba(255,0,153,.48);
  --blob-b:rgba(0,210,255,.48);
  --blob-c:rgba(74,0,224,.40);
  --panel-fill:rgba(255,255,255,.78);
  --panel-fill-over:rgba(255,255,255,.90);
  --panel-edge:rgba(255,255,255,.62);
  --panel-highlight:var(--glass-highlight);
  --panel-shadow:var(--glass-shadow);
  --card-fill:rgba(255,255,255,.88);
  --card-drag-fill:rgba(255,255,255,.55);
  --card-edge:rgba(17,25,40,.16);
  --card-shadow:0 4px 16px rgba(17,25,40,.08), inset 0 1px 0 rgba(255,255,255,.75);
  --control-fill:rgba(255,255,255,.82);
  --control-border:rgba(17,25,40,.55);
  --chip-hover:rgba(255,255,255,.95);
  --track-bg:rgba(17,25,40,.16);

  --ink:#111927;
  --muted:#334155;
  --btn-bg:#3730a3;
  --btn-ink:#ffffff;
  --todo:#1e40af;
  --doing:#9a3412;
  --done:#065f46;
  --high:#991b1b;
  --mid:#9a3412;
  --low:#475569;
  --late-bg:rgba(153,27,27,.10);
  --today-fill:rgba(255,255,255,.88);
  --solid-panel:#f4f7fb;
  --solid-card:#ffffff;
  color-scheme:light;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stage-bg:var(--bg-dark);
    --blob-a:rgba(142,45,226,.38);
    --blob-b:rgba(0,210,255,.24);
    --blob-c:rgba(255,0,153,.22);
    --panel-fill:var(--glass-fill-dark);
    --panel-fill-over:rgba(23,34,54,.88);
    --panel-edge:var(--glass-edge);
    --panel-highlight:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.06);
    --panel-shadow:0 8px 32px rgba(0,0,0,.37);
    --card-fill:rgba(17,25,40,.84);
    --card-drag-fill:rgba(17,25,40,.52);
    --card-edge:rgba(255,255,255,.24);
    --card-shadow:0 6px 20px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.16);
    --control-fill:rgba(17,25,40,.72);
    --control-border:rgba(255,255,255,.45);
    --chip-hover:rgba(30,41,59,.92);
    --track-bg:rgba(255,255,255,.18);

    --ink:#ffffff;
    --muted:#cbd5e1;
    --btn-bg:#38bdf8;
    --btn-ink:#0f172a;
    --todo:#93c5fd;
    --doing:#fcd34d;
    --done:#6ee7b7;
    --high:#fca5a5;
    --mid:#fcd34d;
    --low:#cbd5e1;
    --late-bg:rgba(252,165,165,.14);
    --today-fill:rgba(22,33,56,.88);
    --solid-panel:#111928;
    --solid-card:#182235;
    color-scheme:dark;
  }
}

:root[data-theme="dark"]{
  --stage-bg:var(--bg-dark);
  --blob-a:rgba(142,45,226,.38);
  --blob-b:rgba(0,210,255,.24);
  --blob-c:rgba(255,0,153,.22);
  --panel-fill:var(--glass-fill-dark);
  --panel-fill-over:rgba(23,34,54,.88);
  --panel-edge:var(--glass-edge);
  --panel-highlight:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.06);
  --panel-shadow:0 8px 32px rgba(0,0,0,.37);
  --card-fill:rgba(17,25,40,.84);
  --card-drag-fill:rgba(17,25,40,.52);
  --card-edge:rgba(255,255,255,.24);
  --card-shadow:0 6px 20px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.16);
  --control-fill:rgba(17,25,40,.72);
  --control-border:rgba(255,255,255,.45);
  --chip-hover:rgba(30,41,59,.92);
  --track-bg:rgba(255,255,255,.18);

  --ink:#ffffff;
  --muted:#cbd5e1;
  --btn-bg:#38bdf8;
  --btn-ink:#0f172a;
  --todo:#93c5fd;
  --doing:#fcd34d;
  --done:#6ee7b7;
  --high:#fca5a5;
  --mid:#fcd34d;
  --low:#cbd5e1;
  --late-bg:rgba(252,165,165,.14);
  --today-fill:rgba(22,33,56,.88);
  --solid-panel:#111928;
  --solid-card:#182235;
  color-scheme:dark;
}

html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  min-height:100vh;
  font-family:var(--font);
  font-weight:var(--fw-body);
  line-height:1.5;
  color:var(--ink);
  background:var(--stage-bg);
  overflow-x:clip;
}

/* Fixed vivid backdrop and blurred ambient blobs sit behind .wrap (no backdrop-root trap) */
.stage-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background:var(--stage-bg);
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
}
.blob-1{width:380px;height:380px;top:-90px;left:-60px;background:var(--blob-a)}
.blob-2{width:360px;height:360px;top:18%;right:-80px;background:var(--blob-b)}
.blob-3{width:340px;height:340px;bottom:-100px;left:28%;background:var(--blob-c)}

.wrap{
  position:relative;
  z-index:1;
  max-width:1260px;
  margin:0 auto;
  padding:28px 20px 48px;
}

/* Key glass surfaces (heavier blur on hero/back panels, lighter on columns; never nested) */
.glass-panel{
  background:var(--panel-fill);
  border:1px solid var(--panel-edge);
  border-radius:var(--glass-radius);
  box-shadow:var(--panel-shadow),var(--panel-highlight);
  -webkit-backdrop-filter:blur(var(--glass-blur-heavy)) saturate(var(--glass-sat));
          backdrop-filter:blur(var(--glass-blur-heavy)) saturate(var(--glass-sat));
}
.col.glass-panel{
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
          backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
}

.hero-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  padding:24px 28px;
  margin-bottom:24px;
}
.hero-copy{min-width:0;flex:1 1 280px}
h1{
  font-size:clamp(26px,4.2vw,40px);
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.12;
  margin:0 0 6px;
}
.sub{margin:0;color:var(--muted);font-size:15px}
.head-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill-toggle{
  background:var(--control-fill);
  color:var(--ink);
  border:1px solid var(--control-border);
  border-radius:999px;
  padding:7px 14px;
  font:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:background .18s ease,border-color .18s ease,transform .15s ease;
}
.pill-toggle:hover{background:var(--chip-hover)}
.pill-toggle[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}

/* Progress glass card with SVG ring gauge + stacked status bar */
.progress{
  padding:24px 28px;
  margin-bottom:24px;
}
.pg-main{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.gauge{
  width:72px;
  height:72px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
}
.gauge svg{width:72px;height:72px;transform:rotate(-90deg)}
.gauge .g-track{fill:none;stroke:var(--track-bg);stroke-width:7}
.gauge .g-fill{fill:none;stroke:var(--done);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .35s ease}
.pg-info{flex:1 1 220px;min-width:0}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.pg-num{
  font-size:clamp(30px,5vw,46px);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
}
.pg-num small{
  font-size:.42em;
  font-weight:600;
  color:var(--muted);
  letter-spacing:0;
  margin-left:8px;
}
.pg-note{color:var(--muted);font-size:14px;font-weight:600}
.bar{
  display:flex;
  height:14px;
  border-radius:999px;
  overflow:hidden;
  background:var(--track-bg);
  gap:2px;
  padding:2px;
}
.bar span{
  display:block;
  min-width:0;
  border-radius:999px;
  transition:flex-grow .35s ease;
}
.bar .b-done{background:var(--done)}
.bar .b-doing{background:var(--doing)}
.bar .b-todo{background:var(--todo)}

/* Dock: add form, views, week navigation, priority filters */
.dock{
  padding:24px 28px;
  margin-bottom:24px;
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:10px;
  margin-bottom:16px;
}
input,select,button{font:inherit;color:inherit}
.add input,.add select{
  background:var(--control-fill);
  border:1px solid var(--control-border);
  border-radius:12px;
  padding:10px 14px;
  min-width:0;
  font-weight:500;
}
.add input::placeholder{color:var(--muted)}
.btn{
  background:var(--btn-bg);
  color:var(--btn-ink);
  border:1px solid var(--btn-bg);
  border-radius:12px;
  padding:10px 20px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s ease,box-shadow .18s ease;
}
.btn:hover{transform:translateY(-1px)}

:focus-visible{outline:3px solid var(--todo);outline-offset:2px}

.controls-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.views{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{
  display:inline-flex;
  background:var(--control-fill);
  border:1px solid var(--control-border);
  border-radius:12px;
  padding:3px;
  gap:3px;
}
.seg button{
  background:transparent;
  border:0;
  border-radius:9px;
  padding:7px 14px;
  cursor:pointer;
  color:var(--muted);
  font-weight:600;
  font-size:14px;
}
.seg button[aria-pressed="true"]{
  background:var(--btn-bg);
  color:var(--btn-ink);
  font-weight:700;
}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  background:var(--control-fill);
  border:1px solid var(--control-border);
  border-radius:999px;
  padding:6px 14px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  color:var(--muted);
  transition:background .15s ease,color .15s ease;
}
.chip:hover{background:var(--chip-hover);color:var(--ink)}
.chip[aria-pressed="true"]{
  background:var(--btn-bg);
  color:var(--btn-ink);
  border-color:var(--btn-bg);
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--panel-edge);
  flex-wrap:wrap;
}
.weeknav .lbl{font-weight:700;margin-left:4px;font-size:15px}

/* Board & week columns */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
  align-items:start;
}
.col{
  padding:20px;
  min-height:200px;
  min-width:0;
  transition:background .18s ease,border-color .18s ease;
}
.col.over{
  background:var(--panel-fill-over);
  border-color:var(--todo);
}
.col-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
}
.col-head i{
  width:11px;
  height:11px;
  border-radius:50%;
  display:block;
  flex:0 0 auto;
}
.col-head h2{font-size:16px;margin:0;font-weight:700}
.col-head .count{
  margin-left:auto;
  font-size:13px;
  font-weight:700;
  color:var(--ink);
  background:var(--control-fill);
  border:1px solid var(--control-border);
  border-radius:999px;
  padding:1px 9px;
}
.col[data-s="todo"] i{background:var(--todo)}
.col[data-s="doing"] i{background:var(--doing)}
.col[data-s="done"] i{background:var(--done)}

/* Cards sit on glass columns without nested backdrop-filter */
.card{
  background:var(--card-fill);
  border:1px solid var(--card-edge);
  border-left:5px solid var(--low);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:12px;
  box-shadow:var(--card-shadow);
  cursor:grab;
  min-width:0;
  transition:transform .15s ease,border-color .15s ease;
}
.card:last-child{margin-bottom:0}
.card:hover{transform:translateY(-1px)}
.card.p-high{border-left-color:var(--high)}
.card.p-mid{border-left-color:var(--mid)}
.card.p-low{border-left-color:var(--low)}
.card.dragging{background:var(--card-drag-fill);border-style:dashed}
.card .t{font-weight:600;overflow-wrap:anywhere}
.card.is-done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{
  font-size:12px;
  font-weight:600;
  border:1px solid var(--control-border);
  border-radius:7px;
  padding:2px 8px;
  color:var(--muted);
}
.tag.late{
  color:var(--high);
  border-color:var(--high);
  background:var(--late-bg);
  font-weight:700;
}
.acts{margin-left:auto;display:flex;gap:2px}
.acts button{
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  width:30px;
  height:30px;
  cursor:pointer;
  color:var(--muted);
  font-size:16px;
  font-weight:700;
  line-height:1;
}
.acts button:hover:not(:disabled){
  background:var(--control-fill);
  border-color:var(--control-border);
  color:var(--ink);
}
.acts button:disabled{color:var(--control-border);cursor:default}

.empty{
  color:var(--muted);
  font-size:14px;
  text-align:center;
  padding:20px 8px;
  border:1px dashed var(--control-border);
  border-radius:12px;
}

[hidden]{display:none!important}

/* Week view */
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:12px;
  align-items:start;
}
.week .col,.extra .col{padding:12px}
.week .card{padding:10px;font-size:14px}
.week .col-head{flex-wrap:wrap;gap:4px 6px}
.week .col-head h2{font-size:14px}
.dsub{font-size:13px;font-weight:600;color:var(--muted)}
.col.today{
  border-color:var(--todo);
  background:var(--today-fill);
}
.col.today .dsub{color:var(--todo);font-weight:700}
.addday{
  width:100%;
  margin-top:8px;
  background:transparent;
  border:1px dashed var(--control-border);
  border-radius:10px;
  padding:7px 8px;
  color:var(--muted);
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}
.addday:hover{color:var(--ink);border-color:var(--ink);background:var(--control-fill)}
.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:24px;
  margin-top:24px;
  align-items:start;
}

@media (max-width:1050px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .week,.extra,.board{grid-template-columns:1fr;gap:16px}
  .add{grid-template-columns:1fr 1fr}
  .add input[type=text]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
}
@media (max-width:480px){
  .wrap{padding:16px 12px 36px}
  .hero-head,.progress,.dock{padding:16px;margin-bottom:16px}
  .col{padding:14px}
  .add{grid-template-columns:1fr}
}

/* Required fallbacks */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass-panel{
    background:var(--solid-panel);
  }
  .card{
    background:var(--solid-card);
  }
}

@media (prefers-reduced-transparency:reduce){
  .stage-bg .blob{display:none}
  .glass-panel{
    background:var(--solid-panel);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  .card{background:var(--solid-card)}
}

:root[data-transparency="reduced"] .stage-bg .blob{display:none}
:root[data-transparency="reduced"] .glass-panel{
  background:var(--solid-panel);
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
}
:root[data-transparency="reduced"] .card{background:var(--solid-card)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

@media (forced-colors:active){
  .stage-bg{background:Canvas}
  .stage-bg .blob{display:none}
  .glass-panel,.card,.pill-toggle,.chip,.seg,.add input,.add select,.btn,.tag,.addday,.empty{
    background:Canvas;
    color:CanvasText;
    border:1px solid CanvasText;
    box-shadow:none;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  .btn,.chip[aria-pressed="true"],.seg button[aria-pressed="true"],.pill-toggle[aria-pressed="true"]{
    background:Highlight;
    color:HighlightText;
    border-color:Highlight;
  }
  .bar{background:Canvas;border:1px solid CanvasText}
  .bar span{background:Highlight}
  .col-head i{background:CanvasText}
  .gauge .g-track{stroke:CanvasText}
  .gauge .g-fill{stroke:Highlight}
}
</style>
</head>
<body>
<div class="stage-bg" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<main class="wrap">
  <header class="glass-panel hero-head">
    <div class="hero-copy">
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <div class="head-tools">
      <button class="pill-toggle" id="themeBtn" type="button" aria-pressed="false">Giao diện tối</button>
      <button class="pill-toggle" id="transBtn" type="button" aria-pressed="false">Giảm độ trong suốt</button>
    </div>
  </header>

  <section class="glass-panel progress" aria-label="Tiến độ">
    <div class="pg-main">
      <div class="gauge" aria-hidden="true">
        <svg viewBox="0 0 80 80">
          <circle class="g-track" cx="40" cy="40" r="32"></circle>
          <circle class="g-fill" id="gFill" cx="40" cy="40" r="32" stroke-dasharray="201.06" stroke-dashoffset="201.06"></circle>
        </svg>
      </div>
      <div class="pg-info">
        <div class="pg-top">
          <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
          <div class="pg-note" id="note"></div>
        </div>
      </div>
    </div>
    <div class="bar" aria-hidden="true"><span class="b-done" id="bDone"></span><span class="b-doing" id="bDoing"></span><span class="b-todo" id="bTodo"></span></div>
  </section>

  <section class="glass-panel dock" aria-label="Thêm và lọc công việc">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button class="btn" id="addBtn" type="button">Thêm việc</button>
    </div>

    <div class="controls-row">
      <div class="views">
        <div class="seg" role="group" aria-label="Chế độ xem">
          <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
          <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
        </div>
      </div>
      <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
        <button class="chip" type="button" data-f="all" aria-pressed="true">Tất cả</button>
        <button class="chip" type="button" data-f="high" aria-pressed="false">Cao</button>
        <button class="chip" type="button" data-f="mid" aria-pressed="false">Vừa</button>
        <button class="chip" type="button" data-f="low" aria-pressed="false">Thấp</button>
      </div>
    </div>

    <div class="weeknav" id="weeknav" hidden>
      <button class="chip" type="button" id="prevW" aria-label="Tuần trước">←</button>
      <button class="chip" type="button" id="thisW">Tuần này</button>
      <button class="chip" type="button" id="nextW" aria-label="Tuần sau">→</button>
      <span class="lbl" id="wlabel"></span>
    </div>
  </section>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</main>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme";
  var TRANS_KEY="bang-cong-viec-trans";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var CIRC=201.06;
  var tasks=[],filter="all",dragId=null;

  function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

  function initPrefs(){
    var root=document.documentElement;
    var savedTheme=safeGet(THEME_KEY);
    var prefersDark=false;
    try{prefersDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches}catch(e){}
    var isDark=savedTheme?savedTheme==="dark":prefersDark;
    if(savedTheme){root.setAttribute("data-theme",savedTheme)}
    var tBtn=document.getElementById("themeBtn");
    tBtn.setAttribute("aria-pressed",String(isDark));
    tBtn.textContent=isDark?"Giao diện sáng":"Giao diện tối";
    tBtn.onclick=function(){
      var curDark=root.getAttribute("data-theme")==="dark"||(!root.hasAttribute("data-theme")&&prefersDark);
      var next=curDark?"light":"dark";
      root.setAttribute("data-theme",next);
      safeSet(THEME_KEY,next);
      tBtn.setAttribute("aria-pressed",String(next==="dark"));
      tBtn.textContent=next==="dark"?"Giao diện sáng":"Giao diện tối";
    };

    var savedTrans=safeGet(TRANS_KEY);
    var isRed=savedTrans==="reduced";
    if(isRed){root.setAttribute("data-transparency","reduced")}
    var rBtn=document.getElementById("transBtn");
    rBtn.setAttribute("aria-pressed",String(isRed));
    rBtn.onclick=function(){
      var nextRed=root.getAttribute("data-transparency")!=="reduced";
      if(nextRed){root.setAttribute("data-transparency","reduced");safeSet(TRANS_KEY,"reduced")}
      else{root.removeAttribute("data-transparency");safeSet(TRANS_KEY,"glass")}
      rBtn.setAttribute("aria-pressed",String(nextRed));
    };
  }

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag",PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col glass-panel");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("gFill").setAttribute("stroke-dashoffset",String(CIRC-(CIRC*pct/100)));
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col glass-panel"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip[data-f]").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip[data-f]").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  initPrefs();load();render();
})();
</script>
</body>
</html>
