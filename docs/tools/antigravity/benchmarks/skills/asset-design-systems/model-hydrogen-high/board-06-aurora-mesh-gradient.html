<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --au-midnight:#0b0d1a;
  --au-base:#05010f;
  --au-space:#111827;
  --au-cosmic:#1e1b4b;
  --au-purple:#7c3aed;
  --au-violet:#a855f7;
  --au-pink:#ec4899;
  --au-rose:#f472b6;
  --au-rose-text:#f9a8d4;
  --au-violet-text:#c4b5fd;
  --au-blue:#3b82f6;
  --au-blue-text:#93c5fd;
  --au-cyan:#06b6d4;
  --au-green:#10b981;
  --au-mint:#34d399;
  --au-teal:#2dd4bf;
  --au-text:#e0e7ff;
  --au-text-2:#a5b4fc;
  --au-text-bright:#f8fafc;
  --au-panel:rgba(10,8,20,.72);
  --au-panel-solid:rgba(11,13,26,.92);
  --au-panel-edge:rgba(224,231,255,.20);
  --au-control-edge:rgba(224,231,255,.45);
  --au-card:rgba(11,13,26,.82);
  --au-card-edge:rgba(224,231,255,.18);
  --au-blur:14px;
  --au-orb-blur:80px;
  --au-drift:18s;
  --au-radius:18px;
  --au-radius-sm:12px;
  --font:"Sora","Inter","Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --section-gap:clamp(16px,2.4vw,24px);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background-color:var(--au-base);
  color:var(--au-text);
  font-family:var(--font);
  font-weight:400;
  line-height:1.55;
  letter-spacing:.005em;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}

/* Single ambient aurora layer behind all panels (sibling to .wrap to avoid backdrop-root trap) */
.aurora-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background-color:var(--au-base);
  background-image:
    radial-gradient(40% 50% at 20% 30%,rgba(99,102,241,.55),transparent 70%),
    radial-gradient(45% 55% at 75% 25%,rgba(45,212,191,.45),transparent 70%),
    radial-gradient(50% 60% at 60% 75%,rgba(236,72,153,.40),transparent 70%),
    radial-gradient(40% 50% at 30% 80%,rgba(139,92,246,.45),transparent 70%);
}
.aurora-bg::before{
  content:"";
  position:absolute;
  inset:-20%;
  background:conic-gradient(from 120deg at 50% 30%,#3a29ff,#2dd4bf,#ec4899,#8b5cf6,#3a29ff);
  filter:blur(var(--au-orb-blur)) saturate(1.4);
  opacity:.55;
  animation:drift var(--au-drift) ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate3d(-4%,-2%,0) rotate(0deg)}
  to{transform:translate3d(4%,3%,0) rotate(8deg)}
}

.wrap{
  position:relative;
  z-index:1;
  max-width:1240px;
  margin:0 auto;
  padding:24px 20px 48px;
}

/* Glass panels carry all text */
.aurora-panel{
  position:relative;
  background:var(--au-panel);
  border:1px solid var(--au-panel-edge);
  border-radius:var(--au-radius);
  color:var(--au-text);
  box-shadow:0 16px 40px rgba(5,1,15,.45),inset 0 1px 0 rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(var(--au-blur)) saturate(1.35);
  backdrop-filter:blur(var(--au-blur)) saturate(1.35);
  min-width:0;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .aurora-panel{background:var(--au-panel-solid)}
}

.top-grid{
  display:grid;
  grid-template-columns:1.15fr 1fr;
  gap:var(--section-gap);
  margin-bottom:var(--section-gap);
  align-items:stretch;
}

.hero{
  padding:22px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.hero-copy{min-width:0}
h1{
  margin:0 0 8px;
  font-size:clamp(28px,4.2vw,42px);
  font-weight:600;
  letter-spacing:-.025em;
  line-height:1.15;
  background:linear-gradient(135deg,#c4b5fd,#f9a8d4 38%,#93c5fd 70%,#2dd4bf);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.sub{
  margin:0;
  color:var(--au-text-2);
  font-size:15px;
  font-weight:400;
}
.hero-orb{
  flex:0 0 auto;
  width:56px;
  height:56px;
}

/* Progress panel */
.progress{
  padding:20px 24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:14px;
}
.pg-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
.pg-stat{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}
.pg-ring{
  width:52px;
  height:52px;
  flex:0 0 auto;
}
.pg-num{
  font-size:clamp(28px,4vw,40px);
  font-weight:600;
  letter-spacing:-.03em;
  line-height:1;
  color:var(--au-text-bright);
}
.pg-num small{
  display:block;
  margin-top:6px;
  font-size:13px;
  font-weight:500;
  color:var(--au-text-2);
  letter-spacing:0;
}
.pg-note{
  color:var(--au-text);
  font-size:14px;
  font-weight:500;
  text-align:right;
}
.bar{
  display:flex;
  height:12px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(11,13,26,.85);
  border:1px solid var(--au-control-edge);
  gap:2px;
  padding:1px;
}
.bar span{
  display:block;
  min-width:0;
  border-radius:999px;
  transition:flex-grow .35s ease;
}
.bar .b-done{background:var(--au-teal)}
.bar .b-doing{background:var(--au-rose)}
.bar .b-todo{background:var(--au-blue)}
.pg-legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--au-text-2);
}
.pg-legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.pg-legend i{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
}

/* Controls panel */
.controls{
  padding:18px 20px;
  margin-bottom:var(--section-gap);
  display:flex;
  flex-direction:column;
  gap:14px;
}
.add{
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:10px;
}
input,select,button{
  font:inherit;
  color:inherit;
}
.add input,.add select{
  background:var(--au-card);
  border:1px solid var(--au-control-edge);
  border-radius:var(--au-radius-sm);
  padding:10px 14px;
  color:var(--au-text-bright);
  min-width:0;
  font-size:14px;
}
.add input::placeholder{color:var(--au-text-2)}
.add select option{
  background:var(--au-midnight);
  color:var(--au-text-bright);
}
.btn{
  background:var(--au-teal);
  color:var(--au-base);
  border:1px solid var(--au-teal);
  border-radius:var(--au-radius-sm);
  padding:10px 20px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  transition:filter .15s ease,transform .15s ease;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}

:focus-visible{
  outline:3px solid var(--au-teal);
  outline-offset:2px;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.views{display:flex;align-items:center}
.seg{
  display:inline-flex;
  background:var(--au-card);
  border:1px solid var(--au-control-edge);
  border-radius:var(--au-radius-sm);
  padding:3px;
  gap:4px;
  max-width:100%;
}
.seg button{
  background:transparent;
  border:0;
  border-radius:9px;
  padding:7px 14px;
  cursor:pointer;
  color:var(--au-text-2);
  font-size:14px;
  font-weight:500;
  transition:background .15s ease,color .15s ease;
}
.seg button:hover{color:var(--au-text-bright)}
.seg button[aria-pressed="true"]{
  background:var(--au-text);
  color:var(--au-midnight);
  font-weight:600;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.chip{
  background:var(--au-card);
  border:1px solid var(--au-control-edge);
  border-radius:999px;
  padding:6px 14px;
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  color:var(--au-text-2);
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.chip:hover{
  color:var(--au-text-bright);
  border-color:var(--au-text);
}
.chip[aria-pressed="true"]{
  background:var(--au-text);
  color:var(--au-midnight);
  border-color:var(--au-text);
  font-weight:600;
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding-top:12px;
  border-top:1px solid var(--au-panel-edge);
}
.weeknav .lbl{
  font-weight:600;
  font-size:14px;
  color:var(--au-text-bright);
  margin-left:4px;
  min-width:0;
}

/* Board and columns */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  align-items:start;
}
.col{
  padding:14px;
  min-height:200px;
  transition:background .15s ease,border-color .15s ease;
}
.col.over{
  background:rgba(17,24,39,.86);
  border-color:var(--au-teal);
}
.col-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin:2px 2px 14px;
}
.col-head i{
  width:10px;
  height:10px;
  border-radius:50%;
  display:block;
  flex:0 0 auto;
}
.col[data-s="todo"] .col-head i{background:var(--au-blue);box-shadow:0 0 10px var(--au-blue)}
.col[data-s="doing"] .col-head i{background:var(--au-rose);box-shadow:0 0 10px var(--au-rose)}
.col[data-s="done"] .col-head i{background:var(--au-teal);box-shadow:0 0 10px var(--au-teal)}
.col-head h2{
  font-size:15px;
  margin:0;
  font-weight:600;
  color:var(--au-text-bright);
  letter-spacing:.01em;
}
.col-head .count{
  margin-left:auto;
  font-size:12px;
  font-weight:600;
  color:var(--au-text);
  background:var(--au-card);
  border:1px solid var(--au-control-edge);
  border-radius:999px;
  padding:1px 9px;
}

/* Task cards (no backdrop-filter on cards/badges to keep performance high and avoid nested blur) */
.card{
  background:var(--au-card);
  border:1px solid var(--au-card-edge);
  border-left:4px solid var(--au-control-edge);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:10px;
  cursor:grab;
  transition:border-color .15s ease,transform .15s ease;
}
.card:last-child{margin-bottom:0}
.card:hover{border-color:var(--au-control-edge)}
.card.p-high{border-left-color:var(--au-rose)}
.card.p-mid{border-left-color:var(--au-violet)}
.card.p-low{border-left-color:var(--au-teal)}
.card.dragging{opacity:.45}
.card .t{
  font-weight:500;
  font-size:14px;
  color:var(--au-text-bright);
  overflow-wrap:anywhere;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--au-text-2);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  font-size:12px;
  font-weight:500;
  border:1px solid var(--au-control-edge);
  border-radius:7px;
  padding:2px 8px;
  color:var(--au-text-2);
  background:rgba(5,1,15,.45);
}
.tag.prio-high{color:var(--au-rose-text);border-color:var(--au-rose)}
.tag.prio-mid{color:var(--au-violet-text);border-color:var(--au-violet)}
.tag.prio-low{color:var(--au-teal);border-color:var(--au-teal)}
.tag.late{
  color:var(--au-rose-text);
  border-color:var(--au-rose);
  font-weight:600;
}

.acts{
  margin-left:auto;
  display:flex;
  gap:2px;
}
.acts button{
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  width:30px;
  height:30px;
  cursor:pointer;
  color:var(--au-text-2);
  font-size:15px;
  line-height:1;
  display:inline-grid;
  place-items:center;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.acts button:hover:not(:disabled){
  background:rgba(224,231,255,.12);
  border-color:var(--au-control-edge);
  color:var(--au-text-bright);
}
.acts button:disabled{
  opacity:.30;
  cursor:default;
}

.empty{
  color:var(--au-text-2);
  font-size:13px;
  text-align:center;
  padding:20px 8px;
  border:1px dashed var(--au-control-edge);
  border-radius:var(--au-radius-sm);
}

/* Week view */
[hidden]{display:none!important}
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
  align-items:start;
}
.week .col,.extra .col{padding:12px}
.week .card{padding:10px 11px;font-size:13px}
.week .col-head{flex-wrap:wrap;gap:3px 6px}
.week .col-head h2{font-size:14px}
.dsub{
  font-size:12px;
  color:var(--au-text-2);
  font-weight:500;
}
.col.today{
  border-color:var(--au-teal);
  box-shadow:0 0 0 1px rgba(45,212,191,.35),0 16px 40px rgba(5,1,15,.45);
}
.col.today .dsub{
  color:var(--au-teal);
  font-weight:600;
}
.addday{
  width:100%;
  margin-top:8px;
  background:rgba(11,13,26,.55);
  border:1px dashed var(--au-control-edge);
  border-radius:10px;
  padding:7px 10px;
  color:var(--au-text-2);
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  transition:color .15s ease,border-color .15s ease,background .15s ease;
}
.addday:hover{
  color:var(--au-text-bright);
  border-color:var(--au-teal);
  background:rgba(11,13,26,.85);
}
.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:16px;
  align-items:start;
}

@media (max-width:1100px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .top-grid{grid-template-columns:1fr}
  .pg-note{text-align:left}
}
@media (max-width:820px){
  .week,.extra,.board{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input[type=text]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
}
@media (max-width:480px){
  .wrap{padding:16px 14px 36px}
  .hero,.progress,.controls{padding:16px}
  .add{grid-template-columns:1fr}
  .seg{width:100%}
  .seg button{flex:1 1 0;padding:8px 10px;font-size:13px}
}

@media (prefers-reduced-motion:reduce){
  .aurora-bg::before{animation:none}
  *,*::before,*::after{transition:none!important;animation:none!important}
}

@media (prefers-reduced-transparency:reduce){
  .aurora-bg::before{opacity:.25;filter:blur(var(--au-orb-blur))}
  .aurora-panel{
    background:rgba(11,13,26,.95);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  .card{background:var(--au-midnight)}
}

@media (forced-colors:active){
  .aurora-bg{display:none}
  body{background:Canvas;color:CanvasText}
  .aurora-panel,.card,.add input,.add select,.chip,.seg,.addday{
    background:Canvas;
    color:CanvasText;
    border-color:CanvasText;
    box-shadow:none;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  h1{
    background:none;
    -webkit-background-clip:border-box;
    background-clip:border-box;
    color:CanvasText;
  }
  .sub,.pg-note,.pg-num small,.pg-legend,.dsub,.empty,.tag,.acts button{color:CanvasText}
  .btn,.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{
    background:Highlight;
    color:HighlightText;
    border-color:Highlight;
  }
  .bar{background:Canvas;border-color:CanvasText}
  .bar .b-done,.bar .b-doing,.bar .b-todo{background:Highlight}
  .col.today,.col.over{border-color:Highlight}
  .card.p-high,.card.p-mid,.card.p-low{border-left-color:Highlight}
}
</style>
</head>
<body>
<div class="aurora-bg" aria-hidden="true"></div>
<div class="wrap">
  <div class="top-grid">
    <header class="aurora-panel hero">
      <div class="hero-copy">
        <h1>Bảng công việc</h1>
        <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
      </div>
      <svg class="hero-orb" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="auOrb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c4b5fd"/>
            <stop offset="50%" stop-color="#f9a8d4"/>
            <stop offset="100%" stop-color="#2dd4bf"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="26" stroke="url(#auOrb)" stroke-width="2" stroke-opacity=".75"/>
        <circle cx="32" cy="32" r="16" stroke="url(#auOrb)" stroke-width="2" stroke-dasharray="5 5"/>
        <circle cx="32" cy="32" r="5" fill="#2dd4bf"/>
      </svg>
    </header>

    <section class="aurora-panel progress" aria-label="Tiến độ">
      <div class="pg-top">
        <div class="pg-stat">
          <svg class="pg-ring" viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="21" fill="none" stroke="rgba(224,231,255,.22)" stroke-width="4.5"/>
            <circle id="ringArc" cx="26" cy="26" r="21" fill="none" stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="131.95" stroke-dashoffset="131.95" transform="rotate(-90 26 26)"/>
          </svg>
          <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
        </div>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="bar" aria-hidden="true"><span class="b-done" id="bDone"></span><span class="b-doing" id="bDoing"></span><span class="b-todo" id="bTodo"></span></div>
      <div class="pg-legend" aria-hidden="true">
        <span><i style="background:var(--au-teal)"></i>Hoàn thành</span>
        <span><i style="background:var(--au-rose)"></i>Đang làm</span>
        <span><i style="background:var(--au-blue)"></i>Cần làm</span>
      </div>
    </section>
  </div>

  <section class="aurora-panel controls" aria-label="Thêm và lọc công việc">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button class="btn" id="addBtn">Thêm việc</button>
    </div>

    <div class="toolbar">
      <div class="views">
        <div class="seg" role="group" aria-label="Chế độ xem">
          <button data-v="board" aria-pressed="true">Theo trạng thái</button>
          <button data-v="week" aria-pressed="false">Theo tuần</button>
        </div>
      </div>
      <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
        <button class="chip" data-f="all" aria-pressed="true">Tất cả</button>
        <button class="chip" data-f="high" aria-pressed="false">Cao</button>
        <button class="chip" data-f="mid" aria-pressed="false">Vừa</button>
        <button class="chip" data-f="low" aria-pressed="false">Thấp</button>
      </div>
    </div>

    <div class="weeknav" id="weeknav" hidden>
      <button class="chip" id="prevW" aria-label="Tuần trước">←</button>
      <button class="chip" id="thisW">Tuần này</button>
      <button class="chip" id="nextW" aria-label="Tuần sau">→</button>
      <span class="lbl" id="wlabel"></span>
    </div>
  </section>

  <main>
    <div class="board" id="board"></div>
    <div class="week" id="week" hidden></div>
    <div class="extra" id="extra" hidden></div>
  </main>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var RING_C=2*Math.PI*21;
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","aurora-panel col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("ringArc").style.strokeDashoffset=(RING_C*(1-pct/100)).toFixed(2);
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","aurora-panel col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  load();render();
})();
</script>
</body>
</html>
