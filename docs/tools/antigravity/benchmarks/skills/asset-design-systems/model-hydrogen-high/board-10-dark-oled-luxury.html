<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --lx-obsidian:#0a0a0a;
  --lx-onyx:#111111;
  --lx-charcoal:#1a1a1a;
  --lx-graphite:#252525;
  --lx-smoke:#333333;
  --lx-black:#000000;
  --lx-gold:#d4af37;
  --lx-gold-antique:#c5a258;
  --lx-gold-pale:#e8d48b;
  --lx-rose:#b76e79;
  --lx-rose-text:#c9858f;
  --lx-ivory:#f5f0e1;
  --lx-warm-white:#e8e0d0;
  --lx-muted:#a89d8c;
  --lx-muted-base:#8a8070;
  --lx-burgundy:#6b1024;
  --lx-emerald:#1b5e3b;
  --lx-sapphire:#1a3a5c;
  --lx-done:#5c9e78;
  --lx-doing:#d4af37;
  --lx-todo:#7da0c4;
  --lx-border:rgba(255,255,255,.12);
  --lx-gold-line:rgba(212,175,55,.35);
  --lx-ui-border:rgba(212,175,55,.55);
  --lx-control-border:rgba(255,255,255,.38);
  --lx-spot:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.14),transparent 62%);
  --lx-shadow:0 12px 32px rgba(0,0,0,.55),0 2px 10px rgba(212,175,55,.05);
  --lx-shadow-card:0 6px 20px rgba(0,0,0,.45),0 1px 0 rgba(212,175,55,.06);
  --lx-cta-bg:#d4af37;
  --lx-cta-fg:#0a0a0a;
  --lx-late-bg:rgba(107,16,36,.42);
  --lx-today-bg:rgba(212,175,55,.07);
  --font-display:"Playfair Display","Bodoni Moda","Cormorant Garamond",Georgia,serif;
  --font-body:"Montserrat","Raleway",Inter,system-ui,-apple-system,sans-serif;
  --section-gap:clamp(28px,4vw,44px);
  --pad-block:clamp(24px,4vw,44px);
  --max:1160px;
  --radius-panel:4px;
  --radius-card:3px;
  --radius-pill:999px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  color-scheme:light;
  --lx-obsidian:#faf6ee;
  --lx-onyx:#f2ece0;
  --lx-charcoal:#ffffff;
  --lx-graphite:#ebe3d3;
  --lx-smoke:#dfd5c3;
  --lx-black:#e5dccb;
  --lx-gold:#8a6914;
  --lx-gold-antique:#785a10;
  --lx-gold-pale:#5e450a;
  --lx-rose:#9a3846;
  --lx-rose-text:#9a3846;
  --lx-ivory:#1a1714;
  --lx-warm-white:#302a23;
  --lx-muted:#61584c;
  --lx-muted-base:#61584c;
  --lx-done:#226644;
  --lx-doing:#8a6914;
  --lx-todo:#2b5480;
  --lx-border:rgba(26,23,20,.14);
  --lx-gold-line:rgba(138,105,20,.38);
  --lx-ui-border:rgba(138,105,20,.65);
  --lx-control-border:rgba(26,23,20,.42);
  --lx-spot:radial-gradient(ellipse at 50% 0%,rgba(138,105,20,.10),transparent 60%);
  --lx-shadow:0 12px 28px rgba(26,23,20,.08),0 1px 0 rgba(138,105,20,.12);
  --lx-shadow-card:0 4px 14px rgba(26,23,20,.06);
  --lx-cta-bg:#8a6914;
  --lx-cta-fg:#faf6ee;
  --lx-late-bg:rgba(154,56,70,.08);
  --lx-today-bg:rgba(138,105,20,.08);
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}

body{
  margin:0;
  min-height:100vh;
  background-color:var(--lx-obsidian);
  background-image:var(--lx-spot);
  color:var(--lx-ivory);
  font-family:var(--font-body);
  font-weight:400;
  font-size:15px;
  line-height:1.6;
  letter-spacing:.02em;
  position:relative;
  overflow-x:clip;
}

.lx-velvet::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  mix-blend-mode:overlay;
  opacity:.04;
  z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
:root[data-theme="light"] .lx-velvet::after{opacity:.025}

.wrap{
  position:relative;
  z-index:1;
  max-width:var(--max);
  margin:0 auto;
  padding:var(--pad-block) clamp(14px,3.5vw,28px) clamp(48px,6vw,72px);
}

/* Editorial Header */
.hdr{
  text-align:center;
  margin-bottom:var(--section-gap);
  position:relative;
}
.hdr-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:1px solid var(--lx-border);
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--lx-gold-antique);
}
.theme-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--lx-onyx);
  color:var(--lx-warm-white);
  border:1px solid var(--lx-ui-border);
  border-radius:var(--radius-pill);
  padding:6px 14px;
  font-size:12px;
  font-weight:500;
  letter-spacing:.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.theme-btn:hover{
  background:var(--lx-graphite);
  border-color:var(--lx-gold);
  color:var(--lx-ivory);
}

h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(32px,5.2vw,54px);
  line-height:1.12;
  letter-spacing:.01em;
  margin:0 0 10px;
  color:var(--lx-gold);
}
@supports ((background-clip:text) or (-webkit-background-clip:text)){
  :root:not([data-theme="light"]) .lx-gold-text{
    background:linear-gradient(135deg,#bf953f,#fcf6ba 30%,#b38728 50%,#fbf5b7 70%,#aa771c);
    -webkit-background-clip:text;
    background-clip:text;
    color:var(--lx-gold);
    -webkit-text-fill-color:transparent;
  }
}
.sub{
  color:var(--lx-warm-white);
  font-weight:300;
  font-size:15px;
  max-width:56ch;
  margin:0 auto 18px;
}
.ornament{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  color:var(--lx-gold);
}
.ornament::before,.ornament::after{
  content:"";
  height:1px;
  width:clamp(44px,12vw,120px);
  background:linear-gradient(90deg,transparent,var(--lx-gold-line),var(--lx-gold));
}
.ornament::after{
  background:linear-gradient(90deg,var(--lx-gold),var(--lx-gold-line),transparent);
}

/* Progress Atelier Card (.lx-frame double border) */
.progress{
  background:var(--lx-charcoal);
  border:1px solid var(--lx-ui-border);
  outline:1px solid var(--lx-gold-line);
  outline-offset:5px;
  border-radius:var(--radius-panel);
  padding:clamp(18px,3vw,26px) clamp(18px,3.5vw,30px);
  margin-bottom:var(--section-gap);
  box-shadow:var(--lx-shadow);
}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px 20px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.pg-num{
  font-family:var(--font-display);
  font-size:clamp(34px,5.5vw,52px);
  font-weight:600;
  line-height:1;
  color:var(--lx-gold);
  font-variant-numeric:tabular-nums;
}
.pg-num small{
  font-family:var(--font-body);
  font-size:13px;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--lx-muted);
  margin-left:12px;
}
.pg-note{
  color:var(--lx-warm-white);
  font-size:14px;
  font-weight:400;
}
.bar{
  display:flex;
  height:14px;
  border-radius:2px;
  overflow:hidden;
  background:var(--lx-black);
  border:1px solid var(--lx-ui-border);
  padding:2px;
  gap:3px;
}
.bar span{
  display:block;
  min-width:0;
  border-radius:1px;
  transition:flex-grow .35s ease;
}
.bar .b-done{background:var(--lx-done)}
.bar .b-doing{background:var(--lx-doing)}
.bar .b-todo{background:var(--lx-todo)}

.pg-legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  margin-top:12px;
  font-size:12px;
  color:var(--lx-muted);
  letter-spacing:.04em;
}
.pg-legend span{
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.pg-legend i{
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
}
.lg-done{background:var(--lx-done)}
.lg-doing{background:var(--lx-doing)}
.lg-todo{background:var(--lx-todo)}

/* Composer / Add Form */
.add{
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:10px;
  background:var(--lx-onyx);
  border:1px solid var(--lx-ui-border);
  border-radius:var(--radius-panel);
  padding:14px;
  margin-bottom:18px;
  box-shadow:var(--lx-shadow-card);
}
input,select,button{font:inherit;color:inherit}
.add input,.add select{
  background:var(--lx-charcoal);
  color:var(--lx-ivory);
  border:1px solid var(--lx-control-border);
  border-radius:var(--radius-card);
  padding:10px 13px;
  min-width:0;
  min-height:42px;
  transition:border-color .2s ease,background-color .2s ease;
}
.add input::placeholder{color:var(--lx-muted)}
.add input:hover,.add select:hover{border-color:var(--lx-gold)}
.add input:focus,.add select:focus{
  background:var(--lx-graphite);
  border-color:var(--lx-gold);
}
.btn{
  background:var(--lx-cta-bg);
  color:var(--lx-cta-fg);
  border:1px solid var(--lx-gold);
  border-radius:var(--radius-card);
  padding:10px 22px;
  min-height:42px;
  font-weight:600;
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background-color .2s ease,transform .15s ease;
}
.btn:hover{background:var(--lx-gold-pale);color:#0a0a0a}
.btn:active{transform:translateY(1px)}

:focus-visible{
  outline:2px solid var(--lx-gold);
  outline-offset:2px;
}

/* Toolbar: Views, Week Nav, Filters */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px 18px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.views{margin:0}
.seg{
  display:inline-flex;
  background:var(--lx-onyx);
  border:1px solid var(--lx-ui-border);
  border-radius:var(--radius-card);
  padding:3px;
  gap:3px;
}
.seg button{
  background:transparent;
  border:0;
  border-radius:2px;
  padding:7px 16px;
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  letter-spacing:.04em;
  color:var(--lx-muted);
  transition:background-color .2s ease,color .2s ease;
}
.seg button:hover{color:var(--lx-ivory)}
.seg button[aria-pressed="true"]{
  background:var(--lx-cta-bg);
  color:var(--lx-cta-fg);
  font-weight:600;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.chip{
  background:var(--lx-onyx);
  border:1px solid var(--lx-control-border);
  border-radius:var(--radius-pill);
  padding:6px 15px;
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  color:var(--lx-warm-white);
  transition:background-color .2s ease,border-color .2s ease,color .2s ease;
}
.chip:hover{
  border-color:var(--lx-gold);
  color:var(--lx-ivory);
  background:var(--lx-charcoal);
}
.chip[aria-pressed="true"]{
  background:var(--lx-cta-bg);
  color:var(--lx-cta-fg);
  border-color:var(--lx-gold);
  font-weight:600;
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.weeknav .lbl{
  font-family:var(--font-display);
  font-size:18px;
  font-weight:500;
  color:var(--lx-gold-pale);
  margin-left:6px;
}

/* Board & Columns */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  align-items:start;
}
.col{
  background:var(--lx-onyx);
  border:1px solid var(--lx-ui-border);
  border-radius:var(--radius-panel);
  padding:14px;
  min-height:210px;
  min-width:0;
  transition:background-color .2s ease,border-color .2s ease;
}
.col.over{
  background:var(--lx-charcoal);
  border-color:var(--lx-gold);
  box-shadow:0 0 0 1px var(--lx-gold);
}
.col-head{
  display:flex;
  align-items:center;
  gap:9px;
  padding-bottom:11px;
  margin:0 0 13px;
  border-bottom:1px solid var(--lx-border);
}
.col-head i{
  width:9px;
  height:9px;
  border-radius:50%;
  flex-shrink:0;
  display:block;
}
.col[data-s="todo"] .col-head i{background:var(--lx-todo)}
.col[data-s="doing"] .col-head i{background:var(--lx-doing)}
.col[data-s="done"] .col-head i{background:var(--lx-done)}
.col-head h2{
  font-family:var(--font-display);
  font-size:18px;
  font-weight:600;
  margin:0;
  color:var(--lx-ivory);
}
.col-head .count{
  margin-left:auto;
  font-size:12px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  color:var(--lx-gold-pale);
  background:var(--lx-charcoal);
  border:1px solid var(--lx-ui-border);
  border-radius:var(--radius-pill);
  padding:1px 10px;
}

/* Cards */
.card{
  background:var(--lx-charcoal);
  border:1px solid var(--lx-control-border);
  border-left:4px solid var(--lx-muted);
  border-radius:var(--radius-card);
  padding:12px 13px;
  margin-bottom:11px;
  box-shadow:var(--lx-shadow-card);
  cursor:grab;
  min-width:0;
  transition:background-color .2s ease,border-color .2s ease,transform .15s ease;
}
.card:hover{
  background:var(--lx-graphite);
  border-color:var(--lx-gold);
}
.card.p-high{border-left-color:var(--lx-rose-text)}
.card.p-mid{border-left-color:var(--lx-gold)}
.card.p-low{border-left-color:var(--lx-muted)}
.card.dragging{opacity:.45;cursor:grabbing}
.card .t{
  font-weight:500;
  color:var(--lx-ivory);
  overflow-wrap:anywhere;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--lx-muted);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  font-size:11px;
  font-weight:500;
  letter-spacing:.04em;
  border:1px solid var(--lx-control-border);
  border-radius:2px;
  padding:2px 8px;
  color:var(--lx-warm-white);
  background:var(--lx-onyx);
}
.tag.late{
  color:var(--lx-rose-text);
  border-color:var(--lx-rose-text);
  background:var(--lx-late-bg);
  font-weight:600;
}

.acts{
  margin-left:auto;
  display:flex;
  gap:3px;
}
.acts button{
  background:transparent;
  border:1px solid transparent;
  border-radius:2px;
  width:30px;
  height:30px;
  cursor:pointer;
  color:var(--lx-warm-white);
  font-size:15px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease;
}
.acts button:hover:not(:disabled){
  background:var(--lx-onyx);
  border-color:var(--lx-gold);
  color:var(--lx-gold-pale);
}
.acts button:disabled{
  opacity:.35;
  cursor:default;
}

.empty{
  color:var(--lx-muted);
  font-size:13px;
  font-style:italic;
  text-align:center;
  padding:22px 8px;
}

/* Week View */
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
  align-items:start;
}
.week .col,.extra .col{padding:10px}
.week .card{padding:9px 10px;font-size:14px}
.week .col-head{flex-wrap:wrap;gap:3px 6px}
.week .col-head h2{font-size:15px}
.dsub{
  font-size:12px;
  color:var(--lx-muted);
  font-variant-numeric:tabular-nums;
}
.col.today{
  border-color:var(--lx-gold);
  background:linear-gradient(180deg,var(--lx-today-bg),var(--lx-onyx) 45%);
}
.col.today .dsub{
  color:var(--lx-gold-pale);
  font-weight:600;
}
.addday{
  width:100%;
  background:transparent;
  border:1px dashed var(--lx-ui-border);
  border-radius:var(--radius-card);
  padding:7px 8px;
  color:var(--lx-gold-pale);
  cursor:pointer;
  font-size:12px;
  font-weight:500;
  letter-spacing:.04em;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease;
}
.addday:hover{
  background:var(--lx-charcoal);
  border-color:var(--lx-gold);
  color:var(--lx-ivory);
}
.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:16px;
  align-items:start;
}

/* Responsive (including 400px mobile check) */
@media (max-width:1080px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .week,.extra,.board{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input[type=text]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
}
@media (max-width:440px){
  .add{grid-template-columns:1fr}
  .seg{width:100%}
  .seg button{flex:1;padding:8px 10px}
}

/* Reduced Motion, Reduced Transparency, Forced Colors */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
  }
}
@media (prefers-reduced-transparency:reduce){
  .lx-velvet::after{display:none!important}
  body{background-image:none}
  :root{
    --lx-border:#404040;
    --lx-gold-line:#8f7529;
    --lx-ui-border:#a8892f;
    --lx-control-border:#6e6e6e;
    --lx-late-bg:#4d0c1a;
    --lx-today-bg:#1c1910;
  }
  :root[data-theme="light"]{
    --lx-border:#c9bfa9;
    --lx-gold-line:#8a6914;
    --lx-ui-border:#8a6914;
    --lx-control-border:#70685b;
    --lx-late-bg:#f7e4e7;
    --lx-today-bg:#f3ead2;
  }
}
@media (forced-colors:active){
  .lx-velvet::after{display:none!important}
  :root:not([data-theme="light"]) .lx-gold-text{
    background:none!important;
    -webkit-text-fill-color:CanvasText!important;
    color:CanvasText!important;
  }
  .progress,.col,.card,.add,.seg,.chip,.tag,.theme-btn,.btn,.addday,.bar{
    border:1px solid ButtonText!important;
    box-shadow:none!important;
  }
  .progress{outline:1px solid ButtonText!important}
  .btn,.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{
    background:Highlight!important;
    color:HighlightText!important;
  }
  .bar .b-done,.bar .b-doing,.bar .b-todo,.col-head i{
    background:Highlight!important;
    forced-color-adjust:none;
  }
  :focus-visible{
    outline:2px solid Highlight!important;
  }
}
</style>
</head>
<body class="lx-velvet">
<div class="wrap">
  <header class="hdr">
    <div class="hdr-bar">
      <span class="eyebrow">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1L10.2 5.8L15 8L10.2 10.2L8 15L5.8 10.2L1 8L5.8 5.8L8 1Z" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        Không gian điều phối
      </span>
      <button type="button" class="theme-btn" id="themeBtn" aria-pressed="false">Chế độ sáng</button>
    </div>
    <h1 class="lx-gold-text">Bảng công việc</h1>
    <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    <div class="ornament" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="9" y="2" width="9.9" height="9.9" transform="rotate(45 9 2)" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="9" cy="9" r="2" fill="currentColor"/>
      </svg>
    </div>
  </header>

  <section class="progress" aria-label="Tiến độ">
    <div class="pg-top">
      <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
      <div class="pg-note" id="note"></div>
    </div>
    <div class="bar" aria-hidden="true"><span class="b-done" id="bDone"></span><span class="b-doing" id="bDoing"></span><span class="b-todo" id="bTodo"></span></div>
    <div class="pg-legend" aria-hidden="true">
      <span><i class="lg-done"></i>Hoàn thành</span>
      <span><i class="lg-doing"></i>Đang làm</span>
      <span><i class="lg-todo"></i>Cần làm</span>
    </div>
  </section>

  <div class="add">
    <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
    <select id="prio" aria-label="Mức ưu tiên">
      <option value="high">Ưu tiên cao</option>
      <option value="mid" selected>Ưu tiên vừa</option>
      <option value="low">Ưu tiên thấp</option>
    </select>
    <input type="date" id="due" aria-label="Hạn hoàn thành">
    <button type="button" class="btn" id="addBtn">Thêm việc</button>
  </div>

  <div class="toolbar">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="chip" id="thisW">Tuần này</button>
    <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme-lx";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;

  function applyTheme(t){
    var root=document.documentElement;
    var btn=document.getElementById("themeBtn");
    if(t==="light"){
      root.setAttribute("data-theme","light");
      btn.textContent="Chế độ tối";
      btn.setAttribute("aria-pressed","true");
    }else{
      root.setAttribute("data-theme","dark");
      btn.textContent="Chế độ sáng";
      btn.setAttribute("aria-pressed","false");
    }
  }
  function initTheme(){
    var saved="dark";
    try{var v=localStorage.getItem(THEME_KEY);if(v==="light"||v==="dark")saved=v}catch(e){}
    applyTheme(saved);
  }
  document.getElementById("themeBtn").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme")==="light"?"light":"dark";
    var next=cur==="light"?"dark":"light";
    applyTheme(next);
    try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  };

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag",PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  initTheme();load();render();
})();
</script>
</body>
</html>
