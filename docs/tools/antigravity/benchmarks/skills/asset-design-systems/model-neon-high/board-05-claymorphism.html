<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  /* Claymorphism core tokens */
  --clay-bg:#f5f5fa;
  --clay-bg-2:#f0eeff;
  --clay-bg-3:#eefbf5;
  --clay-white:#ffffff;
  --clay-lav:#f3e8ff;
  --clay-coral:#f76d6d;
  --clay-sky:#62cdff;
  --clay-purple:#d6a2ff;
  --clay-green:#7ae582;
  --clay-peach:#ffb347;
  --clay-text:#2d3557;
  --clay-text-2:#555b7a;
  --clay-shadow-tint:112,100,176;
  --radius-card:32px;
  --radius-ctl:24px;
  --radius-pill:999px;
  --pad-card:2rem;
  --font:"Nunito","Quicksand","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;

  /* Recipe & contrast-safe derived tokens */
  --clay-btn:#c4b5fd;
  --clay-focus:#6d28d9;
  --clay-edge:#7b6ba8;
  --clay-coral-soft:#ffd2d2;     /* substitute for #f76d6d text fill (8.76:1 with #2d3557) */
  --clay-coral-tint:#ffe6e6;     /* delete button clay fill (6.67:1 with #9e1c2b) */
  --clay-coral-ink:#9e1c2b;      /* overdue / danger text (>= 5.80:1 AA) */
  --clay-coral-edge:#d93848;     /* substitute for #f76d6d UI marker (>= 3.34:1 UI) */
  --clay-mid-edge:#c77400;       /* mid-priority marker (>= 3.32:1 UI) */
  --clay-low-edge:#0e7490;       /* low-priority marker (>= 5.03:1 AA) */
  --clay-col-todo:#edf7ff;
  --clay-col-doing:#fff6e5;
  --clay-col-done:var(--clay-bg-3);
  --clay-col-overdue:#fff0f0;
  --clay-card-done:#f8f7fc;

  /* Single top-down light source; no pure-black shadows */
  --shadow-container:0 28px 56px rgba(var(--clay-shadow-tint),.20);
  --shadow-container-sm:0 18px 36px rgba(var(--clay-shadow-tint),.16);
  --shadow-clay-card:
    0 12px 24px rgba(var(--clay-shadow-tint),.18),
    inset 0 -5px 10px rgba(var(--clay-shadow-tint),.15),
    inset 0 5px 10px rgba(255,255,255,.92);
  --shadow-clay-btn:
    0 12px 24px rgba(var(--clay-shadow-tint),.35),
    inset 0 -4px 8px rgba(95,70,140,.28),
    inset 0 4px 8px rgba(255,255,255,.72);
  --shadow-clay-ctl:
    0 8px 16px rgba(var(--clay-shadow-tint),.20),
    inset 0 -3px 6px rgba(95,70,140,.18),
    inset 0 3px 6px rgba(255,255,255,.86);
  --shadow-clay-coral:
    0 10px 20px rgba(217,56,72,.26),
    inset 0 -4px 8px rgba(158,28,43,.22),
    inset 0 4px 8px rgba(255,255,255,.78);
  --shadow-clay-peach:
    0 10px 20px rgba(199,116,0,.28),
    inset 0 -4px 8px rgba(156,84,0,.25),
    inset 0 4px 8px rgba(255,255,255,.72);
  --shadow-clay-sky:
    0 10px 20px rgba(14,116,144,.26),
    inset 0 -4px 8px rgba(14,96,136,.24),
    inset 0 4px 8px rgba(255,255,255,.74);
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 6%,var(--clay-bg-2) 0%,transparent 48%),
    radial-gradient(circle at 88% 16%,var(--clay-bg-3) 0%,transparent 46%),
    var(--clay-bg);
  color:var(--clay-text);
  font-family:var(--font);
  font-weight:600;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:clamp(20px,4vw,40px) clamp(14px,3vw,28px) 56px;
}

/* Header */
.hero{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:24px;
}
.hero-badge{
  flex:0 0 auto;
  width:58px;
  height:58px;
  border-radius:20px;
  background:var(--clay-btn);
  color:var(--clay-text);
  display:grid;
  place-items:center;
  box-shadow:var(--shadow-container-sm);
}
.hero-copy{min-width:0}
h1{
  font-size:clamp(28px,5vw,42px);
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.12;
  margin:0 0 4px;
  color:var(--clay-text);
}
.sub{
  margin:0;
  color:var(--clay-text-2);
  font-size:15px;
  font-weight:600;
}

/* Focus outline (explicit per guardrail) */
:focus-visible{
  outline:3px solid var(--clay-focus);
  outline-offset:3px;
}

/* Progress hero container: outer shadow only */
.progress{
  background:var(--clay-lav);
  border-radius:var(--radius-card);
  padding:clamp(1.25rem,3vw,var(--pad-card));
  margin-bottom:24px;
  box-shadow:var(--shadow-container);
}
.pg-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px 18px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.pg-stat{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:8px 12px;
}
.pg-num{
  font-size:clamp(34px,6vw,50px);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
  color:var(--clay-text);
}
.pg-num small{
  font-size:.38em;
  font-weight:700;
  letter-spacing:0;
  color:var(--clay-text-2);
  margin-left:8px;
}
.pg-note{
  background:var(--clay-white);
  color:var(--clay-text);
  border-radius:var(--radius-pill);
  padding:7px 16px;
  font-size:14px;
  font-weight:700;
  box-shadow:0 8px 18px rgba(var(--clay-shadow-tint),.14);
}
.pg-note.has-late{
  background:var(--clay-coral-soft);
  color:var(--clay-coral-ink);
}

/* Stacked clay progress bar */
.bar{
  display:flex;
  height:24px;
  padding:4px;
  border-radius:var(--radius-pill);
  background:var(--clay-white);
  gap:4px;
  box-shadow:inset 0 3px 8px rgba(var(--clay-shadow-tint),.18);
  overflow:hidden;
}
.bar span{
  display:block;
  min-width:0;
  border-radius:var(--radius-pill);
}
.bar .b-done{
  background:var(--clay-green);
  box-shadow:inset 0 -3px 5px rgba(24,118,52,.28),inset 0 3px 5px rgba(255,255,255,.68);
}
.bar .b-doing{
  background:var(--clay-peach);
  box-shadow:inset 0 -3px 5px rgba(168,92,0,.28),inset 0 3px 5px rgba(255,255,255,.65);
}
.bar .b-todo{
  background:var(--clay-sky);
  box-shadow:inset 0 -3px 5px rgba(14,104,148,.28),inset 0 3px 5px rgba(255,255,255,.68);
}
.pg-legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 10px;
  margin-top:14px;
}
.leg-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:var(--radius-pill);
  padding:4px 12px;
  font-size:13px;
  font-weight:700;
  color:var(--clay-text);
}
.leg-done{background:var(--clay-green)}
.leg-doing{background:var(--clay-peach)}
.leg-todo{background:var(--clay-sky)}

/* Add task form container: outer shadow only */
.add-card{
  background:var(--clay-white);
  border-radius:var(--radius-card);
  padding:clamp(1rem,2.5vw,1.5rem);
  margin-bottom:24px;
  box-shadow:var(--shadow-container);
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:12px;
  align-items:stretch;
}
input,select,button{
  font:inherit;
  color:inherit;
}
.add input,.add select{
  min-width:0;
  width:100%;
  background:var(--clay-bg);
  color:var(--clay-text);
  border:2px solid var(--clay-edge);
  border-radius:var(--radius-ctl);
  padding:12px 16px;
  font-weight:700;
}
.add input::placeholder{
  color:var(--clay-text-2);
  opacity:1;
  font-weight:600;
}

/* Primary clay button: full three-shadow stack */
.btn{
  background:var(--clay-btn);
  color:var(--clay-text);
  border:0;
  border-radius:var(--radius-ctl);
  padding:12px 24px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:var(--shadow-clay-btn);
  transition:transform 120ms ease,opacity 120ms ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px) scale(.98)}

/* Toolbar: views + priority filters */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px 18px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.views{display:flex;align-items:center;max-width:100%}
.seg{
  display:inline-flex;
  flex-wrap:wrap;
  gap:6px;
  background:var(--clay-white);
  border-radius:var(--radius-pill);
  padding:6px;
  box-shadow:var(--shadow-container-sm);
}
.seg button{
  background:transparent;
  border:0;
  border-radius:var(--radius-pill);
  padding:9px 18px;
  cursor:pointer;
  font-weight:700;
  color:var(--clay-text-2);
  transition:transform 120ms ease,opacity 120ms ease;
}
.seg button:hover{transform:translateY(-1px)}
.seg button:active{transform:translateY(1px) scale(.98)}
.seg button[aria-pressed="true"]{
  background:var(--clay-btn);
  color:var(--clay-text);
  font-weight:800;
  box-shadow:var(--shadow-clay-ctl);
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}
.chip{
  background:var(--clay-white);
  color:var(--clay-text-2);
  border:0;
  border-radius:var(--radius-pill);
  padding:9px 18px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  box-shadow:var(--shadow-clay-ctl);
  transition:transform 120ms ease,opacity 120ms ease;
}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:translateY(2px) scale(.98)}
.chip[aria-pressed="true"]{
  color:var(--clay-text);
  font-weight:800;
}
.chip[data-f="all"][aria-pressed="true"]{
  background:var(--clay-btn);
  box-shadow:var(--shadow-clay-btn);
}
.chip[data-f="high"][aria-pressed="true"]{
  background:var(--clay-coral-soft);
  box-shadow:var(--shadow-clay-coral);
}
.chip[data-f="mid"][aria-pressed="true"]{
  background:var(--clay-peach);
  box-shadow:var(--shadow-clay-peach);
}
.chip[data-f="low"][aria-pressed="true"]{
  background:var(--clay-sky);
  box-shadow:var(--shadow-clay-sky);
}

/* Week navigation bar */
.weeknav{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.navbtn{
  background:var(--clay-white);
  color:var(--clay-text);
  border:0;
  border-radius:var(--radius-pill);
  padding:9px 16px;
  cursor:pointer;
  font-size:14px;
  font-weight:800;
  box-shadow:var(--shadow-clay-ctl);
  transition:transform 120ms ease,opacity 120ms ease;
}
.navbtn:hover{transform:translateY(-2px)}
.navbtn:active{transform:translateY(2px) scale(.98)}
.weeknav .lbl{
  background:var(--clay-lav);
  color:var(--clay-text);
  border-radius:var(--radius-pill);
  padding:8px 16px;
  font-weight:800;
  font-size:14px;
  box-shadow:var(--shadow-container-sm);
}

/* Board view: 3 clay trays (containers get outer shadow only) */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
  align-items:start;
}
.col{
  min-width:0;
  background:var(--clay-white);
  border-radius:var(--radius-card);
  padding:20px;
  min-height:220px;
  box-shadow:var(--shadow-container);
  transition:transform 120ms ease;
}
.col[data-s="todo"]{background:var(--clay-col-todo)}
.col[data-s="doing"]{background:var(--clay-col-doing)}
.col[data-s="done"]{background:var(--clay-col-done)}
.col.overdue-col{background:var(--clay-col-overdue)}
.col.over{
  outline:3px dashed var(--clay-focus);
  outline-offset:-5px;
  transform:scale(1.01);
}

.col-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin:2px 4px 16px;
}
.col-head i{
  flex:0 0 auto;
  width:16px;
  height:16px;
  border-radius:50%;
  display:block;
}
.col[data-s="todo"] .col-head i{
  background:var(--clay-sky);
  box-shadow:inset 0 -3px 4px rgba(14,104,148,.30),inset 0 3px 4px rgba(255,255,255,.78);
}
.col[data-s="doing"] .col-head i{
  background:var(--clay-peach);
  box-shadow:inset 0 -3px 4px rgba(168,92,0,.30),inset 0 3px 4px rgba(255,255,255,.75);
}
.col[data-s="done"] .col-head i{
  background:var(--clay-green);
  box-shadow:inset 0 -3px 4px rgba(24,118,52,.30),inset 0 3px 4px rgba(255,255,255,.75);
}
.col-head h2{
  font-size:17px;
  font-weight:800;
  margin:0;
  color:var(--clay-text);
}
.col.overdue-col .col-head h2{color:var(--clay-coral-ink)}
.col-head .count{
  margin-left:auto;
  font-size:13px;
  font-weight:800;
  color:var(--clay-text);
  background:var(--clay-white);
  border-radius:var(--radius-pill);
  padding:2px 11px;
  box-shadow:0 4px 10px rgba(var(--clay-shadow-tint),.14);
}
.col.overdue-col .col-head .count{
  background:var(--clay-coral-soft);
  color:var(--clay-coral-ink);
}

/* Task cards: draggable interactive clay pieces (full three-shadow stack) */
.card{
  position:relative;
  background:var(--clay-white);
  border-radius:var(--radius-ctl);
  padding:15px 16px 14px 22px;
  margin-bottom:14px;
  box-shadow:var(--shadow-clay-card);
  cursor:grab;
  transition:transform 120ms ease,opacity 120ms ease;
}
.card:last-child{margin-bottom:0}
.card::before{
  content:"";
  position:absolute;
  left:9px;
  top:14px;
  bottom:14px;
  width:5px;
  border-radius:var(--radius-pill);
  background:var(--clay-low-edge);
}
.card.p-high::before{background:var(--clay-coral-edge)}
.card.p-mid::before{background:var(--clay-mid-edge)}
.card.p-low::before{background:var(--clay-low-edge)}

.card:hover{transform:translateY(-2px)}
.card:active{cursor:grabbing;transform:translateY(1px) scale(.99)}
.card.dragging{opacity:.42}
.card.is-done{background:var(--clay-card-done)}
.card .t{
  font-weight:700;
  font-size:15px;
  line-height:1.4;
  color:var(--clay-text);
  overflow-wrap:anywhere;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--clay-text-2);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:11px;
  flex-wrap:wrap;
}
.tag{
  display:inline-flex;
  align-items:center;
  font-size:12px;
  font-weight:800;
  border-radius:var(--radius-pill);
  padding:3px 10px;
  background:var(--clay-lav);
  color:var(--clay-text-2);
}
.tag.prio-high{background:var(--clay-coral-soft);color:var(--clay-text)}
.tag.prio-mid{background:var(--clay-peach);color:var(--clay-text)}
.tag.prio-low{background:var(--clay-sky);color:var(--clay-text)}
.tag.state-doing{background:var(--clay-purple);color:var(--clay-text)}
.tag.late{
  background:var(--clay-coral-soft);
  color:var(--clay-coral-ink);
  border:1.5px solid var(--clay-coral-edge);
}

.acts{
  margin-left:auto;
  display:flex;
  gap:6px;
}
.acts button{
  background:var(--clay-lav);
  color:var(--clay-text);
  border:0;
  border-radius:12px;
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
  line-height:1;
  box-shadow:
    0 5px 10px rgba(var(--clay-shadow-tint),.22),
    inset 0 -2px 4px rgba(95,70,140,.20),
    inset 0 2px 4px rgba(255,255,255,.80);
  transition:transform 120ms ease,opacity 120ms ease;
}
.acts button:hover:not(:disabled){transform:translateY(-1px)}
.acts button:active:not(:disabled){transform:translateY(1px) scale(.94)}
.acts button.del{
  background:var(--clay-coral-tint);
  color:var(--clay-coral-ink);
  box-shadow:
    0 5px 10px rgba(217,56,72,.20),
    inset 0 -2px 4px rgba(158,28,43,.18),
    inset 0 2px 4px rgba(255,255,255,.82);
}
.acts button:disabled{
  opacity:.32;
  cursor:not-allowed;
  box-shadow:none;
}

.empty{
  color:var(--clay-text-2);
  font-size:14px;
  font-weight:600;
  text-align:center;
  padding:22px 10px;
  border-radius:20px;
  border:2px dashed var(--clay-edge);
}

[hidden]{display:none!important}

/* Week view */
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
  align-items:start;
}
.week .col{
  border-radius:24px;
  padding:12px 10px;
  min-height:190px;
  box-shadow:var(--shadow-container-sm);
}
.week .col-head{
  flex-wrap:wrap;
  gap:3px 6px;
  margin:0 2px 10px;
}
.week .col-head h2{font-size:14px}
.dsub{
  font-size:12px;
  font-weight:700;
  color:var(--clay-text-2);
}
.col.today{
  background:var(--clay-lav);
  border:2.5px solid var(--clay-focus);
}
.col.today .dsub{
  color:var(--clay-focus);
  font-weight:800;
}
.week .card{
  border-radius:18px;
  padding:10px 10px 10px 15px;
  margin-bottom:10px;
}
.week .card::before{
  left:6px;
  top:10px;
  bottom:10px;
  width:4px;
}
.week .card .t{font-size:13.5px}
.week .acts button{
  width:28px;
  height:28px;
  border-radius:10px;
  font-size:14px;
}

.addday{
  width:100%;
  margin-top:8px;
  background:var(--clay-bg-2);
  color:var(--clay-text);
  border:0;
  border-radius:var(--radius-pill);
  padding:8px 10px;
  cursor:pointer;
  font-size:13px;
  font-weight:800;
  box-shadow:var(--shadow-clay-ctl);
  transition:transform 120ms ease,opacity 120ms ease;
}
.addday:hover{transform:translateY(-1px)}
.addday:active{transform:translateY(1px) scale(.98)}

.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
  margin-top:20px;
  align-items:start;
}
.extra .col{padding:18px}

/* Responsive layout (400px-safe, zero horizontal scroll) */
@media (max-width:980px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .week .col{padding:16px}
}
@media (max-width:820px){
  .board{grid-template-columns:1fr;gap:18px}
  .extra{grid-template-columns:1fr;gap:16px}
  .add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .add input[type="text"]{grid-column:1 / -1}
  .add .btn{grid-column:1 / -1}
}
@media (max-width:560px){
  .week{grid-template-columns:1fr}
  .add{grid-template-columns:minmax(0,1fr)}
  .hero{align-items:flex-start}
  .hero-badge{width:48px;height:48px;border-radius:16px}
  .seg{width:100%;justify-content:stretch}
  .seg button{flex:1 1 auto;text-align:center;padding:9px 12px}
}

/* Reduced motion fallback */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
  }
  .btn:hover,.btn:active,
  .chip:hover,.chip:active,
  .navbtn:hover,.navbtn:active,
  .seg button:hover,.seg button:active,
  .card:hover,.card:active,
  .acts button:hover,.acts button:active,
  .addday:hover,.addday:active,
  .col.over{
    transform:none!important;
  }
}

/* Reduced transparency fallback */
@media (prefers-reduced-transparency:reduce){
  body{background:var(--clay-bg)}
  .progress,.add-card,.col,.card,.seg,.chip,.navbtn,.btn,.addday,.acts button,.pg-note,.weeknav .lbl{
    box-shadow:none;
    border:2px solid var(--clay-edge);
  }
  .bar{
    box-shadow:none;
    border:2px solid var(--clay-edge);
  }
  .bar span,.col-head i{box-shadow:none}
  .card.dragging{opacity:1;border-style:dashed}
  .acts button:disabled{opacity:1;background:var(--clay-bg);color:var(--clay-text-2)}
}

/* Forced colors / High Contrast fallback */
@media (forced-colors:active){
  .progress,.add-card,.col,.card,.seg,.chip,.navbtn,.btn,.addday,.acts button,.bar,.tag,.leg-pill,.pg-note,.weeknav .lbl,.col-head .count,.hero-badge{
    box-shadow:none!important;
    border:1px solid CanvasText;
  }
  .seg button[aria-pressed="true"],
  .chip[aria-pressed="true"],
  .col.today,
  .col.over{
    border:2px solid Highlight;
  }
  .card::before{background:CanvasText}
  .bar span{border:1px solid CanvasText}
  :focus-visible{outline:3px solid Highlight;outline-offset:2px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-badge" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="5" width="24" height="22" rx="8" fill="#ffffff" stroke="#2d3557" stroke-width="2.4"/>
        <path d="M10.5 16.5L14.2 20.2L21.8 12.2" stroke="#2d3557" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="hero-copy">
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
  </header>

  <section class="progress" aria-label="Tiến độ">
    <div class="pg-top">
      <div class="pg-stat">
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
      </div>
      <div class="pg-note" id="note"></div>
    </div>
    <div class="bar" aria-hidden="true">
      <span class="b-done" id="bDone"></span>
      <span class="b-doing" id="bDoing"></span>
      <span class="b-todo" id="bTodo"></span>
    </div>
    <div class="pg-legend" aria-hidden="true">
      <span class="leg-pill leg-done">Hoàn thành: <strong id="cDone">0</strong></span>
      <span class="leg-pill leg-doing">Đang làm: <strong id="cDoing">0</strong></span>
      <span class="leg-pill leg-todo">Cần làm: <strong id="cTodo">0</strong></span>
    </div>
  </section>

  <section class="add-card" aria-label="Thêm công việc mới">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button type="button" class="btn" id="addBtn">Thêm việc</button>
    </div>
  </section>

  <div class="toolbar">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>

    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="navbtn" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="navbtn" id="thisW">Tuần này</button>
    <button type="button" class="navbtn" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <main>
    <div class="board" id="board"></div>
    <div class="week" id="week" hidden></div>
    <div class="extra" id="extra" hidden></div>
  </main>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{
      var r=localStorage.getItem(KEY);
      if(r){
        var parsed=JSON.parse(r);
        if(Array.isArray(parsed)){tasks=parsed;return;}
      }
    }catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(text!=null)e.textContent=text;
    return e;
  }
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    x.setDate(x.getDate()-((x.getDay()+6)%7));
    return x;
  }
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function resolveDragId(e){
    if(dragId!=null)return dragId;
    try{
      var raw=e.dataTransfer&&e.dataTransfer.getData("text/plain");
      if(raw){var n=Number(raw);if(!isNaN(n))return n;}
    }catch(x){}
    return null;
  }

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;
    c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));

    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag state-doing","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late){
        m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
      }
    }

    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button","del","×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};

    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");
      K.type="button";
      K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";
      K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else{
      a.append(L,R,X);
    }
    m.appendChild(a);
    c.appendChild(m);

    c.addEventListener("dragstart",function(e){
      dragId=t.id;
      c.classList.add("dragging");
      try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}
    });
    c.addEventListener("dragend",function(){
      c.classList.remove("dragging");
      dragId=null;
      document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")});
    });
    return c;
  }

  function move(id,s){
    tasks.forEach(function(t){if(t.id===id)t.s=s});
    save();
    render();
  }

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();

    var b=document.getElementById("board");
    b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");
      col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");
      h.appendChild(el("i"));
      h.appendChild(el("h2",null,c[1]));
      h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length){
        col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      }
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){
        e.preventDefault();
        col.classList.remove("over");
        var id=resolveDragId(e);
        if(id!=null)move(id,c[0]);
      });
      b.appendChild(col);
    });

    var n=tasks.length;
    var d=tasks.filter(function(t){return t.s==="done"}).length;
    var g=tasks.filter(function(t){return t.s==="doing"}).length;
    var o=n-d-g;
    var pct=n?Math.round(d/n*100):0;

    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    document.getElementById("cDone").textContent=String(d);
    document.getElementById("cDoing").textContent=String(g);
    document.getElementById("cTodo").textContent=String(o);

    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    var noteEl=document.getElementById("note");
    noteEl.textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
    noteEl.classList.toggle("has-late",late>0);
  }

  function setDate(id,d){
    tasks.forEach(function(t){if(t.id===id)t.d=d});
    save();
    render();
  }

  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");
    h.appendChild(el("h2",null,title));
    if(sub)h.appendChild(el("span","dsub",sub));
    h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");
      A.type="button";
      A.onclick=function(){
        document.getElementById("due").value=dateVal;
        document.getElementById("title").focus();
      };
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){
        e.preventDefault();
        col.classList.remove("over");
        var id=resolveDragId(e);
        if(id!=null)setDate(id,dateVal);
      });
    }
    return col;
  }

  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");
    W.textContent="";
    E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null," overdue-col"));
  }

  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    var nextId=Date.now();
    while(tasks.some(function(x){return x.id===nextId}))nextId++;
    tasks.push({id:nextId,t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";
    document.getElementById("due").value="";
    save();
    render();
    inp.focus();
  }

  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".chip[data-f]").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".chip[data-f]").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button[data-v]").forEach(function(b){
    b.onclick=function(){
      view=b.dataset.v;
      document.querySelectorAll(".seg button[data-v]").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
      render();
    };
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};

  load();
  render();
})();
</script>
</body>
</html>
