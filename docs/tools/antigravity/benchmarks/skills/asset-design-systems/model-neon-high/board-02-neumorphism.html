<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600;700;800&display=swap">
<style>
:root{
  --neu-bg:#e0e5ec;
  --neu-shadow-dark:#a3b1c6;
  --neu-shadow-light:#ffffff;
  --neu-text:#2d3436;
  --neu-text-2:#4b565a;          /* #636e72 from sources fails AA (4.14:1); substituted with #4b565a (5.97:1) */
  --neu-accent:#3a62d8;          /* #4d7cff fails AA for white text (3.72:1); substituted with #3a62d8 (5.36:1) */
  --neu-accent-text:#284ab0;     /* 6.15:1 on #e0e5ec for accent text/links */
  --neu-accent-soft:rgba(58,98,216,.15);
  --neu-cta-bg:#3a62d8;
  --neu-cta-text:#ffffff;
  --neu-edge:#6f7c8e;            /* 3.35:1 UI border so controls pass 3:1 non-text bar */
  --neu-convex-hi:#e6ebf2;
  --neu-convex-lo:#ccd1d8;

  /* Semantic status & priority tokens (all >=4.5:1 text & >=3:1 UI on #e0e5ec) */
  --st-todo:#3a62d8;
  --st-doing:#8f5300;
  --st-done:#15734b;
  --st-high:#b92b27;
  --st-high-text:#a6221e;
  --st-high-bg:rgba(185,43,39,.10);
  --st-mid-text:#854b00;
  --st-mid-bg:rgba(143,83,0,.10);
  --st-done-text:#126642;
  --st-done-bg:rgba(21,115,75,.10);
  --st-low:#4b565a;

  /* Neumorphic depth geometry (single top-left light source) */
  --neu-dist:8px;
  --neu-blur:15px;
  --neu-dist-sm:4px;
  --neu-blur-sm:8px;
  --neu-dist-lg:12px;
  --neu-blur-lg:24px;
  --neu-inset:5px;
  --neu-inset-blur:10px;

  --radius-card:20px;
  --radius-ctl:12px;
  --radius-pill:999px;
  --space-panel:32px;
  --space-gap:24px;
  --font:"Nunito Sans","Nunito",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --neu-bg:#2d2d2d;
    --neu-shadow-dark:#252525;
    --neu-shadow-light:#353535;
    --neu-text:#e0e0e0;
    --neu-text-2:#b2bac2;
    --neu-accent:#7ea2ff;
    --neu-accent-text:#8cb0ff;
    --neu-accent-soft:rgba(126,162,255,.15);
    --neu-cta-bg:#3a62d8;
    --neu-cta-text:#ffffff;
    --neu-edge:#7d8590;
    --neu-convex-hi:#333333;
    --neu-convex-lo:#272727;

    --st-todo:#7ea2ff;
    --st-doing:#f0b429;
    --st-done:#4cd095;
    --st-high:#ff7a70;
    --st-high-text:#ff8a80;
    --st-high-bg:rgba(255,122,112,.14);
    --st-mid-text:#f5be41;
    --st-mid-bg:rgba(240,180,41,.14);
    --st-done-text:#57d99f;
    --st-done-bg:rgba(76,208,149,.14);
    --st-low:#b2bac2;
    color-scheme:dark;
  }
}

:root[data-theme="dark"]{
  --neu-bg:#2d2d2d;
  --neu-shadow-dark:#252525;
  --neu-shadow-light:#353535;
  --neu-text:#e0e0e0;
  --neu-text-2:#b2bac2;
  --neu-accent:#7ea2ff;
  --neu-accent-text:#8cb0ff;
  --neu-accent-soft:rgba(126,162,255,.15);
  --neu-cta-bg:#3a62d8;
  --neu-cta-text:#ffffff;
  --neu-edge:#7d8590;
  --neu-convex-hi:#333333;
  --neu-convex-lo:#272727;

  --st-todo:#7ea2ff;
  --st-doing:#f0b429;
  --st-done:#4cd095;
  --st-high:#ff7a70;
  --st-high-text:#ff8a80;
  --st-high-bg:rgba(255,122,112,.14);
  --st-mid-text:#f5be41;
  --st-mid-bg:rgba(240,180,41,.14);
  --st-done-text:#57d99f;
  --st-done-bg:rgba(76,208,149,.14);
  --st-low:#b2bac2;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--neu-bg);
  color:var(--neu-text);
  font-family:var(--font);
  font-size:16px;
  font-weight:500;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* Core neumorphic depth primitives: raised, flat, pressed */
.neu-raised{
  background:var(--neu-bg);
  border-radius:var(--radius-card);
  box-shadow:
    var(--neu-dist) var(--neu-dist) var(--neu-blur) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist)) calc(-1 * var(--neu-dist)) var(--neu-blur) var(--neu-shadow-light);
}
.neu-raised-lg{
  background:var(--neu-bg);
  border-radius:var(--radius-card);
  box-shadow:
    var(--neu-dist-lg) var(--neu-dist-lg) var(--neu-blur-lg) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist-lg)) calc(-1 * var(--neu-dist-lg)) var(--neu-blur-lg) var(--neu-shadow-light);
}
.neu-pressed{
  background:var(--neu-bg);
  border-radius:var(--radius-card);
  box-shadow:
    inset var(--neu-inset) var(--neu-inset) var(--neu-inset-blur) var(--neu-shadow-dark),
    inset calc(-1 * var(--neu-inset)) calc(-1 * var(--neu-inset)) var(--neu-inset-blur) var(--neu-shadow-light);
}

.wrap{
  max-width:1260px;
  margin:0 auto;
  padding:36px 28px 56px;
}

/* Header */
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:var(--space-gap);
}
.brand{min-width:0}
h1{
  margin:0 0 6px;
  font-size:clamp(28px,4.5vw,42px);
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.12;
  color:var(--neu-text);
}
.sub{
  margin:0;
  color:var(--neu-text-2);
  font-size:16px;
}

/* Tactile controls with 1px >=3:1 border so controls read unmistakably as controls */
input,select,button{
  font:inherit;
  color:inherit;
}
:focus-visible{
  outline:3px solid var(--neu-accent);
  outline-offset:3px;
}
.neu-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--neu-bg);
  color:var(--neu-text);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-ctl);
  padding:10px 18px;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  box-shadow:
    var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  transition:box-shadow .2s ease,background-color .2s ease,border-color .2s ease;
}
.neu-btn:hover{
  box-shadow:
    2px 2px 5px var(--neu-shadow-dark),
    -2px -2px 5px var(--neu-shadow-light);
}
.neu-btn:active{
  box-shadow:
    inset 3px 3px 6px var(--neu-shadow-dark),
    inset -3px -3px 6px var(--neu-shadow-light);
}
.theme-toggle{
  flex:0 0 auto;
  padding:10px 14px;
  border-radius:var(--radius-pill);
  font-size:14px;
  white-space:nowrap;
}
.theme-toggle svg{width:18px;height:18px;flex:0 0 auto}

/* Progress Instrument Console */
.progress{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  gap:var(--space-panel);
  padding:var(--space-panel);
  margin-bottom:var(--space-gap);
}
.gauge-shell{
  position:relative;
  width:136px;
  height:136px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--neu-bg);
  box-shadow:
    var(--neu-dist) var(--neu-dist) var(--neu-blur) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist)) calc(-1 * var(--neu-dist)) var(--neu-blur) var(--neu-shadow-light);
  flex:0 0 auto;
}
.gauge-svg{
  width:120px;
  height:120px;
  transform:rotate(-90deg);
}
.gauge-track{
  fill:none;
  stroke:var(--neu-edge);
  stroke-opacity:.35;
  stroke-width:10;
}
.gauge-arc{
  fill:none;
  stroke:var(--st-done);
  stroke-width:10;
  stroke-linecap:round;
  transition:stroke-dashoffset .4s ease;
}
.gauge-cap{
  position:absolute;
  inset:24px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,var(--neu-convex-hi),var(--neu-convex-lo));
  box-shadow:
    4px 4px 8px var(--neu-shadow-dark),
    -4px -4px 8px var(--neu-shadow-light);
  text-align:center;
}
.gauge-pct-label{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
  color:var(--neu-text);
}

.pg-body{min-width:0}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px 20px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.pg-num{
  font-size:clamp(30px,4.5vw,44px);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1.05;
  color:var(--neu-text);
}
.pg-num small{
  font-size:16px;
  font-weight:600;
  color:var(--neu-text-2);
  letter-spacing:0;
  margin-left:10px;
}
.pg-note{
  font-size:15px;
  font-weight:600;
  color:var(--neu-text-2);
}

/* Static labeled stacked gauge (distinct from scrollbars via legend + border + pills) */
.pg-legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  margin-bottom:12px;
  font-size:14px;
  font-weight:600;
  color:var(--neu-text-2);
}
.pg-legend-item{
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.pg-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
  flex:0 0 auto;
}
.pg-dot.d-done{background:var(--st-done)}
.pg-dot.d-doing{background:var(--st-doing)}
.pg-dot.d-todo{background:var(--st-todo)}

.bar-well{
  padding:5px;
  border-radius:var(--radius-pill);
  border:1px solid var(--neu-edge);
  background:var(--neu-bg);
  box-shadow:
    inset 4px 4px 8px var(--neu-shadow-dark),
    inset -4px -4px 8px var(--neu-shadow-light);
}
.bar{
  display:flex;
  height:14px;
  border-radius:var(--radius-pill);
  overflow:hidden;
  gap:3px;
}
.bar span{
  display:block;
  min-width:0;
  border-radius:var(--radius-pill);
  transition:flex-grow .35s ease;
}
.bar .b-done{background:var(--st-done)}
.bar .b-doing{background:var(--st-doing)}
.bar .b-todo{background:var(--st-todo)}

/* Add Task Dock */
.add-dock{
  padding:22px 24px;
  margin-bottom:var(--space-gap);
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:12px;
  align-items:stretch;
}
.add input,.add select{
  background:var(--neu-bg);
  color:var(--neu-text);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-ctl);
  padding:11px 14px;
  min-width:0;
  min-height:46px;
  box-shadow:
    inset 4px 4px 8px var(--neu-shadow-dark),
    inset -4px -4px 8px var(--neu-shadow-light);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.add input::placeholder{color:var(--neu-text-2);opacity:1}
.add input:focus,.add select:focus{
  border-color:var(--neu-accent);
}

/* Primary CTA: solid accent stickered key per Guardrail #2 */
.btn-cta{
  background:var(--neu-cta-bg);
  color:var(--neu-cta-text);
  border:1px solid var(--neu-accent);
  border-radius:var(--radius-ctl);
  padding:11px 24px;
  min-height:46px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:
    var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light),
    inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .15s ease,box-shadow .2s ease,filter .2s ease;
}
.btn-cta:hover{
  filter:brightness(1.06);
  box-shadow:
    2px 2px 6px var(--neu-shadow-dark),
    -2px -2px 6px var(--neu-shadow-light),
    inset 0 1px 0 rgba(255,255,255,.32);
}
.btn-cta:active{
  transform:translateY(1px);
  box-shadow:
    inset 3px 3px 7px rgba(0,0,0,.35),
    inset -2px -2px 5px rgba(255,255,255,.15);
}

/* Toolbar: View switcher + Priority filters */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px 20px;
  margin-bottom:20px;
}
.views{display:flex;align-items:center;min-width:0}
.seg{
  display:inline-flex;
  flex-wrap:wrap;
  gap:6px;
  padding:6px;
  border-radius:var(--radius-pill);
  border:1px solid var(--neu-edge);
  background:var(--neu-bg);
  box-shadow:
    inset 4px 4px 8px var(--neu-shadow-dark),
    inset -4px -4px 8px var(--neu-shadow-light);
}
.seg button{
  background:transparent;
  color:var(--neu-text-2);
  border:1px solid transparent;
  border-radius:var(--radius-pill);
  padding:8px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:background-color .2s ease,color .2s ease,box-shadow .2s ease;
}
.seg button:hover:not([aria-pressed="true"]){
  color:var(--neu-text);
  border-color:var(--neu-edge);
}
.seg button[aria-pressed="true"]{
  background:var(--neu-cta-bg);
  color:var(--neu-cta-text);
  border-color:var(--neu-accent);
  box-shadow:
    3px 3px 7px var(--neu-shadow-dark),
    -2px -2px 5px var(--neu-shadow-light);
}

.filters{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.chip{
  background:var(--neu-bg);
  color:var(--neu-text-2);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-pill);
  padding:8px 16px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:
    var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  transition:box-shadow .2s ease,background-color .2s ease,color .2s ease,border-color .2s ease;
}
.chip:hover:not([aria-pressed="true"]){
  color:var(--neu-text);
  box-shadow:
    2px 2px 5px var(--neu-shadow-dark),
    -2px -2px 5px var(--neu-shadow-light);
}
.chip[aria-pressed="true"]{
  background:var(--neu-cta-bg);
  color:var(--neu-cta-text);
  border-color:var(--neu-accent);
  box-shadow:
    inset 2px 2px 5px rgba(0,0,0,.32),
    inset -2px -2px 4px rgba(255,255,255,.16);
}

/* Week Navigation */
.weeknav{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.weeknav .nav-btn{
  background:var(--neu-bg);
  color:var(--neu-text);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-pill);
  padding:8px 15px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:
    var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  transition:box-shadow .2s ease;
}
.weeknav .nav-btn:hover{
  box-shadow:
    2px 2px 5px var(--neu-shadow-dark),
    -2px -2px 5px var(--neu-shadow-light);
}
.weeknav .nav-btn:active{
  box-shadow:
    inset 3px 3px 6px var(--neu-shadow-dark),
    inset -3px -3px 6px var(--neu-shadow-light);
}
.weeknav .lbl{
  font-weight:800;
  font-size:16px;
  color:var(--neu-text);
  margin-left:6px;
}

/* Board & Column Recessed Trays */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:var(--space-gap);
  align-items:start;
}
.col{
  background:var(--neu-bg);
  border-radius:var(--radius-card);
  padding:20px;
  min-height:220px;
  min-width:0;
  border:1px solid transparent;
  box-shadow:
    inset var(--neu-inset) var(--neu-inset) var(--neu-inset-blur) var(--neu-shadow-dark),
    inset calc(-1 * var(--neu-inset)) calc(-1 * var(--neu-inset)) var(--neu-inset-blur) var(--neu-shadow-light);
  transition:border-color .18s ease,background-color .18s ease,box-shadow .18s ease;
}
.col.over{
  border-color:var(--neu-accent);
  background:var(--neu-accent-soft);
}
.col-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 2px 18px;
}
.col-head i{
  width:12px;
  height:12px;
  border-radius:50%;
  display:block;
  flex:0 0 auto;
}
.col[data-s="todo"] .col-head i{background:var(--st-todo)}
.col[data-s="doing"] .col-head i{background:var(--st-doing)}
.col[data-s="done"] .col-head i{background:var(--st-done)}
.col-head h2{
  margin:0;
  font-size:17px;
  font-weight:800;
  color:var(--neu-text);
}
.col-head .count{
  margin-left:auto;
  min-width:28px;
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:var(--neu-text);
  background:var(--neu-bg);
  border:1px solid var(--neu-edge);
  border-radius:var(--radius-pill);
  padding:2px 9px;
  box-shadow:
    2px 2px 5px var(--neu-shadow-dark),
    -2px -2px 5px var(--neu-shadow-light);
}

/* Extruded Tactile Task Cards inside Recessed Trays */
.card{
  position:relative;
  background:var(--neu-bg);
  border-radius:16px;
  padding:15px 16px 14px 20px;
  margin-bottom:16px;
  cursor:grab;
  box-shadow:
    var(--neu-dist-sm) var(--neu-dist-sm) var(--neu-blur-sm) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist-sm)) calc(-1 * var(--neu-dist-sm)) var(--neu-blur-sm) var(--neu-shadow-light);
  transition:box-shadow .2s ease,opacity .2s ease;
}
.card:last-child{margin-bottom:0}
.card::before{
  content:"";
  position:absolute;
  left:8px;
  top:14px;
  bottom:14px;
  width:5px;
  border-radius:var(--radius-pill);
  background:var(--st-low);
}
.card.p-high::before{background:var(--st-high)}
.card.p-mid::before{background:var(--st-doing)}
.card.p-low::before{background:var(--st-low)}
.card:hover{
  box-shadow:
    var(--neu-dist) var(--neu-dist) var(--neu-blur) var(--neu-shadow-dark),
    calc(-1 * var(--neu-dist)) calc(-1 * var(--neu-dist)) var(--neu-blur) var(--neu-shadow-light);
}
.card:active{cursor:grabbing}
.card.dragging{opacity:.42}
.card .t{
  font-weight:700;
  font-size:16px;
  line-height:1.4;
  color:var(--neu-text);
  overflow-wrap:anywhere;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--neu-text-2);
}

.meta{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}
.tag{
  display:inline-flex;
  align-items:center;
  font-size:12px;
  font-weight:700;
  border-radius:var(--radius-pill);
  padding:3px 10px;
  color:var(--neu-text-2);
  background:var(--neu-bg);
  border:1px solid var(--neu-edge);
}
.tag.prio-high{
  color:var(--st-high-text);
  background:var(--st-high-bg);
  border-color:var(--st-high);
}
.tag.prio-mid{
  color:var(--st-mid-text);
  background:var(--st-mid-bg);
  border-color:var(--st-doing);
}
.tag.prio-low{
  color:var(--neu-text-2);
  background:var(--neu-bg);
  border-color:var(--neu-edge);
}
.tag.status-doing{
  color:var(--st-mid-text);
  background:var(--st-mid-bg);
  border-color:var(--st-doing);
}
.tag.late{
  color:var(--st-high-text);
  background:var(--st-high-bg);
  border-color:var(--st-high);
}

.acts{
  margin-left:auto;
  display:flex;
  gap:6px;
}
.acts button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:10px;
  border:1px solid var(--neu-edge);
  background:var(--neu-bg);
  color:var(--neu-text);
  font-size:15px;
  font-weight:700;
  line-height:1;
  cursor:pointer;
  box-shadow:
    3px 3px 6px var(--neu-shadow-dark),
    -3px -3px 6px var(--neu-shadow-light);
  transition:box-shadow .16s ease,color .16s ease,border-color .16s ease;
}
.acts button:hover:not(:disabled){
  border-color:var(--neu-accent);
  color:var(--neu-accent-text);
  box-shadow:
    1px 1px 3px var(--neu-shadow-dark),
    -1px -1px 3px var(--neu-shadow-light);
}
.acts button:active:not(:disabled){
  box-shadow:
    inset 2px 2px 5px var(--neu-shadow-dark),
    inset -2px -2px 5px var(--neu-shadow-light);
}
.acts button.btn-del:hover:not(:disabled){
  border-color:var(--st-high);
  color:var(--st-high-text);
}
.acts button:disabled{
  opacity:.35;
  cursor:not-allowed;
  box-shadow:none;
}

.empty{
  color:var(--neu-text-2);
  font-size:14px;
  text-align:center;
  padding:24px 10px;
}

/* Week View */
[hidden]{display:none!important}
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:12px;
  align-items:start;
}
.week .col,.extra .col{
  padding:14px 12px;
  min-height:180px;
}
.week .col-head{
  flex-wrap:wrap;
  gap:4px 6px;
  margin-bottom:14px;
}
.week .col-head h2{font-size:15px}
.dsub{
  font-size:13px;
  font-weight:700;
  color:var(--neu-text-2);
}
.col.today{
  border:2px solid var(--neu-accent);
  background:var(--neu-accent-soft);
}
.col.today .dsub{
  color:var(--neu-accent-text);
}
.week .card{
  padding:12px 12px 12px 16px;
  margin-bottom:12px;
}
.week .card .t{font-size:14px}
.week .acts button{width:30px;height:30px;font-size:14px}

.addday{
  width:100%;
  margin-top:12px;
  background:var(--neu-bg);
  color:var(--neu-text-2);
  border:1px dashed var(--neu-edge);
  border-radius:var(--radius-ctl);
  padding:9px 10px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  box-shadow:
    2px 2px 5px var(--neu-shadow-dark),
    -2px -2px 5px var(--neu-shadow-light);
  transition:color .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.addday:hover{
  color:var(--neu-accent-text);
  border-color:var(--neu-accent);
  border-style:solid;
}
.addday:active{
  box-shadow:
    inset 2px 2px 5px var(--neu-shadow-dark),
    inset -2px -2px 5px var(--neu-shadow-light);
}

.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--space-gap);
  margin-top:var(--space-gap);
  align-items:start;
}

/* Responsive Breakpoints (shrink shadow offsets under 768px per Guardrail #5) */
@media (max-width:1120px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .board{grid-template-columns:1fr}
  .extra{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input[type="text"]{grid-column:1 / -1}
  .add .btn-cta{grid-column:1 / -1}
}
@media (max-width:768px){
  :root{
    --neu-dist:5px;
    --neu-blur:10px;
    --neu-dist-sm:3px;
    --neu-blur-sm:6px;
    --neu-dist-lg:8px;
    --neu-blur-lg:16px;
    --neu-inset:3px;
    --neu-inset-blur:6px;
    --space-panel:22px;
    --space-gap:18px;
  }
  .wrap{padding:22px 16px 40px}
  .progress{
    grid-template-columns:1fr;
    justify-items:center;
    text-align:center;
    gap:18px;
  }
  .pg-top{justify-content:center}
  .pg-legend{justify-content:center}
  .pg-body{width:100%}
  .week{grid-template-columns:1fr}
}
@media (max-width:480px){
  .topbar{flex-direction:column;align-items:stretch}
  .theme-toggle{align-self:flex-start}
  .add-dock{padding:16px}
  .add{grid-template-columns:1fr}
  .add input[type="text"],.add .btn-cta{grid-column:auto}
  .toolbar{flex-direction:column;align-items:stretch}
  .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .seg button{padding:8px 10px;font-size:14px;text-align:center}
  .col{padding:14px}
}

/* Reduced Motion Fallback */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
  }
}

/* Reduced Transparency Fallback: replace alpha fills with opaque high-contrast surfaces */
@media (prefers-reduced-transparency:reduce){
  :root{
    --neu-accent-soft:#c7d1e9;
    --st-high-bg:#dcd2d8;
    --st-mid-bg:#d8d6d4;
    --st-done-bg:#ccdadc;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --neu-accent-soft:#393f4c;
      --st-high-bg:#4a3836;
      --st-mid-bg:#48402c;
      --st-done-bg:#31443c;
    }
  }
  :root[data-theme="dark"]{
    --neu-accent-soft:#393f4c;
    --st-high-bg:#4a3836;
    --st-mid-bg:#48402c;
    --st-done-bg:#31443c;
  }
}

/* Forced Colors Fallback: shadows vanish, restore crisp system borders */
@media (forced-colors:active){
  .neu-raised,.neu-raised-lg,.neu-pressed,.col,.card,.gauge-shell,.gauge-cap,.bar-well{
    box-shadow:none!important;
    border:1px solid CanvasText!important;
  }
  .col.over,.col.today{
    border:2px solid Highlight!important;
  }
  .neu-btn,.btn-cta,.chip,.seg,.seg button,.weeknav .nav-btn,.acts button,.addday,.add input,.add select,.tag,.col-head .count{
    box-shadow:none!important;
    border:1px solid ButtonText!important;
  }
  .btn-cta,.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{
    background:Highlight!important;
    color:HighlightText!important;
    border-color:Highlight!important;
  }
  .bar .b-done,.bar .b-doing,.bar .b-todo,.card::before,.pg-dot,.col-head i{
    forced-color-adjust:none;
    border:1px solid CanvasText;
  }
  :focus-visible{
    outline:3px solid Highlight!important;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <button type="button" class="neu-btn theme-toggle" id="themeBtn" aria-label="Chuyển giao diện sáng tối">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span id="themeText">Giao diện tối</span>
    </button>
  </header>

  <section class="progress neu-raised-lg" aria-label="Tiến độ">
    <div class="gauge-shell" aria-hidden="true">
      <svg class="gauge-svg" viewBox="0 0 120 120">
        <circle class="gauge-track" cx="60" cy="60" r="50"/>
        <circle class="gauge-arc" id="gaugeArc" cx="60" cy="60" r="50" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
      </svg>
      <div class="gauge-cap">
        <span class="gauge-pct-label" id="gaugePct">0%</span>
      </div>
    </div>
    <div class="pg-body">
      <div class="pg-top">
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
        <div class="pg-note" id="note"></div>
      </div>
      <div class="pg-legend" aria-hidden="true">
        <span class="pg-legend-item"><span class="pg-dot d-done"></span>Hoàn thành: <strong id="lgDone">0</strong></span>
        <span class="pg-legend-item"><span class="pg-dot d-doing"></span>Đang làm: <strong id="lgDoing">0</strong></span>
        <span class="pg-legend-item"><span class="pg-dot d-todo"></span>Cần làm: <strong id="lgTodo">0</strong></span>
      </div>
      <div class="bar-well" aria-hidden="true">
        <div class="bar"><span class="b-done" id="bDone"></span><span class="b-doing" id="bDoing"></span><span class="b-todo" id="bTodo"></span></div>
      </div>
    </div>
  </section>

  <section class="add-dock neu-raised" aria-label="Thêm công việc mới">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button type="button" class="btn-cta" id="addBtn">Thêm việc</button>
    </div>
  </section>

  <div class="toolbar">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="nav-btn" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="nav-btn" id="thisW">Tuần này</button>
    <button type="button" class="nav-btn" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <main>
    <div class="board" id="board"></div>
    <div class="week" id="week" hidden></div>
    <div class="extra" id="extra" hidden></div>
  </main>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var CIRC=2*Math.PI*50;
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function currentTheme(){
    var attr=document.documentElement.getAttribute("data-theme");
    if(attr==="dark"||attr==="light")return attr;
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  }
  function syncThemeUI(){
    var dark=currentTheme()==="dark";
    var btn=document.getElementById("themeBtn");
    var txt=document.getElementById("themeText");
    var ic=document.getElementById("themeIcon");
    txt.textContent=dark?"Giao diện sáng":"Giao diện tối";
    btn.setAttribute("aria-pressed",String(dark));
    if(dark){
      ic.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
    }else{
      ic.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    }
  }
  function initTheme(){
    try{
      var saved=localStorage.getItem(THEME_KEY);
      if(saved==="dark"||saved==="light")document.documentElement.setAttribute("data-theme",saved);
    }catch(e){}
    syncThemeUI();
    document.getElementById("themeBtn").onclick=function(){
      var next=currentTheme()==="dark"?"light":"dark";
      document.documentElement.setAttribute("data-theme",next);
      try{localStorage.setItem(THEME_KEY,next)}catch(e){}
      syncThemeUI();
    };
  }

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("article","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag status-doing","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button","btn-del","×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("section","col");col.dataset.s=c[0];col.setAttribute("aria-label",c[1]);
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("gaugePct").textContent=pct+"%";
    document.getElementById("gaugeArc").style.strokeDashoffset=String(CIRC*(1-pct/100));
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("lgDone").textContent=String(d);
    document.getElementById("lgDoing").textContent=String(g);
    document.getElementById("lgTodo").textContent=String(o);
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("section","col"+(cls||""));col.setAttribute("aria-label",title);
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  initTheme();
  load();
  render();
})();
</script>
</body>
</html>
