<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Anthropic brand look tokens [ANTH, DERIVED] */
:root{
  color-scheme:light;
  /* Core brand palette */
  --bg:#faf9f5;
  --surface:#ffffff;
  --surface-2:#f5f4ed;
  --surface-3:#f0eee6;
  --line:#e8e6dc;
  --line-2:#dedcd1;
  --line-ctl:#87867f;
  --ink:#141413;
  --ink-2:#3d3d3a;
  --ink-hover:#3d3d3a;
  --muted:#5e5d59; /* substitutes #87867f (3.47:1 fails AA); #5e5d59 is 6.26:1 */
  --accent:#d97757;
  --accent-interactive:#c6613f; /* 3.85:1 on #faf9f5: UI edges and focus rings */
  --accent-text:#9e4324; /* deep clay substitute for small text: 6.07:1 on #faf9f5, 6.40:1 on #fff */
  --olive:#788c5d;
  --sky:#6a9bcc;
  --fig:#c46686;
  --oat:#e3dacc;
  --cactus:#bcd1ca;
  --heather:#cbcadb;
  --coral:#ebcece;
  --iris:#dfdbfd;
  --iris-deep:#4a3aa7;
  --periwinkle:#cde2fb;
  --periwinkle-deep:#184f95;

  /* Editorial dark-slate progress band [ANTH] */
  --band-bg:#141413;
  --band-border:#30302e;
  --band-ink:#faf9f5;
  --band-muted:#b0aea5;
  --band-track:#30302e;
  --band-accent:#d97757; /* 5.90:1 on #141413 */
  --bar-done:#92ab70;    /* 5.22:1 on #30302e */
  --bar-doing:#a396f2;   /* 5.17:1 on #30302e */
  --bar-todo:#7aa8d6;    /* 5.29:1 on #30302e */

  /* Semantic status indicators (separate from clay accent) */
  --st-todo:#184f95;
  --st-doing:#4a3aa7;
  --st-done:#4a6332;

  /* Priority & status tags (all >= 4.5:1) */
  --p-high-bg:#ebcece;
  --p-high-fg:#781f3d; /* substitutes #c46686 (3.56:1); 6.91:1 on #ebcece */
  --p-mid-bg:#e3dacc;
  --p-mid-fg:#543c14;  /* 7.46:1 on #e3dacc */
  --p-low-bg:#f0eee6;
  --p-low-fg:#5e5d59;  /* 5.67:1 on #f0eee6 */
  --doing-bg:#dfdbfd;
  --doing-fg:#4a3aa7;  /* 6.39:1 on #dfdbfd */
  --late-bg:#ebcece;
  --late-fg:#781f3d;   /* 6.91:1 on #ebcece */
  --late-edge:#a63a5e; /* 6.20:1 on #ffffff */
  --due-bg:#f5f4ed;
  --due-fg:#3d3d3a;    /* 9.88:1 on #f5f4ed */
  --card-done-bg:#f5f4ed;

  /* Shape, type, motion */
  --radius-xs:4px;
  --radius-ctl:8px;
  --radius-card:10px;
  --radius-lane:12px;
  --radius-pill:999px;
  --shadow-card:0 1px 2px rgba(20,20,19,.04);
  --shadow-hover:0 4px 12px rgba(20,20,19,.07);
  --font-serif:"Newsreader","Source Serif 4",Georgia,serif;
  --font-sans:"Inter","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141413;
    --surface:#262624;
    --surface-2:#1f1e1d;
    --surface-3:#30302e;
    --line:#30302e;
    --line-2:#4d4c48;
    --line-ctl:#87867f;
    --ink:#faf9f5;
    --ink-2:#dedcd1;
    --ink-hover:#dedcd1;
    --muted:#b0aea5;
    --accent:#d97757;
    --accent-interactive:#e08a6c;
    --accent-text:#eba289;
    --band-bg:#1f1e1d;
    --band-border:#30302e;
    --band-ink:#faf9f5;
    --band-muted:#b0aea5;
    --band-track:#30302e;
    --band-accent:#e08a6c;
    --st-todo:#7aa8d6;
    --st-doing:#a396f2;
    --st-done:#92ab70;
    --p-high-bg:#3c222a;
    --p-high-fg:#f5b8ca;
    --p-mid-bg:#332b1f;
    --p-mid-fg:#ebd2a7;
    --p-low-bg:#30302e;
    --p-low-fg:#c2c0b6;
    --doing-bg:#2c2747;
    --doing-fg:#d5cffd;
    --late-bg:#3c222a;
    --late-fg:#f5b8ca;
    --late-edge:#c46686;
    --due-bg:#30302e;
    --due-fg:#dedcd1;
    --card-done-bg:#1f1e1d;
    --shadow-card:none;
    --shadow-hover:0 6px 18px rgba(0,0,0,.28);
  }
}

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141413;
  --surface:#262624;
  --surface-2:#1f1e1d;
  --surface-3:#30302e;
  --line:#30302e;
  --line-2:#4d4c48;
  --line-ctl:#87867f;
  --ink:#faf9f5;
  --ink-2:#dedcd1;
  --ink-hover:#dedcd1;
  --muted:#b0aea5;
  --accent:#d97757;
  --accent-interactive:#e08a6c;
  --accent-text:#eba289;
  --band-bg:#1f1e1d;
  --band-border:#30302e;
  --band-ink:#faf9f5;
  --band-muted:#b0aea5;
  --band-track:#30302e;
  --band-accent:#e08a6c;
  --st-todo:#7aa8d6;
  --st-doing:#a396f2;
  --st-done:#92ab70;
  --p-high-bg:#3c222a;
  --p-high-fg:#f5b8ca;
  --p-mid-bg:#332b1f;
  --p-mid-fg:#ebd2a7;
  --p-low-bg:#30302e;
  --p-low-fg:#c2c0b6;
  --doing-bg:#2c2747;
  --doing-fg:#d5cffd;
  --late-bg:#3c222a;
  --late-fg:#f5b8ca;
  --late-edge:#c46686;
  --due-bg:#30302e;
  --due-fg:#dedcd1;
  --card-done-bg:#1f1e1d;
  --shadow-card:none;
  --shadow-hover:0 6px 18px rgba(0,0,0,.28);
}

*,*::before,*::after{box-sizing:border-box}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 1rem/1.5 var(--font-sans);
  font-synthesis-weight:none;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:clip;
}

.wrap{
  max-width:1280px;
  margin:0 auto;
  padding:clamp(24px,4vw,40px) max(16px,env(safe-area-inset-right,0px)) clamp(44px,6vw,64px) max(16px,env(safe-area-inset-left,0px));
}

/* Header */
.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.head-copy{min-width:0;flex:1 1 260px}
h1{
  margin:0 0 6px;
  font-family:var(--font-serif);
  font-optical-sizing:auto;
  font-weight:400;
  font-size:clamp(2rem,4.5vw,3rem);
  line-height:1.12;
  letter-spacing:-.015em;
  text-wrap:balance;
}
.sub{
  margin:0;
  color:var(--muted);
  font-size:.9375rem;
  max-width:60ch;
}
.theme-btn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line-ctl);
  border-radius:var(--radius-pill);
  background:var(--surface-2);
  color:var(--ink-2);
  padding:7px 14px;
  font:500 .8125rem/1.4 var(--font-sans);
  letter-spacing:.01em;
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
  white-space:nowrap;
}
.theme-btn:hover{
  background:var(--surface-3);
  color:var(--ink);
  border-color:var(--ink-2);
}
.theme-btn svg{width:15px;height:15px;flex:none}

/* Progress card: Anthropic dark-slate editorial band */
.progress{
  background:var(--band-bg);
  color:var(--band-ink);
  border:1px solid var(--band-border);
  border-radius:var(--radius-lane);
  padding:clamp(18px,3vw,26px) clamp(18px,3vw,28px);
  margin-bottom:20px;
}
.pg-top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px 24px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.pg-metric{min-width:0}
.pg-label{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:.75rem;
  font-weight:500;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--band-accent);
  margin-bottom:6px;
}
.pg-label::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--band-accent);
}
.pg-num{
  font-family:var(--font-serif);
  font-optical-sizing:auto;
  font-size:clamp(2.25rem,5vw,3.25rem);
  font-weight:500;
  line-height:1.05;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:4px 12px;
}
.pg-num small{
  font-family:var(--font-sans);
  font-size:.9375rem;
  font-weight:400;
  letter-spacing:0;
  color:var(--band-muted);
}
.pg-note{
  color:var(--band-muted);
  font-size:.9375rem;
  margin:0;
  text-align:right;
}
.bar{
  display:flex;
  height:10px;
  border-radius:var(--radius-pill);
  overflow:hidden;
  background:var(--band-track);
  gap:2px;
}
.bar span{
  display:block;
  min-width:0;
  transition:flex-grow .3s ease;
}
.bar .b-done{background:var(--bar-done)}
.bar .b-doing{background:var(--bar-doing)}
.bar .b-todo{background:var(--bar-todo)}
.pg-legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 20px;
  margin-top:12px;
  font-size:.8125rem;
  color:var(--band-muted);
  font-variant-numeric:tabular-nums;
}
.pg-legend-item{
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.pg-legend-item i{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  flex:none;
}
.pg-legend-item.l-done i{background:var(--bar-done)}
.pg-legend-item.l-doing i{background:var(--bar-doing)}
.pg-legend-item.l-todo i{background:var(--bar-todo)}

/* Add task form */
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:10px;
  padding:12px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lane);
  margin-bottom:18px;
  box-shadow:var(--shadow-card);
}
input,select,button{font:inherit;color:inherit}
.add input,.add select{
  background:var(--bg);
  color:var(--ink);
  border:1px solid var(--line-ctl);
  border-radius:var(--radius-ctl);
  padding:9px 12px;
  font-size:.9375rem;
  min-width:0;
  width:100%;
  transition:border-color .15s ease,background .15s ease;
}
.add input::placeholder{color:var(--muted)}
.add input:hover,.add select:hover{border-color:var(--ink-2)}
.btn{
  border:0;
  border-radius:var(--radius-pill);
  padding:10px 20px;
  font:500 .875rem/1.4 var(--font-sans);
  letter-spacing:.01em;
  background:var(--ink);
  color:var(--bg);
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s ease,transform .12s ease;
}
.btn:hover{background:var(--ink-hover)}
.btn:active{transform:translateY(1px)}

:focus-visible{
  outline:2px solid var(--accent-interactive);
  outline-offset:2px;
}

/* Controls bar: view switcher & priority filter chips */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px 16px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.seg{
  display:inline-flex;
  flex-wrap:wrap;
  gap:2px;
  padding:3px;
  background:var(--surface-2);
  border:1px solid var(--line-ctl);
  border-radius:var(--radius-pill);
  max-width:100%;
}
.seg button{
  background:transparent;
  border:0;
  border-radius:var(--radius-pill);
  padding:6px 15px;
  cursor:pointer;
  color:var(--ink-2);
  font:500 .8125rem/1.4 var(--font-sans);
  letter-spacing:.01em;
  transition:background .15s ease,color .15s ease;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{
  background:var(--ink);
  color:var(--bg);
}

.filters{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.filters-label{
  font-size:.8125rem;
  color:var(--muted);
  margin-right:2px;
}
.chip{
  background:var(--surface-2);
  border:1px solid var(--line-ctl);
  border-radius:var(--radius-pill);
  padding:5px 14px;
  cursor:pointer;
  font:500 .8125rem/1.4 var(--font-sans);
  letter-spacing:.01em;
  color:var(--ink-2);
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.chip:hover{
  background:var(--surface-3);
  color:var(--ink);
  border-color:var(--ink-2);
}
.chip[aria-pressed="true"]{
  background:var(--ink);
  color:var(--bg);
  border-color:var(--ink);
}

/* Week navigation */
.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.weeknav .nav-btn{
  background:var(--surface-2);
  border:1px solid var(--line-ctl);
  border-radius:var(--radius-pill);
  padding:5px 13px;
  cursor:pointer;
  font:500 .8125rem/1.4 var(--font-sans);
  color:var(--ink-2);
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.weeknav .nav-btn:hover{
  background:var(--surface-3);
  color:var(--ink);
  border-color:var(--ink-2);
}
.weeknav .lbl{
  font-family:var(--font-serif);
  font-optical-sizing:auto;
  font-size:1.125rem;
  font-weight:500;
  letter-spacing:-.01em;
  margin-left:4px;
  font-variant-numeric:tabular-nums;
}

/* Board & columns */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  align-items:start;
}
.col{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-lane);
  padding:14px;
  min-height:200px;
  min-width:0;
  transition:background .15s ease,border-color .15s ease;
}
.col.over{
  background:var(--surface);
  border-color:var(--accent-interactive);
  box-shadow:inset 0 0 0 1px var(--accent-interactive);
}
.col-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:2px 2px 12px;
  margin-bottom:12px;
  border-bottom:1px solid var(--line);
}
.col-head i{
  width:8px;
  height:8px;
  border-radius:50%;
  display:block;
  flex:none;
}
.col-head h2{
  margin:0;
  font-family:var(--font-serif);
  font-optical-sizing:auto;
  font-size:1.125rem;
  font-weight:500;
  line-height:1.25;
  letter-spacing:-.01em;
  text-wrap:balance;
}
.col-head .count{
  margin-left:auto;
  font-size:.75rem;
  font-weight:500;
  font-variant-numeric:tabular-nums;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-pill);
  padding:1px 9px;
}
.col[data-s="todo"] .col-head i{background:var(--st-todo)}
.col[data-s="doing"] .col-head i{background:var(--st-doing)}
.col[data-s="done"] .col-head i{background:var(--st-done)}

/* Cards: calm paper surface, hairline border, no left accent rail */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  padding:12px 13px;
  margin-bottom:10px;
  box-shadow:var(--shadow-card);
  cursor:grab;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
.card:last-child{margin-bottom:0}
.card:hover{
  border-color:var(--line-ctl);
  box-shadow:var(--shadow-hover);
}
.card:active{cursor:grabbing}
.card.dragging{
  opacity:.45;
  border-style:dashed;
  border-color:var(--accent-interactive);
}
.card .t{
  font-size:.9375rem;
  font-weight:500;
  line-height:1.45;
  color:var(--ink);
  overflow-wrap:anywhere;
}
.card.is-done{
  background:var(--card-done-bg);
  box-shadow:none;
}
.card.is-done .t{
  text-decoration:line-through;
  text-decoration-color:var(--muted);
  color:var(--muted);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:.75rem;
  font-weight:500;
  line-height:1.35;
  border-radius:var(--radius-xs);
  padding:2px 8px;
  border:1px solid transparent;
  font-variant-numeric:tabular-nums;
}
.tag-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  flex:none;
  background:currentColor;
}
.tag.prio-high{background:var(--p-high-bg);color:var(--p-high-fg)}
.tag.prio-mid{background:var(--p-mid-bg);color:var(--p-mid-fg)}
.tag.prio-low{background:var(--p-low-bg);color:var(--p-low-fg)}
.tag.status-doing{background:var(--doing-bg);color:var(--doing-fg)}
.tag.due{background:var(--due-bg);color:var(--due-fg);border-color:var(--line-2)}
.tag.late{
  background:var(--late-bg);
  color:var(--late-fg);
  border-color:var(--late-edge);
  font-weight:600;
}

.acts{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:2px;
}
.acts button{
  background:transparent;
  border:1px solid transparent;
  border-radius:var(--radius-pill);
  width:30px;
  height:30px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--muted);
  font-size:.95rem;
  line-height:1;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.acts button:hover:not(:disabled){
  background:var(--surface-2);
  border-color:var(--line-2);
  color:var(--ink);
}
.acts button:disabled{
  opacity:.3;
  cursor:default;
}

.empty{
  color:var(--muted);
  font-size:.875rem;
  text-align:center;
  padding:22px 10px;
}

/* Week view */
[hidden]{display:none!important}
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
  align-items:start;
}
.week .col{
  padding:10px;
  min-height:185px;
}
.week .col-head{
  flex-wrap:wrap;
  gap:3px 6px;
  padding-bottom:9px;
  margin-bottom:10px;
}
.week .col-head h2{font-size:.95rem}
.week .card{
  padding:9px 10px;
  margin-bottom:8px;
}
.week .card .t{font-size:.875rem}
.dsub{
  font-size:.75rem;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.col.today{
  background:var(--surface);
  border-color:var(--accent-interactive);
  box-shadow:inset 0 0 0 1px var(--accent-interactive);
}
.col.today .dsub{
  color:var(--accent-text);
  font-weight:600;
}
.addday{
  width:100%;
  margin-top:8px;
  background:transparent;
  border:1px dashed var(--line-ctl);
  border-radius:var(--radius-pill);
  padding:6px 10px;
  color:var(--ink-2);
  cursor:pointer;
  font:500 .8125rem/1.35 var(--font-sans);
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.addday:hover{
  background:var(--surface-3);
  border-color:var(--ink);
  color:var(--ink);
}

.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:16px;
  align-items:start;
}

/* Responsive layout (verified down to 400px with zero horizontal scroll) */
@media (max-width:1120px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .board,.week,.extra{grid-template-columns:1fr}
  .add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .add input[type=text]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
  .pg-note{text-align:left}
}
@media (max-width:460px){
  .add{grid-template-columns:1fr}
  .toolbar{align-items:stretch}
  .seg{width:100%;justify-content:space-between}
  .seg button{flex:1 1 auto;text-align:center}
}

/* Accessibility fallbacks */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important;
  }
}

@media (prefers-reduced-transparency:reduce){
  .card.dragging{opacity:1;border-width:2px}
  .acts button:disabled{opacity:1;color:var(--muted)}
}

@media (forced-colors:active){
  body{background:Canvas;color:CanvasText}
  .progress,.add,.col,.card,.seg,.chip,.nav-btn,.theme-btn,.addday,.tag,.col-head .count{
    background:Canvas;
    color:CanvasText;
    border:1px solid CanvasText;
    box-shadow:none;
  }
  .btn,.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{
    background:Highlight;
    color:HighlightText;
    border:1px solid Highlight;
    forced-color-adjust:none;
  }
  .col.today,.col.over{border:2px solid Highlight}
  .bar{border:1px solid CanvasText;background:Canvas}
  .bar .b-done{background:Highlight;forced-color-adjust:none}
  .bar .b-doing{background:CanvasText;forced-color-adjust:none}
  .bar .b-todo{background:GrayText;forced-color-adjust:none}
  .acts button:disabled{color:GrayText;opacity:1}
  :focus-visible{outline:2px solid Highlight;outline-offset:2px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="page-head">
    <div class="head-copy">
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Chuyển giao diện sáng tối" aria-pressed="false">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
      </svg>
      <span id="themeText">Giao diện tối</span>
    </button>
  </header>

  <section class="progress" aria-label="Tiến độ">
    <div class="pg-top">
      <div class="pg-metric">
        <div class="pg-label">Tiến độ</div>
        <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
      </div>
      <p class="pg-note" id="note"></p>
    </div>
    <div class="bar" aria-hidden="true"><span class="b-done" id="bDone"></span><span class="b-doing" id="bDoing"></span><span class="b-todo" id="bTodo"></span></div>
    <div class="pg-legend" aria-hidden="true">
      <span class="pg-legend-item l-done"><i></i><span id="lDone">Hoàn thành: 0</span></span>
      <span class="pg-legend-item l-doing"><i></i><span id="lDoing">Đang làm: 0</span></span>
      <span class="pg-legend-item l-todo"><i></i><span id="lTodo">Cần làm: 0</span></span>
    </div>
  </section>

  <section class="add" aria-label="Thêm công việc mới">
    <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
    <select id="prio" aria-label="Mức ưu tiên">
      <option value="high">Ưu tiên cao</option>
      <option value="mid" selected>Ưu tiên vừa</option>
      <option value="low">Ưu tiên thấp</option>
    </select>
    <input type="date" id="due" aria-label="Hạn hoàn thành">
    <button type="button" class="btn" id="addBtn">Thêm việc</button>
  </section>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Chế độ xem">
      <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
      <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <span class="filters-label">Ưu tiên:</span>
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="nav-btn" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="nav-btn" id="thisW">Tuần này</button>
    <button type="button" class="nav-btn" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="week" id="week" hidden></div>
  <div class="extra" id="extra" hidden></div>
</main>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var tasks=[],filter="all",dragId=null;

  function load(){
    try{
      var r=localStorage.getItem(KEY);
      if(r){
        var parsed=JSON.parse(r);
        if(Array.isArray(parsed)){tasks=parsed;return;}
      }
    }catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(text!=null)e.textContent=text;
    return e;
  }
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    x.setDate(x.getDate()-((x.getDay()+6)%7));
    return x;
  }
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function prioTag(p){
    var tag=el("span","tag prio-"+p);
    tag.appendChild(el("span","tag-dot"));
    tag.appendChild(document.createTextNode(PL[p]||PL.mid));
    return tag;
  }

  function card(t){
    var c=el("article","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;
    c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));

    var m=el("div","meta");
    m.appendChild(prioTag(t.p));
    if(view==="week"&&t.s==="doing"){
      m.appendChild(el("span","tag status-doing","Đang làm"));
    }
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late){
        m.appendChild(el("span","tag "+(late?"late":"due"),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
      }
    }

    var a=el("div","acts");
    var i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button",null,"×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");

    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};

    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");
      K.type="button";
      K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";
      K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else{
      a.append(L,R,X);
    }
    m.appendChild(a);
    c.appendChild(m);

    c.addEventListener("dragstart",function(e){
      dragId=t.id;
      c.classList.add("dragging");
      try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}
    });
    c.addEventListener("dragend",function(){
      c.classList.remove("dragging");
      dragId=null;
      document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")});
    });
    return c;
  }

  function move(id,s){
    tasks.forEach(function(t){if(t.id===id)t.s=s});
    save();
    render();
  }

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();

    var b=document.getElementById("board");
    b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("section","col");
      col.dataset.s=c[0];
      col.setAttribute("aria-label",c[1]);
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");
      h.appendChild(el("i"));
      h.appendChild(el("h2",null,c[1]));
      h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length){
        col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      }
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });

    var n=tasks.length;
    var d=tasks.filter(function(t){return t.s==="done"}).length;
    var g=tasks.filter(function(t){return t.s==="doing"}).length;
    var o=n-d-g;
    var pct=n?Math.round(d/n*100):0;

    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    document.getElementById("lDone").textContent="Hoàn thành: "+d;
    document.getElementById("lDoing").textContent="Đang làm: "+g;
    document.getElementById("lTodo").textContent="Cần làm: "+o;

    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){
    tasks.forEach(function(t){if(t.id===id)t.d=d});
    save();
    render();
  }

  function dayCol(title,sub,list,dateVal,cls){
    var col=el("section","col"+(cls||""));
    col.setAttribute("aria-label",title+(sub?" "+sub:""));
    var h=el("div","col-head");
    h.appendChild(el("h2",null,title));
    if(sub)h.appendChild(el("span","dsub",sub));
    h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");
      A.type="button";
      A.onclick=function(){
        document.getElementById("due").value=dateVal;
        document.getElementById("title").focus();
      };
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }

  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");
    W.textContent="";
    E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"];
    var tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }

  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return;}
    tasks.push({
      id:Date.now(),
      t:v,
      p:document.getElementById("prio").value,
      s:"todo",
      d:document.getElementById("due").value
    });
    inp.value="";
    document.getElementById("due").value="";
    save();
    render();
    inp.focus();
  }

  /* Theme switcher synced with data-theme and prefers-color-scheme */
  var themeBtn=document.getElementById("themeBtn");
  var themeText=document.getElementById("themeText");
  var themeIcon=document.getElementById("themeIcon");
  var mqDark=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;

  function currentTheme(){
    var explicit=document.documentElement.getAttribute("data-theme");
    if(explicit==="dark"||explicit==="light")return explicit;
    return mqDark&&mqDark.matches?"dark":"light";
  }
  function syncThemeUI(){
    var dark=currentTheme()==="dark";
    themeBtn.setAttribute("aria-pressed",String(dark));
    themeText.textContent=dark?"Giao diện sáng":"Giao diện tối";
    themeIcon.textContent="";
    if(dark){
      var c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx","12");c.setAttribute("cy","12");c.setAttribute("r","4");
      var p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d","M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41");
      themeIcon.append(c,p);
    }else{
      var m=document.createElementNS("http://www.w3.org/2000/svg","path");
      m.setAttribute("d","M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z");
      themeIcon.append(m);
    }
  }
  function initTheme(){
    try{
      var saved=localStorage.getItem(THEME_KEY);
      if(saved==="light"||saved==="dark"){
        document.documentElement.setAttribute("data-theme",saved);
      }
    }catch(e){}
    syncThemeUI();
    if(mqDark&&mqDark.addEventListener){
      mqDark.addEventListener("change",syncThemeUI);
    }
  }
  themeBtn.onclick=function(){
    var next=currentTheme()==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem(THEME_KEY,next)}catch(e){}
    syncThemeUI();
  };

  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){
      view=b.dataset.v;
      document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
      render();
    };
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};

  initTheme();
  load();
  render();
})();
</script>
</body>
</html>
