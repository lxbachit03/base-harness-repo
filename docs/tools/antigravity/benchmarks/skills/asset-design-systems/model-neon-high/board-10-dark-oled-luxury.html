<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* Dark OLED Luxury base tokens */
  --lx-obsidian:#0a0a0a;
  --lx-onyx:#111111;
  --lx-charcoal:#1a1a1a;
  --lx-graphite:#252525;
  --lx-smoke:#333333;
  --lx-black:#000000; /* OLED canvas under visual gauge/track only; text sits on obsidian+ */
  --lx-gold:#d4af37;
  --lx-gold-antique:#c5a258;
  --lx-gold-pale:#e8d48b;
  --lx-rose:#b76e79;
  --lx-ivory:#f5f0e1;
  --lx-warm-white:#e8e0d0;
  --lx-muted:#8a8070;
  --lx-burgundy:#6b1024;
  --lx-emerald:#1b5e3b;
  --lx-sapphire:#1a3a5c;
  --lx-border:rgba(255,255,255,.12);
  --lx-gold-line:rgba(212,175,55,.35);
  --font-display:"Playfair Display","Bodoni Moda","Cormorant Garamond",Georgia,serif;
  --font-body:"Montserrat","Raleway",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --section-gap:clamp(40px,6vw,72px);
  --pad-block:clamp(24px,4vw,48px);
  --max:1160px;

  /* Semantic surfaces & contrast-verified substitutions */
  --bg-canvas:var(--lx-obsidian);
  --bg-panel:var(--lx-onyx);
  --bg-card:var(--lx-charcoal);
  --bg-elevated:var(--lx-graphite);
  --bg-track:var(--lx-black);
  --bg-dock-glass:rgba(17,17,17,.88);

  --ink-primary:var(--lx-ivory);
  --ink-secondary:var(--lx-warm-white);
  /* Substituted #a89f8f for --lx-muted (#8a8070 fails 4.5:1 on #1a1a1a and #252525) */
  --ink-muted:#a89f8f;
  --ink-on-gold:var(--lx-obsidian);
  --ink-on-jewel:var(--lx-ivory);

  --accent-gold:var(--lx-gold);
  --accent-gold-soft:var(--lx-gold-antique);
  --accent-gold-bright:var(--lx-gold-pale);
  /* Substituted #d9929d for --lx-rose (#b76e79 fails 4.5:1 on #252525) */
  --status-high:#d9929d;
  --status-mid:var(--lx-gold);
  --status-low:#a89f8f;
  --status-todo:#8ab0d6;
  --status-doing:var(--lx-gold);
  --status-done:#6fb38d;
  --late-bg:var(--lx-burgundy);
  --late-ink:var(--lx-ivory);

  /* Decorative vs interactive edges (>=3:1 on #1a1a1a for controls) */
  --hairline:var(--lx-border);
  --hairline-gold:var(--lx-gold-line);
  --edge-control:#787066;
  --edge-gold:rgba(212,175,55,.55);
  --focus-ring:var(--lx-gold-pale);

  --spot-glow:rgba(212,175,55,.12);
  --today-glow:rgba(212,175,55,.08);
  --shadow-warm:0 16px 36px rgba(0,0,0,.55),0 1px 0 rgba(212,175,55,.08);
  --shadow-card:0 8px 20px rgba(0,0,0,.42),0 1px 0 rgba(212,175,55,.05);
  --grain-opacity:.04;
  --gold-gradient:linear-gradient(135deg,#bf953f,#fcf6ba 30%,#b38728 50%,#fbf5b7 70%,#aa771c);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* Light Luxury counterpart (honours prefers-color-scheme and manual [data-theme]; never filter:invert) */
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg-canvas:#f5f0e1;
    --bg-panel:#ede6d6;
    --bg-card:#faf7ef;
    --bg-elevated:#e4dcc8;
    --bg-track:#dcd3be;
    --bg-dock-glass:rgba(237,230,214,.92);

    --ink-primary:#141210;
    --ink-secondary:#2e2a24;
    --ink-muted:#5c5448;
    --ink-on-gold:#faf7ef;
    --ink-on-jewel:#faf7ef;

    --accent-gold:#765912;
    --accent-gold-soft:#6b5010;
    --accent-gold-bright:#5a430c;
    --status-high:#8c1d35;
    --status-mid:#765912;
    --status-low:#5c5448;
    --status-todo:#1a3a5c;
    --status-doing:#765912;
    --status-done:#1b5e3b;
    --late-bg:#6b1024;
    --late-ink:#faf7ef;

    --hairline:rgba(20,18,16,.14);
    --hairline-gold:rgba(118,89,18,.34);
    --edge-control:#756b5d;
    --edge-gold:#765912;
    --focus-ring:#765912;

    --spot-glow:rgba(181,142,46,.14);
    --today-glow:rgba(118,89,18,.08);
    --shadow-warm:0 14px 32px rgba(20,18,16,.08),0 1px 0 rgba(118,89,18,.14);
    --shadow-card:0 4px 14px rgba(20,18,16,.06),0 1px 0 rgba(118,89,18,.08);
    --grain-opacity:.025;
    --gold-gradient:linear-gradient(135deg,#5a430c,#8b6918 45%,#4d3808 85%);
  }
}

:root[data-theme="light"]{
  color-scheme:light;
  --bg-canvas:#f5f0e1;
  --bg-panel:#ede6d6;
  --bg-card:#faf7ef;
  --bg-elevated:#e4dcc8;
  --bg-track:#dcd3be;
  --bg-dock-glass:rgba(237,230,214,.92);

  --ink-primary:#141210;
  --ink-secondary:#2e2a24;
  --ink-muted:#5c5448;
  --ink-on-gold:#faf7ef;
  --ink-on-jewel:#faf7ef;

  --accent-gold:#765912;
  --accent-gold-soft:#6b5010;
  --accent-gold-bright:#5a430c;
  --status-high:#8c1d35;
  --status-mid:#765912;
  --status-low:#5c5448;
  --status-todo:#1a3a5c;
  --status-doing:#765912;
  --status-done:#1b5e3b;
  --late-bg:#6b1024;
  --late-ink:#faf7ef;

  --hairline:rgba(20,18,16,.14);
  --hairline-gold:rgba(118,89,18,.34);
  --edge-control:#756b5d;
  --edge-gold:#765912;
  --focus-ring:#765912;

  --spot-glow:rgba(181,142,46,.14);
  --today-glow:rgba(118,89,18,.08);
  --shadow-warm:0 14px 32px rgba(20,18,16,.08),0 1px 0 rgba(118,89,18,.14);
  --shadow-card:0 4px 14px rgba(20,18,16,.06),0 1px 0 rgba(118,89,18,.08);
  --grain-opacity:.025;
  --gold-gradient:linear-gradient(135deg,#5a430c,#8b6918 45%,#4d3808 85%);
}

:root[data-theme="dark"]{
  color-scheme:dark;
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  background:var(--bg-canvas);
}

*,*::before,*::after{box-sizing:inherit}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg-canvas);
  color:var(--ink-primary);
  font-family:var(--font-body);
  font-weight:400;
  letter-spacing:.025em;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:clip;
}

/* Signature Dark OLED Luxury surfaces */
.lx-spot{
  background:
    radial-gradient(ellipse 80% 380px at 50% 0%,var(--spot-glow),transparent 65%),
    var(--bg-canvas);
}

.lx-velvet{position:relative}
.lx-velvet::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  mix-blend-mode:overlay;
  opacity:var(--grain-opacity);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.lx-gold-text{
  background:var(--gold-gradient);
  -webkit-background-clip:text;
  background-clip:text;
  color:var(--accent-gold);
  -webkit-text-fill-color:transparent;
}

.lx-frame{
  border:1px solid var(--edge-gold);
  outline:1px solid var(--hairline-gold);
  outline-offset:5px;
}

.wrap{
  position:relative;
  z-index:1;
  max-width:var(--max);
  margin:0 auto;
  padding:var(--pad-block) clamp(16px,3.2vw,32px) calc(var(--pad-block) + 16px);
}

/* Editorial masthead */
.masthead{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:start;
  gap:16px;
  margin-bottom:clamp(28px,4vw,42px);
}
.masthead-spacer{min-width:0}
.masthead-center{
  text-align:center;
  min-width:0;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
  font-size:11px;
  font-weight:500;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--accent-gold-soft);
}
.eyebrow::before,.eyebrow::after{
  content:"";
  width:28px;
  height:1px;
  background:var(--edge-gold);
}
h1{
  font-family:var(--font-display);
  font-size:clamp(32px,5vw,52px);
  font-weight:600;
  letter-spacing:.02em;
  line-height:1.12;
  margin:0 0 10px;
}
.sub{
  color:var(--ink-muted);
  font-size:14px;
  font-weight:400;
  margin:0 auto;
  max-width:520px;
  letter-spacing:.03em;
}
.masthead-actions{
  display:flex;
  justify-content:flex-end;
  align-items:flex-start;
  min-width:0;
}
.theme-toggle{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--bg-card);
  color:var(--ink-secondary);
  border:1px solid var(--edge-control);
  border-radius:2px;
  padding:8px 14px;
  font-size:12px;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:border-color .2s ease,background-color .2s ease,color .2s ease;
}
.theme-toggle:hover{
  background:var(--bg-elevated);
  border-color:var(--edge-gold);
  color:var(--ink-primary);
}
.theme-toggle svg{
  width:14px;
  height:14px;
  flex-shrink:0;
}

/* Hero Progress Suite */
.progress{
  position:relative;
  background:var(--bg-card);
  border-radius:3px;
  padding:clamp(20px,3vw,30px) clamp(18px,3vw,32px);
  margin:6px 6px clamp(26px,4vw,36px);
  box-shadow:var(--shadow-warm);
}
.pg-grid{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:clamp(18px,3vw,32px);
  align-items:center;
}
.gauge-wrap{
  position:relative;
  width:92px;
  height:92px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--bg-track);
  border:1px solid var(--edge-gold);
  display:grid;
  place-items:center;
}
.gauge-svg{
  width:84px;
  height:84px;
  transform:rotate(-90deg);
}
.gauge-track{
  fill:none;
  stroke:var(--hairline);
  stroke-width:4;
}
.gauge-fill{
  fill:none;
  stroke:var(--accent-gold);
  stroke-width:4;
  stroke-linecap:butt;
  transition:stroke-dashoffset .45s cubic-bezier(.22,1,.36,1);
}
.gauge-core{
  position:absolute;
  font-family:var(--font-display);
  font-size:15px;
  font-weight:600;
  color:var(--accent-gold-bright);
  letter-spacing:.02em;
}
.pg-body{min-width:0}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px 20px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.pg-num{
  font-family:var(--font-display);
  font-size:clamp(34px,5.2vw,52px);
  font-weight:600;
  line-height:1;
  letter-spacing:.01em;
  color:var(--ink-primary);
}
.pg-num small{
  font-family:var(--font-body);
  font-size:13px;
  font-weight:500;
  color:var(--ink-muted);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-left:12px;
  vertical-align:middle;
}
.pg-note{
  color:var(--ink-secondary);
  font-size:13px;
  font-weight:400;
  letter-spacing:.03em;
}
.bar{
  display:flex;
  height:10px;
  border-radius:2px;
  overflow:hidden;
  background:var(--bg-track);
  border:1px solid var(--edge-control);
  gap:2px;
  padding:1px;
}
.bar span{
  display:block;
  min-width:0;
  transition:flex-grow .4s cubic-bezier(.22,1,.36,1);
}
.bar .b-done{background:var(--status-done)}
.bar .b-doing{background:var(--status-doing)}
.bar .b-todo{background:var(--status-todo)}

.pg-legend{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:12px;
  font-size:12px;
  color:var(--ink-muted);
  letter-spacing:.05em;
}
.pg-legend span{
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.pg-legend i{
  width:8px;
  height:8px;
  border-radius:1px;
  display:inline-block;
}
.pg-legend .l-done{background:var(--status-done)}
.pg-legend .l-doing{background:var(--status-doing)}
.pg-legend .l-todo{background:var(--status-todo)}

/* Composer dock */
.dock{
  background:var(--bg-panel);
  border:1px solid var(--hairline);
  border-top:1px solid var(--edge-gold);
  border-radius:3px;
  padding:16px;
  margin-bottom:20px;
  box-shadow:var(--shadow-card);
}
@supports (backdrop-filter:blur(10px)){
  .dock{
    background:var(--bg-dock-glass);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:10px;
  align-items:stretch;
}
input,select,button{
  font:inherit;
  color:inherit;
}
.add input,.add select{
  background:var(--bg-card);
  color:var(--ink-primary);
  border:1px solid var(--edge-control);
  border-radius:2px;
  padding:11px 14px;
  min-width:0;
  font-size:14px;
  letter-spacing:.02em;
  transition:border-color .2s ease,background-color .2s ease;
}
.add input::placeholder{
  color:var(--ink-muted);
  opacity:1;
}
.add input:hover,.add select:hover{
  border-color:var(--edge-gold);
  background:var(--bg-elevated);
}
.btn{
  position:relative;
  overflow:hidden;
  background:var(--accent-gold);
  color:var(--ink-on-gold);
  border:1px solid var(--accent-gold);
  border-radius:2px;
  padding:11px 22px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  cursor:pointer;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,transform .15s ease;
}
.btn:hover{
  background:var(--accent-gold-bright);
  border-color:var(--accent-gold-bright);
}
.btn:active{transform:translateY(1px)}

/* Subtle gold shimmer strictly gated on motion preference */
@media (prefers-reduced-motion:no-preference){
  .btn::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.28) 50%,transparent 75%);
    transform:translateX(-120%);
    transition:transform .6s ease;
    pointer-events:none;
  }
  .btn:hover::after{transform:translateX(120%)}
}

/* Focus ring */
:focus-visible{
  outline:2px solid var(--focus-ring);
  outline-offset:2px;
}

/* View switcher, priority filters & week navigation */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px 18px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.views{margin:0;min-width:0}
.seg{
  display:inline-flex;
  max-width:100%;
  background:var(--bg-panel);
  border:1px solid var(--edge-control);
  border-radius:2px;
  overflow:hidden;
}
.seg button{
  background:transparent;
  border:0;
  border-right:1px solid var(--hairline);
  padding:9px 18px;
  font-size:12px;
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-muted);
  cursor:pointer;
  transition:background-color .2s ease,color .2s ease;
}
.seg button:last-child{border-right:0}
.seg button:hover{
  background:var(--bg-card);
  color:var(--ink-primary);
}
.seg button[aria-pressed="true"]{
  background:var(--accent-gold);
  color:var(--ink-on-gold);
  font-weight:600;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin:0;
  min-width:0;
}
.chip{
  background:var(--bg-panel);
  border:1px solid var(--edge-control);
  border-radius:2px;
  padding:7px 14px;
  cursor:pointer;
  font-size:12px;
  font-weight:500;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--ink-muted);
  transition:border-color .2s ease,background-color .2s ease,color .2s ease;
}
.chip:hover{
  background:var(--bg-card);
  border-color:var(--edge-gold);
  color:var(--ink-primary);
}
.chip[aria-pressed="true"]{
  background:var(--bg-elevated);
  border-color:var(--accent-gold);
  color:var(--accent-gold-bright);
  box-shadow:inset 0 -2px 0 var(--accent-gold);
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  flex-wrap:wrap;
  padding:12px 14px;
  background:var(--bg-panel);
  border:1px solid var(--hairline);
  border-radius:3px;
}
.weeknav .nav-btn{
  background:var(--bg-card);
  border:1px solid var(--edge-control);
  border-radius:2px;
  padding:7px 13px;
  cursor:pointer;
  font-size:12px;
  font-weight:500;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--ink-secondary);
  transition:border-color .2s ease,background-color .2s ease,color .2s ease;
}
.weeknav .nav-btn:hover{
  background:var(--bg-elevated);
  border-color:var(--edge-gold);
  color:var(--ink-primary);
}
.weeknav .lbl{
  font-family:var(--font-display);
  font-size:18px;
  font-weight:600;
  color:var(--accent-gold-bright);
  margin-left:auto;
  letter-spacing:.03em;
}

/* Board & columns */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  align-items:start;
}
.col{
  background:var(--bg-panel);
  border:1px solid var(--hairline);
  border-top:2px solid var(--edge-control);
  border-radius:3px;
  padding:16px 14px 14px;
  min-height:220px;
  min-width:0;
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.col[data-s="todo"]{border-top-color:var(--status-todo)}
.col[data-s="doing"]{border-top-color:var(--status-doing)}
.col[data-s="done"]{border-top-color:var(--status-done)}
.col.over{
  background:var(--bg-card);
  border-color:var(--accent-gold);
  box-shadow:0 0 0 1px var(--accent-gold),var(--shadow-warm);
}
.col-head{
  display:flex;
  align-items:center;
  gap:9px;
  padding-bottom:12px;
  margin-bottom:14px;
  border-bottom:1px solid var(--hairline);
  min-width:0;
}
.col-head i{
  width:8px;
  height:8px;
  transform:rotate(45deg);
  display:block;
  flex-shrink:0;
}
.col[data-s="todo"] .col-head i{background:var(--status-todo)}
.col[data-s="doing"] .col-head i{background:var(--status-doing)}
.col[data-s="done"] .col-head i{background:var(--status-done)}
.col-head h2{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:600;
  margin:0;
  letter-spacing:.02em;
  color:var(--ink-primary);
  min-width:0;
}
.col-head .count{
  margin-left:auto;
  font-size:12px;
  font-weight:600;
  color:var(--accent-gold-bright);
  background:var(--bg-card);
  border:1px solid var(--edge-gold);
  border-radius:2px;
  padding:2px 9px;
  font-variant-numeric:tabular-nums;
  flex-shrink:0;
}

/* Task Cards */
.card{
  background:var(--bg-card);
  border:1px solid var(--hairline);
  border-left:3px solid var(--status-low);
  border-radius:2px;
  padding:13px 14px;
  margin-bottom:12px;
  box-shadow:var(--shadow-card);
  cursor:grab;
  transition:background-color .2s ease,border-color .2s ease,transform .18s ease,opacity .18s ease;
}
.card:last-child{margin-bottom:0}
.card:hover{
  background:var(--bg-elevated);
  border-color:var(--edge-gold);
  border-left-color:inherit;
}
.card.p-high{border-left-color:var(--status-high)}
.card.p-high:hover{border-left-color:var(--status-high)}
.card.p-mid{border-left-color:var(--status-mid)}
.card.p-mid:hover{border-left-color:var(--status-mid)}
.card.p-low{border-left-color:var(--status-low)}
.card.p-low:hover{border-left-color:var(--status-low)}
.card.dragging{
  opacity:.42;
  cursor:grabbing;
}
.card .t{
  font-size:14px;
  font-weight:500;
  color:var(--ink-primary);
  line-height:1.48;
  overflow-wrap:anywhere;
}
.card.is-done .t{
  text-decoration:line-through;
  text-decoration-color:var(--accent-gold-soft);
  color:var(--ink-muted);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:11px;
  padding-top:9px;
  border-top:1px solid var(--hairline);
  flex-wrap:wrap;
}
.tag{
  font-size:11px;
  font-weight:500;
  letter-spacing:.07em;
  text-transform:uppercase;
  border:1px solid var(--edge-control);
  border-radius:2px;
  padding:2px 8px;
  color:var(--ink-secondary);
  background:transparent;
}
.tag.prio-high{
  color:var(--status-high);
  border-color:var(--status-high);
}
.tag.prio-mid{
  color:var(--accent-gold-bright);
  border-color:var(--edge-gold);
}
.tag.prio-low{
  color:var(--ink-muted);
  border-color:var(--edge-control);
}
.tag.doing-tag{
  color:var(--accent-gold-bright);
  border-color:var(--edge-gold);
}
.tag.late{
  background:var(--late-bg);
  color:var(--late-ink);
  border-color:var(--late-bg);
  font-weight:600;
}

.acts{
  margin-left:auto;
  display:flex;
  gap:4px;
}
.acts button{
  background:transparent;
  border:1px solid transparent;
  border-radius:2px;
  width:30px;
  height:30px;
  display:inline-grid;
  place-items:center;
  cursor:pointer;
  color:var(--ink-muted);
  font-size:15px;
  line-height:1;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease;
}
.acts button:hover:not(:disabled){
  background:var(--bg-panel);
  border-color:var(--edge-gold);
  color:var(--accent-gold-bright);
}
.acts button.del:hover:not(:disabled){
  border-color:var(--status-high);
  color:var(--status-high);
}
.acts button:disabled{
  opacity:.3;
  cursor:default;
}

.empty{
  color:var(--ink-muted);
  font-size:13px;
  font-style:italic;
  text-align:center;
  padding:24px 10px;
  border:1px dashed var(--hairline);
  border-radius:2px;
}

/* Week View */
[hidden]{display:none!important}
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
  align-items:start;
}
.week .col,.extra .col{
  padding:12px 10px;
  min-height:190px;
}
.week .card{
  padding:10px;
  font-size:13px;
}
.week .card .t{font-size:13px}
.week .col-head{
  flex-wrap:wrap;
  gap:4px 6px;
  padding-bottom:9px;
  margin-bottom:10px;
}
.week .col-head h2{font-size:15px}
.dsub{
  font-size:12px;
  color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
}
.col.today{
  background:
    radial-gradient(ellipse at 50% 0%,var(--today-glow),transparent 70%),
    var(--bg-card);
  border-color:var(--edge-gold);
  border-top:2px solid var(--accent-gold);
}
.col.today .dsub{
  color:var(--accent-gold-bright);
  font-weight:600;
}
.addday{
  width:100%;
  margin-top:10px;
  background:transparent;
  border:1px dashed var(--edge-control);
  border-radius:2px;
  padding:8px 6px;
  color:var(--ink-muted);
  cursor:pointer;
  font-size:12px;
  font-weight:500;
  letter-spacing:.07em;
  text-transform:uppercase;
  transition:color .2s ease,border-color .2s ease,background-color .2s ease;
}
.addday:hover{
  color:var(--accent-gold-bright);
  border-color:var(--accent-gold);
  background:var(--bg-elevated);
}
.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:18px;
  align-items:start;
}

/* Responsive breakpoints (zero horizontal overflow down to 400px and below) */
@media (max-width:1050px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .masthead{
    grid-template-columns:1fr;
    justify-items:center;
    gap:12px;
  }
  .masthead-spacer{display:none}
  .masthead-actions{justify-content:center}
  .pg-grid{
    grid-template-columns:1fr;
    justify-items:start;
  }
  .gauge-wrap{
    width:74px;
    height:74px;
  }
  .gauge-svg{
    width:68px;
    height:68px;
  }
  .board,.week,.extra{grid-template-columns:1fr}
  .add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .add input[type=text]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }
  .seg{width:100%}
  .seg button{
    flex:1 1 0;
    padding:9px 10px;
  }
  .weeknav .lbl{
    width:100%;
    margin-left:0;
    margin-top:4px;
  }
}
@media (max-width:440px){
  .add{grid-template-columns:1fr}
  .progress{margin:6px 0 24px}
  .lx-frame{outline-offset:3px}
  .eyebrow::before,.eyebrow::after{width:16px}
  .pg-num small{
    display:block;
    margin-left:0;
    margin-top:6px;
  }
}

/* Accessibility fallbacks */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
@media (prefers-reduced-transparency:reduce){
  .lx-velvet::after{display:none}
  .dock{
    background:var(--bg-panel);
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
}
@media (forced-colors:active){
  .lx-velvet::after{display:none}
  .lx-spot{background:Canvas}
  .lx-gold-text{
    background:none;
    -webkit-background-clip:border-box;
    background-clip:border-box;
    color:CanvasText;
    -webkit-text-fill-color:CanvasText;
  }
  .progress,.dock,.col,.card,.chip,.seg,.weeknav,.theme-toggle,.add input,.add select,.btn,.tag,.addday,.empty{
    border:1px solid ButtonBorder;
    box-shadow:none;
    outline:none;
  }
  .lx-frame{outline:1px solid Highlight}
  .seg button[aria-pressed="true"],.chip[aria-pressed="true"],.btn{
    background:Highlight;
    color:HighlightText;
    border-color:Highlight;
    forced-color-adjust:none;
  }
  .bar span,.col-head i,.pg-legend i,.gauge-fill{
    forced-color-adjust:none;
  }
  :focus-visible{
    outline:2px solid Highlight;
    outline-offset:2px;
  }
}
</style>
</head>
<body class="lx-spot lx-velvet">
<div class="wrap">
  <header class="masthead">
    <div class="masthead-spacer" aria-hidden="true"></div>
    <div class="masthead-center">
      <div class="eyebrow" aria-hidden="true">Atelier Quản Trị</div>
      <h1 class="lx-gold-text">Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>
    <div class="masthead-actions">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Đổi giao diện sáng tối">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <span id="themeLabel">Giao diện</span>
      </button>
    </div>
  </header>

  <section class="progress lx-frame" aria-label="Tiến độ">
    <div class="pg-grid">
      <div class="gauge-wrap" aria-hidden="true">
        <svg class="gauge-svg" viewBox="0 0 84 84">
          <circle class="gauge-track" cx="42" cy="42" r="36"></circle>
          <circle class="gauge-fill" id="gaugeArc" cx="42" cy="42" r="36" stroke-dasharray="226.19" stroke-dashoffset="226.19"></circle>
        </svg>
        <span class="gauge-core" id="gaugeText">0%</span>
      </div>
      <div class="pg-body">
        <div class="pg-top">
          <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
          <div class="pg-note" id="note"></div>
        </div>
        <div class="bar" aria-hidden="true"><span class="b-done" id="bDone"></span><span class="b-doing" id="bDoing"></span><span class="b-todo" id="bTodo"></span></div>
        <div class="pg-legend" aria-hidden="true">
          <span><i class="l-done"></i>Hoàn thành</span>
          <span><i class="l-doing"></i>Đang làm</span>
          <span><i class="l-todo"></i>Cần làm</span>
        </div>
      </div>
    </div>
  </section>

  <div class="dock">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button type="button" class="btn" id="addBtn">Thêm việc</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="views">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
      <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
      <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
    </div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button type="button" class="nav-btn" id="prevW" aria-label="Tuần trước">←</button>
    <button type="button" class="nav-btn" id="thisW">Tuần này</button>
    <button type="button" class="nav-btn" id="nextW" aria-label="Tuần sau">→</button>
    <span class="lbl" id="wlabel"></span>
  </div>

  <main>
    <div class="board" id="board"></div>
    <div class="week" id="week" hidden></div>
    <div class="extra" id="extra" hidden></div>
  </main>
</div>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var THEME_KEY="bang-cong-viec-theme";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var CIRC=2*Math.PI*36;
  var tasks=[],filter="all",dragId=null;

  /* Theme handling: honours prefers-color-scheme and manual [data-theme] */
  function resolvedTheme(){
    var explicit=document.documentElement.getAttribute("data-theme");
    if(explicit==="dark"||explicit==="light")return explicit;
    try{
      if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)return "light";
    }catch(e){}
    return "dark";
  }
  function syncThemeUI(){
    var cur=resolvedTheme();
    var lbl=document.getElementById("themeLabel");
    var btn=document.getElementById("themeToggle");
    if(lbl)lbl.textContent=cur==="dark"?"Chế độ tối":"Chế độ sáng";
    if(btn)btn.setAttribute("aria-pressed",String(cur==="dark"));
  }
  function initTheme(){
    try{
      var saved=localStorage.getItem(THEME_KEY);
      if(saved==="dark"||saved==="light")document.documentElement.setAttribute("data-theme",saved);
    }catch(e){}
    syncThemeUI();
    var btn=document.getElementById("themeToggle");
    if(btn){
      btn.onclick=function(){
        var next=resolvedTheme()==="dark"?"light":"dark";
        document.documentElement.setAttribute("data-theme",next);
        try{localStorage.setItem(THEME_KEY,next)}catch(e){}
        syncThemeUI();
      };
    }
    try{
      if(window.matchMedia){
        var mq=window.matchMedia("(prefers-color-scheme: light)");
        if(mq.addEventListener)mq.addEventListener("change",syncThemeUI);
      }
    }catch(e){}
  }

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r)||[];return}}catch(e){}
    var d=new Date(),iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  var view="board",ws=mondayOf(new Date());
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  function card(t){
    var c=el("div","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));
    var m=el("div","meta");
    m.appendChild(el("span","tag prio-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag doing-tag","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late)m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
    }
    var a=el("div","acts"),i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i===0;
    var R=el("button",null,"→");R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i===2;
    var X=el("button","del","×");X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");
    L.onclick=function(){move(t.id,COLS[i-1][0])};
    R.onclick=function(){move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");K.type="button";K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else a.append(L,R,X);
    m.appendChild(a);c.appendChild(m);
    c.addEventListener("dragstart",function(e){dragId=t.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");dragId=null;document.querySelectorAll(".col.over").forEach(function(n){n.classList.remove("over")})});
    return c;
  }

  function move(id,s){tasks.forEach(function(t){if(t.id===id)t.s=s});save();render()}

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("week").hidden=!isW;
    document.getElementById("extra").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;
    if(isW)renderWeek();
    var b=document.getElementById("board");b.textContent="";
    if(!isW)COLS.forEach(function(c){
      var col=el("div","col");col.dataset.s=c[0];
      var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
      var h=el("div","col-head");h.appendChild(el("i"));h.appendChild(el("h2",null,c[1]));h.appendChild(el("span","count",String(list.length)));
      col.appendChild(h);
      if(!list.length)col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
      list.forEach(function(t){col.appendChild(card(t))});
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)move(dragId,c[0])});
      b.appendChild(col);
    });
    var n=tasks.length,d=tasks.filter(function(t){return t.s==="done"}).length,g=tasks.filter(function(t){return t.s==="doing"}).length,o=n-d-g;
    var pct=n?Math.round(d/n*100):0;
    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("gaugeText").textContent=pct+"%";
    var arc=document.getElementById("gaugeArc");
    if(arc){
      arc.setAttribute("stroke-dasharray",CIRC.toFixed(2));
      arc.setAttribute("stroke-dashoffset",(CIRC*(1-pct/100)).toFixed(2));
    }
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=!n?"Chưa có công việc nào.":late?late+" việc đã quá hạn.":d===n?"Bạn đã xong tất cả.":"Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function setDate(id,d){tasks.forEach(function(t){if(t.id===id)t.d=d});save();render()}
  function dayCol(title,sub,list,dateVal,cls){
    var col=el("div","col"+(cls||""));
    var h=el("div","col-head");h.appendChild(el("h2",null,title));if(sub)h.appendChild(el("span","dsub",sub));h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);
    list.forEach(function(t){col.appendChild(card(t))});
    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");
      A.type="button";
      A.onclick=function(){document.getElementById("due").value=dateVal;document.getElementById("title").focus()};
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId!=null)setDate(dragId,dateVal)});
    }
    return col;
  }
  function renderWeek(){
    var W=document.getElementById("week"),E=document.getElementById("extra");W.textContent="";E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"],tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};
    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k),s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":""));
    }
    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),first=isoDate(ws);
    document.getElementById("wlabel").textContent=pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();
    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"",""));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    if(over.length)E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,""));
  }
  function add(){
    var inp=document.getElementById("title"),v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({id:Date.now(),t:v,p:document.getElementById("prio").value,s:"todo",d:document.getElementById("due").value});
    inp.value="";document.getElementById("due").value="";save();render();inp.focus();
  }
  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c))});
      render();
    };
  });
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){view=b.dataset.v;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
  });
  function shift(n){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);render()}
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};
  initTheme();
  load();
  render();
})();
</script>
</body>
</html>
