<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Style 6: Aurora / Mesh Gradient (single dark theme; dark base mandatory) */
:root{
  --au-midnight:#0b0d1a;
  --au-base:#05010f;
  --au-space:#111827;
  --au-cosmic:#1e1b4b;
  --au-purple:#7c3aed;
  --au-violet:#a855f7;
  --au-pink:#ec4899;
  --au-rose:#f472b6;
  --au-blue:#3b82f6;
  --au-cyan:#06b6d4;
  --au-green:#10b981;
  --au-mint:#34d399;
  --au-teal:#2dd4bf;
  --au-text:#e0e7ff;
  --au-text-2:#a5b4fc;
  --au-text-bright:#f8fafc;
  /* Substituted panel opacity .55 -> .72 so --au-text-2 meets AA (>=4.5:1) over brightest #2dd4bf bloom */
  --au-panel:rgba(10,8,20,.72);
  --au-panel-solid:rgba(10,8,20,.92);
  --au-panel-edge:rgba(255,255,255,.12);
  /* Interactive control edge meets >=3:1 UI contrast over worst bloom and dark base */
  --au-control-edge:rgba(224,231,255,.52);
  --au-card:rgba(11,13,26,.82);
  --au-card-hover:rgba(17,24,39,.92);
  --au-blur:14px;
  --au-orb-blur:80px;
  --au-drift:18s;
  --au-radius:18px;
  --au-radius-md:12px;
  --au-radius-sm:8px;
  --font:"Sora","Inter","Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --section-gap:clamp(80px,10vw,140px);
  /* Semantic mappings (capped to 4 Aurora hues: violet/purple, blue/indigo, teal/mint, pink/rose) */
  --st-todo:var(--au-blue);
  --st-doing:var(--au-teal);
  --st-done:var(--au-mint);
  --pr-high:var(--au-rose);
  --pr-mid:var(--au-violet);
  --pr-low:var(--au-text-2);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{
  background:var(--au-base);
  scroll-padding-top:env(safe-area-inset-top,0px);
}
body{
  margin:0;
  min-height:100vh;
  background:var(--au-base);
  color:var(--au-text);
  font-family:var(--font);
  font-weight:500;
  line-height:1.5;
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}

/* Single page-wide Aurora mesh gradient backdrop (sibling of content: avoids backdrop-root trap) */
.aurora{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background-color:var(--au-base);
  background-image:
    radial-gradient(40% 50% at 20% 25%,rgba(99,102,241,.55),transparent 70%),
    radial-gradient(45% 55% at 78% 22%,rgba(45,212,191,.45),transparent 70%),
    radial-gradient(50% 60% at 62% 78%,rgba(236,72,153,.40),transparent 70%),
    radial-gradient(40% 50% at 28% 82%,rgba(139,92,246,.45),transparent 70%);
}
.aurora::before{
  content:"";
  position:absolute;
  inset:-20%;
  background:conic-gradient(from 120deg at 50% 30%,#3a29ff,#2dd4bf,#ec4899,#8b5cf6,#3a29ff);
  filter:blur(var(--au-orb-blur)) saturate(1.4);
  opacity:.55;
  animation:drift var(--au-drift) ease-in-out infinite alternate;
  will-change:transform;
}
.aurora::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 50% 0%,transparent 40%,rgba(5,1,15,.55) 100%);
}
@keyframes drift{
  from{transform:translate3d(-4%,-2%,0) rotate(0deg)}
  to{transform:translate3d(4%,3%,0) rotate(8deg)}
}

/* Main layout shell */
.wrap{
  position:relative;
  z-index:1;
  max-width:1280px;
  margin:0 auto;
  padding:clamp(18px,3.2vw,36px) clamp(12px,2.8vw,28px) clamp(40px,6vw,72px);
}

/* Primary frosted dark glass panel (limited to top-level surfaces, never nested) */
.aurora-panel{
  position:relative;
  background:var(--au-panel);
  border:1px solid var(--au-panel-edge);
  border-radius:var(--au-radius);
  box-shadow:0 16px 48px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16);
  color:var(--au-text);
  -webkit-backdrop-filter:blur(var(--au-blur)) saturate(135%);
  backdrop-filter:blur(var(--au-blur)) saturate(135%);
}

/* Hero + Progress panel */
.hero-panel{
  padding:clamp(20px,3vw,30px);
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:clamp(18px,3vw,32px);
  align-items:center;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--au-teal);
  margin:0 0 10px;
}
.eyebrow-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--au-teal);
  box-shadow:0 0 10px rgba(45,212,191,.75);
  flex:none;
}
/* One gradient display heading per page; stops chosen from :root tokens so every stop clears >=3:1 large text over worst bloom */
h1{
  margin:0 0 8px;
  font-size:clamp(30px,4.8vw,48px);
  font-weight:700;
  letter-spacing:-.025em;
  line-height:1.12;
  background:linear-gradient(135deg,#f8fafc 0%,#e0e7ff 28%,#f472b6 62%,#2dd4bf 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.sub{
  margin:0;
  color:var(--au-text-2);
  font-size:15px;
  max-width:46ch;
}

/* Progress readout inside hero panel */
.progress-box{
  background:var(--au-card);
  border:1px solid var(--au-panel-edge);
  border-radius:14px;
  padding:18px 20px;
  min-width:0;
}
.pg-row{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:14px;
}
.ring-wrap{
  width:64px;
  height:64px;
  flex:none;
  position:relative;
}
.ring-wrap svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
  display:block;
}
.ring-track{
  fill:none;
  stroke:rgba(224,231,255,.18);
  stroke-width:6;
}
.ring-val{
  fill:none;
  stroke:var(--au-teal);
  stroke-width:6;
  stroke-linecap:round;
  transition:stroke-dashoffset .45s ease;
}
.pg-main{
  min-width:0;
  flex:1;
}
.pg-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px 12px;
  flex-wrap:wrap;
}
.pg-num{
  font-size:clamp(28px,4.2vw,42px);
  font-weight:700;
  letter-spacing:-.03em;
  line-height:1.05;
  color:var(--au-text-bright);
  font-variant-numeric:tabular-nums;
}
.pg-num small{
  display:inline-block;
  font-size:14px;
  font-weight:500;
  color:var(--au-text-2);
  letter-spacing:0;
  margin-left:8px;
}
.pg-note{
  margin:4px 0 0;
  color:var(--au-text-2);
  font-size:13.5px;
}
.bar{
  display:flex;
  height:12px;
  border-radius:999px;
  overflow:hidden;
  background:var(--au-midnight);
  border:1px solid var(--au-control-edge);
  gap:2px;
  padding:1px;
}
.bar span{
  display:block;
  min-width:0;
  border-radius:999px;
  transition:flex-grow .35s ease;
}
.bar .b-done{background:var(--st-done)}
.bar .b-doing{background:var(--st-doing)}
.bar .b-todo{background:var(--st-todo)}
.pg-legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px;
  margin-top:10px;
  font-size:12.5px;
  color:var(--au-text-2);
}
.pg-legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.pg-legend i{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
}
.lg-done i{background:var(--st-done)}
.lg-doing i{background:var(--st-doing)}
.lg-todo i{background:var(--st-todo)}

/* Subtle wavy SVG horizon divider between hero and workspace */
.wave-divider{
  display:block;
  width:100%;
  height:24px;
  margin:6px 0;
  pointer-events:none;
}

/* Controls panel: Add form + View switcher + Priority filters + Week nav */
.controls-panel{
  padding:18px 20px;
  margin-bottom:18px;
}
.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:10px;
  align-items:stretch;
}
input,select,button{
  font:inherit;
  color:inherit;
}
.add input,.add select{
  background:var(--au-midnight);
  color:var(--au-text-bright);
  border:1px solid var(--au-control-edge);
  border-radius:var(--au-radius-md);
  padding:10px 13px;
  min-width:0;
  min-height:44px;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.add input::placeholder{
  color:var(--au-text-2);
  opacity:1;
}
.add input:hover,.add select:hover{
  border-color:var(--au-text);
}
.add select option{
  background:var(--au-midnight);
  color:var(--au-text-bright);
}
.btn{
  background:var(--au-teal);
  color:var(--au-base);
  border:1px solid transparent;
  border-radius:var(--au-radius-md);
  padding:10px 20px;
  min-height:44px;
  font-weight:700;
  letter-spacing:.01em;
  cursor:pointer;
  white-space:nowrap;
  transition:background-color .18s ease,transform .15s ease;
}
.btn:hover{
  background:var(--au-text-bright);
}
.btn:active{
  transform:translateY(1px);
}

:focus-visible{
  outline:2px solid var(--au-teal);
  outline-offset:2px;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px 16px;
  flex-wrap:wrap;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--au-panel-edge);
}
.seg{
  display:inline-flex;
  background:var(--au-midnight);
  border:1px solid var(--au-control-edge);
  border-radius:var(--au-radius-md);
  padding:3px;
  gap:3px;
  max-width:100%;
}
.seg button{
  background:transparent;
  color:var(--au-text-2);
  border:0;
  border-radius:9px;
  padding:7px 14px;
  min-height:36px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:background-color .18s ease,color .18s ease;
}
.seg button:hover{
  color:var(--au-text-bright);
}
.seg button[aria-pressed="true"]{
  background:var(--au-text);
  color:var(--au-base);
  font-weight:700;
}

.filters{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.chip{
  background:var(--au-midnight);
  color:var(--au-text-2);
  border:1px solid var(--au-control-edge);
  border-radius:999px;
  padding:6px 14px;
  min-height:36px;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.chip:hover{
  color:var(--au-text-bright);
  border-color:var(--au-text);
}
.chip[aria-pressed="true"]{
  background:var(--au-text);
  color:var(--au-base);
  border-color:var(--au-text);
  font-weight:700;
}

.weeknav{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--au-panel-edge);
}
.weeknav .lbl{
  font-weight:600;
  font-size:14px;
  color:var(--au-text-bright);
  margin-left:4px;
  font-variant-numeric:tabular-nums;
}

[hidden]{display:none!important}

/* Board view: 3 glass columns floating over the aurora */
.board{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  align-items:start;
}
.col{
  min-width:0;
  padding:14px;
  min-height:220px;
  transition:border-color .18s ease,background-color .18s ease,box-shadow .18s ease;
}
.col.over{
  border-color:var(--au-teal);
  box-shadow:0 0 0 1px var(--au-teal),0 18px 44px rgba(0,0,0,.48);
}
.col-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin:2px 2px 14px;
  min-width:0;
}
.col-head i{
  width:10px;
  height:10px;
  border-radius:50%;
  display:block;
  flex:none;
}
.col[data-s="todo"] .col-head i{background:var(--st-todo);box-shadow:0 0 10px rgba(59,130,246,.7)}
.col[data-s="doing"] .col-head i{background:var(--st-doing);box-shadow:0 0 10px rgba(45,212,191,.75)}
.col[data-s="done"] .col-head i{background:var(--st-done);box-shadow:0 0 10px rgba(52,211,153,.75)}
.col-head h2{
  margin:0;
  font-size:15.5px;
  font-weight:600;
  color:var(--au-text-bright);
  letter-spacing:-.01em;
}
.col-head .count{
  margin-left:auto;
  font-size:12.5px;
  font-weight:600;
  color:var(--au-text);
  background:var(--au-midnight);
  border:1px solid var(--au-control-edge);
  border-radius:999px;
  padding:1px 9px;
  font-variant-numeric:tabular-nums;
  flex:none;
}

/* Task cards (opaque-tinted dark surfaces; no nested backdrop-filter) */
.card{
  background:var(--au-card);
  border:1px solid var(--au-panel-edge);
  border-left:4px solid var(--pr-low);
  border-radius:var(--au-radius-md);
  padding:12px 13px;
  margin-bottom:10px;
  cursor:grab;
  min-width:0;
  transition:background-color .16s ease,border-color .16s ease,transform .15s ease;
}
.card:last-of-type{margin-bottom:0}
.card:hover{
  background:var(--au-card-hover);
  border-color:rgba(224,231,255,.28);
}
.card.p-high{border-left-color:var(--pr-high)}
.card.p-mid{border-left-color:var(--pr-mid)}
.card.p-low{border-left-color:var(--pr-low)}
.card.dragging{
  opacity:.42;
  cursor:grabbing;
}
.card .t{
  font-size:14.5px;
  font-weight:500;
  color:var(--au-text-bright);
  overflow-wrap:anywhere;
  line-height:1.45;
}
.card.is-done .t{
  text-decoration:line-through;
  color:var(--au-text-2);
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag{
  display:inline-flex;
  align-items:center;
  font-size:12px;
  font-weight:600;
  line-height:1.25;
  border:1px solid var(--au-control-edge);
  border-radius:6px;
  padding:2px 8px;
  color:var(--au-text-2);
  background:rgba(5,1,15,.55);
  max-width:100%;
}
.tag.t-high{color:var(--pr-high);border-color:rgba(244,114,182,.65)}
.tag.t-mid{color:var(--pr-mid);border-color:rgba(168,85,247,.7)}
.tag.t-low{color:var(--pr-low);border-color:var(--au-control-edge)}
.tag.t-doing{color:var(--st-doing);border-color:rgba(45,212,191,.6)}
.tag.late{
  color:var(--au-rose);
  border-color:var(--au-rose);
  background:rgba(244,114,182,.12);
  font-weight:700;
}

.acts{
  margin-left:auto;
  display:flex;
  gap:3px;
  flex:none;
}
.acts button{
  background:transparent;
  color:var(--au-text-2);
  border:1px solid transparent;
  border-radius:7px;
  width:30px;
  height:30px;
  padding:0;
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:15px;
  line-height:1;
  transition:background-color .15s ease,color .15s ease,border-color .15s ease;
}
.acts button:hover:not(:disabled){
  background:rgba(224,231,255,.14);
  color:var(--au-text-bright);
  border-color:var(--au-control-edge);
}
.acts button:disabled{
  opacity:.28;
  cursor:default;
}

.empty{
  color:var(--au-text-2);
  font-size:13.5px;
  text-align:center;
  padding:22px 10px;
  border:1px dashed rgba(224,231,255,.24);
  border-radius:var(--au-radius-md);
}

/* Week view: single glass shell containing 7 day cells (avoids excessive GPU blur layers) */
.week-shell{
  padding:14px;
}
.week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
  align-items:start;
}
.extra-shell{
  padding:14px;
  margin-top:16px;
}
.extra{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  align-items:start;
}
.day-col{
  background:rgba(5,1,15,.46);
  border:1px solid var(--au-panel-edge);
  border-radius:14px;
  padding:10px;
  min-width:0;
  min-height:160px;
  transition:border-color .18s ease,background-color .18s ease;
}
.day-col.over{
  border-color:var(--au-teal);
  background:rgba(45,212,191,.10);
}
.day-col.today{
  border-color:var(--au-teal);
  box-shadow:inset 0 1px 0 rgba(45,212,191,.45);
  background:rgba(11,13,26,.78);
}
.day-col .col-head{
  flex-wrap:wrap;
  gap:2px 6px;
  margin:0 0 10px;
}
.day-col .col-head h2{
  font-size:13.5px;
}
.dsub{
  font-size:12.5px;
  color:var(--au-text-2);
  font-variant-numeric:tabular-nums;
}
.day-col.today .dsub{
  color:var(--au-teal);
  font-weight:700;
}
.week .card{
  padding:9px 10px;
  margin-bottom:8px;
}
.week .card .t{
  font-size:13.5px;
}
.addday{
  width:100%;
  margin-top:8px;
  background:var(--au-midnight);
  border:1px dashed var(--au-control-edge);
  border-radius:var(--au-radius-sm);
  padding:7px 8px;
  color:var(--au-text-2);
  cursor:pointer;
  font-size:12.5px;
  font-weight:600;
  transition:color .16s ease,border-color .16s ease,background-color .16s ease;
}
.addday:hover{
  color:var(--au-text-bright);
  border-color:var(--au-teal);
  background:rgba(45,212,191,.10);
}

/* Responsive breakpoints: zero horizontal scroll down to 400px and below */
@media (max-width:1120px){
  .week{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .hero-panel{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .week,.extra{grid-template-columns:1fr}
  .add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .add input[type="text"]{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
}
@media (max-width:460px){
  .add{grid-template-columns:1fr}
  .seg{width:100%}
  .seg button{flex:1;padding:7px 10px;font-size:13.5px}
  .pg-row{gap:12px}
  .ring-wrap{width:54px;height:54px}
}

/* Required Fallbacks */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .aurora-panel{
    background:var(--au-panel-solid);
  }
}
@media (prefers-reduced-motion:reduce){
  .aurora::before{animation:none}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
@media (prefers-reduced-transparency:reduce){
  .aurora-panel{
    background:rgba(10,8,20,.96);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  .card,.day-col,.progress-box{
    background:var(--au-midnight);
  }
}
@media (forced-colors:active){
  .aurora{display:none}
  .aurora-panel,.card,.day-col,.progress-box{
    background:Canvas;
    color:CanvasText;
    border:1px solid CanvasText;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    box-shadow:none;
  }
  h1{
    background:none;
    -webkit-background-clip:border-box;
    background-clip:border-box;
    color:CanvasText;
  }
  .btn,.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{
    background:Highlight;
    color:HighlightText;
    border:1px solid Highlight;
  }
  .bar{
    background:Canvas;
    border:1px solid CanvasText;
  }
  .bar .b-done,.bar .b-doing,.bar .b-todo{
    background:Highlight;
    border-right:1px solid Canvas;
  }
  .day-col.today,.col.over,.day-col.over{
    border:2px solid Highlight;
  }
  :focus-visible{
    outline:2px solid Highlight;
  }
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<main class="wrap">
  <header class="aurora-panel hero-panel">
    <div>
      <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>Không gian theo dõi công việc</p>
      <h1>Bảng công việc</h1>
      <p class="sub">Kéo thẻ giữa các cột hoặc dùng nút mũi tên để đổi trạng thái.</p>
    </div>

    <section class="progress-box" aria-label="Tiến độ">
      <div class="pg-row">
        <div class="ring-wrap" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <circle class="ring-track" cx="32" cy="32" r="26"></circle>
            <circle class="ring-val" id="ringVal" cx="32" cy="32" r="26" stroke-dasharray="163.36" stroke-dashoffset="163.36"></circle>
          </svg>
        </div>
        <div class="pg-main">
          <div class="pg-top">
            <div class="pg-num" id="pct">0%<small id="frac">0/0 việc xong</small></div>
          </div>
          <p class="pg-note" id="note"></p>
        </div>
      </div>
      <div class="bar" aria-hidden="true">
        <span class="b-done" id="bDone"></span>
        <span class="b-doing" id="bDoing"></span>
        <span class="b-todo" id="bTodo"></span>
      </div>
      <div class="pg-legend" aria-hidden="true">
        <span class="lg-done"><i></i>Hoàn thành</span>
        <span class="lg-doing"><i></i>Đang làm</span>
        <span class="lg-todo"><i></i>Cần làm</span>
      </div>
    </section>
  </header>

  <svg class="wave-divider" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="auWave" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
        <stop offset="30%" stop-color="#a5b4fc" stop-opacity=".45"/>
        <stop offset="55%" stop-color="#2dd4bf" stop-opacity=".55"/>
        <stop offset="80%" stop-color="#f472b6" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M0 14 Q 300 2, 600 13 T 1200 11" fill="none" stroke="url(#auWave)" stroke-width="1.5"/>
  </svg>

  <section class="aurora-panel controls-panel" aria-label="Thêm và lọc công việc">
    <div class="add">
      <input type="text" id="title" placeholder="Bạn cần làm gì?" aria-label="Tên công việc" maxlength="120">
      <select id="prio" aria-label="Mức ưu tiên">
        <option value="high">Ưu tiên cao</option>
        <option value="mid" selected>Ưu tiên vừa</option>
        <option value="low">Ưu tiên thấp</option>
      </select>
      <input type="date" id="due" aria-label="Hạn hoàn thành">
      <button type="button" class="btn" id="addBtn">Thêm việc</button>
    </div>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button type="button" data-v="board" aria-pressed="true">Theo trạng thái</button>
        <button type="button" data-v="week" aria-pressed="false">Theo tuần</button>
      </div>

      <div class="filters" role="group" aria-label="Lọc theo ưu tiên">
        <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
        <button type="button" class="chip" data-f="high" aria-pressed="false">Cao</button>
        <button type="button" class="chip" data-f="mid" aria-pressed="false">Vừa</button>
        <button type="button" class="chip" data-f="low" aria-pressed="false">Thấp</button>
      </div>
    </div>

    <div class="weeknav" id="weeknav" hidden>
      <button type="button" class="chip" id="prevW" aria-label="Tuần trước">←</button>
      <button type="button" class="chip" id="thisW">Tuần này</button>
      <button type="button" class="chip" id="nextW" aria-label="Tuần sau">→</button>
      <span class="lbl" id="wlabel"></span>
    </div>
  </section>

  <section class="board" id="board" aria-label="Bảng theo trạng thái"></section>

  <section class="aurora-panel week-shell" id="weekWrap" aria-label="Lịch công việc theo tuần" hidden>
    <div class="week" id="week"></div>
  </section>

  <section class="aurora-panel extra-shell" id="extraWrap" aria-label="Công việc chưa đặt ngày và tồn đọng" hidden>
    <div class="extra" id="extra"></div>
  </section>
</main>

<script>
(function(){
  var KEY="bang-cong-viec-v1";
  var COLS=[["todo","Cần làm"],["doing","Đang làm"],["done","Hoàn thành"]];
  var PL={high:"Cao",mid:"Vừa",low:"Thấp"};
  var RING_C=2*Math.PI*26;
  var tasks=[],filter="all",dragId=null;

  function pad(n){return n<10?"0"+n:""+n}
  function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}

  var view="board",ws=mondayOf(new Date());

  function load(){
    try{
      var r=localStorage.getItem(KEY);
      if(r){
        var parsed=JSON.parse(r);
        if(Array.isArray(parsed)){tasks=parsed;return}
      }
    }catch(e){}
    var d=new Date();
    var iso=function(n){var x=new Date(d);x.setDate(x.getDate()+n);return isoDate(x)};
    tasks=[
      {id:1,t:"Gửi báo cáo tuần cho nhóm",p:"high",s:"doing",d:iso(0)},
      {id:2,t:"Đặt lịch khám răng",p:"mid",s:"todo",d:iso(3)},
      {id:3,t:"Dọn hộp thư đến",p:"low",s:"todo",d:""},
      {id:4,t:"Thanh toán tiền điện",p:"high",s:"done",d:iso(-1)}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function el(tag,cls,text){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(text!=null)e.textContent=text;
    return e;
  }

  function card(t){
    var c=el("article","card p-"+t.p+(t.s==="done"?" is-done":""));
    c.draggable=true;
    c.dataset.id=t.id;
    c.appendChild(el("div","t",t.t));

    var m=el("div","meta");
    m.appendChild(el("span","tag t-"+t.p,PL[t.p]));
    if(view==="week"&&t.s==="doing")m.appendChild(el("span","tag t-doing","Đang làm"));
    if(t.d){
      var late=t.s!=="done"&&t.d<today();
      if(view!=="week"||late){
        m.appendChild(el("span","tag"+(late?" late":""),(late?"Quá hạn ":"Hạn ")+fmt(t.d)));
      }
    }

    var a=el("div","acts");
    var i=COLS.findIndex(function(x){return x[0]===t.s});
    var L=el("button",null,"←");
    L.type="button";L.title="Chuyển sang cột trước";L.setAttribute("aria-label","Chuyển sang cột trước");L.disabled=i<=0;
    var R=el("button",null,"→");
    R.type="button";R.title="Chuyển sang cột sau";R.setAttribute("aria-label","Chuyển sang cột sau");R.disabled=i<0||i>=2;
    var X=el("button",null,"×");
    X.type="button";X.title="Xóa việc";X.setAttribute("aria-label","Xóa việc");

    L.onclick=function(){if(i>0)move(t.id,COLS[i-1][0])};
    R.onclick=function(){if(i>=0&&i<2)move(t.id,COLS[i+1][0])};
    X.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};

    if(view==="week"){
      var K=el("button",null,t.s==="done"?"↺":"✓");
      K.type="button";
      K.title=t.s==="done"?"Mở lại việc":"Đánh dấu xong";
      K.setAttribute("aria-label",K.title);
      K.onclick=function(){move(t.id,t.s==="done"?"todo":"done")};
      a.append(K,X);
    }else{
      a.append(L,R,X);
    }
    m.appendChild(a);
    c.appendChild(m);

    c.addEventListener("dragstart",function(e){
      dragId=t.id;
      c.classList.add("dragging");
      try{e.dataTransfer.setData("text/plain",String(t.id))}catch(x){}
    });
    c.addEventListener("dragend",function(){
      c.classList.remove("dragging");
      dragId=null;
      document.querySelectorAll(".col.over,.day-col.over").forEach(function(n){n.classList.remove("over")});
    });
    return c;
  }

  function move(id,s){
    tasks.forEach(function(t){if(t.id===id)t.s=s});
    save();
    render();
  }

  function setDate(id,d){
    tasks.forEach(function(t){if(t.id===id)t.d=d});
    save();
    render();
  }

  function dayCol(title,sub,list,dateVal,cls,emptyMsg){
    var col=el("div","day-col"+(cls||""));
    var h=el("div","col-head");
    h.appendChild(el("h2",null,title));
    if(sub)h.appendChild(el("span","dsub",sub));
    h.appendChild(el("span","count",String(list.length)));
    col.appendChild(h);

    if(!list.length&&emptyMsg){
      col.appendChild(el("div","empty",emptyMsg));
    }
    list.forEach(function(t){col.appendChild(card(t))});

    if(dateVal!==null){
      var A=el("button","addday","+ Thêm việc");
      A.type="button";
      A.onclick=function(){
        document.getElementById("due").value=dateVal;
        document.getElementById("title").focus();
      };
      col.appendChild(A);
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
      col.addEventListener("drop",function(e){
        e.preventDefault();
        col.classList.remove("over");
        if(dragId!=null)setDate(dragId,dateVal);
      });
    }
    return col;
  }

  function renderWeek(){
    var W=document.getElementById("week");
    var E=document.getElementById("extra");
    W.textContent="";
    E.textContent="";
    var names=["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ nhật"];
    var tod=today();
    var vis=function(t){return filter==="all"||t.p===filter};

    for(var k=0;k<7;k++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k);
      var s=isoDate(d);
      var list=tasks.filter(function(t){return t.d===s&&vis(t)});
      W.appendChild(dayCol(names[k],pad(d.getDate())+"/"+pad(d.getMonth()+1),list,s,s===tod?" today":"",""));
    }

    var e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6);
    var first=isoDate(ws);
    document.getElementById("wlabel").textContent=
      pad(ws.getDate())+"/"+pad(ws.getMonth()+1)+" – "+pad(e.getDate())+"/"+pad(e.getMonth()+1)+"/"+e.getFullYear();

    E.appendChild(dayCol("Chưa đặt ngày","",tasks.filter(function(t){return !t.d&&vis(t)}),"","","Kéo thẻ vào đây để bỏ hạn."));
    var over=tasks.filter(function(t){return t.d&&t.d<first&&t.s!=="done"&&vis(t)});
    E.appendChild(dayCol("Chưa xong từ trước tuần này","",over,null,"","Không có việc tồn đọng."));
  }

  function render(){
    var isW=view==="week";
    document.getElementById("board").hidden=isW;
    document.getElementById("weekWrap").hidden=!isW;
    document.getElementById("extraWrap").hidden=!isW;
    document.getElementById("weeknav").hidden=!isW;

    if(isW)renderWeek();

    var b=document.getElementById("board");
    b.textContent="";
    if(!isW){
      COLS.forEach(function(c){
        var col=el("div","aurora-panel col");
        col.dataset.s=c[0];
        var list=tasks.filter(function(t){return t.s===c[0]&&(filter==="all"||t.p===filter)});
        var h=el("div","col-head");
        h.appendChild(el("i"));
        h.appendChild(el("h2",null,c[1]));
        h.appendChild(el("span","count",String(list.length)));
        col.appendChild(h);

        if(!list.length){
          col.appendChild(el("div","empty",c[0]==="todo"?"Chưa có việc nào. Thêm việc ở phía trên.":"Kéo thẻ vào đây."));
        }
        list.forEach(function(t){col.appendChild(card(t))});

        col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
        col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
        col.addEventListener("drop",function(e){
          e.preventDefault();
          col.classList.remove("over");
          if(dragId!=null)move(dragId,c[0]);
        });
        b.appendChild(col);
      });
    }

    var n=tasks.length;
    var d=tasks.filter(function(t){return t.s==="done"}).length;
    var g=tasks.filter(function(t){return t.s==="doing"}).length;
    var o=n-d-g;
    var pct=n?Math.round(d/n*100):0;

    document.getElementById("pct").firstChild.nodeValue=pct+"%";
    document.getElementById("frac").textContent=d+"/"+n+" việc xong";
    document.getElementById("bDone").style.flexGrow=d;
    document.getElementById("bDoing").style.flexGrow=g;
    document.getElementById("bTodo").style.flexGrow=o;
    document.getElementById("ringVal").style.strokeDashoffset=String((RING_C*(1-pct/100)).toFixed(2));

    var late=tasks.filter(function(t){return t.s!=="done"&&t.d&&t.d<today()}).length;
    document.getElementById("note").textContent=
      !n?"Chưa có công việc nào.":
      late?late+" việc đã quá hạn.":
      d===n?"Bạn đã xong tất cả.":
      "Còn "+(n-d)+" việc cần hoàn thành.";
  }

  function add(){
    var inp=document.getElementById("title");
    var v=inp.value.trim();
    if(!v){inp.focus();return}
    tasks.push({
      id:Date.now(),
      t:v,
      p:document.getElementById("prio").value,
      s:"todo",
      d:document.getElementById("due").value
    });
    inp.value="";
    document.getElementById("due").value="";
    save();
    render();
    inp.focus();
  }

  document.getElementById("addBtn").onclick=add;
  document.getElementById("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});

  document.querySelectorAll(".filters .chip").forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      document.querySelectorAll(".filters .chip").forEach(function(x){
        x.setAttribute("aria-pressed",String(x===c));
      });
      render();
    };
  });

  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){
      view=b.dataset.v;
      document.querySelectorAll(".seg button").forEach(function(x){
        x.setAttribute("aria-pressed",String(x===b));
      });
      render();
    };
  });

  function shift(n){
    ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+n);
    render();
  }
  document.getElementById("prevW").onclick=function(){shift(-7)};
  document.getElementById("nextW").onclick=function(){shift(7)};
  document.getElementById("thisW").onclick=function(){ws=mondayOf(new Date());render()};

  load();
  render();
})();
</script>
</body>
</html>
